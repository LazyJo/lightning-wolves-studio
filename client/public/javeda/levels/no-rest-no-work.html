<style>
html,body{height:100%}
body{margin:0; background:#140a12; color:#fff3e6; overflow:hidden; font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

#cab{position:fixed; inset:0}

@keyframes hurt{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{width:120px; height:6px; border-radius:3px; background:#ffffff1f; margin:4px 0 0 auto; overflow:hidden}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= NO REST/NO WORK =================
   Level 6 of JAVEDA: the beach from the cover at sunset - striped palms, the
   stone arch, the orange sun on the sea and Jo's lime-green saucer with its
   green beam. Three parts, three different games, picked by Jo from three
   prototypes:
     Part 1 ISLAND HOPPER   side-on: hop rock to palm to rock to the stone arch
     Part 2 CRAB NIGHT      the saucer holds the arch and beams the crabs back
                            to the sea; five crabs on the arch and it falls
     Part 3 SURF THE SUNSET skim the sea to the sun: lanes, waves, rocks
   All three end on the cover: the beach, the palms, the saucer in the sand.

   The beat: GRID, measured from the song (SONG.md): 128.9 BPM trap, counted
   half-time - a beat every 0.931 s, the pulse you nod to. Bars start at
   -0.931 + 3.724 n s. The three hooks (HOOKS, where the hi-hats double) are
   where everything gets busier. The song is the clock; without the file a
   small built-in beat plays on the same grid.

   ENDLESS (?part=N&endless=1, ids lvl6x / lvl6bx / lvl6cx) and REMIX (?remix=1,
   lvl6r) are the golden runs for after the song: no sunset, no win - the song
   loops (LOOP, whole bars, so the grid stays exact), everything keeps coming and
   keeps getting harder (ramp) until the hearts run out. The remix plays the
   three games in turn, 8 bars each, round and round, faster every lap. */

const GRID = { bpm:64.448, t0:-.931, len:159.2 };   // each part lasts the song: the music stops at 2:43
const HOOKS = [[32.58, 43.76], [73.55, 103.34], [133.13, 162.92]];
const inHook = t => (t = loopT(t), HOOKS.some(([a, b]) => t >= a && t < b));
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const LEN = GRID.len, END_AT = LEN;        // the part ends here; the cover follows

const Q = new URLSearchParams(location.search), flag = k => Q.has(k) && Q.get(k) !== "0";
const REMIX = flag("remix"), ENDLESS = !REMIX && flag("endless"), GOLD = REMIX || ENDLESS;
const PART = REMIX ? 1 : Math.min(3, Math.max(1, +Q.get("part") || 1));
const CFG = REMIX ? { id:"lvl6r", title:"No Rest/No Work", by:"LEVEL 6 REMIX" } : {
  1: { id:"lvl6",  title:"Island Hopper",   by:"LEVEL 6" },
  2: { id:"lvl6b", title:"Crab Night",      by:"LEVEL 6 PART 2" },
  3: { id:"lvl6c", title:"Surf the Sunset", by:"LEVEL 6 PART 3" }
}[PART];
if (ENDLESS){ CFG.id += "x"; CFG.by = "LEVEL 6 PART " + PART + " \u221e"; }
if (GOLD) document.body.classList.add("gold");
// endless/remix: at the end of bar 43 (in Hook 3) the song jumps back to bar 20 (Hook 2) -
// 23 whole bars, so game time = song time + loops * LOOPLEN stays on the grid
const LOOP = [barT(20), barT(43)], LOOPLEN = LOOP[1] - LOOP[0];
const loopT = t => GOLD && t >= LOOP[1] ? LOOP[0] + (t - LOOP[0]) % LOOPLEN : t;
// how far along the difficulty is: 0..1 over the song, then on to 2.1 over five more minutes
const ramp = t => !GOLD || t <= END_AT ? t / END_AT : 1 + Math.min(1.1, (t - END_AT)/300);
// things stop coming here: the sunset, the end of a remix section, or never
const untilT = () => REMIX ? S.segEnd : ENDLESS ? Infinity : END_AT;

const LINKS = {
  next:    "https://lightningwolves.studio/javeda/",
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB){
  document.getElementById("next").addEventListener("click", e => { e.preventDefault(); toHub({ type:"javeda:next", level:CFG.id }); });
  document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
}

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const song = new Audio("lvl6.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 130.8, 98];
let saidHook = false;
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .005); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
// the stand-in beat, scheduled a little ahead on the audio clock
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), full = bar >= 2;
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 130, 42, at, .32, .5, 900);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .16, .22, 0, 1700); tone("triangle", 220, 160, at, .08, .08); }
    hiss(at, .04, s8 % 2 ? .05 : .08, 7000);
    if (s8 === 0 || s8 === 3 || s8 === 6){ const f = PROG[bar % 4]; tone("triangle", f, f, at, BEAT*.9, .16, 600); }
    if (s8 === 0 && bar % 4 === 0){ const f = PROG[bar % 4]*4; tone("sine", f, f, at, BAR*.9, .025, 3000); tone("sine", f*1.5, f*1.5, at, BAR*.9, .02, 3000); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: () => ac && tone("triangle", 880, 1320, ac.currentTime, .12, .07, 6000),
  big:  () => ac && [660, 880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.05, .2, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  jump: () => ac && tone("sine", 300, 700, ac.currentTime, .12, .05, 4000),
  zap:  () => ac && tone("square", 1400, 300, ac.currentTime, .12, .03, 5000),
  beam: () => ac && tone("sine", 500, 1500, ac.currentTime, .22, .05, 5000),
  dry:  () => ac && tone("square", 200, 120, ac.currentTime, .1, .03, 1500),
  splash: () => ac && hiss(ac.currentTime, .5, .25, 0, 900),
  heart: () => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000))
};

/* ---------------- the world from the cover ---------------- */
const C = { sand:0x2a1820, sandLit:0x4a2a26, sea:0x2a1830, rock:0x5a4a4a, leaf:0x3f5a22, ufo:0x5f9a2a, glow:0x7dff4d };
const SUN_DIR = new THREE.Vector3(.35, 0, -1).normalize();
let scene, cam, ren, sky, sea, seaGeo, ufo, beam, clockR, flashEl = $("flash");
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops){ const cv = document.createElement("canvas"); cv.width = cv.height = 128; const x = cv.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv); }
function buildSky(){
  const cv = document.createElement("canvas"); cv.width = 8; cv.height = 256; const x = cv.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, "#120a1e"); g.addColorStop(.3, "#3a1a34"); g.addColorStop(.44, "#8a3a2a"); g.addColorStop(.49, "#ff8a3a"); g.addColorStop(.52, "#6a2a22"); g.addColorStop(1, "#1a0d10");
  x.fillStyle = g; x.fillRect(0, 0, 8, 256);
  sky = new THREE.Group(); scene.add(sky);
  sky.add(new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv), side:THREE.BackSide, fog:false, depthWrite:false })));
  const n = 700, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++){ const a = rnd(i)*Math.PI*2, e = .25 + rnd(i*2.3)*1.2, r = 760; pos.set([Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r], i*3); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  sky.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:0xffe8d0, size:1.3, sizeAttenuation:false, fog:false, transparent:true, opacity:.8 })));
  const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map:radial([[0, "rgba(255,240,200,1)"], [.12, "rgba(255,190,90,1)"], [.3, "rgba(255,120,40,.55)"], [1, "rgba(255,80,20,0)"]]), fog:false, depthWrite:false, transparent:true }));
  sun.position.copy(SUN_DIR).multiplyScalar(700).setY(8); sun.scale.set(260, 260, 1); sky.add(sun);
  const cm = new THREE.SpriteMaterial({ map:radial([[0, "rgba(90,30,30,.9)"], [.6, "rgba(70,25,30,.5)"], [1, "rgba(40,15,20,0)"]]), fog:false, depthWrite:false, transparent:true });
  for (let i = 0; i < 18; i++){ const a = Math.atan2(SUN_DIR.z, SUN_DIR.x) + (rnd(i*3.3) - .5)*1.6, r = 650;
    const s = new THREE.Sprite(cm); s.position.set(Math.cos(a)*r, 40 + rnd(i*5.1)*80, Math.sin(a)*r); s.scale.set(220 + rnd(i)*200, 26 + rnd(i*2)*24, 1); sky.add(s); }
}
function buildSea(w, d, cx, cz, parent){
  const geo = new THREE.PlaneGeometry(w, d, 60, 60); geo.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color:C.sea, emissive:0x24101a, specular:0xffa060, shininess:60, flatShading:true }));
  m.position.set(cx, 0, cz); (parent || scene).add(m);
  geo.userData.base = geo.attributes.position.array.slice();
  return m;
}
function waveSea(m, t, swell){
  const geo = m.geometry, p = geo.attributes.position.array, b = geo.userData.base;
  for (let i = 0; i < p.length; i += 3){ const x = b[i] + m.position.x, z = b[i + 2] + m.position.z;

    // crabs: small, big (two hits) and fast sand-runners; built once, reused
    this.pool = [];
    const shell = c => new THREE.MeshLambertMaterial({ color:c, flatShading:true });
    const kinds = { small:[shell(0xd8452a), shell(0xff6a3a)], big:[shell(0x8a2a5a), shell(0xc84a8a)], runner:[shell(0xe8b04a), shell(0xffd27a)] };
    const eyeM = new THREE.MeshBasicMaterial({ color:0x111111 });
    for (const [kind, [bodyM, clawM]] of Object.entries(kinds)) for (let i = 0; i < (GOLD ? 36 : 26); i++){
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(.55, 10, 6), bodyM); body.scale.set(1.3, .55, 1); body.position.y = .4; g.add(body);
      for (const s of [-1, 1]){
        const c = new THREE.Mesh(new THREE.SphereGeometry(.24, 8, 6), clawM); c.scale.set(1.2, .7, 1); c.position.set(s*.75, .45, .45); g.add(c);
        const e = new THREE.Mesh(new THREE.SphereGeometry(.07, 6, 4), eyeM); e.position.set(s*.18, .72, .35); g.add(e);
        for (let l = 0; l < 3; l++){ const leg = new THREE.Mesh(new THREE.BoxGeometry(.5, .06, .06), bodyM); leg.position.set(s*.75, .25, -.25 + l*.25); leg.rotation.z = s*.6; g.add(leg); }
      }
      g.visible = false; g.userData.kind = kind; this.root.add(g); this.pool.push(g);
    }
    // the beam shots
    this.bolts = [];
    for (let i = 0; i < 10; i++){ const b = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, 1.6, 8), glowMat(C.glow, .95)); b.visible = false; this.root.add(b); this.bolts.push({ m:b, on:false }); }
    this.ring = new THREE.Mesh(new THREE.RingGeometry(.6, .85, 24), glowMat(C.glow, .8)); this.ring.rotation.x = -Math.PI/2; this.ring.visible = false; this.root.add(this.ring);
    $("gwrap").classList.remove("hid"); $("gl").textContent = "BEAM";
    $("awrap").classList.remove("hid"); $("arch").innerHTML = "<i></i>".repeat(SLOTS);
    this.ray = new THREE.Raycaster(); this.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.4);
  },
  reset(){
    Object.assign(S, { hearts:0, maxHearts:0, energy:100, hot:false, onArch:0, beamed:0, combo:0, best:0, nextSpawn:barT(1), k:0, shots:0, onBeat:0, ringT:0, tilt:0 });
    this.pool.forEach(g => g.visible = false); this.crabs = [];
    this.bolts.forEach(b => { b.on = false; b.m.visible = false; });
    this.arch.rotation.set(0, 0, 0); this.arch.position.y = 0;
  },
  intro: ["HOLD THE ARCH", "tap a crab to beam it back to the sea"],
  // tap: a beam shot from the saucer to where you tapped; on the beat it's free
  tap(cx, cy){
    if (!S.started || S.end >= 0 || S.done) return;
    const t = S.t, ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT, onBeat = ph < .13 || ph > .87;
    const cost = onBeat ? 0 : 16;
    if (S.hot || S.energy < cost){ sfx.dry(); say("TOO HOT", "wait for the beam to cool - or hit the beat", .7, true); return; }
    S.energy -= cost; if (S.energy <= 0){ S.energy = 0; S.hot = true; }
    this.ray.setFromCamera({ x:cx / innerWidth * 2 - 1, y:-(cy / innerHeight) * 2 + 1 }, cam);
    const P = new THREE.Vector3(); if (!this.ray.ray.intersectPlane(this.plane, P)) return;
    const b = this.bolts.find(b => !b.on); if (!b) return;
    const from = new THREE.Vector3(0, 4.6, ARCH_Z - 1.5), dir = P.clone().sub(from), len = dir.length(); dir.normalize();
    Object.assign(b, { on:true, from, dir, len, d:0, onBeat });
    b.m.visible = true; b.m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    S.shots++; if (onBeat){ S.onBeat++; }
    sfx.zap(); this.ring.position.set(P.x, .1, P.z); this.ring.visible = true; S.ringT = .3;
  },
  spawn(t, n){
    for (let i = 0; i < n; i++){
      const k = S.k++, f = ramp(t);
      const kind = f > .5 && rnd(k*9.1) < .22 ? "runner" : f > .25 && rnd(k*7.7) < .22 ? "big" : "small";
      const g = this.pool.find(p => !p.visible && p.userData.kind === kind); if (!g) return;
      g.visible = true; g.scale.setScalar(kind === "big" ? 2.6 : kind === "runner" ? 1.5 : 1.8);
      const v = kind === "runner" ? 3.6 + f*1.5 : kind === "big" ? 1.3 + f : 1.7 + f*1.6 + rnd(k)*.6;
      const c = { g, kind, x:(rnd(k*3.3) - .5)*24, z:-17 - rnd(k)*2, v, hp:kind === "big" ? 2 : 1, ph:rnd(k*4.4)*6, up:-1, slot:-1 };
      g.position.set(c.x, 0, c.z); this.crabs.push(c);
    }
  },
  update(dt, t){
    // crabs come on the beat, more and more; a crowd on every 8th bar
    while (t >= S.nextSpawn && t < untilT() - 3){
      const bar = Math.floor((S.nextSpawn - GRID.t0) / BAR), crowd = bar % (inHook(S.nextSpawn) ? 4 : 8) === 3, f = ramp(t);
      this.spawn(t, crowd ? 4 + Math.floor(f*4) : 1 + (rnd(bar*3.7 + S.k) < f*1.2 ? 1 : 0));
      if (crowd) say("HERE THEY COME", "", 1);
      S.nextSpawn += BEAT*2;
    }
    // the beam gun cools down; overheated it has to cool all the way to half
    S.energy = Math.min(100, S.energy + dt*(S.hot ? 34 : 24));
    if (S.hot && S.energy >= 50) S.hot = false;
    // shots fly; the first crab near the line is hit
    for (const b of this.bolts){
      if (!b.on) continue;
      b.d += 48*dt;
      const p = b.from.clone().addScaledVector(b.dir, Math.min(b.d, b.len));
      b.m.position.copy(p);
      let hit = null, hd = 1.5;
      for (const c of this.crabs){ if (c.up >= 0 || c.slot >= 0) continue; const r = c.kind === "big" ? 1.9 : 1.4, d = Math.hypot(c.x - p.x, c.z - p.z);
        if (d < r && p.y < 3 && d < hd + r){ hd = d; hit = c; } }
      if (hit){
        b.on = false; b.m.visible = false; hit.hp--; sfx.beam();
        if (hit.hp > 0){ say("BIG ONE", "hit it again", .6); }
        else { hit.up = 0; S.beamed++; S.combo++; S.best = Math.max(S.best, S.combo);
          const pts = (hit.kind === "big" ? 250 : hit.kind === "runner" ? 200 : 100) * (b.onBeat ? 2 : 1) * Math.min(4, 1 + Math.floor(S.combo/8));
          S.score += pts; if (b.onBeat) say("ON THE BEAT", "double points, free shot", .5); }
      } else if (b.d >= b.len + 1){ b.on = false; b.m.visible = false; S.combo = 0; }
    }
    // crabs scuttle to the arch; the ones that make it climb up onto it
    for (const c of this.crabs){
      if (c.up >= 0){ c.up += dt; continue; }
      if (c.slot >= 0) continue;
      const tx = (c.ph % 1 - .5)*4, dx = tx - c.x, dz = ARCH_Z - 1.5 - c.z, d = Math.hypot(dx, dz);
      const wig = c.kind === "runner" ? Math.sin(t*5 + c.ph)*4 : Math.sin(t*6 + c.ph)*1.2;
      c.x += (dx/d*c.v + wig)*dt; c.z += dz/d*c.v*dt;
      if (d < 1.2 && REMIX){
        // the remix: no crabs pile up - one that gets through bites a heart and is flung off
        c.up = 0; sfx.bad(); S.combo = 0; S.hearts--;
        if (S.hearts <= 0){ lose("THE CRABS GOT THROUGH", "Beam the nearest crab first, and shoot on the beat - it's free."); return; }
        say("A CRAB GOT THROUGH", S.hearts + (S.hearts === 1 ? " heart" : " hearts") + " left", 1, true); continue;
      }
      if (d < 1.2){
        c.slot = S.onArch++; sfx.bad(); S.combo = 0;
        const left = SLOTS - S.onArch;
        if (left <= 0){ this.topple(); return; }
        say("A CRAB ON THE ARCH", left === 1 ? "one more and it falls!" : left + " more and it falls", 1.1, true);
      }
    }
    this.crabs = this.crabs.filter(c => { if (c.up > 1.6){ c.g.visible = false; return false; } return true; });
    if (S.ringT > 0){ S.ringT -= dt; if (S.ringT <= 0) this.ring.visible = false; }
    if (!GOLD && t >= END_AT){
      // the sun's down: whatever's left runs back into the sea
      for (const c of this.crabs) if (c.up < 0 && c.slot < 0) c.up = 0;
      S.score += (SLOTS - S.onArch)*800; win("THE ARCH HOLDS");
    }
  },
  // endless: every 24 bars the tide takes the top crab off the arch
  unload(){
    const c = this.crabs.find(c => c.slot === S.onArch - 1); if (!c) return;
    c.slot = -1; c.up = 0; S.onArch--; sfx.heart(); say("THE TIDE TAKES ONE", "one crab off the arch", 1);
  },
  topple(){ S.toppleT = 0; sfx.splash(); lose("THE ARCH FELL", "Five crabs on the arch is too many. Shoot on the beat - it's free and it never overheats."); },
  hud(){
    $("gauge").firstChild.style.width = S.energy.toFixed(0) + "%"; $("gauge").classList.toggle("hot", S.hot); $("gl").textContent = S.hot ? "TOO HOT" : "BEAM";
    [...$("arch").children].forEach((e, i) => e.classList.toggle("on", i < S.onArch));
  },
  render(dt, t){
    const archTop = this.arch.position.y + 5.1*.7 + .2;
    for (const c of this.crabs){
      if (c.up >= 0){ const u = c.up; c.g.position.set(c.x, .4 + u*u*9, c.z - u*16); c.g.rotation.set(u*8, u*6, 0); }
      else if (c.slot >= 0){ c.g.position.set((c.slot - (SLOTS - 1)/2)*1.2, archTop + Math.abs(Math.sin(t*9 + c.slot))*.12, ARCH_Z); c.g.rotation.set(0, Math.sin(t*3 + c.slot)*.4, 0); c.g.scale.setScalar(1.2); }
      else { c.g.position.set(c.x, Math.abs(Math.sin(t*14 + c.ph))*.06, c.z); c.g.rotation.set(0, Math.atan2(-c.x, ARCH_Z - c.z) + Math.sin(t*6 + c.ph)*.3, 0); }
    }
    // the arch sways under the weight, and falls
    if (S.toppleT !== undefined){ S.toppleT += dt; this.arch.rotation.z = Math.min(1.3, S.toppleT*S.toppleT*1.6); this.arch.position.y = -Math.min(2, S.toppleT*1.2); }
    else this.arch.rotation.z = Math.sin(t*2)*.012*S.onArch;
    ufo.position.set(0, 4.8 + Math.sin(t*2)*.08, ARCH_Z - 1.5); ufo.rotation.set(0, t*.8, 0); ufo.visible = true;
    beam.visible = this.bolts.some(b => b.on) || S.ringT > 0; beam.scale.set(.6, 1.2, .6); beam.position.y = -.6;
    const portrait = cam.aspect < .8;
    cam.position.set(0, portrait ? 40 : 25, portrait ? 21 : 17); cam.lookAt(0, 0, portrait ? -3 : -4);
    waveSea(this.sea, t, (x, z) => Math.max(0, Math.sin((((t - GRID.t0) % BAR) / BAR)*Math.PI*2))*.35);
  }
};

/* =============== PART 3 - SURF THE SUNSET: a runner on the sea, to the sun =============== */
const LANE = 2.6;
const SURF = {
  title:"Surf the Sunset", fov:62,
  // endless: past the song it speeds up again, to 28 at ~7.5 minutes
  speed: t => 16 + Math.min(8, t/10) + (GOLD ? Math.min(4, Math.max(0, t - END_AT)/75) : 0),
  setup(){
    this.sea = buildSea(160, 400, 0, -150, this.root);
    this.items = []; this.side = [];
    for (let i = 0; i < 26; i++){ const s = i % 2 ? 1 : -1, g = new THREE.Group();
      const isle = new THREE.Mesh(new THREE.SphereGeometry(5, 12, 6, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshLambertMaterial({ color:C.sand, flatShading:true })); isle.scale.set(1.4, .35, 1); g.add(isle);
      const p = buildPalm(8 + rnd(i)*5, s*-1.2, i); p.position.set(rnd(i*2)*2, 0, 0); g.add(p);
      if (rnd(i*3) < .5){ const r = buildRock(2, i); r.position.set(-s*3, .5, 2); g.add(r); }
      g.position.set(s*(16 + rnd(i*4)*10), -.3, -i*28); this.root.add(g); this.side.push(g); }
    const rockG = new THREE.DodecahedronGeometry(1.1, 0), rockM = new THREE.MeshLambertMaterial({ color:C.rock, flatShading:true });
    const waveM = new THREE.MeshPhongMaterial({ color:0x5a3a6a, emissive:0x2a1430, specular:0xffb070, shininess:40, flatShading:true, transparent:true, opacity:.92 });
    const foamM = new THREE.MeshBasicMaterial({ color:0xffe8d8 });
    const lightM = new THREE.SpriteMaterial({ map:radial([[0, "#fffbe0"], [.3, "rgba(160,255,110,.9)"], [1, "rgba(80,255,40,0)"]]), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    const heartM = new THREE.SpriteMaterial({ map:(() => { const cv = document.createElement("canvas"); cv.width = cv.height = 64; const x = cv.getContext("2d"); x.font = "52px serif"; x.textAlign = "center"; x.fillStyle = "#7dff4d"; x.fillText("♥", 32, 50); return new THREE.CanvasTexture(cv); })(), transparent:true, depthWrite:false });
    this.make = {
      rock: () => { const m = new THREE.Mesh(rockG, rockM); m.scale.set(1.1, .9, 1); return m; },
      wave: () => { const g = new THREE.Group(); const w = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, LANE*3.4, 16, 1, false, 0, Math.PI), waveM);
        w.rotation.z = Math.PI/2; w.rotation.y = Math.PI/2; w.scale.set(1, 1, .9); g.add(w);
        const f = new THREE.Mesh(new THREE.BoxGeometry(LANE*3.4, .18, .5), foamM); f.position.y = 1.4; g.add(f); return g; },
      light: () => { const s = new THREE.Sprite(lightM); s.scale.setScalar(1.4); return s; },
      heart: () => { const s = new THREE.Sprite(heartM); s.scale.setScalar(1.5); return s; }
    };
    this.pads = '<button type="button" data-a="-1">&#9664;</button><button type="button" data-a="0">&#9650;</button><button type="button" data-a="1">&#9654;</button>';
    $("pads").innerHTML = this.pads;
  },
  reset(){
    Object.assign(S, { hearts:3, maxHearts:3, z:0, lane:0, lx:0, y:0, vy:0, inv:0, nextBeat:barT(1), k:0, lights:0, jumps:0 });
    this.items.forEach(i => this.root.remove(i.m)); this.items = [];
    $("pads").classList.remove("hid");
  },
  intro: ["RIDE TO THE SUN", "◀ ▶ lanes · ▲ jump the waves"],
  act(a){ if (!S.started || S.end >= 0 || S.done) return;
    if (a === 0){ if (S.y <= .01){ S.vy = 9; sfx.jump(); } }
    else S.lane = clamp(S.lane + a, -1, 1); },
  update(dt, t){
    const v = this.speed(t); S.z -= v*dt;
    S.vy -= 24*dt; S.y = Math.max(0, S.y + S.vy*dt); if (S.y === 0) S.vy = 0;
    S.lx += (S.lane*LANE - S.lx)*Math.min(1, dt*15); if (S.inv > 0) S.inv -= dt;
    // things arrive on the beat: a wave every other bar, rocks between, lights on the off-beats
    while (t + 2.2 > S.nextBeat && S.nextBeat < untilT() - 2){
      const k = S.k++, at = S.nextBeat, z = S.z - v*(at - t), beatInBar = k % 4, f = ramp(at);
      if (k >= 4 && beatInBar === 0 && ((k/4) % 2 === 1 || inHook(at))){ const m = this.make.wave(); m.position.set(0, 0, z); this.root.add(m); this.items.push({ m, kind:"wave", z, lane:9 }); }
      else if (k >= 4 && rnd(k*3.1) < .5 + f*.3){
        const lanes = f > .5 && rnd(k*4.1) < .35 + clamp((f - 1)*.25, 0, .25) ? 2 : 1, free = Math.floor(rnd(k*5.7)*3) - 1;
        for (const lane of [-1, 0, 1].filter(l => l !== free).slice(0, lanes)){ const m = this.make.rock(); m.position.set(lane*LANE, .3, z); this.root.add(m); this.items.push({ m, kind:"rock", z, lane }); }
      }
      const ll = Math.floor(rnd(k*7.3)*3) - 1, isHeart = k % 64 === 40, m = isHeart ? this.make.heart() : this.make.light();
      m.position.set(ll*LANE, 1.1, z - v*BEAT/2); this.root.add(m); this.items.push({ m, kind:isHeart ? "heart" : "light", z:z - v*BEAT/2, lane:ll });
      S.nextBeat += BEAT;
    }
    for (const it of this.items){
      if (it.done) continue;
      const dz = it.z - S.z;
      if (dz > -.6 && dz < .6){
        const near = Math.abs(it.lane*LANE - S.lx), inLane = near < 1.3, onRock = near < 1.0;   // halfway out of a lane is out of a rock's way
        if (it.kind === "light" && inLane){ it.done = true; it.m.visible = false; S.score += 50; S.lights++; sfx.good(); }
        else if (it.kind === "heart" && inLane){ it.done = true; it.m.visible = false; S.hearts = Math.min(3, S.hearts + 1); sfx.heart(); say("+1 HEART", "", .8); }
        else if (it.kind === "rock" && onRock && S.inv <= 0 && S.y < .9){ it.done = true; this.hit("ROCK!"); }
        else if (it.kind === "wave" && S.inv <= 0 && S.y < 1.3){ it.done = true; this.hit("WIPEOUT!"); }
        else if (it.kind === "wave"){ it.done = true; S.score += 200; S.jumps++; say("NICE JUMP", "", .6); sfx.big(); }
      }
      if (dz > 8){ it.done = true; this.root.remove(it.m); }
      if (S.done) return;
    }
    this.items = this.items.filter(it => !(it.done && it.z - S.z > 8));

  },
  hit(what){ S.hearts--; S.inv = 1.2; sfx.bad(); if (S.hearts <= 0){ lose("WIPEOUT", "Jump when the foam of the wave reaches you, and keep to the open lane."); return; }
    say(what, S.hearts + (S.hearts === 1 ? " heart" : " hearts") + " left", 1, true); },
  render(dt, t){
    ufo.position.set(S.lx, 1 + S.y + Math.sin(t*4)*.06, S.z); ufo.rotation.set(-.15, t*.8, clamp((S.lane*LANE - S.lx)*-.15, -.4, .4));
    ufo.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
    beam.visible = true; beam.scale.set(.7, .9, .7); beam.position.y = -.5;
    const portrait = cam.aspect < .8;
    cam.position.set(S.lx*.4, portrait ? 5.5 : 4.2, S.z + (portrait ? 11 : 8.5)); cam.lookAt(S.lx*.4, 1.4, S.z - 12);
    this.sea.position.z = Math.floor(S.z / 40)*40 - 150; waveSea(this.sea, t);
    this.side.forEach(g => { if (g.position.z - S.z > 20) g.position.z -= 26*28; });
    this.items.forEach(it => { if (it.kind === "light") it.m.scale.setScalar(1.3 + Math.sin(t*8)*.15); });
  }
};

let G = PART === 1 ? HOP : PART === 2 ? CRAB : SURF;   // the remix changes it every 8 bars

/* ================= ENDLESS AND REMIX =================
   A heart back every 24 bars (Part 2 endless: the tide takes a crab off the
   arch instead). The remix: 8 bars of each game, 1 -> 2 -> 3 -> 1 ..., one score
   and 3 shared hearts, +2000 and a heart back every lap; difficulty runs on the
   game clock, so every lap is harder than the one before. */
const GAMES = [HOP, CRAB, SURF];
function show(P){
  G = P; GAMES.forEach(p => { if (p.root) p.root.visible = p === P; });
  cam.fov = P.fov; cam.updateProjectionMatrix();
  $("pads").innerHTML = P.pads || ""; $("pads").classList.toggle("hid", P === CRAB);
  $("gwrap").classList.toggle("hid", P === SURF); $("gl").textContent = P === HOP ? "HOVER" : "BEAM"; $("gauge").classList.remove("hot");
  $("awrap").classList.add("hid");
}
function switchTo(seg){
  const first = S.seg < 0, keep = { hearts:S.hearts, z:S.z || 0 };
  Object.assign(S, { seg, lap:Math.floor(seg/3), segT:barT(seg*8), segEnd:barT(seg*8 + 8) });
  show(GAMES[seg % 3]); G.reset();
  S.maxHearts = 3; S.hearts = first ? 3 : keep.hearts; S.z = keep.z;
  if (G === CRAB){ S.nextSpawn = S.segT + BEAT*2; S.k = S.lap*331; }
  if (G === SURF){ S.nextBeat = S.segT + BAR; S.k = 8 + S.lap*64; }
  if (first) return;
  S.flashT = .7; lyric(G.title, 2.2); const [c0, c1] = G === HOP ? ["KEEP HOPPING", HOP.intro[1]] : G.intro;
  if (seg % 3 === 0){ S.score += 2000; S.hearts = Math.min(3, S.hearts + 1); sfx.big(); say("LAP " + (S.lap + 1), "+2,000 &middot; a heart back", 1.8); }
  else say(c0, c1, 1.8);
}
const cue = () => REMIX ? ["THE REMIX", "all three games, 8 bars each - till the hearts run out"] : GOLD && G === HOP ? ["KEEP HOPPING", HOP.intro[1]] : G.intro;
function gold(t, dt){
  const bar = Math.floor((t - GRID.t0) / BAR);
  if (REMIX && Math.floor(bar / 8) !== S.seg) switchTo(Math.floor(bar / 8));
  const r = Math.floor(bar / 24);
  if (r > S.regen){ S.regen = r;
    if (G === CRAB && !REMIX){ if (S.onArch > 0) CRAB.unload(); }
    else if (S.hearts < S.maxHearts){ S.hearts++; sfx.heart(); say("+1 HEART", "24 bars", .9); } }
  if (S.flashT > 0){ S.flashT -= dt; flashEl.style.opacity = (Math.max(0, S.flashT)/.7*.85).toFixed(2); }
}

/* ================= THE ENDING =================
   Every part ends on the cover: an orange flash, then the beach - the palms,
   the stone arch, the sun on the sea - and the saucer settling into the sand
   with its green beam on. "No Rest/No Work". */
const END = { flash:.5, out:7.5 };
let coverG;
function win(what){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.won = what; S.endT = S.t; sfx.big();
  $("hud").classList.add("off"); $("pads").classList.add("hid");
}
function lose(title, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = title; S.tip = tip; sfx.bad();
  say(title, "", 2, true);
  setTimeout(finish, 1500);
}
function renderCover(dt){
  const e = S.end;
  flashEl.style.opacity = e < END.flash ? e/END.flash : e < END.flash + .8 ? 1 - (e - END.flash)/.8 : e > END.out - 1.2 ? Math.min(1, (e - (END.out - 1.2))/1.2) : 0;
  flashEl.style.background = e > END.out - 1.2 ? "#140a12" : "#ffd9a8";
  if (e < END.flash){ G.render(dt, S.t); return; }
  const u = clamp((e - END.flash)/3, 0, 1), s = u*u*(3 - 2*u);
  ufo.visible = true; ufo.position.set(COVER.x + .5, 4 - s*2.9 + Math.sin(e*2)*.05, COVER.z + 3); ufo.rotation.set(0, e*.6, 0);
  beam.visible = true; beam.scale.set(.9, 1.1 - s*.3, .9); beam.position.y = -.55 + s*.15;
  const portrait = cam.aspect < .8;
  cam.position.set(COVER.x + .5, 2.2 + (1 - s)*1.5, COVER.z + (portrait ? 17 : 13) + (1 - s)*3); cam.lookAt(COVER.x + 1, 3.6, COVER.z - 8);
  waveSea(coverG.userData.sea, e);
  if (e > END.flash + 1.4 && !S.saidEnd){ S.saidEnd = true; lyric("No Rest/No Work", 5); }
}

/* ---------------- boot, the loop ---------------- */
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a0d14); scene.fog = new THREE.Fog(0x3a1a22, 50, 300);
  cam = new THREE.PerspectiveCamera(PART === 1 ? 42 : PART === 2 ? 52 : 62, innerWidth/innerHeight, .1, 2000);
  scene.add(new THREE.HemisphereLight(0xffb080, 0x1a0a14, .75));
  const sunL = new THREE.DirectionalLight(0xffa060, .9); sunL.position.set(-10, 6, -40); scene.add(sunL);
  buildSky();
  ufo = buildUFO(); beam = ufo.userData.beam; scene.add(ufo);
  coverG = buildCover();
  if (GOLD){ coverG.visible = false; coverG.userData.sea.visible = false; flashEl.style.background = "#ffe08a"; if (ENDLESS) $("sunbar").classList.add("hid"); }
  for (const P of REMIX ? GAMES : [G]){ P.root = new THREE.Group(); scene.add(P.root); P.setup(); }
  if (REMIX) show(HOP);
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, lyrT:0, hearts:0, maxHearts:0 }; saidHook = false;
  if (GOLD) Object.assign(S, { loops:0, regen:0, seg:-1, lap:0, segT:0, segEnd:Infinity, flashT:0 });
  if (REMIX) show(HOP);
  G.reset();
  $("msg").className = ""; $("lyric").classList.remove("on"); flashEl.style.opacity = 0; lastH = "";
}
function update(dt){
  // the song is the clock while it plays; the stand-in beat keeps its own
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done){
    // endless/remix: at the loop end jump back a whole number of bars
    if (GOLD && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOPLEN; S.loops++; } catch(e){} }
    S.t = song.currentTime + (GOLD ? S.loops*LOOPLEN : 0);
  }
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.lyrT > 0){ S.lyrT -= dt; if (S.lyrT <= 0) $("lyric").classList.remove("on"); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  if (!saidHook && !REMIX && S.t >= HOOKS[0][0]){ saidHook = true; lyric("No Rest/No Work", 3.5); }
  if (GOLD) gold(Math.max(0, S.t), dt);
  G.update(dt, Math.max(0, S.t));
}
function frame(){
  try {
    const dt = Math.min(.05, clockR ? clockR.getDelta() : .016);
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done || S.end >= 0) hud(); }
    if (S.end >= 0) renderCover(dt); else G.render(dt, Math.max(0, S.t));
    sky.position.copy(cam.position);
    ren.render(scene, cam);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return GOLD ? Math.round(S.score) : S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }   // endless counts in full
const clock = t => { const s = Math.floor(Math.max(0, t)); return Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0"); };

function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !GOLD);
  $("next").classList.toggle("hid", S.fail || GOLD);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("pads").classList.add("hid");
  if (HUB) toHub(GOLD ? { type:"javeda:result", level:CFG.id, cleared:true, score:score(), metres:Math.floor(Math.max(0, S.t)) }
    : { type:"javeda:result", level:CFG.id, cleared:!S.fail, score:score(), metres:0 });
  if (GOLD){
    v.querySelector(".by").textContent = (REMIX ? "REMIX · " : "ENDLESS · ") + S.why;
    v.querySelector("h1").textContent = score().toLocaleString("en");
    const stat = REMIX ? "lap " + (S.lap + 1) + " &middot; died in " + G.title
      : PART === 1 ? S.starsGot + " sun-stars &middot; " + S.falls + (S.falls === 1 ? " splash" : " splashes")
      : PART === 2 ? S.beamed + " crabs beamed back &middot; " + S.onBeat + " on the beat" : S.lights + " lights &middot; " + S.jumps + " waves jumped";
    ps[0].innerHTML = "Survived <b>" + clock(S.t) + "</b> &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>Level 6 " + (REMIX ? "Remix" : "Part " + PART + " &infin;") + "</b> scoreboard.";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "Not yet";
    ps[0].innerHTML = "Score <b>" + score().toLocaleString("en") + "</b>" + (PART === 2 ? " &middot; " + S.beamed + " crabs beamed back" : "");
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = CFG.title;
  const stat = PART === 1 ? S.starsGot + " sun-stars" + (S.falls ? " &middot; " + S.falls + (S.falls === 1 ? " splash" : " splashes") : " &middot; no splash")
    : PART === 2 ? S.beamed + " crabs beamed back &middot; " + S.onBeat + " on the beat &middot; " + S.onArch + " on the arch"
    : S.lights + " lights &middot; " + S.jumps + " waves jumped";
  ps[0].innerHTML = "Score <b>" + score().toLocaleString("en") + "</b> &middot; " + stat;
  ps[1].innerHTML = "No rest, no work. <b>You made it.</b>" + (PART === 1 ? "<br>Part 2: Crab Night - hold the arch." : PART === 2 ? "<br>Part 3: surf the sunset." : "");
}
$("go").addEventListener("click", () => {
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (GOLD && HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(cue()[0], cue()[1], 2.6);
});

/* ---------------- input ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
addEventListener("pointerdown", e => {
  if (veilUp() || !S.started) return;
  if (G === SURF && e.target.closest("#pads")) return;
  e.preventDefault();
  if (G === HOP) HOP.press(true);
  else if (G === CRAB) CRAB.tap(e.clientX, e.clientY);
  else { const f = e.clientX / innerWidth; SURF.act(f < 1/3 ? -1 : f > 2/3 ? 1 : 0); }
}, { passive:false });
addEventListener("pointerup", () => { if (G === HOP) HOP.press(false); });
addEventListener("pointercancel", () => { if (G === HOP) HOP.press(false); });
$("pads").addEventListener("pointerdown", e => { const b = e.target.closest("button"); if (!b || G !== SURF) return; e.stopPropagation(); e.preventDefault();
  b.classList.add("on"); setTimeout(() => b.classList.remove("on"), 100); SURF.act(+b.dataset.a); });
addEventListener("keydown", e => {
  if (veilUp() || e.repeat || !S.started) return;
  if (G === HOP && [" ", "ArrowUp", "w", "W"].includes(e.key)){ e.preventDefault(); HOP.press(true); }
  if (G === SURF){ const a = { ArrowLeft:-1, a:-1, A:-1, ArrowRight:1, d:1, D:1, ArrowUp:0, " ":0, w:0, W:0 }[e.key]; if (a !== undefined){ e.preventDefault(); SURF.act(a); } }
});
addEventListener("keyup", e => { if (G === HOP && [" ", "ArrowUp", "w", "W"].includes(e.key)) HOP.press(false); });

// the start card for this part; on its own you can switch parts
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = PART === 1 && !ENDLESS ? "No Rest/No Work" : CFG.title;
$("intro").innerHTML = PART === 1 ? "The beach from the cover, at sunset. Hop the saucer across the sea to the stone arch before the sun goes down."
  : PART === 2 ? "The sun goes down and the crabs come out of the sea - no rest. The saucer holds the stone arch: <b>beam them back</b>."
  : "The saucer skims the sea toward the sun. Jump the big waves, keep off the rocks, grab the lights.";
$("how").innerHTML = PART === 1 ? "<b>Tap</b> for a short hop, <b>hold</b> for a high jump and to hover with the beam (the HOVER bar refills when you land). Fall in the sea and it costs a heart - you have 3, and green hearts float over some gaps."
  : PART === 2 ? "<b>Tap</b> where you want the beam to go - it shoots from the saucer and knocks the first crab it meets back to the sea. Big purple crabs take two hits. The beam <b>overheats</b> if you fire too fast - but a shot <b>on the beat is free</b> and scores double. Every crab that gets through climbs onto the arch: <b>five and it falls</b>."
  : "<b>◀ ▶</b> (or the sides of the screen) to change lane, <b>▲</b> (or the middle) to jump. A big wave across all lanes has to be jumped; rocks have to be dodged. 3 hearts.";
if (ENDLESS){
  $("intro").innerHTML = "<b>Endless.</b> " + (PART === 1 ? "The beach never ends: rock to palm to rock, faster and wider the longer you last."
    : PART === 2 ? "The sun never sets and the crabs never stop - bigger crowds, faster crabs." : "The sea never ends: faster, more rocks, and the waves keep coming.") + " The song loops - play till you're out.";
  $("how").innerHTML += PART === 2 ? " Every 24 bars the tide takes one crab off the arch. Play till it falls." : " A heart back every 24 bars. Play till you're out.";
}
if (REMIX){
  $("intro").innerHTML = "<b>The remix:</b> all three games, 8 bars each - hop the rocks, hold the arch, surf the sea - and round again, faster every lap.";
  $("how").innerHTML = "One score, <b>3 hearts</b> for all of it. Island Hopper: tap = hop, hold = fly. Crab Night: tap the crabs - one that gets through costs a heart. Surf: <b>◀ ▶</b> lanes, <b>▲</b> jump. A heart back every 24 bars, and <b>+2,000</b> and a heart every lap.";
}
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const mode = b.dataset.mode || "";
    b.setAttribute("aria-pressed", String(mode === "remix" ? REMIX : +b.dataset.part === PART && !REMIX && ENDLESS === (mode === "endless")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("remix");
      if (mode === "remix"){ q.delete("part"); q.set("remix", "1"); } else { q.set("part", b.dataset.part); if (mode) q.set("endless", "1"); }
      location.search = q.toString(); });
  });
}

boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

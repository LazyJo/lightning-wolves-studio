<style>
html,body{height:100%}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= ROLLERCOASTER =================
   Level 4 of JAVEDA, and its first music game. Jo's blue UFO rides a neon
   coaster through a storm sky towards the lightning portal from the cover, and
   the track is the song: the intro is the slow climb, the first drop lands
   exactly when the drums slam in, the bars where the drums cut out are lift
   hills, and every chorus is another drop. Lights sit on three lanes of the
   track on the beat: move the UFO into a light's lane to catch it (on the beat
   for PERFECT) and out of the way of the red walls.

   Everything is timed off the song's measured grid (javeda/rollercoaster/
   SONG.md): 82.5 BPM, first downbeat 0.327 s, 56 bars; the kick hits beats 1,
   2 and 3 of each bar. While the song plays, the song is the clock. */

const BPM = 82.5, BEAT = 60 / BPM, BAR = BEAT * 4, T0 = .327;
const barT = (b, beat) => T0 + b * BAR + (beat || 0) * BEAT;
const DROPS = [barT(4), barT(24), barT(44)];                  // 11.96, 70.15, 128.33 s
const LIFTS = [[barT(20), barT(24)], [barT(40), barT(44)]];   // drums out: the chain lift
const SONG_END = 164.3, PORTAL_T = barT(53), END_T = barT(52);
const LANE = 1.9;
const WIN_PERFECT = .075, WIN_GOOD = .15;

/* Three parts. In Parts 1 and 2 the UFO rides one of three lanes: tap a lane to
   move there, fly through the lights, and stay out of the way of the red walls.
   Part 2 has a light on every kick and walls that close two lanes at once, and a
   GATE score in it opens Part 3. Part 3 is a different game: the brakes are gone,
   the UFO leaves the lanes and flies free - drag to steer through rings of
   lightning on the beat, round the storm mines. The hub opens a part with
   ?part=2|3; on its own the start card lets you pick. */
/* Once all three are cleared there is more: ?part=N&endless=1 plays a part with
   no end (the song loops, every loop is faster and fuller, 3 hearts), and
   ?remix=1 rides all three games in turn, 8 bars each, round and round. Both
   are gold, and both go on their own scoreboards (ids +"x", and "lvl4r"). */
const Q = new URLSearchParams(location.search);
const REMIX = Q.get("remix") === "1", ENDLESS = !REMIX && Q.get("endless") === "1", GOLD = ENDLESS || REMIX;
const PART = REMIX ? 1 : Math.min(3, Math.max(1, +new URLSearchParams(location.search).get("part") || 1));
const CFGS = {
  1: { id:"lvl4",  title:"ROLLERCOASTER", hit:3, miss:7, crash:12, start:70 },
  2: { id:"lvl4b", title:"FULL SPEED",    hit:2, miss:8, crash:14, start:65 },
  3: { id:"lvl4c", title:"NO BRAKES",     hit:2, miss:8, crash:14, start:60 }
};
let CFG = CFGS[PART];      // the remix swaps it as the parts come round
let FLY = PART === 3;
const RUN_ID = REMIX ? "lvl4r" : CFG.id + (ENDLESS ? "x" : "");
const HEARTS = 3;          // endless and the remix: the thrill running dry costs a heart
const GATE = 100000;       // a Part 2 score that opens Part 3 (the hub and the database hold the same number)

const LINKS = {
  next:    "https://lightningwolves.studio/javeda/",
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB){
  document.getElementById("next").addEventListener("click", e => { e.preventDefault(); toHub({ type:"javeda:next", level:CFG.id }); });
  document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
}

/* ---- the chart: which beats get a light, by section and part ---- */
function section(bar){
  if (bar < 4) return "intro";
  if ((bar >= 4 && bar < 8) || (bar >= 24 && bar < 28) || (bar >= 44 && bar < 48)) return "chorus";
  if ((bar >= 20 && bar < 24) || (bar >= 40 && bar < 44)) return "lift";
  if (bar >= 52) return "tail";
  return "verse";
}
const PATTERN = {          // beats within a bar (0-3, halves allowed) per section and part
  intro:  [[], [0], [0, 2]],
  chorus: [[0, 1, 2], [0, 1, 2, 2.5], [0, 1, 2, 3]],
  verse:  [[0, 2], [0, 1, 2], [0, 2]],
  lift:   [[0], [0, 2], [0, 2]],
  tail:   [[], [], []]
};
function rnd(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
// Part 3: the line the rings follow, as an offset from the track (x right, y up, metres)
function flyPath(t){
  const a = Math.min(1, Math.max(0, (t - 2) / 8));
  return [ (Math.sin(t*.83)*2.5 + Math.sin(t*2.1 + 1)*.8) * a, .95 + ((Math.sin(t*.61 + 1)*.9 + Math.sin(t*1.7)*.35) + .8) * a ];
}
function buildChart(){
  const notes = [];
  // lane shapes: choruses sweep across, verses step, lifts sit in the middle
  const sweep = [0, 1, 2, 1], step = [1, 0, 1, 2, 1, 2, 1, 0];
  let k = 0;
  for (let bar = 0; bar < 56; bar++){
    const sec = section(bar), beats = PATTERN[sec][PART - 1];
    beats.forEach((b, j) => {
      const t = barT(bar, b);
      let lane;
      if (sec === "chorus") lane = sweep[(bar*3 + j) % 4];
      else if (sec === "lift") lane = rnd(bar*7.3 + j) < .6 ? 1 : (j % 2 ? 0 : 2);
      else lane = step[(bar*2 + j) % 8];
      const [x, y] = flyPath(t);
      notes.push({ t, lane, x, y, sec, k:k++, hit:0, fly:FLY, lv:0 });
    });
  }
  return notes;
}
const NOTES = buildChart();

/* ---- the obstacles ----
   Parts 1-2: red walls halfway between two lights. A wall stands in the lane of
   the light you just took, so you move over early; in Part 2 a wall can close
   two lanes and leave one gap, or block the lane both lights are in (out and
   back). Part 3: storm mines sitting right on the ring line - swerve round. */
function buildWalls(){
  const out = [];
  for (let i = 0; i + 1 < NOTES.length; i++){
    const a = NOTES[i], b = NOTES[i + 1], gap = b.t - a.t, t = a.t + gap/2;
    if (a.sec === "intro" || a.sec === "lift" || b.sec === "lift" || t > END_T) continue;
    if (FLY){
      if (gap < BEAT*1.9 || rnd(i*2.7 + 5) > .55) continue;
      const [x, y] = flyPath(t);
      out.push({ t, x, y, k:out.length, fly:true });
      continue;
    }
    if (gap < BEAT*(PART === 1 ? 1.9 : .99) || rnd(i*3.1 + PART) > (PART === 1 ? .5 : .62)) continue;
    let lanes;
    if (a.lane !== b.lane) lanes = PART === 2 && rnd(i*5.3) < .5 ? [0, 1, 2].filter(l => l !== b.lane) : [a.lane];
    else if (PART === 2 && gap >= BEAT*1.9) lanes = [a.lane];
    else continue;
    out.push({ t, lanes, k:out.length, fly:false });
  }
  return out;
}
const WALLS = buildWalls();

/* ---- endless and the remix: the chart never ends ----
   The song loops bars 32-51 (the rest of verse 2, the lift, chorus 3, the
   outro): at bar 52, before the fade, it seeks back 20 bars to bar 32 - the
   outro's "living fast" lines are verse 2's first four, so the seam is clean,
   and a whole number of bars keeps the grid exact. Game time runs on
   (song time + loops * loop length); the track is drawn at song time, so each
   loop ends through the portal and comes out at bar 32 again. Every loop (lap,
   in the remix) is a level harder, up to LV_CAP: faster (the song speeds up,
   pitch kept), more lights on the off-beats, more walls and more of them
   closing two lanes, more mines - but walls still only stand where there's a
   beat or more to move. */
const LOOP_B0 = 32, LOOP_B1 = 52, LOOP_BARS = LOOP_B1 - LOOP_B0;
const LOOP_START = barT(LOOP_B0), LOOP_END = barT(LOOP_B1), LOOP_LEN = LOOP_BARS * BAR;
const LV_CAP = 5;
const PORTAL_AT = GOLD ? LOOP_END : PORTAL_T;
const songT = t => !GOLD || t < LOOP_END ? t : LOOP_START + (t - LOOP_END) % LOOP_LEN;   // game time -> song time
const songBar = g => g < LOOP_B1 ? g : LOOP_B0 + (g - LOOP_B1) % LOOP_BARS;
const barOf = t => Math.floor((t - T0) / BAR + 1e-6);
// the remix: Part 1 to bar 12, then 8 bars of each part in turn; a lap is all three
const blockOf = g => g < 4 ? 0 : Math.floor((g - 4) / 8);
const partAt = g => REMIX ? [1, 2, 3][blockOf(g) % 3] : PART;
const lapOf = g => REMIX ? Math.floor(blockOf(g) / 3) + 1 : g < LOOP_B1 ? 1 : 2 + Math.floor((g - LOOP_B1) / LOOP_BARS);
const levelAt = g => Math.min(LV_CAP, lapOf(g) - 1);
const rateAt = t => GOLD ? 1 + .04 * levelAt(barOf(t)) : 1;      // up to 1.2x at the cap
let GEN = null;                                                   // where the chart has got to
function genBars(g1){
  const sweep = [0, 1, 2, 1], step = [1, 0, 1, 2, 1, 2, 1, 0];
  for (; GEN.bar < g1; GEN.bar++){
    const g = GEN.bar, P = partAt(g), lv = levelAt(g), sb = songBar(g), sec = section(sb), fly = P === 3;
    let beats = (REMIX && g < 4 ? PATTERN.intro[1] : PATTERN[sec][P - 1]).slice();
    if (lv > 0 && sec !== "intro"){
      // more lights: the other whole beats, and (in the lanes) the off-beats
      const pWhole = Math.min(.55, .11*lv) * (sec === "lift" ? .5 : 1);
      for (const b of [0, 1, 2, 3]) if (!beats.includes(b) && rnd(g*13.7 + b*3.1 + lv) < pWhole) beats.push(b);
      if (!fly && lv >= 2 && sec !== "lift"){
        const pHalf = Math.min(.3, .075*(lv - 1));
        for (const b of [.5, 1.5, 2.5, 3.5]) if (!beats.includes(b) && rnd(g*7.9 + b*5.3 + lv) < pHalf) beats.push(b);
      }
      beats.sort((a, b) => a - b);
    }
    // a remix switch: the first beat (beat and a half, flying) is left free to change games
    if (REMIX && g >= 12 && (g - 4) % 8 === 0) beats = beats.filter(b => b >= (fly ? 1.5 : 1));
    beats.forEach((b, j) => {
      const t = barT(g, b);
      let lane;
      if (sec === "chorus") lane = sweep[(sb*3 + j + lv) % 4];
      else if (sec === "lift") lane = rnd(sb*7.3 + j + lv*11) < .6 ? 1 : (j % 2 ? 0 : 2);
      else lane = step[(sb*2 + j + lv) % 8];
      const [x, y] = flyPath(t);
      const n = { t, lane, x, y, sec, k:GEN.k++, hit:0, fly, lv };
      if (GEN.last) wallBetween(GEN.last, n, GEN.i++);
      NOTES.push(n); GEN.last = n;
    });
  }
}
// a wall (or a mine) between two lights, like buildWalls, a little more often each level
function wallBetween(a, b, i){
  if (a.fly !== b.fly || (REMIX && blockOf(barOf(a.t)) !== blockOf(barOf(b.t)))) return;
  if (a.sec === "intro" || a.sec === "lift" || b.sec === "lift") return;
  const gap = b.t - a.t, t = a.t + gap/2, lv = b.lv, P = partAt(barOf(t));
  if (b.fly){

/* ---- the track: height, speed and curves all come from the song ---- */
const LIFT_V = 5.5, G = 9.8;
function heightAt(t){
  // the climbs: intro and the two drums-out lifts, each a straight pull up
  const climb = (a, b, h0, h1) => h0 + (h1 - h0) * Math.min(1, Math.max(0, (t - a) / (b - a)));
  if (t < DROPS[0]) return climb(0, DROPS[0] - .4, 0, 40);
  for (let i = 0; i < 2; i++) if (t >= LIFTS[i][0] && t < LIFTS[i][1]) return climb(LIFTS[i][0], LIFTS[i][1] - .4, hillAt(LIFTS[i][0]), 44 + i*4);
  // after a drop: down fast, then rolling hills two bars long
  const d = DROPS.filter(x => x <= t).pop(), top = d === DROPS[0] ? 40 : d === DROPS[1] ? 44 : 48;
  const u = Math.min(1, (t - d) / 2.4), fall = top + (hillAt(d + 2.4) - top) * (1 - Math.pow(1 - u, 3)) ;
  if (t < d + 2.4) return fall;
  if (t > END_T) return hillAt(END_T) + (16 - hillAt(END_T)) * Math.min(1, (t - END_T) / 4);
  return hillAt(t);
}
function hillAt(t){ return 9 + Math.sin((t - T0) / (BAR*2) * Math.PI*2) * 5; }
function curveAt(t){
  // S-bends, quiet on the lifts and in the station - eased in and out over a
  // couple of seconds, because a bend that switches on at once is a 14 m jump
  const lift = Math.max(...LIFTS.map(([a, b]) => Math.min(1, Math.max(0, (t - (a - 2)) / 2)) * Math.min(1, Math.max(0, (b + 1.5 - t) / 2))));
  const amp = Math.min(1, t / 14) * (1 - .75*lift);
  return Math.sin(t / 21 * Math.PI*2) * 26 * amp + Math.sin(t / 7.3 * Math.PI*2) * 5 * amp;
}
const TR = { dt:.05, P:[], T:[], R:[], U:[], v:[] };
function buildTrack(){
  const n = Math.ceil((SONG_END + 2) / TR.dt);
  let s = 0, top = 0, y = 0;
  for (let i = 0; i <= n; i++){
    const t = i * TR.dt, want = heightAt(t);
    const onLift = t < DROPS[0] || LIFTS.some(([a, b]) => t >= a && t < b);
    // a coaster: chain-lift speed on the climbs, energy from the last top after
    let v = onLift ? LIFT_V : Math.sqrt(LIFT_V*LIFT_V + 2*G*Math.max(0, top - y)) * .92;
    if (t > END_T) v *= Math.max(.35, 1 - (t - END_T) / 9);
    // never steeper than 45 degrees down or 37 up: a drop you can ride, and a
    // track whose sideways never flips over the top
    const step = v * TR.dt;
    y += Math.max(-step, Math.min(.75*step, want - y));
    if (onLift) top = Math.max(top, y);
    TR.v.push(v);
    TR.P.push(new THREE.Vector3(curveAt(t), y, -s));
    s += step;
  }
  const up = new THREE.Vector3(0, 1, 0);
  let carry = null;
  for (let i = 0; i <= n; i++){
    const a = TR.P[Math.max(0, i - 1)], b = TR.P[Math.min(n, i + 1)];
    const T = b.clone().sub(a).normalize();
    // "right" is carried from one sample to the next and only eased towards level,
    // so it can't snap round on a steep bit
    const level = T.clone().cross(up);
    let R;
    if (!carry) R = level.normalize();
    else {
      R = carry.clone().addScaledVector(T, -carry.dot(T));
      if (level.lengthSq() > 1e-4) R.lerp(level.normalize(), .08);
      R.normalize();
    }
    carry = R.clone();
    // bank into the bends a little: lean from how hard the track turns
    const c = TR.P[Math.max(0, i - 6)], d = TR.P[Math.min(n, i + 6)];
    const turn = (d.x - 2*TR.P[i].x + c.x) * .06;
    R.applyAxisAngle(T, Math.max(-.35, Math.min(.35, turn)));
    const U = R.clone().cross(T).normalize();
    TR.T.push(T); TR.R.push(R); TR.U.push(U);
  }
}
// sample the track at song time t
function at(t, out, which){
  const f = Math.max(0, Math.min(TR.P.length - 1.001, t / TR.dt)), i = Math.floor(f), u = f - i;
  const A = TR[which || "P"];
  return out.copy(A[i]).lerp(A[i + 1], u);
}

const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl4.mp3"); song.preload = "auto";
// endless: at bar 52 the song seeks back 20 bars (also from timeupdate, which
// keeps firing when a hidden tab stops drawing)
function loopSong(){ if (song.currentTime >= LOOP_END){ try { song.currentTime -= LOOP_LEN; S.loops++; } catch(e){} } }
if (GOLD) song.addEventListener("timeupdate", () => { if (S && S.started && !S.done && !song.paused) loopSong(); });
let ac = null, bus = null;
function tone(type, f0, f1, dur, gain, lp, delay){
  if (!ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp; o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(.01, dur*.2));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  hit:  p => tone("triangle", p ? 1760 : 1320, p ? 1900 : 1400, .09, p ? .07 : .05, 7000),

  crash:() => { tone("sawtooth", 220, 40, .35, .09, 1200); tone("square", 90, 40, .3, .06, 600); },
  move: () => tone("sine", 520, 780, .06, .025, 4000),

/* ---- input ----
   Parts 1-2: the pads, the screen in thirds, or the arrow keys put the UFO in
   that lane. Part 3: drag anywhere to steer (the UFO follows your finger's
   movement), or hold the arrow keys. */
const laneEls = [...document.querySelectorAll("#lanes i")];
const veilUp = () => !document.getElementById("veil").classList.contains("hid");
const padEls = [...document.querySelectorAll("#pads button")];
padEls.forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); press(+b.dataset.lane); }, { passive:false }));
const FLY_X = 4.2, FLY_Y = [.5, 3.4];
const clampFly = () => { S.tx = Math.max(-FLY_X, Math.min(FLY_X, S.tx)); S.ty = Math.max(FLY_Y[0], Math.min(FLY_Y[1], S.ty)); };
let drag = null;
addEventListener("pointerdown", e => {
  if (veilUp() || (e.target.closest && e.target.closest("#pads"))) return;
  e.preventDefault();
  if (FLY){ drag = { id:e.pointerId, x:e.clientX, y:e.clientY, tx:S.tx, ty:S.ty }; return; }
  // anywhere else on the screen works too, by thirds
  const f = e.clientX / innerWidth; press(f < 1/3 ? 0 : f < 2/3 ? 1 : 2);
}, { passive:false });
addEventListener("pointermove", e => {
  if (!drag || drag.id !== e.pointerId || !S.started || S.done) return;
  // a full sweep across the short side of the screen is the whole flying room and a bit
  const k = 11 / Math.min(innerWidth, innerHeight * 1.2);
  S.tx = drag.tx + (e.clientX - drag.x) * k; S.ty = drag.ty - (e.clientY - drag.y) * k * .8; clampFly();
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
const KEYS = { ArrowLeft:0, a:0, A:0, ArrowDown:1, ArrowUp:1, s:1, S:1, w:1, W:1, " ":1, ArrowRight:2, d:2, D:2 };
const held = {};
const FLYKEYS = { ArrowLeft:[-1, 0], a:[-1, 0], A:[-1, 0], ArrowRight:[1, 0], d:[1, 0], D:[1, 0],
                  ArrowUp:[0, 1], w:[0, 1], W:[0, 1], ArrowDown:[0, -1], s:[0, -1], S:[0, -1] };
addEventListener("keydown", e => {
  if (FLY){ if (e.key in FLYKEYS){ e.preventDefault(); held[e.key] = 1; } return; }
  if (e.key in KEYS){ e.preventDefault(); if (!e.repeat && !veilUp()) press(KEYS[e.key]); }
});
addEventListener("keyup", e => { delete held[e.key]; });
addEventListener("blur", () => { for (const k in held) delete held[k]; });

function press(lane){
  if (FLY || !S.started || S.done || S.end >= 0) return;
  laneEls[lane].classList.add("on"); padEls[lane].classList.add("on");
  setTimeout(() => { laneEls[lane].classList.remove("on"); padEls[lane].classList.remove("on"); }, 90);
  if (targets) targets.children[lane].userData.flash = 1;
  // move there
  if (S.lane !== lane){ S.lane = lane; sfx.move(); }
  // and the nearest light in that lane that hasn't been judged, if it's on the beat
  let best = null, bd = 1e9;
  for (const n of NOTES){
    if (n.hit || n.lane !== lane || n.fly) continue;
    const d = Math.abs(n.t - S.t);
    if (d < bd){ bd = d; best = n; }
    if (n.t > S.t + WIN_GOOD) break;
  }
  if (!best || bd > WIN_GOOD) return;          // a tap on nothing costs nothing
  judge(best, bd <= WIN_PERFECT ? 2 : 1);
}
const judgeEl = document.getElementById("judge");
function judge(n, q){
  n.hit = q === 0 ? -1 : q;
  const m = n.m;
  if (q > 0){
    S.combo++; S.best = Math.max(S.best, S.combo);
    if (q === 2) S.perfect++; else S.good++;
    S.score += (q === 2 ? 300 : 120) * mult();
    S.thrill = Math.min(100, S.thrill + CFG.hit);
    sfx.hit(q === 2);
    if (m){ burst(m.position, q === 2 ? 14 : 8); m.visible = false; }
  } else {
    S.combo = 0; S.miss++; S.thrill = Math.max(0, S.thrill - CFG.miss); sfx.miss();
  }
  judgeEl.textContent = q === 2 ? "PERFECT" : q === 1 ? "GOOD" : "MISS";
  judgeEl.className = "on " + (q === 2 ? "p" : q === 1 ? "g" : "x"); S.judgeT = .45;
  stopIfEmpty();
}
function stopIfEmpty(){
  // endless and the remix: a heart goes instead, and the thrill comes back
  if (GOLD && S.thrill <= 0 && !S.fail && --S.hearts > 0){
    S.thrill = CFG.start; S.shake = .45; S.flash = REDUCED ? .1 : .3;
    lyric("HEART LOST", S.hearts + (S.hearts > 1 ? " hearts" : " heart") + " left", 1.6); return;
  }
  if (GOLD && S.thrill <= 0 && !S.fail) S.why = "OUT OF HEARTS";
  if (S.thrill <= 0 && !S.fail){ S.fail = true; S.done = true; lyric("THE RIDE STOPPED", "", 2); setTimeout(finish, 1200); }
}
// into a wall or a mine: the combo's gone, a big bite out of the thrill, a shake
function crash(w){
  S.crash++; S.combo = 0; S.thrill = Math.max(0, S.thrill - CFG.crash); S.shake = .45;
  sfx.crash();
  const m = w.m;
  if (m){ m.visible = false; burstAt(m, 16); }
  judgeEl.textContent = "CRASH"; judgeEl.className = "on x"; S.judgeT = .6;
  stopIfEmpty();
}
function burstAt(m, n){
  const p = new THREE.Vector3();
  if (m.userData.w.fly) p.copy(m.position); else onTrack(songT(m.userData.w.t), S.x, .9, p);
  burst(p, n, 0xff2d55);
}
const mult = () => Math.min(4, 1 + Math.floor(S.combo / 15));
function burst(p, n, color){
  let k = 0;
  for (const s of spark.children){
    if (s.visible) continue;
    if (k++ >= n) break;
    s.visible = true; s.position.copy(p);
    s.material.color.setHex(color || s.userData.c);
    s.userData.v.set((Math.random()-.5)*6, Math.random()*5 + 1, (Math.random()-.5)*6);
  }

const lyricEl = document.getElementById("lyric");
function lyric(a, b, t){ lyricEl.innerHTML = a + (b ? "<small>" + b + "</small>" : ""); lyricEl.classList.add("on"); S.msgT = t; }
// the clean lines on screen, on the beat they're sung
const LYRICS = [
  [barT(4) - .45, "LIFE'S BEEN A ROLLERCOASTER", "", 5.5],
  [barT(20), "AIN'T GOING BACK", "the drums drop out - here comes the climb", 4],
  [barT(21) + .2, "WE GON MAKE IT TO THE TOP", "", 4],
  [barT(24) - .45, "LIFE'S BEEN A ROLLERCOASTER", "", 5.5],
  [barT(40), "AIN'T GOING BACK", "", 4],
  [barT(41) + .2, "WE GON MAKE IT TO THE TOP", "", 4],
  [barT(44) - .45, "LIFE'S BEEN A ROLLERCOASTER", "last drop", 5.5],
  [barT(48), "I'M LIVING FAST", "I'm driving fast", 3.5]
];
if (ENDLESS) LYRICS[6][2] = "and again";      // endless: chorus 3 comes round every loop

function update(dt){
  // the song is the clock while it plays; before it starts, and if the browser
  // blocks it, the game keeps its own
  if (GOLD){
    // endless: the song loops (game time = song time + loops * loop length),
    // and runs a little faster each level; without it the stand-in keeps the beat
    if (!song.paused && song.currentTime > 0 && !S.done){
      loopSong(); S.t = song.currentTime + S.loops*LOOP_LEN;
    } else S.t += dt * rateAt(S.t);
    S.real += dt;
    const r = rateAt(S.t); if (Math.abs(song.playbackRate - r) > .001) song.playbackRate = r;
  } else if (!song.paused && song.currentTime > 0 && !S.done){
    S.t = song.currentTime;
  } else S.t += dt;
  // where on the song (and the track) we are: the same as S.t until endless loops
  const st = songT(S.t), pst = GOLD ? S.st : S.t - dt;
  if (GOLD){
    if (st < S.st - 1){
      // through the portal and round again
      S.lyric = LYRICS.findIndex(l => l[0] >= LOOP_START); S.flash = REDUCED ? .2 : .8; S.boltT = 0;
      if (ENDLESS) lyric("ROUND AGAIN", "loop " + lapOf(barOf(S.t)) + " &middot; faster", 2.5);
      if (REMIX) S.lyric = LYRICS.length;
    }
    S.st = st;
  }
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) lyricEl.classList.remove("on"); }
  if (S.judgeT > 0){ S.judgeT -= dt; if (S.judgeT <= 0) judgeEl.classList.remove("on"); }
  while (S.lyric < LYRICS.length && st >= LYRICS[S.lyric][0]){ const [, a, b, d] = LYRICS[S.lyric++]; lyric(a, b, d); }
  if (S.done) return;
  if (GOLD) goldStep(dt);
  // the UFO glides to where it's going: a lane, or wherever you steered it
  if (FLY){
    let kx = 0, ky = 0;
    for (const k in held){ kx += FLYKEYS[k][0]; ky += FLYKEYS[k][1]; }
    if (kx || ky){ S.tx += Math.sign(kx)*7*dt; S.ty += Math.sign(ky)*5*dt; clampFly(); }
  } else { S.tx = (S.lane - 1)*LANE; S.ty = .95; }
  const glide = 1 - Math.exp(-dt*(FLY ? 10 : 22));
  S.x += (S.tx - S.x)*glide; S.y += (S.ty - S.y)*glide;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  // the lights as they reach the UFO
  for (const n of NOTES){
    if (n.t > S.t) break;
    if (n.hit) continue;
    if (n.fly){
      // a ring: through the middle is PERFECT, through the ring is GOOD
      const d = Math.hypot(S.x - n.x, S.y - n.y);
      judge(n, d < .9 ? 2 : d < 1.65 ? 1 : 0);
    } else {
      // in its lane as it passes = caught; tap that lane on the beat for PERFECT
      if (n.in === undefined) n.in = S.lane === n.lane;
      if (n.in && S.t - n.t > WIN_PERFECT) judge(n, 1);
      else if (!n.in && S.t - n.t > WIN_GOOD) judge(n, 0);
    }
    if (S.done) return;
  }
  // the walls and mines as they reach it
  for (const w of WALLS){
    if (w.t > S.t) break;
    if (w.done) continue;
    w.done = 1;
    const hit = w.fly ? Math.hypot(S.x - w.x, S.y - w.y) < 1.05 : w.lanes.includes(S.lane);
    if (hit){ crash(w); if (S.done) return; } else S.dodged++;
  }
  // the clack of the chain on the climbs
  const onLift = st > 0 && (st < DROPS[0] || LIFTS.some(([a, b]) => st >= a && st < b));
  if (onLift && Math.floor(S.t * 6) !== Math.floor((S.t - dt) * 6)) sfx.clack();
  // lightning on every drop
  if (DROPS.some(d => st >= d && pst < d)){ S.boltT = 0; S.flash = REDUCED ? .15 : .55; }
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt*1.4);
  if (S.boltT >= 0){ S.boltT += dt; if (S.boltT > 1.2) S.boltT = -1; }
  if (!GOLD && S.t >= PORTAL_T && S.end < 0){ S.end = 0; document.getElementById("hud").classList.add("off"); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.done){ S.done = true; finish(); } }
}

// endless and the remix, every frame: a heart back every 24 bars, the remix's
// switches, the camera easing between lanes and flying, the chart kept ahead
function goldStep(dt){
  const g = barOf(S.t);
  if (ENDLESS && g >= S.heartBar){ S.heartBar += 24;
    if (S.hearts < HEARTS){ S.hearts++; if (S.msgT <= 0) lyric("+1 HEART", "24 bars ridden", 1.6); } }
  if (REMIX){
    if (S.t >= T0){ const P = partAt(g); if (P !== S.part) switchPart(P, g); }
    S.fk += ((FLY ? 1 : 0) - S.fk) * (1 - Math.exp(-dt*4));
  }
  extendChart();
}
// the remix changes games: a flash, the part's name big, the UFO into (or out of) the lanes
function switchPart(P, g){
  const was = FLY;
  S.part = P; CFG = CFGS[P]; FLY = P === 3;
  if (FLY && !was){ S.tx = S.x; S.ty = S.y; drag = null; }
  if (!FLY && was) S.lane = Math.max(0, Math.min(2, Math.round(S.x / LANE) + 1));
  for (const k in held) delete held[k];
  document.getElementById("pads").classList.toggle("hid", FLY);
  laneRibbons.forEach(m => m.visible = !FLY);
  const lap = lapOf(g);
  let sub = FLY ? "drag to fly - through the rings" : "tap a lane - catch the lights";
  if (lap > S.lap){ S.lap = lap; S.score += 2000; S.hearts = Math.min(HEARTS, S.hearts + 1); sub = "lap " + lap + " &middot; +2000 &middot; a heart back &middot; faster"; }
  S.flash = REDUCED ? .2 : .8; S.boltT = 0;
  lyric("PART " + P + " &middot; " + CFG.title, sub, 2.4);
}

/* ================= THE ENDING =================
   At bar 53 the track runs through the lightning portal: a white flash, and you
   come out where the ride began - in the cinema aisle between the blue seats,
   the beam on, the portal crackling in front. The cover. */
const END = { flash:.0, out:8.5 };
const V = new THREE.Vector3(), V2 = new THREE.Vector3(), V3 = new THREE.Vector3(), V4 = new THREE.Vector3(), LOOK = new THREE.Vector3();
const CT = new THREE.Vector3(), CU = new THREE.Vector3(), CR = new THREE.Vector3();
function render(dt){
  const t = Math.max(0, S.t), tt = songT(t);      // game time, and where on the track (endless loops it)
  if (S.end >= 0 && S.end > .35){ renderCinema(dt); return; }
  // the rings on the track ride along at the middle; the one you're in glows
  at(tt, V); at(tt, V2, "U"); at(tt, V3, "T"); at(tt, V4, "R");
  targets.visible = !FLY;
  if (!FLY){
    targets.position.copy(V).addScaledVector(V2, .95);
    targets.up.copy(V2); targets.lookAt(LOOK.copy(targets.position).add(V3));
    targets.children.forEach((r, l) => { r.userData.flash = Math.max(0, r.userData.flash - dt*5);
      r.material.opacity = (l === S.lane ? .75 : .3) + r.userData.flash*.4; r.scale.setScalar(1 + r.userData.flash*.25); });
  }
  // the UFO, hovering where you put it, leaning into the move
  ufo.position.copy(V).addScaledVector(V4, S.x).addScaledVector(V2, S.y + Math.sin(t*4)*.04);
  LOOK.copy(ufo.position).add(V3);
  ufo.up.copy(V2); ufo.lookAt(LOOK);
  ufo.rotateZ(Math.max(-.55, Math.min(.55, (S.tx - S.x)*.35)));
  if (FLY) ufo.rotateX(Math.max(-.35, Math.min(.35, -(S.ty - S.y)*.3)));
  ufo.children[0].userData.holes.rotation.y = t*1.5;
  beam.material.opacity = .14 + Math.sin(t*6)*.02;
  // a chase camera: 6 m behind the UFO and a bit above, in the track's direction
  // smoothed over the last half second - so drops and bends swing it gently, and
  // the UFO stays in the same place on screen however steep it gets. It leans
  // after the UFO sideways (and up, flying) but not all the way.
  CT.set(0, 0, 0); CU.set(0, 0, 0);
  for (let k = 0; k <= 12; k++){ const s = tt - .45 + k*.05; CT.add(at(s, V3, "T")); CU.add(at(s, V3, "U")); }
  CT.normalize(); CR.copy(CT).cross(CU).normalize(); CU.copy(CR).cross(CT).normalize();
  // (sx, sy: how far the camera stays back from following the UFO's offset)
  // (the remix eases between the two over a moment, fk)
  const fk = REMIX ? S.fk : FLY ? 1 : 0, mix = (a, b) => fk === 0 ? a : fk === 1 ? b : a + (b - a)*fk;
  const sx = -S.x * mix(cam.aspect < .8 ? .3 : .55, .25), sy = -(S.y - .95) * mix(.5, .1), lift = mix(0, .5);
  cam.position.copy(ufo.position).addScaledVector(CT, -6).addScaledVector(CU, 2.15 + lift + sy).addScaledVector(CR, sx);
  if (S.shake > 0 && !REDUCED){ const k = S.shake*.5; cam.position.x += (Math.random() - .5)*k; cam.position.y += (Math.random() - .5)*k; }
  LOOK.copy(ufo.position).addScaledVector(CT, 10).addScaledVector(CU, .7 + lift + sy).addScaledVector(CR, sx);
  cam.up.copy(CU); cam.lookAt(LOOK);
  sky.position.copy(cam.position);
  // lights: only the ones in reach are drawn; they pulse on the beat
  const beatPhase = ((t - T0) / BEAT) % 1, pulse = 1 + Math.max(0, 1 - beatPhase*4)*.25;
  for (const m of noteMeshes){
    const n = m.userData.n;
    m.visible = !n.hit && n.t > t - .2 && n.t < t + 5;
    if (!m.visible) continue;
    const fade = Math.min(1, (t + 5 - n.t)/1.5);
    if (n.fly){ m.scale.setScalar(.92 + (pulse - 1)*.5); m.userData.halo.material.opacity = .12 * fade; continue; }
    m.children[0].rotation.y = t*3; m.scale.setScalar(pulse);
    m.userData.halo.quaternion.copy(cam.quaternion);
    m.userData.halo.material.opacity = .55 * fade;
  }
  for (const m of wallMeshes){
    const w = m.userData.w;
    m.visible = !w.done && w.t < t + 5;
    if (!m.visible || !w.fly) continue;
    m.userData.core.rotation.set(t*1.3, t*2, 0);
    m.userData.halo.quaternion.copy(cam.quaternion);
    m.userData.halo.material.opacity = .25 + rnd(Math.floor(t*14) + w.k)*.25;
  }
  for (const s of spark.children){
    if (!s.visible) continue;
    s.userData.v.y -= 10*dt; s.position.addScaledVector(s.userData.v, dt);
    if (s.userData.v.y < -8) s.visible = false;
  }
  crackle(portal, t);
  station.visible = tt < 20;
  // lightning: jagged bolts down the sky ahead
  bolts.forEach((l, k) => {
    const on = S.boltT >= 0 && S.boltT < .5 + k*.12;
    l.material.opacity = on ? (1 - S.boltT) : 0;
    if (on && Math.floor(S.boltT*20) !== l.userData.f){
      l.userData.f = Math.floor(S.boltT*20);
      const pos = l.geometry.attributes.position, x0 = cam.position.x + (k - 1.5)*60, z0 = cam.position.z - 220;
      for (let i = 0; i < 12; i++) pos.setXYZ(i, x0 + (rnd(i + k*13 + l.userData.f)*2 - 1)*10, cam.position.y + 120 - i*14, z0);
      pos.needsUpdate = true;
    }
  });
  const f = document.getElementById("flash");
  f.style.background = "#ffffff";
  f.style.opacity = S.end >= 0 ? Math.min(1, S.end/.35) : (S.flash || 0);
  ren.render(scene, cam);
}
// after the portal: the cinema, the cover shot
function renderCinema(dt){
  const e = S.end, f = document.getElementById("flash");
  station.visible = true; targets.visible = false;
  // a second portal stands at the end of the aisle, like the cover
  if (!portal.userData.home){ portal.userData.home = true; portal.position.set(0, 7, -14); portal.rotation.set(0, 0, 0); }
  crackle(portal, e);
  ufo.up.set(0, 1, 0);
  const land = Math.min(1, (e - .35)/2);
  ufo.position.set(0, 1.6 + (1 - land)*2.5 + Math.sin(e*2)*.05, 13 - land*3);
  ufo.rotation.set(0, Math.PI + e*.4, 0);
  beam.material.opacity = .22;
  cam.up.set(0, 1, 0);
  cam.position.set(0, 3.2, 24 - Math.min(1, e/6)*2);
  cam.lookAt(0, 4.2, -14);
  sky.position.copy(cam.position);
  f.style.background = e > END.out - 1.4 ? "#050814" : "#ffffff";
  f.style.opacity = e > END.out - 1.4 ? Math.min(1, (e - (END.out - 1.4))/1.2) : Math.max(0, 1 - (e - .35)*1.5);
  if (e > 1.4 && !S.saidEnd){ S.saidEnd = true; lyric("LIFE'S BEEN A ROLLERCOASTER", "and you rode it", 5); }
  ren.render(scene, cam);
}

/* ---- HUD, score ---- */
const mEl = document.getElementById("m"), comboEl = document.getElementById("combo"), thrillEl = document.getElementById("thrill");
function score(){
  if (GOLD) return S.score;          // endless: the whole score, however it ended
  if (S.fail) return Math.floor(S.score / 4);
  return S.score + (S.miss === 0 && S.crash === 0 ? 5000 : 0) + Math.floor(S.thrill) * 20;
}
let lastScore = -1, lastCombo = -1, lastThrill = -1, crashed = null, lastMode = "", lastHearts = -1;
const clockTxt = s => Math.floor(s/60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const modeEl = document.getElementById("mode"), heartsEl = document.getElementById("hearts");
// endless and the remix: the mode and the time ridden instead of a song, and the hearts
function goldHud(){
  const m = (REMIX ? "REMIX &middot; LAP " + S.lap : "ENDLESS") + "<span>" + clockTxt(S.real) +
    (REMIX ? " &middot; PART " + S.part : S.loops || barOf(S.t) >= LOOP_B1 ? " &middot; LOOP " + lapOf(Math.max(0, barOf(S.t))) : "") + "</span>";
  if (m !== lastMode){ lastMode = m; modeEl.innerHTML = m; }
  if (S.hearts !== lastHearts){ lastHearts = S.hearts; heartsEl.textContent = "\u2665".repeat(Math.max(0, S.hearts)) + "\u2661".repeat(Math.max(0, HEARTS - S.hearts)); }
}
function frame(){
  try {
    const dt = Math.min(.05, clock ? clock.getDelta() : .016);
    if (S.started && !S.done) update(dt);
    else if (S.done && S.end >= 0) { S.end += dt; }
    render(dt);
    if (S.score !== lastScore){ lastScore = S.score; mEl.textContent = S.score; }
    if (GOLD) goldHud();
    if (S.combo !== lastCombo){ lastCombo = S.combo; comboEl.textContent = S.combo >= 5 ? S.combo + " COMBO" + (mult() > 1 ? " · x" + mult() : "") : ""; }
    const th = Math.round(S.thrill); if (th !== lastThrill){ lastThrill = th; thrillEl.firstChild.style.width = th + "%"; thrillEl.classList.toggle("low", th < 25); }
  } catch (e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}

function finish(){
  song.pause();
  const v = document.getElementById("veil");
  v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)");
  const go = document.getElementById("go");
  go.textContent = "Ride it again"; go.classList.toggle("alt", !S.fail);
  document.getElementById("next").classList.toggle("hid", S.fail);
  for (const id of ["outs", "home"]) document.getElementById(id).classList.remove("hid");
  document.getElementById("snd").classList.add("hid");
  document.getElementById("hud").classList.add("off");
  document.getElementById("parts").classList.add("hid");
  document.getElementById("pads").classList.add("hid");
  // endless and the remix: there's no losing, only how long and how much - and no next level
  if (GOLD){
    go.textContent = "Play again"; go.classList.remove("alt");
    document.getElementById("next").classList.add("hid");
    if (HUB) toHub({ type:"javeda:result", level:RUN_ID, cleared:true, score:score(), metres:Math.floor(S.real),
      perfect:S.perfect, good:S.good, miss:S.miss, crash:S.crash, combo:S.best });
    v.querySelector(".by").textContent = (REMIX ? "REMIX · " : "ENDLESS · ") + (S.why || "THE RIDE STOPPED");
    v.querySelector("h1").textContent = score().toLocaleString("en");
    ps[0].innerHTML = "Survived <b>" + clockTxt(S.real) + "</b> &middot; " + (REMIX ? "lap <b>" + S.lap + "</b>" : "loop <b>" + lapOf(Math.max(0, barOf(S.t))) + "</b>") +
      " &middot; " + S.perfect + " perfect, " + S.good + " good &middot; best combo <b>" + S.best + "</b>";
    ps[1].innerHTML = "Your best counts on the <b>Level 4 " + (REMIX ? "Remix" : "Part " + PART + " &infin;") + "</b> scoreboard.";
    return;
  }
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:!S.fail, score:score(), metres:0,
    perfect:S.perfect, good:S.good, miss:S.miss, crash:S.crash, combo:S.best });
  const acc = Math.round((S.perfect + S.good*.5) / Math.max(1, S.perfect + S.good + S.miss) * 100);
  if (S.fail){
    v.querySelector(".by").textContent = "THE RIDE STOPPED";
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Stopped at <b>" + Math.floor(S.t/60) + ":" + String(Math.floor(S.t % 60)).padStart(2, "0") + "</b> &middot; best combo <b>" + S.best + "</b>";
    ps[1].innerHTML = (S.crash > S.miss ? "Watch for the red " + (FLY ? "mines" : "walls") + " - move before you reach them." : "Ride the beat, not the lights.") + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = "LEVEL 4" + (PART > 1 ? " · PART " + PART : "") + " COMPLETE";
  v.querySelector("h1").textContent = CFG.title;
  ps[0].innerHTML = "Score <b>" + score().toLocaleString("en") + "</b> &middot; <b>" + acc + "%</b> &middot; " + S.perfect + " perfect, " + S.good + " good, " + S.miss + " missed" +
    (WALLS.length ? ", " + S.crash + (FLY ? " mines hit" : " walls hit") : "") + " &middot; best combo <b>" + S.best + "</b>";
  ps[1].innerHTML = "Life's been a rollercoaster. <b>You rode it.</b>" + (PART === 1 ? "<br>Part 2 has more lights and double walls."
    : PART === 2 ? (score() >= GATE ? "<br><b>Part 3 is open:</b> no brakes, no lanes - fly it."
                                     : "<br>Score <b>" + GATE.toLocaleString("en") + "</b> here to open Part 3. Tap on the beat for PERFECT.") : "");
}
document.getElementById("go").addEventListener("click", () => {
  reset();
  if (portal) portal.userData.home = false;
  if (portal){ const P = new THREE.Vector3(), T = new THREE.Vector3(); at(PORTAL_AT, P); at(PORTAL_AT, T, "T");
    portal.position.copy(P).add(new THREE.Vector3(0, 3, 0)); portal.lookAt(P.clone().add(T)); }
  document.getElementById("veil").classList.add("hid");
  document.getElementById("pads").classList.toggle("hid", FLY);
  try {
    if (!ac){ ac = new (window.AudioContext||window.webkitAudioContext)();
      bus = ac.createGain(); bus.gain.value = .5; bus.connect(ac.destination); }
    if (ac.state === "suspended") ac.resume();
  } catch(e){}
  try { song.currentTime = 0; if (GOLD) song.playbackRate = 1; } catch(e){}
  if (HUB && GOLD) toHub({ type:"javeda:start", level:RUN_ID });
  const p = song.play(); if (p && p.catch) p.catch(()=>{});
  S.started = true; S.t = 0;
  if (REMIX) lyric("REMIX", "tap a lane - then full speed - then fly - round and round", 3.5);
  else if (FLY){ drag = null; lyric("DRAG TO FLY", ENDLESS ? "endless - faster every loop" : "through the rings - round the red mines", 3.5); }
  else lyric("TAP A LANE TO MOVE THERE", ENDLESS ? "endless - faster every loop" : "catch the lights - dodge the red walls", 3.5);
});

// the start card for this part; on its own you can switch parts
document.getElementById("by").textContent = "LAZY JO" + (PART > 1 ? " · LEVEL 4 PART " + PART : "");
document.getElementById("title").textContent = CFG.title;
document.getElementById("intro").innerHTML = (PART === 1 ? "Ride the song. The lights on the track are the beat."
  : PART === 2 ? "Every kick drum is a light now, and walls can close two lanes."
  : "No brakes. The UFO leaves the lanes and flies free through the storm.") +
  " <b>" + NOTES.length + "</b> " + (FLY ? "rings" : "lights") + ", <b>" + WALLS.length + "</b> " + (FLY ? "mines" : "walls") + ".";
document.getElementById("how").innerHTML = FLY
  ? "<b>Drag</b> anywhere (or hold the arrow keys) to steer the UFO up, down, left and right. Fly <b>through the rings</b> &mdash; right through the middle = <b>PERFECT</b>. Swerve round the <b>red mines</b>. Miss too many and the ride stops."
  : "Tap &#9664; &#9679; &#9654; (or &larr; &darr; &rarr;) to <b>move your UFO</b> to that lane. Fly <b>through the lights</b> to catch them and <b>stay out of the red walls</b>. Tap a light's lane right on the beat = <b>PERFECT</b>. Miss too many and the ride stops." +
    (PART === 2 ? " Score <b>" + GATE.toLocaleString("en") + "</b> to open Part 3." : "");
// endless and the remix: the same card in gold
if (GOLD){
  document.body.classList.add("gold");
  document.getElementById("mode").classList.remove("hid"); document.getElementById("hearts").classList.remove("hid");
  document.getElementById("by").textContent = "LAZY JO · LEVEL 4" + (REMIX ? " · REMIX" : " PART " + PART + " · ENDLESS");
  document.getElementById("title").textContent = REMIX ? "REMIX" : CFG.title + " ∞";
  document.getElementById("intro").innerHTML = REMIX
    ? "All three games in one ride, <b>8 bars each</b>: the lanes, full speed, then free flight - round and round, faster every lap. Every lap is <b>+2000</b> and a heart back."
    : "<b>No end.</b> The song loops through the portal, and every loop is faster, with more lights and more walls" + (FLY ? " and mines" : "") + ". A heart comes back every 24 bars.";
  document.getElementById("how").innerHTML = (REMIX
    ? "Parts 1-2: tap &#9664; &#9679; &#9654; (or &larr; &darr; &rarr;) to <b>move lanes</b>, catch the lights, dodge the <b>red walls</b>. Part 3: <b>drag</b> (or the arrow keys) to fly through the rings, round the <b>red mines</b>."
    : document.getElementById("how").innerHTML.replace(" Miss too many and the ride stops.", "").replace(/ Score <b>[\d,]+<\/b> to open Part 3\./, "")) +
    " <b>3 hearts:</b> when the thrill runs dry you lose one. Your best goes on the <b>Level 4 " + (REMIX ? "Remix" : "Part " + PART + " &infin;") + "</b> scoreboard.";
}
if (!HUB){
  document.getElementById("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode || "";
    b.setAttribute("aria-pressed", String(m === "remix" ? REMIX : !REMIX && +b.dataset.part === PART && (m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("remix");
      if (m === "remix"){ q.delete("part"); q.set("remix", "1"); }
      else { q.set("part", b.dataset.part); if (m === "endless") q.set("endless", "1"); }
      location.search = q.toString(); });
  });
}

reset();
boot();
reset();
requestAnimationFrame(frame);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= BE ALRIGHT =================
   Level 27 of JAVEDA, in the world of the cover: high up in the sky, an island of cloud over the cloud sea, the car
   made of cloud coming up through it, the birds, the deep blue overhead - and Jo's saucer as it is on this cover
   (silver and white, the pearl dome with the "LJ", a red light on the rim, the white beam).
   Jo picked two, so the song has two parts:
   PART 1 · UNTANGLE: birds tied together with strings of light - drag them until no strings cross.
   PART 2 · BIRD CODE (?part=2): crack the order the birds are hiding in; the beads say how close each try is.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once both are cleared. */

// the song's grid, measured from the mp3 (SONG.md): 85 BPM, bar 0 at -0.006 s
const GRID = { bpm:85, t0:-0.006 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(32);                      // the outro: the beat drops out and it fades (1:30)
const LOOP = [barT(8), barT(32)];             // endless: the second hook runs back into the first
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (the intro, the breakdown with no bass), hook, loud (the verse)
const SECTIONS = [[8, "calm"], [12, "hook"], [20, "loud"], [28, "calm"], [32, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = { "2":2 }[Q.get("part")] || 1;
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Untangle", "Bird Code"], IDS = ["", "lvl27", "lvl27b"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 27" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 27" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 27" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl27.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [130.8, 98, 110, 87.3];            // a bright loop, up in the sky
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  flip: () => ac && (tone("square", 180, 90, ac.currentTime, .05, .05, 1500), hiss(ac.currentTime, .04, .08, 0, 2500)),        // a flipper's clack
  bumper:() => ac && (tone("square", 520, 260, ac.currentTime, .09, .06, 3000), tone("sine", 130, 60, ac.currentTime, .12, .12, 600)),
  sling:() => ac && tone("triangle", 900, 400, ac.currentTime, .08, .05, 5000),
  drop: () => ac && (tone("square", 300, 120, ac.currentTime, .12, .06, 1800), hiss(ac.currentTime, .1, .1, 0, 900)),
  launch:() => ac && (hiss(ac.currentTime, .35, .14, 0, 700), tone("sawtooth", 80, 400, ac.currentTime, .3, .06, 1200)),
  lock: () => ac && [392, 523, 784, 1047, 1568].forEach((f, i) => tone("sine", f, f, ac.currentTime + i*.07, .35, .06, 7000)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: high over a sea of clouds in the deep blue sky, the car made of cloud coming through it, the birds; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op, normal) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:normal ? THREE.NormalBlending : THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);

  removeLast(){ for (let i = this.n - 1; i >= 0; i--) if (this.cur[i] >= 0){ this.remove(i); return; } },
  score(g, code){ let ex = 0, any = 0; const a = Array(6).fill(0), b = Array(6).fill(0); g.forEach((c, i) => { if (c === code[i]) ex++; a[c]++; b[code[i]]++; }); for (let c = 0; c < 6; c++) any += Math.min(a[c], b[c]); return [ex, any - ex]; },
  submit(){ const g = this.cur.slice(), [ex, part] = this.score(g, this.code), r = this.rows.length; this.rows.push({ g, ex, part }); this.cur = Array(this.n).fill(-1); this.curM = Array(this.n).fill(null); this.lock = 0; S.guesses++;
    // the beads, gold then blue, to the right of the wire; the count at the left
    for (let k = 0; k < ex + part; k++){ const bead = new THREE.Mesh(PUFF_G, new THREE.MeshStandardMaterial({ color:k < ex ? 0xffc020 : 0x2a86ff, roughness:.3, emissive:k < ex ? 0xffa000 : 0x1a5aff, emissiveIntensity:.6 })); bead.scale.setScalar(.085);
      bead.position.set(this.slotX(this.n - 1) + .5 + (k % 3)*.21, .14, this.rowZ(r) - .09 + Math.floor(k/3)*.19); this.root.add(bead); this.objs.push(bead); }
    const sum = label(sumTex(ex, part), .82, .3); sum.position.set(this.slotX(0) - .78, .25, this.rowZ(r)); this.root.add(sum); this.objs.push(sum);
    // what the beads prove: no bead at all - none of these is hiding; every bird right (each once) - none of the others is
    if (ex + part === 0) g.forEach(c => this.absent.add(c));
    if (!this.rep && ex + part === this.n) for (let c = 0; c < this.nc; c++) if (!g.includes(c)) this.absent.add(c);
    if (ex) { const k = ex*20*mult(S.t); S.score += k; this.fx.pop(new THREE.Vector3(0, .2, this.rowZ(r)), "+" + fmt0(k)); }
    S.deadline += BEAT*4; S.last = new THREE.Vector3(0, 0, this.rowZ(r));
    if (ex === this.n){ const bonus = Math.round((400 + (this.TRIES - r - 1)*120 + this.n*60)*mult(S.t)); S.score += bonus; S.codes++; S.got += this.n; S.combo++; S.lvl++; sfx.big(); say("CRACKED", "in " + (r + 1) + (r ? " tries" : " try") + " · +" + fmt0(bonus), 1.6, "g"); this.cracked = true; this.reveal(); return; }
    sfx.good(ex); if (this.rows.length >= this.TRIES){ this.reveal(); if (hurt("THE BIRDS FLEW OFF", "Gold bead: right bird, right spot. Blue bead: right bird, wrong spot. No bead: that bird isn't hiding.")) return; } },
  reveal(){ this.solved = true; S.nextAt = S.t + BEAT*5; this.hidden.forEach(b => b.visible = true); this.sign.visible = false; },
  tap(cx, cy){ if (S.nextAt || S.done) return; const hit = rayAt(cx, cy, [...this.pal.filter(b => b.visible), ...this.curM.filter(Boolean)]); if (!hit) return; let o = hit.object; while (o.parent && o.parent !== this.root) o = o.parent;
    if (this.pal.includes(o)) this.add(o.userData.ci); else { const i = this.curM.indexOf(o); if (i >= 0) this.remove(i); } },
  // the bot: the first order that fits every answer so far, a bird a beat
  botStep(){ if (S.nextAt || this.lock) return; if (!this.cur.includes(-1)) return;
    if (!this.plan || this.planFor !== S.codes + ":" + this.rows.length){ const all = []; const n = this.n, nc = this.nc; const rec = (p) => { if (p.length === n){ if (this.rep || new Set(p).size === n) all.push(p.slice()); return; } for (let c = 0; c < nc; c++){ p.push(c); rec(p); p.pop(); } }; rec([]);
      const ok = all.filter(g => this.rows.every(r => { const [a, b] = this.score(g, r.g); return a === r.ex && b === r.part; })); this.plan = ok[Math.floor(rnd(S.k*1.7 + this.rows.length)*ok.length)] || all[0]; this.planFor = S.codes + ":" + this.rows.length; }
    const i = this.cur.indexOf(-1); this.add(this.plan[i]); },
  update(dt, t){
    if (this.lock && t > this.lock) this.submit();
    if (S.nextAt && t > S.nextAt) this.make(t);
    if (!S.nextAt && t > S.deadline){ this.reveal(); if (hurt("TOO SLOW", "Tap birds at the front to fill the wire. Gold bead: right bird, right spot. Blue bead: right bird, wrong spot.")) return; }
  },
  render(t){ const dt = dtOf(t), beat = onBeat(t);
    for (const b of this.placed) if (b.parent){ b.position.lerp(b.userData.to, Math.min(1, dt*10)); b.position.y = b.userData.to.y + Math.max(0, Math.sin(Math.min(1, b.position.distanceTo(b.userData.to)/2)*Math.PI))*.4; }
    const used = new Set(this.cur.filter(c => c >= 0));
    this.pal.forEach((b, i) => { const u = b.userData, out = this.absent.has(i), dim = out || (!this.rep && used.has(i));
      b.position.y = .02 + (!dim && beat && i % 2 === Math.floor(t/BEAT) % 2 ? .05 : 0); b.rotation.y = Math.sin(t*1.5 + i)*.3; b.scale.setScalar(dim ? 1.0 : 1.25);
      u.mat.color.setHex(dim ? 0x8a96aa : u.col); u.mat.emissive.setHex(dim ? 0x202838 : u.col); u.x.visible = out; });
    const nextI = this.cur.indexOf(-1);
    this.slots.forEach((s, i) => { s.visible = !S.nextAt && !this.lock && this.cur[i] < 0 && this.rows.length < this.TRIES; s.position.set(this.slotX(i), .3, this.rowZ(this.rows.length)); s.scale.setScalar(i === nextI ? .46 + (beat ? .06 : 0) : .38); });
    this.wires.forEach(w => { const cur = w.userData.row === this.rows.length && !S.nextAt; w.material.color.setHex(cur ? 0xffc020 : 0x6a86b8); w.material.emissive.setHex(cur ? 0xffa000 : 0x2a4a8a); w.material.emissiveIntensity = cur ? .5 + (beat ? .3 : 0) : .3; });
    // the cloud at the back parts when the code's cracked (or lost) and the birds fly off
    this.cover.forEach((p, i) => { const to = this.solved ? p.userData.home.clone().add(new THREE.Vector3((i - 4)*.5, .6 + i % 3*.2, -.6)) : p.userData.home; p.position.lerp(to, Math.min(1, dt*3)); });
    if (this.solved && S.nextAt && S.nextAt - S.t < BEAT*2) this.hidden.forEach((b, i) => { b.position.y += dt*(2 + i*.3); b.position.z -= dt*2; });
    this.fx.tick(dt); animSky(this.w, t, dt, beat);
    hover(S.last || new THREE.Vector3(0, 0, this.rowZ(0)), t, dt, 2.5);
    setCam([[0, 5.8, 7.4], [0, -.5, -1.2]], [[0, 9.4, 6.9], [0, -.2, -.45]]);
  }
};

/* ---------------- the games on the song's clock ----------------
   The two games are the ones from prototypes.html, unchanged at heart; this gives each what the level
   asks of it: a name, the line under GET READY, how hard it is right now (L, 0 → 1 over the song; endless
   keeps climbing), and begin() for the song or an endless window. */
const LV = () => G && G.L ? G.L(S.t) : 0;
function asPart(E, name, tag, hint){
  return Object.assign(E, { name, tag, hint, start:0,
    begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0; this.reset(); },
    L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
    get st(){ return S; } });
}
asPart(UNT, "UNTANGLE", "UNTANGLE", "drag the birds until no strings cross");
asPart(CODE, "BIRD CODE", "BIRD CODE", "guess the order the birds are hiding in");
const PARTS = [null, UNT, CODE];

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, got:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PARTS[PART]; camInit = false; G.root.visible = true; showSetting(true); END.root.visible = false; END.on = false; ME.visible = true; ME.scale.setScalar(G.meScale);
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
  $("msg").className = "";
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the game slides away and the camera comes down low in front of the car made of cloud, coming up through
   the cloud sea with its headlights on, the birds going over in the deep blue - and Jo's saucer comes down in front
   of it with its white beam, like on the cover. */
const END = { out:8.5, root:null };
for (const P of PARTS) if (P) P.meScale = .3;
function showSetting(on){}
function buildEnd(){ END.root = new THREE.Group(); scene.add(END.root); END.glow = sprite(0xffffff, 2.6, 0); END.glow.position.set(0, .1, -2.2); END.root.add(END.glow); }
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off"; $("coach").classList.add("hid");
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#f4f9ff"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = true; LOOK.copy(portrait ? new THREE.Vector3(0, .2, -1.3) : new THREE.Vector3(0, -.4, -1)); }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer comes down in front of the car made of cloud, its white beam on the cloud
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.42); ME.rotation.set(.22, Math.sin(t*1.5)*.2, 0); animSaucer(ME, t, beat);
      const b = ME.userData.beam; b.visible = true; b.scale.set(.5, .45, .5); b.position.y = -.9;
      ME.position.set(0, .42 + (1 - e)*3 + Math.sin(t*2)*.04, -2.2);
      END.glow.material.opacity = .5*e*(beat ? 1.2 : 1); G.w.userData.lift = .6*e; animSky(G.w, t, dt, beat);
      CAMP.set(0, portrait ? 1.9 : 1.55, portrait ? 6.6 : 3.4); CAML.set(0, portrait ? 1.1 : 1.15, -8.6);
      const k = Math.min(1, dt*1.1);
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("BE ALRIGHT", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off"; $("coach").classList.add("hid");
  const got = S.got;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = PART === 1 ? S.flocks + (S.flocks === 1 ? " flock" : " flocks") + " untangled · " + S.got + " birds" : S.codes + (S.codes === 1 ? " code" : " codes") + " cracked · " + S.guesses + " tries";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> up in the sky &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "BE ALRIGHT";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = ["", "Every knot undone.<br>Part 2, <b>Bird Code</b>, is open.", "Every code cracked.<br>Level 27 cleared: <b>Untangle &#8734;</b> and <b>Bird Code &#8734;</b> are open in the gold Endless list."][PART];
}

/* ---------------- input ---------------- */
// Untangle: press on a bird and drag it. Bird Code: tap a bird at the front to put it on the wire, tap one on the
// wire to take it off (or Backspace).
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault();
  if (G.tap){ G.tap(e.clientX, e.clientY); return; } down = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live() || G.tap) return; if (down || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { down = false; if (G.release) G.release(); });
addEventListener("keydown", e => { if (veilUp() || !live()) return; if (G === CODE && e.key === "Backspace"){ e.preventDefault(); CODE.removeLast(); }
  const n = +e.key; if (G === CODE && n >= 1 && n <= CODE.nc){ e.preventDefault(); CODE.add(n - 1); } });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? (PART === 1 ? "the flocks never stop" : "the codes never stop") : G.hint, 3, CFG.endless ? "g" : ""); $("coach").classList.remove("hid"); lastC = "";
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "BE ALRIGHT" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "High up in the sky from the cover - an island of cloud over the cloud sea, the car made of cloud, the birds - and Jo's saucer." +
  [" <b>Part 1 · Untangle:</b> birds tied together with strings of light, all in a knot.", " <b>Part 2 · Bird Code:</b> birds hiding in the cloud, in an order you have to crack."][PART - 1] +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = [
  "<b>Drag the birds</b> until no two strings cross. A string that crosses another is <b>red</b>, and a red X shows where; a string that crosses nothing is blue. Every string blue: the flock flies off and a bigger one comes in. Stuck? A bird lights up - try moving that one. Out of time costs a heart (3).",
  "Some birds hide in the cloud at the back. <b>Tap birds at the front</b> to put them on the wire in the order you think they're hiding. Then the beads tell you: a <b>gold</b> bead for each right bird in the right spot, a <b>blue</b> bead for each right bird in the wrong spot, no bead for a bird that isn't hiding. Use them to crack the order in 8 tries - fewer is worth more. Out of time costs a heart (3)."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
PARTS[PART].setup(); buildEnd();
reset();
requestAnimationFrame(frame);
</script>
</body>

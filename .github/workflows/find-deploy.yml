name: Find Deploy
on:
  push:
    paths:
      - '.github/workflows/find-deploy.yml'
permissions:
  deployments: read
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map deployment URL fcewlgrbe to commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os
          tok = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          def get(u):
              r = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + tok, 'User-Agent': 'gh-lookup'})
              return json.load(urllib.request.urlopen(r))
          found = False
          for page in range(1, 7):
              deps = get(f'https://api.github.com/repos/{repo}/deployments?per_page=100&page={page}')
              if not deps:
                  break
              print(f'--- page {page}: {len(deps)} deployments')
              for d in deps:
                  try:
                      ss = get(f"https://api.github.com/repos/{repo}/deployments/{d['id']}/statuses?per_page=3")
                  except Exception as e:
                      print('status err', d['id'], e); continue
                  url = ''
                  for s in ss:
                      url = s.get('environment_url') or s.get('target_url') or ''
                      if url:
                          break
                  line = f"{d['sha'][:10]} {str(d['ref'])[:45]} {d['created_at']} {url}"
                  if 'fcewlgrbe' in url:
                      print('=== MATCH ===', line)
                      found = True
                      break
                  print(line)
              if found:
                  break
          if not found:
              print('=== NOT FOUND in scanned pages ===')
          PYEOF
      - name: self-clean
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm -q .github/workflows/find-deploy.yml
          git commit -m "chore: remove deploy lookup workflow"
          git push

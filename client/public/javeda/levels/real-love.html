<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
<script>
/* ================= REAL LOVE =================
   Level 25 of JAVEDA, in the world of the cover: the beach at night - the big glowing heart over the sea (the
   small dark red one beside it), the crescent moon, the heart's light on the water, the waves rolling in, the
   palms dark on the right, the red pickup on the sand with its headlights on - and Jo's saucer as it is on this
   cover (the gold dome with the "L", the white beam). Jo picked all four, so the song has four parts:
   PART 1 · HEART FLOW: link the pairs of hearts with lines of light; lines can't cross.
   PART 2 · CRAB SWEEPER (?part=2): dig the mounds; the numbers count the crabs around. Only a crab costs a heart; dig a whole beach to clear it.
   PART 3 · STARLIGHT (?part=3): a star and the four next to it change when you tap it; light them all.
   PART 4 · SHELL SUDOKU (?part=4): each picture once in every row, column and box.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once all four are cleared.
   REMIX (?remix=1), also once all four are cleared: the four games in turn, on one score and one set of hearts. */

// the song's grid, measured from the mp3 (SONG.md): 67 BPM (a 134 beat in half time), bar 0 at -0.01 s
const GRID = { bpm:67, t0:-.0095 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(48);                      // the song fades out (2:52)
const LOOP = [barT(8), barT(48)];             // endless: the last hook runs back into the first verse
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [20, "loud"], [28, "hook"], [40, "loud"], [48, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const TURN = BAR * 16;                        // remix: one game's turn
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const REMIX = Q.get("remix") === "1";
const PART = (!REMIX && { "2":2, "3":3, "4":4 }[Q.get("part")]) || 1;
const ENDLESS = !REMIX && Q.get("endless") === "1";
const NAMES = ["", "Heart Flow", "Crab Sweeper", "Starlight", "Shell Sudoku"], IDS = ["", "lvl25", "lvl25b", "lvl25c", "lvl25d"];
const CFG = REMIX ? { id:"lvl25r", title:"Remix", by:"LEVEL 25 · REMIX", endless:true, board:"Level 25 Remix" }
  : ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 25" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 25" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 25" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/track/1AdfOk03XehfThZCwliLV2",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  universe: "/lazyjo/?src=javeda",     // True Fans -> Lazy Jo's Universe (EVEN stays only for Pass codes)
  discord: "https://discord.gg/SES7XPJvBH", youtube: "https://www.youtube.com/@lazyjo_?sub_confirmation=1",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl25.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [87.3, 116.5, 98, 130.8];          // a slow, warm night loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: the beach at night - the glowing heart over the sea, the crescent moon, the waves rolling in, the palms, the red pickup with its headlights on; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };

/* ---- what the four games share: the patch they lie on, shade under what stands up, a wash of colour on a stone ---- */
function lookGame(g, w, l, z){ const mat = flatMark(MAT, 0xffffff, .5, false, -4); mat.scale.set(w, 1, l); mat.position.set(0, .004, z); g.root.add(mat);
  if (!LK.tile){ LK.tile = new THREE.MeshStandardMaterial({ map:TILE, roughness:.85, emissive:0x4a4030, emissiveIntensity:.22 }); LK.pad = new THREE.MeshStandardMaterial({ color:0xc4b8a2, roughness:.85, emissive:0x4a4030, emissiveIntensity:.22 }); }
  return { mat }; }
function marks(root, max, tex, op, order){ const m = new THREE.InstancedMesh(LK.flat, new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:op, depthWrite:false }), max);
  m.setColorAt(0, LK.C.setHex(0xffffff));
  m.userData.max = max; m.frustumCulled = false; m.count = 0; m.visible = false; m.renderOrder = order; root.add(m); return m; }
function markAt(m, n, x, y, z, s, hex){ if (n >= m.userData.max) return n; const e = LK.I.elements; e[0] = s; e[5] = 1; e[10] = s; e[12] = x; e[13] = y; e[14] = z; m.setMatrixAt(n, LK.I); m.setColorAt(n, LK.C.setHex(hex)); return n + 1; }
function marksDone(m, n){ m.count = n; m.visible = n > 0; m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; }

/* ---- Heart Flow: the lines are lines of light in their own colours (they had burnt out, so blue, green and
   turquoise looked alike), a stone a line lies on takes its colour, a linked pair glows and beats ---- */
function lookFlow(g){ const L = g.look = lookGame(g, 6.6, 6.6, BOARD.Z); L.was = [];
  L.soft = marks(g.root, 72, TINT_SQ, .3, -3); L.full = marks(g.root, 56, TINT_SQ, .55, -3); L.shade = marks(g.root, 16, SHADOW, 1, -2);
  L.line = FLOW_COLS.map(c => new THREE.MeshBasicMaterial({ color:c })); }
function lookFlowFrame(g, t, dt, beat){ const L = g.look; if (!L) return; const n = g.n, w = cellW(n), o = (n - 1)/2;
  if (L.tiles !== g.tiles){ L.tiles = g.tiles; L.was.length = 0; for (const m of g.tiles) m.material = LK.tile; for (const m of g.ends) m.material.color.multiplyScalar(.8); }
  for (const m of g.pipes.children) if (m.material.isMeshStandardMaterial) m.material = L.line[Math.max(0, FLOW_COLS.indexOf(m.material.color.getHex()))];
  let a = 0, b = 0, s = 0;
  for (let i = 0; i < g.pairs.length; i++){ const P = g.paths[i], on = g.linked(i), hex = FLOW_COLS[i % 8];
    for (let k = 0; k < P.length; k++){ const x = (P[k][0] - o)*w, z = (P[k][1] - o)*w + BOARD.Z; if (on) a = markAt(L.full, a, x, .104, z, w*.92, hex); else b = markAt(L.soft, b, x, .104, z, w*.92, hex); }
    for (let k = 0; k < 2; k++){ const p = g.pairs[i][k], x = (p[0] - o)*w, z = (p[1] - o)*w + BOARD.Z, m = g.ends[i*2 + k]; b = markAt(L.soft, b, x, .104, z, w*.92, hex); s = markAt(L.shade, s, x + w*.03, .106, z + w*.07, w*.86, 0xffffff);
      if (m) m.material.emissiveIntensity = on ? .36 + (beat ? .12 : 0) : .2;
      if (on && !L.was[i]) ring(x, .3, z, hex, w*2.3); }
    L.was[i] = on; }
  L.full.material.opacity = .5 + (beat ? .12 : 0);
  marksDone(L.full, a); marksDone(L.soft, b); marksDone(L.shade, s); }

/* ---- Crab Sweeper: mounds that look like mounds (they were burnt out to white), dug ones like hollows with a rim,
   the numbers on the dark of the hollow ---- */
const MOUND_TEX = canvasTex(64, 64, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#ffffff"); g.addColorStop(.5, "#f0e6d4"); g.addColorStop(.86, "#c2b094"); g.addColorStop(1, "#8e7e68"); x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 110; i++){ x.fillStyle = hash(i*1.3) > .5 ? "rgba(255,252,240,.16)" : "rgba(90,70,48,.14)"; x.fillRect(hash(i*2.9)*w, hash(i*4.1)*h, 2, 2); } });
const PIT_TEX = canvasTex(8, 64, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#4e4034"); g.addColorStop(.62, "#5a4a3c"); g.addColorStop(.8, "#76624c"); g.addColorStop(.93, "#b8a07a"); g.addColorStop(1, "#7a6850"); x.fillStyle = g; x.fillRect(0, 0, w, h); });
function lookCrabs(g){ const L = g.look = lookGame(g, 6.6, 6.6, BOARD.Z); L.dug = 0; L.found = 0;
  MOUND.map = MOUND_TEX; MOUND.color.setHex(0xe4d4b2); MOUND.emissiveIntensity = .2; MOUND.needsUpdate = true;
  DUG.map = PIT_TEX; DUG.color.setHex(0xffffff); DUG.emissiveIntensity = .3; DUG.needsUpdate = true; }
function lookCrabsFrame(g, t, dt, beat){ const L = g.look; if (!L) return; const w = cellW(g.n);
  if (S.last && S.found > L.found) ring(S.last.x, .2, S.last.z, 0xff5a3a, w*2.6); else if (S.last && S.dug > L.dug) ring(S.last.x, .12, S.last.z, 0xfff2d6, w*1.9);
  L.dug = S.dug; L.found = S.found; }

/* ---- Starlight: a lit star is gold and its stone glows with it; a dark one is as dark as it was ---- */
function lookStars(g){ const L = g.look = lookGame(g, 6.6, 6.6, BOARD.Z); L.boards = 0;
  L.lit = marks(g.root, 25, TINT_RD, .8, -3); L.shade = marks(g.root, 25, SHADOW, .9, -2); }
function lookStarsFrame(g, t, dt, beat){ const L = g.look; if (!L) return; const w = cellW(g.n);
  if (L.cells !== g.cells){ L.cells = g.cells; for (const x of g.cells){ x.pad.material = LK.pad; x.m.material.emissive.setHex(0xff7a00); } }
  let a = 0, s = 0;
  for (const x of g.cells){ const p = x.pad.position; s = markAt(L.shade, s, p.x + w*.02, .086, p.z + w*.05, w*.8, 0xffffff);
    if (x.on){ x.m.material.color.setHex(0xff7a16); a = markAt(L.lit, a, p.x, .085, p.z, w*.98, 0xffb840); } }
  L.lit.material.opacity = .72 + (beat ? .16 : 0);
  marksDone(L.lit, a); marksDone(L.shade, s);
  if (S.boards > L.boards) ring(0, .35, BOARD.Z, 0xffd070, BOARD.SIZE*1.5);
  L.boards = S.boards; }

/* ---- Shell Sudoku: every picture gets a dark edge (the pale moon was lost on the pale stone), the tray stands on
   the same patch as the board, the picture you hold has light under it ---- */
function lookIcons(){ if (LK.icons) return; LK.icons = true;
  for (const tex of SYM_TEX){ const cv = tex.image, w = cv.width, h = cv.height, x = cv.getContext("2d"), dk = document.createElement("canvas"); dk.width = w; dk.height = h; const y = dk.getContext("2d");
    y.drawImage(cv, 0, 0); y.globalCompositeOperation = "source-in"; y.fillStyle = "#241428"; y.fillRect(0, 0, w, h);
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = "destination-over"; x.globalAlpha = .8; for (let i = 0; i < 12; i++) x.drawImage(dk, Math.cos(i/12*Math.PI*2)*3, Math.sin(i/12*Math.PI*2)*3);
    x.globalAlpha = 1; x.globalCompositeOperation = "source-over"; tex.needsUpdate = true; } }
function lookSudoku(g){ const L = g.look = lookGame(g, 7.5, 8.4, BOARD.Z + .52); L.placed = 0; lookIcons();
  L.shade = marks(g.root, 6, SHADOW, .9, -2); L.held = flatMark(TINT_RD, 0xffd070, .55, true, -3); g.root.add(L.held); }
function lookSudokuFrame(g, t, dt, beat){ const L = g.look; if (!L) return; const w = cellW(g.n);
  if (L.cells !== g.cells){ L.cells = g.cells; for (const x of g.cells) x.m.material = LK.tile; for (const b of g.tray) b.children[0].material = LK.pad; }
  let s = 0; L.held.visible = false;
  for (const b of g.tray){ const p = b.position; s = markAt(L.shade, s, p.x + .04, .009, p.z + .08, 1.3, 0xffffff);
    if (b.userData.k === S.pick){ L.held.visible = true; L.held.position.set(p.x, .012, p.z); L.held.scale.set(beat ? 2.2 : 2, 1, beat ? 2.2 : 2); } }
  marksDone(L.shade, s);
  if (S.last && S.placed > L.placed) ring(S.last.x, .16, S.last.z, 0xffb090, w*2);
  L.placed = S.placed; }

/* =============== 1. HEART FLOW: link the hearts in the sand =============== */
// Pairs of hearts in the same colour on a grid of stones. Drag from a heart to draw a line of light to its
// partner - lines can't cross, and drawing over another one cuts it. Link every pair for the next beach
// (bigger); fill every stone too for a bonus. Out of time costs a heart.
const FLOW_COLS = [0xff3a5a, 0xffc83a, 0x3ab8ff, 0x3ad88a, 0xc86aff, 0xff8a3a, 0xff6ad8, 0x6af0f0];
const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];
const adj = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
const FLOW = {
  setup(){ boot(48); this.w = beach(); this.root = new THREE.Group(); scene.add(this.root); this.tiles = []; this.ends = []; this.pipes = new THREE.Group(); this.root.add(this.pipes);
    if (!ME){ ME = buildSaucer(); ME.scale.setScalar(.42); scene.add(ME); }
    lookFlow(this); },
  reset(){ Object.assign(S, { board:S.lap, boards:kept(S.boards), links:kept(S.links), k:kept(S.k, 1), nextAt:0, last:null, deadline:0 }); lastT = 0; this.drag = null; this.make(startT()); say("HEART FLOW", "drag from a heart to its partner", 2.4); },
  info(){ return this.pairs.filter((_, i) => this.linked(i)).length + "/" + this.pairs.length + " LINKED · BEACH " + (S.board + 1); }, warn(){ return !S.nextAt && S.deadline - S.t < BAR; },
  // a way through every stone (the backbite walk mixes it up), cut into pieces: each piece is a pair and its line
  make(t){ for (const m of this.tiles.concat(this.ends)) this.root.remove(m); const n = this.n = S.board < 1 ? 5 : S.board < 3 ? 6 : 7;
    const P = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) P.push([r % 2 ? n - 1 - c : c, r]);
    for (let i = 0; i < n*n*30; i++){ const front = rnd(S.k++*1.3) < .5, e = front ? P[0] : P[P.length - 1], nb = front ? P[1] : P[P.length - 2];
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [e[0] + dx, e[1] + dy]).filter(q => q[0] >= 0 && q[1] >= 0 && q[0] < n && q[1] < n && !same(q, nb));
      if (!opts.length) continue; const q = opts[Math.floor(rnd(S.k++*2.7)*opts.length)], j = P.findIndex(p => same(p, q));
      if (front){ const head = P.slice(0, j).reverse(); P.splice(0, j, ...head); } else { const tail = P.slice(j + 1).reverse(); P.splice(j + 1, P.length - j - 1, ...tail); } }
    const segs = []; for (let i = 0; i < P.length;){ let L = 3 + Math.floor(rnd(S.k++*4.1)*(n - 1)); if (P.length - (i + L) < 3) L = P.length - i; segs.push(P.slice(i, i + L)); i += L; }
    this.sol = segs; this.pairs = segs.map(s => [s[0], s[s.length - 1]]); this.paths = segs.map(() => []); this.drag = null;
    this.tiles = stones(this.root, n);
    this.ends = []; this.pairs.forEach((pr, i) => pr.forEach(p => { const m = new THREE.Mesh(HEART_GEO, new THREE.MeshStandardMaterial({ color:FLOW_COLS[i % 8], roughness:.35, emissive:FLOW_COLS[i % 8], emissiveIntensity:.45 }));
      m.scale.setScalar(cellW(n)*.62); m.rotation.x = -Math.PI/2; m.position.copy(cellPos(n, p[0], p[1], .22)); m.userData.base = m.position.y; this.root.add(m); this.ends.push(m); }));
    this.dirty = true; S.nextAt = 0; S.allow = BAR*(1.5 + segs.length*1.05)*(n > 5 ? 1.25 : 1)*(1.15 - .3*clamp(LV(), 0, 1.4)); S.deadline = t + S.allow; },
  endAt(p){ return this.pairs.findIndex(pr => same(pr[0], p) || same(pr[1], p)); },
  linked(i){ const P = this.paths[i], [a, b] = this.pairs[i]; return P.length > 1 && ((same(P[0], a) && same(P[P.length - 1], b)) || (same(P[0], b) && same(P[P.length - 1], a))); },
  // one step of the line onto stone p
  step(p){ const d = this.drag, P = this.paths[d.c], last = P[P.length - 1];
    if (!adj(last, p)) return false;
    if (P.length > 1 && same(P[P.length - 2], p)){ P.pop(); this.dirty = true; return true; }
    if (this.linked(d.c)) return false;
    const e = this.endAt(p); if (e >= 0 && e !== d.c) return false;          // another colour's heart: the way is shut
    const own = P.findIndex(q => same(q, p)); if (own >= 0){ P.length = own + 1; this.dirty = true; return true; }
    this.paths.forEach((Q, o) => { if (o === d.c) return; const k = Q.findIndex(q => same(q, p)); if (k >= 0){ const was = this.linked(o); Q.length = k; if (was) sfx.bad(); } });   // cut across another line
    P.push(p); this.dirty = true; sfx.tick(); S.last = cellPos(this.n, p[0], p[1]);
    if (this.linked(d.c)) this.done(d.c); return true; },
  done(i){ const n = (this.paths[i].length*20)*mult(S.t); S.score += n; S.links++; S.got++; S.combo++; sfx.good(S.combo); say("LINKED", "+" + n, .6);
    if (this.pairs.every((_, j) => this.linked(j))){ const full = this.paths.reduce((a, P) => a + P.length, 0) === this.n*this.n, bonus = 300 + (full ? 400 : 0) + Math.round(Math.max(0, S.deadline - S.t)*25);
      S.score += bonus; S.boards++; S.board++; sfx.big(); say(full ? "A FULL BEACH" : "ALL LINKED", "+" + bonus, 1.2); S.nextAt = S.t + BEAT*3; this.drag = null; } },
  setPath(i, cells){ this.drag = { c:i }; this.paths[i] = [cells[0]]; for (const p of cells.slice(1)) this.step(p); this.drag = null; },
  point(cx, cy){ if (!down || S.nextAt) return; const p = cellAt(this.n, cx, cy); if (!p) return;
    if (!this.drag){ const e = this.endAt(p);
      if (e >= 0){ this.paths[e] = [p]; this.drag = { c:e }; this.dirty = true; sfx.tick(); return; }
      const o = this.paths.findIndex(P => P.some(q => same(q, p))); if (o >= 0 && !this.linked(o)){ const P = this.paths[o]; P.length = P.findIndex(q => same(q, p)) + 1; this.drag = { c:o }; this.dirty = true; }
      return; }
    // a quick finger skips stones: walk to it one stone at a time
    for (let guard = 0; guard < 20; guard++){ const P = this.paths[this.drag.c], last = P[P.length - 1]; if (same(last, p)) break;
      const dx = p[0] - last[0], dy = p[1] - last[1], nx = Math.abs(dx) >= Math.abs(dy) ? [last[0] + Math.sign(dx), last[1]] : [last[0], last[1] + Math.sign(dy)];
      if (!this.step(nx) || !this.drag) break; } },
  release(){ this.drag = null; },
  rebuild(){ for (const m of this.pipes.children.slice()) this.pipes.remove(m); const n = this.n, w = cellW(n);
    this.paths.forEach((P, i) => { const mat = new THREE.MeshStandardMaterial({ color:FLOW_COLS[i % 8], roughness:.3, emissive:FLOW_COLS[i % 8], emissiveIntensity:this.linked(i) ? .9 : .5 });
      P.forEach((p, k) => { const a = cellPos(n, p[0], p[1], .14), dot = new THREE.Mesh(new THREE.CylinderGeometry(w*.19, w*.19, .07, 12), mat); dot.position.copy(a); this.pipes.add(dot);
        if (k){ const b = cellPos(n, P[k - 1][0], P[k - 1][1], .14), seg = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(a.x - b.x) + w*.38, .07, Math.abs(a.z - b.z) + w*.38), mat); seg.position.copy(a).add(b).multiplyScalar(.5); this.pipes.add(seg); } }); });
    this.dirty = false; },
  update(dt, t){
    if (S.nextAt && t > S.nextAt){ S.nextAt = 0; this.make(t); }
    if (!S.nextAt && t > S.deadline){ if (hurt("OUT OF TIME", "Drag from a heart to the heart of the same colour - lines can't cross; drawing over one cuts it.")) return; this.make(t); }
  },
  render(t){ const dt = dtOf(t), beat = onBeat(t); if (this.dirty) this.rebuild();
    this.ends.forEach((m, j) => { const i = Math.floor(j/2), on = this.linked(i); m.position.y = m.userData.base + (on ? .08 + (beat ? .05 : 0) : 0); m.rotation.z = on ? Math.sin(t*3 + j)*.15 : 0; });
    animBeach(this.w, t, dt, beat);
    lookFlowFrame(this, t, dt, beat);
    hover(S.last || new THREE.Vector3(0, 0, BOARD.Z), t, dt);
    sandCam();
  }
};

/* =============== 2. CRAB SWEEPER: the crabs hiding in the sand =============== */
// Mounds of sand, crabs hidden under some. Tap a mound to dig it: the number says how many crabs are
// in the 8 around it (0 digs its neighbours too). Hold (or turn on FLAG) to mark a crab with a heart flag.
// Dig up a crab and it bites - a heart. Dig every crab-free mound for the next beach. No hurry: waiting costs nothing
// (the tide used to take a heart after 2 bars without a dig; Jo took it out). A whole beach dug before the song
// ends clears the part, so doing nothing doesn't.
const NUM_CSS = ["", "#3ab8ff", "#3ad88a", "#ff5a5a", "#c86aff", "#ff9a3a", "#3af0f0", "#ffffff", "#ffc83a"];
const NUM_TEX = NUM_CSS.map((c, i) => i ? iconTex(64, 64, (x, w, h) => { x.fillStyle = c; x.strokeStyle = "#1a1410"; x.lineWidth = 6; x.font = "bold 46px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.strokeText(i, 32, 35); x.fillText(i, 32, 35); }) : null);
const MOUND = new THREE.MeshStandardMaterial({ color:0xd8c8a8, roughness:1, emissive:0x4a3a28, emissiveIntensity:.5 });
const DUG = new THREE.MeshStandardMaterial({ color:0x6a5a46, roughness:1, emissive:0x1a140c, emissiveIntensity:.4 });
function crabMesh(){ const g = new THREE.Group(), red = new THREE.MeshStandardMaterial({ color:0xff4a2a, roughness:.5, emissive:0x8a1a0a, emissiveIntensity:.6 });
  const b = new THREE.Mesh(new THREE.SphereGeometry(.3, 14, 8), red); b.scale.set(1.3, .55, 1); g.add(b);
  for (const s of [-1, 1]){ const cl = new THREE.Mesh(new THREE.SphereGeometry(.13, 8, 6), red); cl.position.set(s*.42, .05, .22); g.add(cl);
    for (let k = 0; k < 3; k++){ const l = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .3, 5), red); l.rotation.z = s*1.2; l.position.set(s*.38, -.05, -.12 + k*.12); g.add(l); }
    const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 5), new THREE.MeshBasicMaterial({ color:0xffffff })); e.position.set(s*.1, .2, .2); g.add(e); }
  return g; }
function flagMesh(){ const g = new THREE.Group(); const st = new THREE.Mesh(new THREE.CylinderGeometry(.02, .02, .6, 5), soft(0xf4ecdc, .3)); st.position.y = .3; g.add(st);
  const h = new THREE.Mesh(HEART_GEO, new THREE.MeshStandardMaterial({ color:0xff4a7a, emissive:0xff2a5a, emissiveIntensity:.6 })); h.scale.setScalar(.32); h.position.set(.12, .52, 0); g.add(h); return g; }
const CRABS = {
  act:"FLAG",
  setup(){ boot(48); this.w = beach(); this.root = new THREE.Group(); scene.add(this.root); this.cells = [];
    if (!ME){ ME = buildSaucer(); ME.scale.setScalar(.42); scene.add(ME); }
    lookCrabs(this); },
  reset(){ Object.assign(S, { board:S.lap, boards:kept(S.boards), dug:kept(S.dug), found:kept(S.found), k:kept(S.k, 1), nextAt:0, last:null, deadline:0, flagMode:false }); lastT = 0; this.hold = null; this.make(startT()); say("CRAB SWEEPER", "tap to dig - the numbers count the crabs around", 2.4); },
  info(){ const left = this.cells.filter(x => !x.crab && !x.open).length; return left + " TO DIG · " + this.crabs + " CRABS"; }, warn(){ return false; },
  make(t){ for (const x of this.cells){ this.root.remove(x.m); if (x.num) this.root.remove(x.num); if (x.flag) this.root.remove(x.flag); if (x.crabM) this.root.remove(x.crabM); }
    const n = this.n = S.board < 1 ? 7 : 8; this.crabs = S.board < 1 ? 7 : Math.min(14, 10 + (S.board - 1)*2); this.armed = false; this.cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){ const m = new THREE.Mesh(new THREE.SphereGeometry(cellW(n)*.48, 14, 8, 0, Math.PI*2, 0, Math.PI/2), MOUND); m.scale.y = .45; m.position.copy(cellPos(n, c, r, 0)); this.root.add(m); this.cells.push({ c, r, m, crab:false, open:false, flag:null, n:0 }); }
    S.nextAt = 0; this.fuse(t + BAR*2); },
  fuse(t){ S.allow = BAR*Math.max(1.4, 2.2 - S.board*.2)*(1.15 - .3*clamp(LV(), 0, 1.4)); S.deadline = t + S.allow; },
  at(c, r){ return c >= 0 && r >= 0 && c < this.n && r < this.n ? this.cells[r*this.n + c] : null; },
  around(x){ const o = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (dr || dc){ const y = this.at(x.c + dc, x.r + dr); if (y) o.push(y); } return o; },
  // the crabs only bury themselves after the first dig - it's never one
  arm(first){ const safe = new Set([first, ...this.around(first)]), pool = shuffle(this.cells.filter(x => !safe.has(x)), S.k++*9);

  return Object.assign(E, { name, tag, hint, start:0,
    begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0; this.reset(); },
    L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
    get st(){ return S; } });

  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  if (REMIX) for (const P of PARTS) if (P) P.root.visible = false;
  G = PARTS[PART]; camInit = false; G.root.visible = true; showSetting(true); END.root.visible = false; END.on = false; ME.visible = true; ME.scale.setScalar(G.meScale);
  if (REMIX) G.begin(0, TURN, .3, .4); else if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
  $("msg").className = "";

  $("act").classList.toggle("hid", G !== CRABS);
  $("flash").style.background = "#ffc83a"; S.flashT = .4; sfx.whoosh();
  say(first ? "LAP " + (S.lap + 1) : G.name, first ? G.name + " · +2,000" + (back ? " · a heart back" : "") : G.hint, 2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (REMIX){ if (t >= S.turnAt + TURN && (S.nextAt ? t > S.nextAt : t > S.deadline || t >= S.turnAt + TURN + BAR*8)) nextGame(t); }
  else if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the camera draws back from the board to the whole beach - the glowing heart over the sea, the
   waves rolling in, the palms, the red pickup with its headlights on - and Jo's saucer comes down on the sand
   in front with its white beam, like on the cover. */
const END = { out:8.5, root:null };
for (const P of PARTS) if (P) P.meScale = .42;
function showSetting(on){}
function buildEnd(){ END.root = new THREE.Group(); scene.add(END.root); END.glow = sprite(0xfff4d0, 2.6, 0); END.glow.position.set(-.6, .1, 2.6); END.root.add(END.glow); }
function win(){
  if (S.end >= 0 || S.done) return;
  if (PART === 2 && !CFG.endless && !REMIX && S.boards < 1){ lose("THE SONG'S OVER", "Dig a whole beach - every mound without a crab - to clear Crab Sweeper. Take your time: only a crab costs a heart."); return; }
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say(REMIX ? "REMIX OVER" : "RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#ffe0d8"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = true; LOOK.copy(portrait ? new THREE.Vector3(0, .9, -2.6) : new THREE.Vector3(0, -1, -1.6)); $("act").classList.add("hid"); }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer comes down on the sand in front of the pickup, its beam on the sand
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.46); ME.rotation.set(-.08, Math.sin(t*1.5)*.2, 0); animSaucer(ME, t, beat);
      const b = ME.userData.beam; b.visible = true; b.scale.set(.5, .55, .5); b.position.y = -1.0;
      ME.position.set(portrait ? 2.4 : .5, .85 + (1 - e)*3 + Math.sin(t*2)*.04, 2.6); END.glow.position.x = ME.position.x;
      END.glow.material.opacity = .35*e*(beat ? 1.2 : 1); animBeach(G.w, t, dt, beat);
      CAMP.set(portrait ? 3.4 : 1.6, portrait ? 3.0 : 2.3, portrait ? 13 : 8.6); CAML.set(portrait ? 3.8 : 2.6, portrait ? 1.7 : 1.5, -4);
      const k = Math.min(1, dt*1.1);
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("REAL LOVE", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const got = S.got;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = REMIX ? "pairs <b>" + (S.links || 0) + "</b> &middot; mounds <b>" + (S.dug || 0) + "</b> &middot; taps <b>" + (S.moves || 0) + "</b> &middot; pictures <b>" + (S.placed || 0) + "</b>" : PART === 1 ? S.links + " pairs linked · " + S.boards + " beaches" : PART === 2 ? S.dug + " mounds dug · " + S.boards + " beaches cleared" : PART === 3 ? S.boards + " skies lit in " + S.moves + " taps" : S.placed + " pictures placed · " + S.boards + " grids solved";
  if (CFG.endless){
    v.querySelector(".by").textContent = (REMIX ? "REMIX · " : "ENDLESS · ") + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the beach &middot; " + (REMIX ? "lap <b>" + (S.lap + 1) + "</b> &middot; " : "") + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "REAL LOVE";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = ["", "Every heart found its pair.<br>Part 2, <b>Crab Sweeper</b>, is open.", "Not one crab too many.<br>Part 3, <b>Starlight</b>, is open.", "Every star lit.<br>Part 4, <b>Shell Sudoku</b>, is open.",
    "That's real love.<br>Level 25 cleared: <b>Heart Flow &#8734;</b>, <b>Crab Sweeper &#8734;</b>, <b>Starlight &#8734;</b>, <b>Shell Sudoku &#8734;</b> and the <b>Remix &#8734;</b> are open in the gold Endless list."][PART];
}

/* ---------------- input ---------------- */
// Heart Flow: drag. Crab Sweeper: tap to dig, hold (or the FLAG button) to flag. Starlight, Shell Sudoku: tap.
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live() || e.target === $("act")) return; e.preventDefault(); if (G.tap){ G.tap(e.clientX, e.clientY); return; } down = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live() || G.tap || e.target === $("act")) return; if (down || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { const was = down; down = false; if (was && live() && G.release) G.release(); });
$("act").addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); if (live() && G.press) G.press(); });
addEventListener("keydown", e => { if (e.key === " " && !veilUp() && live() && G.press){ e.preventDefault(); if (!e.repeat) G.press(); } });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  if (REMIX) say("REMIX", "all four games, till the hearts run out", 3, "g");
  else say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? "the beaches never stop" : G.hint, 3, CFG.endless ? "g" : "");
  $("act").classList.toggle("hid", G !== CRABS);
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = REMIX ? "REMIX" : "REAL LOVE" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The beach from the cover at night - the glowing heart over the sea, the crescent moon, the waves, the red pickup with its headlights on - and Jo's saucer." +
  (REMIX ? " <b>The remix:</b> Heart Flow, Crab Sweeper, Starlight and Shell Sudoku, 16 bars each, and round again, harder every lap. A finished lap gives a heart back."
    : [" <b>Part 1 · Heart Flow:</b> pairs of hearts on stones in the sand.", " <b>Part 2 · Crab Sweeper:</b> mounds of sand, crabs hiding under some.", " <b>Part 3 · Starlight:</b> stars lying in the sand, some lit, some dark.", " <b>Part 4 · Shell Sudoku:</b> a sudoku with pictures from the beach."][PART - 1]) +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = REMIX ? "<b>Heart Flow:</b> drag from a heart to the heart of the same colour; lines can't cross. <b>Crab Sweeper:</b> tap a mound to dig it, the number counts the crabs around; hold it, or turn on <b>FLAG</b>, to mark a crab - only a crab costs a heart. <b>Starlight:</b> tap a star and it changes, with the four next to it; light them all. <b>Shell Sudoku:</b> tap a picture on the tray, then a stone; each one once in every row, column and box. When a game's turn is up you finish what you're on, then the next one comes in." : [
  "<b>Drag</b> from a heart to the heart of the same colour to draw a line of light - lines can't cross, and drawing over one cuts it. Link every pair for the next beach; fill every stone too for a bonus. Out of time costs a heart (3). Linked <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Tap</b> a mound to dig it: the number says how many crabs are in the 8 around it (an empty one digs its neighbours too; the first dig is never a crab). <b>Hold</b> a mound, or turn on <b>FLAG</b>, to mark a crab. Dig up a crab and it bites - a heart (3). Take your time: only a crab costs a heart. Dig a whole beach to clear the part. Dug <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Tap</b> a star: it changes, and so do the four next to it - lit goes dark, dark lights up. Light every star for the next sky (each one says how many taps it was made with). Out of time costs a heart (3). Lit <b>on the beat</b> it counts double; double again in the hooks.",
  "Each picture once in every row, every column and every box: <b>tap</b> a picture on the tray, then <b>tap</b> a stone. A wrong one doesn't stay. 4x4, then 6x6. Out of time costs a heart (3). Placed <b>on the beat</b> it counts double; double again in the hooks."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === (REMIX ? "r" : String(PART) + (ENDLESS ? "x" : ""))));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part"); q.delete("remix");
      if (m === "r") q.set("remix", "1"); else { if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); } location.search = q.toString(); });
  });
}
if (REMIX) FLOW.setup(), CRABS.setup(), STARS.setup(), SDK.setup(); else PARTS[PART].setup();
buildEnd();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

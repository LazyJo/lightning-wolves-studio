<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= FEEL LIKE THAT =================
   Level 5 of JAVEDA: the park from the cover, at night, every street lamp dark.
   Jo's little green saucer flies over it and gathers fireflies - they follow it
   in a glowing trail - and brings them to the lamps: enough fireflies and a lamp
   lights up. Light every lamp before the song is over and the two old lamps by
   the bench, leaning into each other, light up together. The cover.

   Moths flutter over the park while the beat plays and scatter your trail if
   they touch the saucer; when the kick drops out of the song they fly off, and
   the fireflies come out. Timed off the song's measured grid (SONG.md):
   100 BPM, bar n at -0.015 + 2.4 n s. While the song plays, it is the clock. */

const BPM = 100, BEAT = 60 / BPM, BAR = BEAT * 4, T0 = -.015;
const barT = (b, beat) => T0 + b * BAR + (beat || 0) * BEAT;
// the bars with no kick drum: the moths leave, more fireflies come out
const CALM = [[0, barT(8)], [barT(16), barT(20)], [barT(30) + BAR*.5, barT(32)], [barT(40), barT(44)]];
const NIGHT_END = barT(53);            // 127.2 s: the song starts to fade - the night is over
const calmAt = t => CALM.some(([a, b]) => t >= a && t < b);

/* Three parts. Part 2: more lamps, more moths, and flying through your own trail
   cuts it. Part 3: lit lamps slowly burn down - feed them to keep them lit, and
   light them all at the same time. The hub opens a part with ?part=2|3; on its
   own the start card lets you pick. */
const PART = Math.min(3, Math.max(1, +new URLSearchParams(location.search).get("part") || 1));
const CFG = {
  1: { id:"lvl5",  title:"Feel Like That", lamps:6, need:[4, 5, 5, 6, 6, 7],       moths:2, mothV:.55, cut:false, burn:0,  flies:13 },
  2: { id:"lvl5b", title:"Moth Night",     lamps:8, need:[5, 5, 6, 6, 7, 7, 8, 8], moths:4, mothV:.7,  cut:true,  burn:0,  flies:15 },
  3: { id:"lvl5c", title:"Stay Lit",       lamps:8, need:[4, 4, 5, 5, 6, 6, 7, 7], moths:4, mothV:.75, cut:true,  burn:85, flies:18 }
}[PART];
const SPEED = 8.5, HOVER = 3, PARK = { x:38, z:28 };

const LINKS = {
  next:    "https://lightningwolves.studio/javeda/",
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB){
  document.getElementById("next").addEventListener("click", e => { e.preventDefault(); toHub({ type:"javeda:next", level:CFG.id }); });
  document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
}

function rnd(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---- the park: lamps round a loop path, the bench with the twin lamps up north ---- */
const LAMP_AT = [[-22, -11], [23, -9], [-30, 11], [30, 12], [-9, 20], [12, 21], [0, 1], [-33, -21]];
const TWIN = { x:0, z:-21 };
const START = { x:0, z:12 };

const C = { sky:0x140c2a, fog:0x1d1238, grass:0x0f1d16, path:0x3b3226, metal:0x221d18, warm:0xffc861, glass:0x2a2a3a,
  hull:0x6f7d2c, dome:0x1e2116, fly:0xe9ff7a, moth:0x5a4f6e };

let scene, cam, ren, clock, ufo, beam, shadow, sky, flyPts, lamps = [], twin, moths = [], bench;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cab = document.getElementById("cab");
const glow = (color, opacity, map) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, map: map || null,
  blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){
  const cv = document.createElement("canvas"); cv.width = cv.height = size || 128;
  const x = cv.getContext("2d"), r = cv.width/2, g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width);
  return new THREE.CanvasTexture(cv);
}
let DOT, POOL;

/* ---- the ground: grass with a gravel loop and paths painted on one big canvas ---- */
function buildGround(){
  const W = 1024, Hh = 1024, SX = 120, SZ = 120;            // the canvas covers 120 x 120 m
  const cv = document.createElement("canvas"); cv.width = W; cv.height = Hh;
  const x = cv.getContext("2d");
  x.fillStyle = "#0f1d16"; x.fillRect(0, 0, W, Hh);
  for (let i = 0; i < 14000; i++){                            // grass speckle
    const l = 9 + rnd(i*1.7)*10;
    x.fillStyle = `hsl(${135 + rnd(i*3.1)*30},35%,${l}%)`;
    x.fillRect(rnd(i*2.3)*W, rnd(i*5.9)*Hh, 1.5, 1.5 + rnd(i)*1.5);
  }
  const P = (wx, wz) => [(wx / SX + .5) * W, (wz / SZ + .5) * Hh];
  x.lineCap = "round"; x.lineJoin = "round";
  const stroke = (pts, w) => {
    for (const [col, ww] of [["#2a241c", w + 10], ["#3b3226", w], ["#4a4030", w*.45]]){
      x.strokeStyle = col; x.lineWidth = ww; x.beginPath();
      pts.forEach(([a, b], i) => { const [u, v] = P(a, b); i ? x.lineTo(u, v) : x.moveTo(u, v); }); x.stroke();
    }
  };
  // the loop round the park, and paths across it to the bench
  const loop = []; for (let i = 0; i <= 64; i++){ const a = i/64*Math.PI*2; loop.push([Math.cos(a)*29, Math.sin(a)*17 + 1]); }
  stroke(loop, 26);
  stroke([[0, 26], [0, 12], [0, 1], [-2, -10], [0, -18]], 22);
  stroke([[-38, 6], [-22, 2], [-8, 1], [8, 1], [22, 0], [38, -4]], 20);
  stroke([[-33, -21], [-24, -16], [-12, -17], [0, -18], [14, -15], [24, -12]], 18);
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(SX, SZ), new THREE.MeshLambertMaterial({ map:tex }));
  g.rotation.x = -Math.PI/2; scene.add(g);
  // beyond the canvas, plain dark grass to the horizon
  const far = new THREE.Mesh(new THREE.RingGeometry(58, 600, 48, 1), new THREE.MeshLambertMaterial({ color:0x0b1510 }));
  far.rotation.x = -Math.PI/2; far.position.y = -.02; scene.add(far);
}

/* ---- the sky from the cover: deep purple, a lighter band of cloud, stars ---- */
function buildSky(){
  const cv = document.createElement("canvas"); cv.width = 8; cv.height = 256;
  const x = cv.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, "#0b0718"); g.addColorStop(.35, "#2a1a52"); g.addColorStop(.47, "#6d58a8"); g.addColorStop(.52, "#3a2a5e"); g.addColorStop(1, "#140c2a");
  x.fillStyle = g; x.fillRect(0, 0, 8, 256);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv), side:THREE.BackSide, fog:false, depthWrite:false }));
  sky.add(dome);
  const n = 1200, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++){ const a = rnd(i*1.1)*Math.PI*2, e = .05 + rnd(i*2.7)*1.4, r = 850;
    pos.set([Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r], i*3); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  sky.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:0xffffff, size:1.4, sizeAttenuation:false, fog:false, transparent:true, opacity:.85 })));
  // purple cloud banks low over the trees
  const cm = new THREE.SpriteMaterial({ map:radial([[0, "rgba(170,140,230,.45)"], [.6, "rgba(110,80,180,.18)"], [1, "rgba(60,40,120,0)"]]), transparent:true, depthWrite:false, fog:false });
  for (let i = 0; i < 26; i++){
    const a = rnd(i*4.3)*Math.PI*2, r = 420 + rnd(i*2.2)*200;
    const s = new THREE.Sprite(cm); s.position.set(Math.cos(a)*r, 60 + rnd(i*7.7)*90, Math.sin(a)*r);
    s.scale.set(260 + rnd(i)*200, 90 + rnd(i*3)*60, 1); sky.add(s);
  }
}

/* ---- trees: dark round crowns on short trunks, thick round the edge ---- */
function buildTrees(){
  const trunkG = new THREE.CylinderGeometry(.25, .35, 3, 6), crownG = new THREE.IcosahedronGeometry(1, 1);
  const trunkM = new THREE.MeshLambertMaterial({ color:0x1d1510 });
  const crownM = new THREE.MeshLambertMaterial({ color:0x13281b, flatShading:true });
  const keepOut = [...LAMP_AT.map(([a, b]) => [a, b, 6]), [TWIN.x, TWIN.z, 9], [START.x, START.z, 6]];
  const spots = [];
  for (let i = 0; i < 116; i++){
    const a = rnd(i*3.3)*Math.PI*2, edge = i < 100;
    const rx = edge ? 40 + rnd(i*5.5)*22 : rnd(i*5.5)*34, rz = edge ? 30 + rnd(i*6.6)*20 : rnd(i*6.6)*24;
    const px = Math.cos(a)*rx, pz = Math.sin(a)*rz;
    if (!edge && Math.abs(Math.hypot(px/29, (pz - 1)/17) - 1) < .3) continue;      // not on the loop path
    if (!edge && (Math.abs(px) < 6 || Math.abs(pz) < 6)) continue;                     // nor the cross paths
    if (keepOut.some(([kx, kz, r]) => Math.hypot(px - kx, pz - kz) < r)) continue;
    spots.push([px, pz, edge ? .8 + rnd(i*9.1)*.7 : .6 + rnd(i*9.1)*.3]);
  }
  for (const [px, pz, s] of spots){
    const t = new THREE.Mesh(trunkG, trunkM); t.position.set(px, 1.5*s, pz); t.scale.setScalar(s); scene.add(t);
    for (let k = 0; k < 3; k++){
      const c = new THREE.Mesh(crownG, crownM);
      c.position.set(px + (rnd(px + k)*2 - 1)*1.2*s, (3.6 + k*.9)*s, pz + (rnd(pz + k*3)*2 - 1)*1.2*s);
      c.scale.setScalar((2.3 - k*.4)*s); scene.add(c);
    }
  }
}

/* ---- a park bench: slats on iron legs ---- */
function buildBench(x, z, ry, s){
  const g = new THREE.Group(), wood = new THREE.MeshLambertMaterial({ color:0x8a5a2b }), iron = new THREE.MeshLambertMaterial({ color:0x1b1a1a });
  for (let i = 0; i < 4; i++){ const sl = new THREE.Mesh(new THREE.BoxGeometry(4, .08, .2), wood); sl.position.set(0, .9, -.3 + i*.24); g.add(sl); }
  for (let i = 0; i < 4; i++){ const sl = new THREE.Mesh(new THREE.BoxGeometry(4, .2, .07), wood); sl.position.set(0, 1.2 + i*.3, -.45); g.add(sl); }
  for (const lx of [-1.7, 1.7]){
    const l = new THREE.Mesh(new THREE.BoxGeometry(.1, .9, .7), iron); l.position.set(lx, .45, -.05); g.add(l);
    const b = new THREE.Mesh(new THREE.BoxGeometry(.1, 1.3, .08), iron); b.position.set(lx, 1.45, -.5); g.add(b);
  }
  g.position.set(x, 0, z); g.rotation.y = ry || 0; g.scale.setScalar(s || 1); scene.add(g);
  return g;
}

/* ---- the old street lamp: a post, a four-sided lantern, a little cap ---- */
function lantern(){
  const g = new THREE.Group(), metal = new THREE.MeshLambertMaterial({ color:C.metal });
  const glass = new THREE.MeshLambertMaterial({ color:C.glass, emissive:0x000000 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.42, .3, .85, 4, 1), glass); body.rotation.y = Math.PI/4; g.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(.6, .45, 4), metal); cap.position.y = .62; cap.rotation.y = Math.PI/4; g.add(cap);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.09, 6, 5), metal); knob.position.y = .9; g.add(knob);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.22, .3, .18, 8), metal); base.position.y = -.5; g.add(base);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color:C.warm, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending }));
  halo.scale.setScalar(5); g.add(halo);
  g.userData = { glass, halo };
  return g;
}
function buildLamp(i){
  const [x, z] = LAMP_AT[i], need = CFG.need[i];
  const g = new THREE.Group(), metal = new THREE.MeshLambertMaterial({ color:C.metal });
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.11, .17, 4.3, 8), metal); post.position.y = 2.15; g.add(post);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(.32, .4, .4, 8), metal); foot.position.y = .2; g.add(foot);
  const L = lantern(); L.position.y = 4.85; g.add(L);
  // how many fireflies it needs: a ring of dots over it, filling up
  const dots = [];
  for (let k = 0; k < need; k++){
    const a = k / need * Math.PI*2;
    const d = new THREE.Mesh(new THREE.SphereGeometry(.17, 8, 6), new THREE.MeshBasicMaterial({ color:0x4a3f68 }));
    d.position.set(Math.cos(a)*1.1, 6.1, Math.sin(a)*1.1); g.add(d); dots.push(d);

  g.position.set(x, 0, z); scene.add(g);
  return { i, x, z, need, got:0, lit:false, burn:0, g, L, dots, pool, pulse:0 };
}

/* ---- fireflies: one cloud of points, each one free, in the trail, or on its way into a lamp ---- */
const MAXF = 90;
let F = [];
function buildFlies(){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAXF*3), 3));
  geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(MAXF*3), 3));
  flyPts = new THREE.Points(geo, new THREE.PointsMaterial({ size:2.6, map:DOT, vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  flyPts.frustumCulled = false; scene.add(flyPts);
}
let seedN = 0;
function spawnFly(near){
  if (F.length >= MAXF) return;
  let x, z, tries = 0;
  do {
    const n = seedN++;
    x = near ? near.x + (rnd(n*1.3) - .5)*16 : (rnd(n*2.9) - .5)*PARK.x*2;
    z = near ? near.z + (rnd(n*3.7) - .5)*16 : (rnd(n*4.1) - .5)*PARK.z*2;
    tries++;
  } while (tries < 8 && S && ufo && Math.hypot(x - S.x, z - S.z) < 7);
  x = clamp(x, -PARK.x, PARK.x); z = clamp(z, -PARK.z, PARK.z);
  F.push({ st:"free", x, y:1.4 + rnd(seedN)*1.4, z, hx:x, hz:z, ph:rnd(seedN*1.9)*6.3, vx:0, vy:0, vz:0, t:0, born:0 });
}

/* the saucer's way behind it, so the trail can follow in its footsteps */
const PATH = [];      // {x, z}, newest first, one every 0.3 m
const GAP = 1.05;     // metres between fireflies in the trail
function pathPoint(d){
  let acc = 0;
  for (let i = 1; i < PATH.length; i++){
    const a = PATH[i - 1], b = PATH[i], l = Math.hypot(b.x - a.x, b.z - a.z);
    if (acc + l >= d){ const u = (d - acc) / Math.max(1e-6, l); return [a.x + (b.x - a.x)*u, a.z + (b.z - a.z)*u]; }
    acc += l;
  }
  const e = PATH[PATH.length - 1] || { x:S.x, z:S.z }; return [e.x, e.z];
}

/* ---- state ---- */
let S;
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, x:START.x, z:START.z, vx:0, vz:0, trail:[], lit:0,
        delivered:0, scatters:0, cuts:0, safe:0, giveT:0, end:-1, msgT:0, judgeT:0, saidTitle:false, goal:null, keys:{x:0, z:0}, spawnT:0, bestTrail:0 };
  F = []; seedN = 0;
  for (let i = 0; i < CFG.flies; i++) spawnFly();
  PATH.length = 0; PATH.push({ x:S.x, z:S.z });
  lamps.forEach(L => { L.got = 0; L.lit = false; L.burn = 0; L.pulse = 0; });
  if (twin) twin.lit = 0;
  document.getElementById("hud").classList.remove("off");
  document.getElementById("judge").className = ""; document.getElementById("lyric").classList.remove("on");
}

const song = new Audio("lvl5.mp3"); song.preload = "auto";
let ac = null, bus = null;
function tone(type, f0, f1, dur, gain, lp, delay){
  if (!ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp; o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(.01, dur*.2));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
}
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const sfx = {
  pick: n => tone("sine", PENTA[n % PENTA.length], PENTA[n % PENTA.length]*1.01, .12, .05, 6000),
  give: n => tone("triangle", PENTA[(n + 3) % PENTA.length]*.5, PENTA[(n + 3) % PENTA.length]*.5, .1, .04, 4000),
  lamp: () => { [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, .9, .05, 5000, i*.06)); },
  scatter: () => { tone("sawtooth", 600, 120, .35, .05, 2000); tone("square", 300, 80, .3, .03, 1200, .05); },
  twin: () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone("sine", f, f, 2.2, .05, 6000, i*.12)); }
};

/* ---- input: hold a finger (or the mouse) on the park and the saucer flies there; or the arrow keys ---- */
const veilUp = () => !document.getElementById("veil").classList.contains("hid");
const aimEl = document.getElementById("aim");
const RAY = new THREE.Raycaster(), NDC = new THREE.Vector2(), GROUND = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), HIT = new THREE.Vector3();
let finger = null;
function aimAt(cx, cy){
  NDC.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  RAY.setFromCamera(NDC, cam);
  if (RAY.ray.intersectPlane(GROUND, HIT)) S.goal = { x:clamp(HIT.x, -PARK.x, PARK.x), z:clamp(HIT.z, -PARK.z, PARK.z) };
  aimEl.style.left = cx + "px"; aimEl.style.top = cy + "px"; aimEl.style.display = "block";
}
addEventListener("pointerdown", e => {
  if (veilUp() || !S.started || S.end >= 0) return;
  e.preventDefault(); finger = e.pointerId; aimAt(e.clientX, e.clientY);
}, { passive:false });
addEventListener("pointermove", e => { if (finger === e.pointerId && S.started && S.end < 0) aimAt(e.clientX, e.clientY); });
const lift = e => { if (finger === e.pointerId){ finger = null; S.goal = null; aimEl.style.display = "none"; } };
addEventListener("pointerup", lift); addEventListener("pointercancel", lift);
const KEYS = { ArrowLeft:[-1, 0], a:[-1, 0], A:[-1, 0], ArrowRight:[1, 0], d:[1, 0], D:[1, 0],
               ArrowUp:[0, -1], w:[0, -1], W:[0, -1], ArrowDown:[0, 1], s:[0, 1], S:[0, 1] };
const held = {};
addEventListener("keydown", e => { if (e.key in KEYS && !veilUp()){ e.preventDefault(); held[e.key] = 1; } });
addEventListener("keyup", e => { delete held[e.key]; });
addEventListener("blur", () => { for (const k in held) delete held[k]; });

const judgeEl = document.getElementById("judge"), lyricEl = document.getElementById("lyric");
function say(text, cls, t){ judgeEl.textContent = text; judgeEl.className = "on " + cls; S.judgeT = t || .9; }
function lyric(a, b, t){ lyricEl.innerHTML = a + (b ? "<small>" + b + "</small>" : ""); lyricEl.classList.add("on"); S.msgT = t; }

/* the trail breaks up: those fireflies fly off and go back to being free */
function scatter(from, why){
  const lost = S.trail.splice(from);
  for (const f of lost){ f.st = "scatter"; f.t = 0; const a = Math.random()*Math.PI*2, v = 5 + Math.random()*5;
    f.vx = Math.cos(a)*v; f.vz = Math.sin(a)*v; f.vy = 2 + Math.random()*3; }
  if (!lost.length) return;
  sfx.scatter();
  say(why, "x", 1.1);
}

function lightLamp(L){
  L.lit = true; L.burn = 1; L.pulse = 1; S.lit = lamps.filter(l => l.lit).length;
  S.score += 1000; sfx.lamp();
  say(S.lit === lamps.length ? "THE PARK IS LIT" : "LAMP " + lamps.filter(l => l.lit).length + " / " + lamps.length, "g", 1.2);
}

function update(dt){
  if (!song.paused && song.currentTime > 0 && !S.done && S.end < 0) S.t = song.currentTime;
  else S.t += dt;
  const t = S.t;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) lyricEl.classList.remove("on"); }
  if (S.judgeT > 0){ S.judgeT -= dt; if (S.judgeT <= 0) judgeEl.classList.remove("on"); }
  if (S.end >= 0){ S.end += dt; endUpdate(dt); return; }
  if (S.done) return;
  if (!S.saidTitle && t > barT(8) - .3){ S.saidTitle = true; lyric("Feel Like That", "light up the park", 3.5); }
  // the saucer: towards the finger, or with the keys
  let wx = 0, wz = 0;
  for (const k in held){ wx += KEYS[k][0]; wz += KEYS[k][1]; }
  if (wx || wz){ const l = Math.hypot(wx, wz); wx = wx/l*SPEED; wz = wz/l*SPEED; }
  else if (S.goal){ const dx = S.goal.x - S.x, dz = S.goal.z - S.z, d = Math.hypot(dx, dz);
    const sp = SPEED * Math.min(1, d / 3); if (d > .2){ wx = dx/d*sp; wz = dz/d*sp; } }
  const k = 1 - Math.exp(-dt*7);
  S.vx += (wx - S.vx)*k; S.vz += (wz - S.vz)*k;
  S.x = clamp(S.x + S.vx*dt, -PARK.x, PARK.x); S.z = clamp(S.z + S.vz*dt, -PARK.z, PARK.z);
  const p0 = PATH[0];
  if (Math.hypot(S.x - p0.x, S.z - p0.z) > .3){ PATH.unshift({ x:S.x, z:S.z }); if (PATH.length > 400) PATH.pop(); }
  if (S.safe > 0) S.safe -= dt;
  const calm = calmAt(t);

  // fireflies
  for (const f of F){
    f.t += dt;
    if (f.st === "free"){
      f.x = f.hx + Math.sin(t*.7 + f.ph)*1.2; f.z = f.hz + Math.cos(t*.5 + f.ph*1.3)*1.2; f.y = 1.8 + Math.sin(t*1.3 + f.ph)*.6;
      if (Math.hypot(f.x - S.x, f.z - S.z) < 2.4){ f.st = "trail"; S.trail.push(f); sfx.pick(S.trail.length);
        S.bestTrail = Math.max(S.bestTrail, S.trail.length); S.score += 10; }
    } else if (f.st === "scatter"){
      f.vy -= 6*dt; f.x += f.vx*dt; f.y = Math.max(.8, f.y + f.vy*dt); f.z += f.vz*dt; f.vx *= .97; f.vz *= .97;
      if (f.t > .9){ f.st = "free"; f.hx = clamp(f.x, -PARK.x, PARK.x); f.hz = clamp(f.z, -PARK.z, PARK.z); f.ph = Math.random()*6.3 - t*.7; }
    } else if (f.st === "give"){
      const L = f.lamp, tx = L.x, ty = 4.85, tz = L.z, u = Math.min(1, f.t / .45);
      f.x += (tx - f.x)*u; f.y += (ty - f.y)*u; f.z += (tz - f.z)*u;
      if (f.t > .45){ f.st = "gone"; landIn(L); }
    }
  }
  S.trail.forEach((f, i) => { const [x, z] = pathPoint((i + 1)*GAP); const u = Math.min(1, dt*14);
    f.x += (x - f.x)*u; f.z += (z - f.z)*u; f.y += (2.2 + Math.sin(t*4 + i*.7)*.25 - f.y)*u; });
  F = F.filter(f => f.st !== "gone");
  // Part 2+: fly through your own trail and it's cut there (only fireflies that really are
  // that far back along the way you came - not ones still catching up)
  let pathLen = 0;
  if (CFG.cut) for (let i = 1; i < PATH.length; i++) pathLen += Math.hypot(PATH[i].x - PATH[i - 1].x, PATH[i].z - PATH[i - 1].z);
  if (CFG.cut && S.safe <= 0) for (let i = 4; i < S.trail.length && (i + 1)*GAP < pathLen; i++){
    const f = S.trail[i];
    if (Math.hypot(f.x - S.x, f.z - S.z) < .75){ S.cuts++; scatter(i, "CUT"); S.safe = .6; break; }
  }
  // more fireflies come out, plenty in the quiet bars
  S.spawnT -= dt;
  const free = F.filter(f => f.st === "free").length;
  if (S.spawnT <= 0 && free < CFG.flies + (calm ? 10 : 0)){ spawnFly(); S.spawnT = calm ? .25 : .6; }

  // giving fireflies to a lamp: near it, one at a time
  S.giveT -= dt;
  const L = nearLamp();
  if (L && S.trail.length && S.giveT <= 0){
    const f = S.trail.pop(); f.st = "give"; f.t = 0; f.lamp = L; L.coming = (L.coming || 0) + 1;
    S.giveT = .11; sfx.give(L.got);
  }
  // Part 3: lit lamps burn down
  if (CFG.burn) for (const l of lamps) if (l.lit){
    l.burn -= dt / CFG.burn;
    if (l.burn <= 0){ l.lit = false; l.got = 0; S.lit = lamps.filter(q => q.lit).length; say("A LAMP WENT OUT", "x", 1.1); }
  }
  for (const l of lamps) l.pulse = Math.max(0, l.pulse - dt*1.5);

  // moths: round their patch while the beat plays, up and away in the quiet bars
  for (const m of moths){
    const a = t*m.w + m.p;
    const tx = m.cx + Math.sin(a)*m.rx + Math.sin(a*2.3)*3, tz = m.cz + Math.cos(a*1.3)*m.rz;
    const mx = (tx - m.x)*Math.min(1, dt*3), mz = (tz - m.z)*Math.min(1, dt*3);
    m.x += mx; m.z += mz; if (mx*mx + mz*mz > 1e-6) m.hd = Math.atan2(mx, mz);
    m.y += ((calm ? 16 : 2.8) - m.y)*Math.min(1, dt*1.2);
    if (m.y < 4.2 && S.safe <= 0 && S.trail.length && Math.hypot(m.x - S.x, m.z - S.z) < 2.3){
      S.scatters++; scatter(0, "SCATTERED!"); S.safe = 1.5;
    }
  }

  // the end: every lamp lit (in Part 3, all at the same time) - or the night runs out
  if (lamps.every(l => l.lit)){ S.end = 0; S.endT = t; S.score += Math.max(0, Math.round((NIGHT_END - t)*100)); finale(); return; }
  if (t >= NIGHT_END){ S.fail = true; S.done = true; lyric("The night is over", "", 2.5); setTimeout(finish, 1800); }
}
function nearLamp(){
  let best = null, bd = 3.6;
  for (const l of lamps){
    const want = l.lit ? (CFG.burn && l.burn < .98) : l.got + (l.coming || 0) < l.need;
    if (!want) continue;
    const d = Math.hypot(l.x - S.x, l.z - S.z); if (d < bd){ bd = d; best = l; }
  }
  return best;
}
function landIn(L){
  L.coming = Math.max(0, (L.coming || 0) - 1); S.delivered++; S.score += 100;
  if (L.lit){ L.burn = Math.min(1, L.burn + .5); L.pulse = .6; return; }
  L.got++; L.pulse = .5;
  if (L.got >= L.need) lightLamp(L);
}

/* ================= THE ENDING =================
   Every lamp is lit: the camera comes down to the bench, the saucer settles in
   the grass in front of it with its beam on, and the two old lamps light up
   together. The cover. */
const END = { swoop:2.6, light:2.9, out:9 };
function finale(){
  document.getElementById("hud").classList.add("off");
  aimEl.style.display = "none"; finger = null; S.goal = null;
  for (const f of F) if (f.st !== "give"){ f.st = "rise"; f.t = Math.random(); }
}
function endUpdate(dt){
  const e = S.end;
  if (e >= END.light && !twin.lit){ twin.lit = 1; sfx.twin(); }
  if (e > END.light + .6 && !S.saidEnd){ S.saidEnd = true; lyric("Feel Like That", "", 5); }
  for (const f of F){
    f.t += dt;
    if (f.st === "rise"){ const a = f.t*.8 + f.ph, r = 3 + (f.ph % 1)*5;
      f.x += (TWIN.x + Math.cos(a)*r - f.x)*dt*.8; f.z += (TWIN.z + Math.sin(a)*r - f.z)*dt*.8; f.y += (2 + (f.ph % 2)*3 - f.y)*dt*.8; }
    else if (f.st === "give"){ const L = f.lamp, u = Math.min(1, f.t/.45); f.x += (L.x - f.x)*u; f.y += (4.85 - f.y)*u; f.z += (L.z - f.z)*u; }
  }
  if (e > END.out && !S.done){ S.done = true; finish(); }
}

/* ---- drawing ---- */
const V = new THREE.Vector3(), LOOK = new THREE.Vector3(), CAMP = new THREE.Vector3(), CAML = new THREE.Vector3();
const WARM = new THREE.Color(C.warm), OFF = new THREE.Color(0x000000), DIM = new THREE.Color(0x4a3f68), FILL = new THREE.Color(0xe9ff7a);
let camInit = false;
function render(dt){
  const t = Math.max(0, S.t), beatPhase = ((t - T0) / BEAT) % 1, onBeat = Math.max(0, 1 - beatPhase*3);
  // the saucer
  const tilt = S.end >= 0 ? 0 : 1;
  let ux = S.x, uy = HOVER + Math.sin(t*2.2)*.12, uz = S.z;
  if (S.end >= 0){ const u = Math.min(1, S.end / END.swoop), s = u*u*(3 - 2*u);
    ux = S.x + (TWIN.x - S.x)*s; uz = S.z + (TWIN.z + 5 - S.z)*s; uy = HOVER + (.6 - HOVER)*s + Math.sin(t*2.2)*.04; }
  ufo.position.set(ux, uy, uz);
  ufo.rotation.set(clamp(S.vz*.03, -.3, .3)*tilt, t*.6, -clamp(S.vx*.03, -.3, .3)*tilt, "YXZ");
  ufo.children[0].userData.lights.forEach((l, i) => { l.visible = ((Math.floor(t*6) + i) % 3) !== 0; });
  beam.scale.set(1, uy - .2, 1); beam.position.y = -(uy - .2)/2 - .2;
  beam.material.opacity = .13 + onBeat*.05;
  shadow.position.set(ux, .08, uz); shadow.scale.setScalar(S.end >= 0 ? .7 : 1);
  // camera: high over the saucer, looking down at the park; at the end, down at the bench
  const portrait = cam.aspect < .8, H = portrait ? 30 : 23, D = portrait ? 15 : 15;
  CAMP.set(S.x, H, S.z + D); CAML.set(S.x, 0, S.z - 3);
  if (S.end >= 0){ const u = Math.min(1, S.end / END.swoop), s = u*u*(3 - 2*u);
    CAMP.lerp(V.set(TWIN.x, 2.5, TWIN.z + (portrait ? 19 : 15)), s); CAML.lerp(LOOK.set(TWIN.x, 3.2, TWIN.z - 1), s); }
  const k = !camInit || S.end >= 0 ? 1 : Math.min(1, dt*4); camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  sky.position.copy(cam.position);
  // lamps
  for (const l of lamps){
    const on = l.lit ? (CFG.burn ? .35 + .65*Math.min(1, l.burn*1.6) * (l.burn < .2 ? (.6 + .4*Math.sin(t*20)) : 1) : 1) : 0;
    l.L.userData.glass.emissive.copy(WARM).multiplyScalar(on*1.2 + l.pulse*.6);
    l.L.userData.halo.material.opacity = on*.9 + l.pulse*.4;
    l.pool.material.opacity = on*.75;
    l.dots.forEach((d, k) => d.material.color.copy(l.lit ? WARM : k < l.got ? FILL : DIM));
    l.dots.forEach(d => d.visible = !l.lit || !!CFG.burn);
    if (l.lit && CFG.burn) l.dots.forEach((d, k) => d.material.color.copy(k < Math.ceil(l.burn*l.need) ? WARM : DIM));
  }
  const tw = twin.lit ? Math.min(1, (S.end - END.light)*1.5) : 0;
  twin.Ls.forEach(L => { L.userData.glass.emissive.copy(WARM).multiplyScalar(tw*1.4); L.userData.halo.material.opacity = tw; L.userData.halo.scale.setScalar(7); });
  twin.pool.material.opacity = tw*.9;
  // moths
  for (const m of moths){
    m.g.position.set(m.x, m.y + Math.sin(t*5 + m.k)*.15, m.z);
    m.g.rotation.y = m.hd || 0;
    const flap = Math.sin(t*16 + m.k)*.7;
    m.wings.forEach(w => { w.rotation.z = w.userData.s*flap; });
    m.sh.position.set(m.x, .07, m.z); m.sh.material.opacity = clamp(.4 - (m.y - 2.8)*.03, 0, .4);
    m.g.visible = S.end < 0;
    m.sh.visible = S.end < 0;
  }
  // fireflies: they blink on the beat
  const pos = flyPts.geometry.attributes.position, col = flyPts.geometry.attributes.color;
  let n = 0;
  for (const f of F){
    if (n >= MAXF) break;
    pos.setXYZ(n, f.x, f.y, f.z);
    const b = f.st === "free" ? .45 + .55*Math.max(0, Math.sin(t*3 + f.ph*2)) * (.6 + onBeat*.4) : .8 + onBeat*.2;
    col.setXYZ(n, .91*b, 1*b, .48*b); n++;
  }
  for (let i = n; i < MAXF; i++) pos.setXYZ(i, 0, -50, 0);
  pos.needsUpdate = true; col.needsUpdate = true;
  // arrows to the lamps that still want you, when they're off screen
  for (const l of lamps){
    const want = S.end < 0 && S.started && (!l.lit || (CFG.burn && l.burn < .5));
    V.set(l.x, 4, l.z).project(cam);
    const off = V.z > 1 || Math.abs(V.x) > .92 || Math.abs(V.y) > .88;
    if (!want || !off){ l.ptr.style.display = "none"; continue; }
    let x = V.x, y = V.y; if (V.z > 1){ x = -x; y = -y; }
    const s = Math.max(Math.abs(x)/.86, Math.abs(y)/.8); x /= s; y /= s;
    l.ptr.style.display = "block";
    l.ptr.style.left = ((x + 1)/2*innerWidth) + "px"; l.ptr.style.top = ((1 - y)/2*innerHeight) + "px";
    l.ptr.style.transform = "rotate(" + Math.atan2(-y, x) + "rad)";
  }
  ren.render(scene, cam);
}

/* ---- HUD, score ---- */
const mEl = document.getElementById("m"), carryEl = document.getElementById("carry"), nightEl = document.getElementById("night");
function score(){
  if (S.fail) return Math.floor(S.score / 4);
  return S.score + (S.scatters === 0 && S.cuts === 0 ? 3000 : 0);
}
let lastScore = -1, lastCarry = -1, lastLamps = "", crashed = null;
function frame(){
  try {
    const dt = Math.min(.05, clock ? clock.getDelta() : .016);
    if (S.started && (!S.done || S.end >= 0)) update(dt);
    render(dt);
    if (S.score !== lastScore){ lastScore = S.score; mEl.textContent = S.score.toLocaleString("en"); }
    if (S.trail.length !== lastCarry){ lastCarry = S.trail.length; carryEl.textContent = S.trail.length ? "✦ " + S.trail.length + (S.trail.length === 1 ? " firefly" : " fireflies") : ""; }
    const ls = lamps.map(l => l.lit ? (CFG.burn && l.burn < .3 ? "f" : "1") : "0").join("");
    if (ls !== lastLamps){ lastLamps = ls; DOTS.forEach((d, i) => { d.className = ls[i] === "1" ? "on" : ls[i] === "f" ? "on fading" : ""; }); }
    const left = clamp((NIGHT_END - Math.max(0, S.t)) / NIGHT_END, 0, 1);
    nightEl.firstChild.style.width = (left*100).toFixed(1) + "%"; nightEl.classList.toggle("low", left < .15);
  } catch (e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}

function finish(){
  song.pause();
  const v = document.getElementById("veil");
  v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)");
  const go = document.getElementById("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail);
  document.getElementById("next").classList.toggle("hid", S.fail);
  for (const id of ["outs", "home"]) document.getElementById(id).classList.remove("hid");
  document.getElementById("snd").classList.add("hid");
  document.getElementById("hud").classList.add("off");
  document.getElementById("parts").classList.add("hid");
  lamps.forEach(l => l.ptr.style.display = "none");
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:!S.fail, score:score(), metres:0,
    lamps:S.lit, fireflies:S.delivered, scatters:S.scatters });
  if (S.fail){
    v.querySelector(".by").textContent = "THE NIGHT IS OVER";
    v.querySelector("h1").textContent = "Not yet";
    ps[0].innerHTML = "<b>" + S.lit + " of " + lamps.length + "</b> lamps lit &middot; " + S.delivered + " fireflies brought home";
    ps[1].innerHTML = (S.scatters > 2 ? "Keep away from the moths - they scatter your fireflies." : "Grab a big trail of fireflies, then fly it to a lamp.") + " <b>Go again.</b>";
    return;
  }
  const secs = Math.round(S.endT);
  v.querySelector(".by").textContent = "LEVEL 5" + (PART > 1 ? " · PART " + PART : "") + " COMPLETE";
  v.querySelector("h1").textContent = CFG.title;
  ps[0].innerHTML = "Score <b>" + score().toLocaleString("en") + "</b> &middot; the park lit in <b>" + Math.floor(secs/60) + ":" + String(secs % 60).padStart(2, "0") + "</b> &middot; " +
    S.delivered + " fireflies &middot; biggest trail <b>" + S.bestTrail + "</b>" + (S.scatters ? " &middot; scattered " + S.scatters + "x" : "");
  ps[1].innerHTML = "The two old lamps are lit. <b>Feel like that.</b>" +
    (PART === 1 ? "<br>Part 2: more lamps, more moths, and don't cross your own trail." : PART === 2 ? "<br>Part 3: the lamps burn down - keep them all lit at once." : "");
}
document.getElementById("go").addEventListener("click", () => {
  reset(); camInit = false;
  document.getElementById("veil").classList.add("hid");
  try {
    if (!ac){ ac = new (window.AudioContext||window.webkitAudioContext)();
      bus = ac.createGain(); bus.gain.value = .5; bus.connect(ac.destination); }
    if (ac.state === "suspended") ac.resume();
  } catch(e){}
  try { song.currentTime = 0; } catch(e){}
  const p = song.play(); if (p && p.catch) p.catch(()=>{});
  S.started = true; S.t = 0;
  lyric("Hold your finger on the park", "the saucer flies there - gather the fireflies", 4);
});

// the start card for this part; on its own you can switch parts
document.getElementById("by").textContent = "LAZY JO" + (PART > 1 ? " · LEVEL 5 PART " + PART : "");
document.getElementById("title").textContent = CFG.title;
document.getElementById("intro").innerHTML = (PART === 1 ? "Night in the park, and every lamp is dark."
  : PART === 2 ? "More lamps, more moths - and fly through your own trail and it breaks."
  : "The lamps burn down now. Keep feeding them: <b>all " + CFG.lamps + " lit at the same time</b>.") +
  " <b>" + CFG.lamps + "</b> lamps, <b>" + CFG.moths + "</b> moths.";
document.getElementById("how").innerHTML = "<b>Hold your finger</b> on the park (or use the arrow keys) and the saucer flies there. " +
  "Fly through <b>fireflies</b> and they follow you. Fly to a <b>dark lamp</b> and they go in &mdash; the dots show how many it needs. " +
  "Keep away from the <b>moths</b>: they scatter your fireflies. When the beat drops out, the moths fly off. Light every lamp before the song ends.";
if (!HUB){
  document.getElementById("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    b.setAttribute("aria-pressed", String(+b.dataset.part === PART));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.set("part", b.dataset.part); location.search = q.toString(); });
  });
}

reset();
boot();
reset();
requestAnimationFrame(frame);
</script>

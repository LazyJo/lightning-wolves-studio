<style>
:root{color-scheme:dark}
html,body{height:100%}
body{margin:0; background:#04051a; color:#e8eeff; overflow:hidden; font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= STAY UP 2 =================
   Level 20 of JAVEDA, the chill version of Stay Up, in the world of its cover: the crowd at the show
   under the blue light, everybody's hand up pointing at the big white light - and Jo's saucer.
   PASS IT ON: nine lights hang over the crowd, each its own note. The lights play a pattern and add
   one; you play it back and add one of your own; they play the whole thing back and add one more...
   Get it wrong, or too slow, and it costs a heart (3) and you see it again. Long enough and a fresh
   one starts. In the hooks the lights play twice as fast, for double points. At the end: the cover.
   ENDLESS (?endless=1) once it's cleared: never stops, less time every 8 bars, a heart back every 24.
   And ONLINE (?online=pass, from the JAVEDA page, logged in): you and a real player found by quick
   match take turns - play the pattern so far and add one, pass it on. Get it wrong and you get a Z;
   three Z's and you fell asleep. Nobody is ever made up: if no one's there, nobody is. */

// the song's grid - a stand-in (75 BPM, chill) until the song is here and measured
const GRID = { bpm:75, t0:0 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(52);
const LOOP = [barT(4), barT(52)];             // endless and online: round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[4, "calm"], [12, "loud"], [20, "hook"], [28, "calm"], [44, "loud"], [52, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ONLINE = Q.get("online") === "pass" ? "pass" : null;
const PRACTICE = !ONLINE && Q.get("practice") === "pass";
const ENDLESS = !ONLINE && !PRACTICE && Q.get("endless") === "1";
const CFG = ONLINE ? { id:"lvl20pass", title:"Pass It On 1v1", by:"LEVEL 20 · ONLINE 1v1", online:ONLINE }
  : ENDLESS ? { id:"lvl20x", title:"Pass It On", by:"LEVEL 20 · ENDLESS", endless:true, board:"Level 20 ∞" }
  : { id:"lvl20", title:"Pass It On", by:"LEVEL 20" };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl20.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [87.3, 69.3, 103.8, 77.8];         // F minor, chill
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: the crowd at the show under the blue light, hands up; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
const SC = { night:0x04051a, blue:0x3a4aff, sky:0x6a8aff, white:0xf0f4ff, gold:0xffc84a };
const glowM = (c, op) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const PUFF = radial([[0, "rgba(255,255,255,.5)"], [.5, "rgba(255,255,255,.2)"], [1, "rgba(255,255,255,0)"]], 128);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const mat = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.4, metalness:.3, emissive:c, emissiveIntensity:e == null ? .15 : e });
const BADGE = (letter, bg) => { const cv = document.createElement("canvas"); cv.width = cv.height = 128; const x = cv.getContext("2d");
  x.fillStyle = "#e8f4ff"; x.beginPath(); x.arc(64, 64, 58, 0, Math.PI*2); x.fill(); x.fillStyle = bg; x.beginPath(); x.arc(64, 64, 50, 0, Math.PI*2); x.fill();
  x.fillStyle = "#06102a"; x.font = "bold 76px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(letter, 66, 70); return new THREE.CanvasTexture(cv); };
function buildSaucer(dc, gc, letter, rim){
  dc = dc || 0xc03aff; gc = gc || 0x9a1aff; rim = rim || 0xd86aff;
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 14), new THREE.MeshStandardMaterial({ color:0x3a4868, roughness:.3, metalness:.8, emissive:0x101a3a, emissiveIntensity:.5 })); hull.scale.set(1.3, .28, 1.3); g.add(hull);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.28, 1.28, .14, 32, 1, true), new THREE.MeshStandardMaterial({ color:0x1a2440, metalness:.8, roughness:.3 })));
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.58, 24, 10, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color:dc, roughness:.2, metalness:.3, emissive:gc, emissiveIntensity:.8 })); dome.position.y = .14; g.add(dome);
  const badge = new THREE.Mesh(new THREE.CircleGeometry(.3, 24), new THREE.MeshBasicMaterial({ map:BADGE(letter || "L", "#" + new THREE.Color(rim).getHexString()), transparent:true })); badge.rotation.x = -Math.PI/2; badge.position.y = .73; g.add(badge);
  const lights = new THREE.Group(); g.add(lights);
  for (let i = 0; i < 14; i++){ const a = i/14*Math.PI*2, l = new THREE.Mesh(new THREE.SphereGeometry(.075, 6, 5), new THREE.MeshBasicMaterial({ color:i % 2 ? rim : 0xe8f4ff })); l.position.set(Math.sin(a)*1.3, 0, Math.cos(a)*1.3); lights.add(l); }
  const under = sprite(rim, 3, .5); under.position.y = -.2; g.add(under);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.35, 1.5, 3.2, 24, 1, true), new THREE.MeshBasicMaterial({ color:0xe8f0ff, transparent:true, opacity:.25, depthWrite:false, side:THREE.DoubleSide })); beam.position.y = -1.8; g.add(beam);
  g.userData = { lights, beam, under };
  return g;
}

/* =============== ONLINE: PASS IT ON, two players, one pattern =============== */
// Both players run exactly this, tap by tap, in the same order - so both always agree whose turn it
// is, what the pattern is and who has which Z's. Only the one playing sends anything: each light
// they tap (or that their clock ran out). Play the pattern so far, then add one: their turn. A wrong
// light or the clock: a Z, and a fresh pattern - started by whoever got the Z. Three Z's: asleep.
// Seat 0 found the match first and starts.
const WORD = "ZZZ";
const PASS = {
  reset(){ Object.assign(this, { up:0, k:0, i:0, z:[0, 0], over:false, queue:[], turnAt:0 }); },
  mineUp(){ return this.up === NET.seat; },
  turn(t){ const s = PO.st;
    if (this.over){ s.phase = "over"; NET.passOver(); return; }
    s.input = []; this.i = 0; this.turnAt = Date.now();
    s.allow = BEAT*((s.seq.length + 1)*1.5 + 6);
    if (this.mineUp()){ s.phase = "you"; s.deadline = t + s.allow; }
    else s.phase = "watch"; },
  // my tap: send it, then do it
  mine(pad, t){ NET.send("tap", { k:this.k, i:this.i, pad }); this.apply({ pad }, t); },
  apply(ev, t){ const s = PO.st, who = this.up, me = who === NET.seat, them = esc(NET.oppName()), len = s.seq.length;
    if (!ev.timeout) PO.light(ev.pad, me ? "me" : "them");
    if (ev.timeout || (this.i < len && ev.pad !== s.seq[this.i])){
      if (!ev.timeout) PO.lamps[s.seq[this.i]].ring = -1;
      this.z[who]++; sfx.bad(); if (me){ $("flash").style.background = "#ff3a5a"; S.flashT = .4; }
      const n = this.z[who];
      say(ev.timeout ? (me ? "TOO SLOW" : them + " WAS TOO SLOW") : me ? "WRONG LIGHT" : them + " GOT IT WRONG",
        (me ? "you get a Z" : them + " gets a Z") + " (" + n + "/3)" + (n >= 3 ? "" : " · " + (me ? "you start" : them + " starts") + " a fresh one"), 1.6, me ? "x" : "g");
      s.best = Math.max(s.best, len); s.seq = []; this.k++; this.i = 0; this.up = who;
      if (n >= WORD.length || this.k >= 150) this.over = true;
      s.phase = "pause"; s.pauseTo = t + 1.8; return; }
    if (this.i < len){ this.i++; if (me) s.input.push(ev.pad); return; }
    // the add: it's theirs now
    s.seq.push(ev.pad); PO.lamps[ev.pad].isNew = 1; s.best = Math.max(s.best, s.seq.length); this.k++; this.i = 0; this.up = 1 - who;
    if (me){ s.rounds++; sfx.good(s.seq.length); }

  update(dt, t){ const s = PO.st;

    if (s.phase === "watch"){
      const e = this.queue.find(e => e.k === this.k && e.i === this.i);
      if (e){ this.queue = this.queue.filter(q => q !== e && q.k >= this.k); this.apply(e, t); } }
    if (s.phase === "you" && t > s.deadline){ NET.send("tap", { k:this.k, i:this.i, timeout:true }); this.apply({ timeout:true }, t); } },
  line(){ const s = PO.st, them = esc(NET.oppName()), len = s.seq.length;
    if (s.phase === "you") return (this.i < len ? "YOUR TURN - PLAY IT BACK" : len ? "NOW ADD ONE" : "START ONE - TAP A LIGHT") + "<small>" + (this.i < len ? this.i + " / " + len + ", then add one" : "any light you like") + "</small>";

/* =============== ONLINE: quick match over Supabase Realtime =============== */
// Same log-in as the JAVEDA page (same site, same saved session). Everyone looking for a game of a
// mode sits in that mode's lobby (presence, keyed by account); oldest first, they pair off two by
// two. The pair meet in their own room; the one who came first (seat 0) sends "go" with the match id
// and the seed for the shots, the other says "ack", and after a count of three both play.
// Then the one whose turn it is sends each light they tap. Both report the result to the JAVEDA page,
// which only pays out when both reports say the same.
// Nobody is ever invented here: no bots, no fake names. Nobody there means nobody there.
const PROTO = 1, SB_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
const NET = {
  sb:null, me:null, name:"", seat:0, opp:null, match:null, state:"off", lobby:null, room:null, since:0, heard:0,
  endAt:0, result:null,
  inMatch(){ return this.state === "play" || this.state === "done"; },
  oppName(){ return this.opp ? this.opp.name : "them"; },
  status(html, wait){ const n = $("net"); n.classList.remove("hid"); n.classList.toggle("wait", !!wait); n.innerHTML = '<span class="dot"></span>' + html; },
  async init(){
    $("go").disabled = true; this.status("Connecting&hellip;", true);
    try {
      if (!window.supabase) await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = SB_JS; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      const r = await fetch("/api/config"), cfg = r.ok ? await r.json() : {};
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error("no config");
      this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
    } catch(e){ this.status("Online play only works on the JAVEDA page, and it can't be reached right now."); return; }
    const { data } = await this.sb.auth.getSession();
    if (!data || !data.session){ this.status("<b>Log in</b> on the JAVEDA page to play online - the result goes on your account."); return; }
    this.me = data.session.user.id;
    const p = await this.sb.from("javeda_players").select("username").eq("user_id", this.me).maybeSingle();
    if (!p.data){ this.status("Make your player on the JAVEDA page first (a name and a picture)."); return; }
    this.name = p.data.username; this.state = "ready";
    this.status("Playing as <b>" + esc(this.name) + "</b>. Quick match finds you a real player.");
    $("go").disabled = false;
    addEventListener("pagehide", () => { if (this.inMatch()) this.send("bye", {}); });
    setInterval(() => this.tick(), 1000);
  },
  send(event, payload){ if (this.room) try { this.room.send({ type:"broadcast", event, payload }); } catch(e){} },
  chan(name){ return this.sb.channel(name, { config:{ presence:{ key:this.me }, broadcast:{ self:false } } }); },
  // the lobby: everyone looking for this mode right now
  seek(){
    this.state = "seek"; if (!this.since) this.since = Date.now();
    $("go").disabled = true; $("go").textContent = "Looking…";
    this.status("Looking for a player&hellip;", true);
    if (this.lobby){ this.lobby.track({ id:this.me, name:this.name, since:this.since }); this.pair(); return; }
    const ch = this.lobby = this.chan("javeda20-" + ONLINE + "-v" + PROTO);
    ch.on("presence", { event:"sync" }, () => this.pair());
    ch.subscribe(s => { if (s === "SUBSCRIBED" && this.state === "seek") ch.track({ id:this.me, name:this.name, since:this.since }); });
  },
  waiting(){ const st = this.lobby.presenceState(), out = [];
    for (const k in st){ const p = st[k] && st[k][0]; if (p && p.id) out.push(p); }
    return out.sort((a, b) => a.since - b.since || (a.id < b.id ? -1 : 1)); },
  pair(){
    if (this.state !== "seek") return;
    const L = this.waiting(), i = L.findIndex(p => p.id === this.me);
    this.status(L.length > 1 ? "Looking for a player&hellip; <b>" + L.length + "</b> here now." :
      "Looking for a player&hellip; nobody else is looking right now. Stay here - the next one in plays you.", true);
    if (i < 0) return;
    const o = L[i % 2 ? i - 1 : i + 1];
    if (!o || o.id === this.me) return;
    // the one who came first is seat 0 (Jo's saucer) and names the room
    const host = i % 2 === 0, a = host ? L[i] : o;
    this.join("javeda20-" + ONLINE + "-v" + PROTO + "-" + a.id.slice(0, 8) + "-" + a.since + "-" + (host ? o : L[i]).id.slice(0, 8), host ? 0 : 1, o);
  },
  join(name, seat, o){
    this.state = "room"; this.seat = seat; this.opp = { id:o.id, name:String(o.name || "player").slice(0, 24) }; this.match = null;
    this.status("Found <b>" + esc(this.opp.name) + "</b> - getting the lights ready&hellip;", true);
    this.lobby.untrack();
    const ch = this.room = this.chan(name);
    ch.on("presence", { event:"sync" }, () => this.roomSync());
    for (const ev of ["go", "ack", "tap", "hb", "bye"]) ch.on("broadcast", { event:ev }, m => this.hear(ev, (m && m.payload) || {}));
    ch.subscribe(s => { if (s === "SUBSCRIBED") ch.track({ id:this.me, name:this.name }); });
    clearTimeout(this.roomT); this.roomT = setTimeout(() => { if (this.state === "room") this.back(); }, 8000);
  },
  // they never turned up (both saw a different pair for a moment): back in the lobby, same place in line
  back(){ clearInterval(this.goT); const r = this.room; this.room = null; this.opp = null; if (r) try { this.sb.removeChannel(r); } catch(e){} this.seek(); },
  roomSync(){
    const st = this.room.presenceState(), here = !!(this.opp && st[this.opp.id] && st[this.opp.id].length);
    if (this.state === "room" && here && this.seat === 0 && !this.match){
      this.match = (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ Math.random()*16 >> c/4).toString(16)));
      this.seed = 1 + Math.floor(Math.random()*9999);
      const go = () => this.send("go", { match:this.match, seed:this.seed, v:PROTO }); go(); this.goT = setInterval(go, 700); }
    if (this.state === "play" && !here && this.seen) this.left("left the match");
    if (here) this.seen = true;
  },
  hear(ev, p){
    this.heard = Date.now();
    if (ev === "go" && this.seat === 1){ if (this.state === "room" && p.v === PROTO){ this.match = p.match; this.seed = p.seed | 0; this.play(); } if (this.match === p.match) this.send("ack", { match:p.match }); }
    else if (ev === "ack" && this.seat === 0 && this.state === "room" && p.match === this.match){ clearInterval(this.goT); this.play(); }
    else if (ev === "tap"){ if ((p.k | 0) >= PASS.k && !PASS.queue.some(q => q.k === (p.k | 0) && q.i === (p.i | 0))) PASS.queue.push({ k:p.k | 0, i:p.i | 0, pad:clamp(p.pad | 0, 0, 8), timeout:!!p.timeout }); }
    else if (ev === "bye") this.left("left the match");
  },
  // matched: a count of three, then both play
  play(){
    clearTimeout(this.roomT); this.state = "play"; this.heard = Date.now();
    let n = 3; const count = () => { if (this.state !== "play") return;
      if (n === 0){ startGame(); return; }
      this.status("Playing <b>" + esc(this.opp.name) + "</b> - starting in <b>" + n + "</b>", true); sfx.tick(); n--; setTimeout(count, 1000); };
    audioInit(); count();
  },
  tick(){
    if (this.state === "room" || !this.inMatch() || !this.room) return;
    this.send("hb", {});
    if (this.state !== "play") return;
    if (Date.now() - this.heard > 15000) this.left("lost the connection");
    else if (S.started && PO.st.phase === "watch" && Date.now() - PASS.turnAt > PO.st.allow*1000 + 20000) this.left("stopped playing");
  },
  passOver(){ if (this.state !== "play") return; S.done = true; this.endAt = Date.now(); this.done(); },
  done(){
    if (this.state !== "play") return;
    this.state = "done";
    const z = PASS.z, my = WORD.length - z[this.seat], their = WORD.length - z[1 - this.seat];
    this.result = { my, their, res:my > their ? "win" : my < their ? "loss" : "draw" };
    if (HUB) toHub({ type:"javeda:match", level:CFG.id, match:this.match, mode:ONLINE, opponent:this.opp.id, my, their });
    if (this.result.res === "win") sfx.big(); else if (this.result.res === "loss") sfx.bad();
    setTimeout(finish, 1200);
  },
  left(why){
    if (this.state !== "play") return;
    this.state = "left"; this.why = why; S.done = true; song.pause(); setTimeout(finish, 300);
  }
};

/* ---------------- the run ---------------- */
let ME = null, OPP = null;
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PO; camInit = false; PO.root.visible = true; END.root.visible = false; END.on = false; ME.visible = true;
  if (ONLINE){ PASS.reset(); G.begin(0, END_AT, .3, .3); }
  else if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless || ONLINE;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!ONLINE && !CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: down in the crowd, looking up - everybody's hand up, pointing at the big white light,
   the blue all round it - and Jo's saucer coming up into the light. */
const END = { out:8.5, root:null, X:300 };
function buildEnd(){
  const g = new THREE.Group(); g.visible = false; g.position.x = END.X; scene.add(g);
  g.add(venue());
  const near = [];
  for (let i = 0; i < 9; i++){ const p = person(i*5 + 2), a = (i/8 - .5);
    p.position.set(a*10 + (rnd(i*3) - .5)*.8, -1.9 + rnd(i*5)*.5 + Math.abs(a)*.6, -.5 - Math.abs(a)*2 + rnd(i*7)); p.rotation.y = -a*.6; p.scale.setScalar(1.15); g.add(p); near.push(p); }
  END.people = near; END.root = g;
}
function win(){
  if (S.end >= 0 || S.done) return;

  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){

}
function over(why){

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);

    const portrait = cam.aspect < .8;

    else {
      if (!END.on){ END.on = true; PO.root.visible = false; END.root.visible = true; camInit = false; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer rises up into the big light; every hand follows it

    }

  }

function frame(){

  S.started = true; S.t = 0;
  if (HUB && !PRACTICE) toHub({ type:"javeda:start", level:CFG.id });
  if (ONLINE) say("PASS IT ON", NET.seat === 0 ? "you start" : esc(NET.oppName()) + " starts", 2.5, "g");
  else say(CFG.endless ? "ENDLESS" : "PASS IT ON", CFG.endless ? "the pattern never stops" : "watch, play it back, add one", 3, CFG.endless ? "g" : "");
}
$("go").addEventListener("click", () => {
  if (ONLINE){ if (NET.state === "ready") NET.seek(); else if (NET.state === "done" || NET.state === "left") location.reload(); return; }
  startGame();
});
// online: warm up on your own (nothing is saved), and back
$("practice").addEventListener("click", () => {
  const q = new URLSearchParams(location.search);
  if (ONLINE){ q.delete("online"); q.set("practice", "pass"); } else { q.delete("practice"); q.set("online", "pass"); }
  location.search = q.toString();
});
$("by").textContent = ONLINE ? CFG.by : "LAZY JO · " + (PRACTICE ? "WARM-UP" : CFG.by);
$("title").textContent = ONLINE ? "PASS IT ON 1v1" : "STAY UP 2" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = ONLINE ? "<b>PASS IT ON:</b> you and a real player, found by quick match, one pattern between you. Play it back, add a light of your own, pass it on - and watch every light they add. Get one wrong (or run out of time) and you get a <b>Z</b>; a fresh pattern starts. Three Z's and you fell asleep."
  : "The crowd from the cover under the blue light, every hand up, the big white light behind - and nine lights over them, each its own note. Jo's saucer hovers by the one you play." +
    (ENDLESS ? " <b>Endless:</b> the pattern never stops - less time every 8 bars, a heart back every 24." : "");
$("how").innerHTML = ONLINE ? "<b>Tap</b> the lights (or the keys <b>1-9</b>). No hurry - the turn clock gives you plenty, a little more the longer the pattern. Nothing's on the beat here: it's all memory."
  : "The lights play the pattern and add one - <b>watch</b>. Then <b>tap</b> it back (or the keys <b>1-9</b>, row by row from the top) and <b>add one</b> of your own: they play the whole thing back and add another. Long enough and a fresh one starts, +1,000. In the hooks they play twice as fast, for <b>double points</b>. A wrong light or too slow costs a heart (3) and you see it again.";
if (ONLINE){ $("go").textContent = "Find a match"; $("practice").classList.remove("hid"); $("snd").classList.add("hid"); NET.init(); }
else if (PRACTICE){ $("practice").textContent = "Back to the 1v1"; $("practice").classList.remove("hid"); }
else if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

<style>
:root{color-scheme:dark}
html,body{height:100%}
body{margin:0; background:#1a0c34; color:#f8eeff; overflow:hidden; font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

  border:1.5px solid #f8eeff66; border-radius:4px; padding:9px 18px; cursor:pointer}

  border-radius:4px; border:1.5px solid #ff7ad099; background:#ff7ad014}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= BLIND LOVE =================
   Level 21 of JAVEDA, in the world of the cover: two rooms split on the diagonal by a white line - hers
   pink, his purple. She reads on her bed with her long red hair; he's on his phone in the headphones,
   the moon in his window, the smiley on his wall - and Jo's saucer (the purple dome with the "L").
   Jo picked two, so the song has two parts:
   PART 1 · LOVE CARDS: the cards face down on her bed. Turn two: the same picture and they're a pair -
   the saucer beams them up. Clear the bed and a bigger one is dealt. In the hooks the cards peek on
   every bar's 1 (and count double). Out of time costs a heart (3).
   PART 2 · SNAP (?part=2): her pile and his on the floor between their rooms. On every beat both turn
   a card - the same picture on both: SNAP. A heart and a broken heart aren't the same. A snap on no pair
   or a pair let go by costs a heart. On the 8ths in the hooks.
   At the end of the song: the cover. ENDLESS for each (?endless=1) once it's cleared.
   And ONLINE (?online=cards|snap, from the JAVEDA page, logged in): Love Cards 1v1 - take turns, a
   pair and you go again, the most pairs wins; Snap 1v1 - the same cards for both at the same time,
   the quicker snap takes the pair. Nobody is ever made up: if no one's there, nobody is. */

// the song's grid - a stand-in (90 BPM) until the song is here and measured
const GRID = { bpm:90, t0:0 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(56);
const LOOP = [barT(8), barT(56)];             // endless and online: round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [16, "loud"], [24, "hook"], [32, "calm"], [48, "loud"], [56, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ONLINE = { cards:"cards", snap:"snap" }[Q.get("online")] || null;
const PRACTICE = !ONLINE && { cards:"cards", snap:"snap" }[Q.get("practice")] || null;
const PART = ONLINE ? (ONLINE === "snap" ? 2 : 1) : PRACTICE ? (PRACTICE === "snap" ? 2 : 1) : Q.get("part") === "2" ? 2 : 1;
const ENDLESS = !ONLINE && !PRACTICE && Q.get("endless") === "1";
const NAMES = ["", "Love Cards", "Snap"];
const CFG = ONLINE ? { id:"lvl21" + ONLINE, title:NAMES[PART] + " 1v1", by:"LEVEL 21 · ONLINE 1v1", online:ONLINE }
  : ENDLESS ? { id:PART === 2 ? "lvl21bx" : "lvl21x", title:NAMES[PART], by:"LEVEL 21" + (PART === 2 ? " PART 2" : "") + " · ENDLESS", endless:true, board:"Level 21" + (PART === 2 ? " Part 2" : "") + " ∞" }
  : { id:PART === 2 ? "lvl21b" : "lvl21", title:NAMES[PART], by:"LEVEL 21" + (PART === 2 ? " PART 2" : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const shuffle = (a, seed) => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd(seed + i*3.7)*(i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl21.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [130.8, 98, 110, 87.3];          // a soft, sweet loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: two rooms, one wall between them - hers pink, his purple; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
const SC = { lav:0xc8b0f4, purple:0x7a5ae8, deep:0x3a2a8a, pink:0xf4a8dc, hot:0xff5ac0, white:0xfaf6ff, ink:0x241640, red:0xe8402a, gold:0xffc84a };
const glowM = (c, op) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
// flat colours like the drawing on the cover: a little light, no shine
const flat = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.85, metalness:0, emissive:c, emissiveIntensity:e == null ? .1 : e*.45 });
const box = (w, h, d, c, e) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), flat(c, e));

/* ---- the icons on the cards, the phone and the pictures: drawn, not copied ---- */
const ICONS = ["heart", "smile", "phone", "book", "phones", "flower", "moon", "tape", "star", "letter", "lamp", "sun", "broken", "note"];
function drawIcon(x, name, cx, cy, s, col, bg){
  x.save(); x.translate(cx, cy); x.scale(s/100, s/100); x.lineWidth = 7; x.lineJoin = x.lineCap = "round"; x.strokeStyle = "#241640"; x.fillStyle = col || "#ff5ac0";
  const heart = () => { x.beginPath(); x.moveTo(0, 34); x.bezierCurveTo(-60, -6, -36, -52, 0, -22); x.bezierCurveTo(36, -52, 60, -6, 0, 34); x.closePath(); };
  if (name === "heart"){ heart(); x.fill(); x.stroke(); }
  else if (name === "broken"){ heart(); x.fill(); x.stroke(); x.beginPath(); x.moveTo(0, -22); x.lineTo(-8, -4); x.lineTo(6, 8); x.lineTo(-4, 30); x.strokeStyle = "#faf6ff"; x.lineWidth = 9; x.stroke(); }

/* =============== ONLINE: SNAP 1v1 - the same cards at the same time =============== */
// Both turn the same cards on the song's beat. On a pair each player says how long after the card
// landed (on their own screen) they snapped - or that they didn't - and the quicker one takes the
// pair (a tie goes to whoever found the match first). Both wait for both answers, so both always

  key(k, seat){ return k + ":" + seat; },
  mine(c, t){ const k = c.k, me = NET.seat;

    if (!c.match){ NET.send("ev", { k, wrong:true }); this.applyWrong(k, me); return; }
    const rt = Math.max(0, t - c.at); NET.send("ev", { k, rt:+rt.toFixed(3) }); this.rt[this.key(k, me)] = rt; sfx.clap(); say("SNAP!", "...", .5); this.resolve(k); },
  // the card's time is up on my screen: if it was a pair and I didn't snap, say so

    this.sent[k] = true; if (c.match){ NET.send("ev", { k, rt:-1 }); this.rt[this.key(k, NET.seat)] = -1; this.resolve(k); } },
  hear(p){ const k = p.k | 0, them = 1 - NET.seat; if (k < 0 || k >= this.LAST) return;

/* =============== ONLINE: quick match over Supabase Realtime =============== */
// Same log-in as the JAVEDA page (same site, same saved session). Everyone looking for a game of a
// mode sits in that mode's lobby (presence, keyed by account); oldest first, they pair off two by
// two. The pair meet in their own room; the one who came first (seat 0) sends "go" with the match id
// and the seed for the cards, the other says "ack", and after a count of three both play.
// Then each sends what they do (Love Cards: the cards they turn; Snap: how quick their snap was). Both report the result to the JAVEDA page,
// which only pays out when both reports say the same.

  oppName(){ return this.opp ? this.opp.name : "them"; },

  async init(){

      if (!window.supabase) await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = SB_JS; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      const r = await fetch("/api/config"), cfg = r.ok ? await r.json() : {};
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error("no config");
      this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
    } catch(e){ this.status("Online play only works on the JAVEDA page, and it can't be reached right now."); return; }
    const { data } = await this.sb.auth.getSession();
    if (!data || !data.session){ this.status("<b>Log in</b> on the JAVEDA page to play online - the result goes on your account."); return; }
    this.me = data.session.user.id;
    const p = await this.sb.from("javeda_players").select("username").eq("user_id", this.me).maybeSingle();
    if (!p.data){ this.status("Make your player on the JAVEDA page first (a name and a picture)."); return; }
    this.name = p.data.username; this.state = "ready";
    this.status("Playing as <b>" + esc(this.name) + "</b>. Quick match finds you a real player.");
    $("go").disabled = false;
    addEventListener("pagehide", () => { if (this.inMatch()) this.send("bye", {}); });
    setInterval(() => this.tick(), 1000);
  },
  send(event, payload){ if (this.room) try { this.room.send({ type:"broadcast", event, payload }); } catch(e){} },
  chan(name){ return this.sb.channel(name, { config:{ presence:{ key:this.me }, broadcast:{ self:false } } }); },
  // the lobby: everyone looking for this mode right now
  seek(){
    this.state = "seek"; if (!this.since) this.since = Date.now();
    $("go").disabled = true; $("go").textContent = "Looking…";
    this.status("Looking for a player&hellip;", true);
    if (this.lobby){ this.lobby.track({ id:this.me, name:this.name, since:this.since }); this.pair(); return; }
    const ch = this.lobby = this.chan("javeda21-" + ONLINE + "-v" + PROTO);
    ch.on("presence", { event:"sync" }, () => this.pair());
    ch.subscribe(s => { if (s === "SUBSCRIBED" && this.state === "seek") ch.track({ id:this.me, name:this.name, since:this.since }); });
  },
  waiting(){ const st = this.lobby.presenceState(), out = [];
    for (const k in st){ const p = st[k] && st[k][0]; if (p && p.id) out.push(p); }
    return out.sort((a, b) => a.since - b.since || (a.id < b.id ? -1 : 1)); },
  pair(){
    if (this.state !== "seek") return;
    const L = this.waiting(), i = L.findIndex(p => p.id === this.me);
    this.status(L.length > 1 ? "Looking for a player&hellip; <b>" + L.length + "</b> here now." :
      "Looking for a player&hellip; nobody else is looking right now. Stay here - the next one in plays you.", true);
    if (i < 0) return;
    const o = L[i % 2 ? i - 1 : i + 1];
    if (!o || o.id === this.me) return;
    // the one who came first is seat 0 (Jo's saucer) and names the room
    const host = i % 2 === 0, a = host ? L[i] : o;
    this.join("javeda21-" + ONLINE + "-v" + PROTO + "-" + a.id.slice(0, 8) + "-" + a.since + "-" + (host ? o : L[i]).id.slice(0, 8), host ? 0 : 1, o);
  },
  join(name, seat, o){
    this.state = "room"; this.seat = seat; this.opp = { id:o.id, name:String(o.name || "player").slice(0, 24) }; this.match = null;
    this.status("Found <b>" + esc(this.opp.name) + "</b> - dealing the cards&hellip;", true);
    this.lobby.untrack();
    const ch = this.room = this.chan(name);
    ch.on("presence", { event:"sync" }, () => this.roomSync());
    for (const ev of ["go", "ack", "ev", "hb", "bye"]) ch.on("broadcast", { event:ev }, m => this.hear(ev, (m && m.payload) || {}));
    ch.subscribe(s => { if (s === "SUBSCRIBED") ch.track({ id:this.me, name:this.name }); });
    clearTimeout(this.roomT); this.roomT = setTimeout(() => { if (this.state === "room") this.back(); }, 8000);
  },
  // they never turned up (both saw a different pair for a moment): back in the lobby, same place in line
  back(){ clearInterval(this.goT); const r = this.room; this.room = null; this.opp = null; if (r) try { this.sb.removeChannel(r); } catch(e){} this.seek(); },
  roomSync(){
    const st = this.room.presenceState(), here = !!(this.opp && st[this.opp.id] && st[this.opp.id].length);
    if (this.state === "room" && here && this.seat === 0 && !this.match){
      this.match = (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ Math.random()*16 >> c/4).toString(16)));
      this.seed = 1 + Math.floor(Math.random()*9999);
      const go = () => this.send("go", { match:this.match, seed:this.seed, v:PROTO }); go(); this.goT = setInterval(go, 700); }
    if (this.state === "play" && !here && this.seen) this.left("left the match");
    if (here) this.seen = true;
  },
  hear(ev, p){
    this.heard = Date.now();
    if (ev === "go" && this.seat === 1){ if (this.state === "room" && p.v === PROTO){ this.match = p.match; this.seed = p.seed | 0; this.play(); } if (this.match === p.match) this.send("ack", { match:p.match }); }
    else if (ev === "ack" && this.seat === 0 && this.state === "room" && p.match === this.match){ clearInterval(this.goT); this.play(); }
    else if (ev === "ev"){ if (S && S.started) OV.hear(p); else this.early.push(p); }
    else if (ev === "bye") this.left("left the match");
  },
  // matched: a count of three, then both play
  play(){
    clearTimeout(this.roomT); this.state = "play"; this.heard = Date.now();
    let n = 3; const count = () => { if (this.state !== "play") return;
      if (n === 0){ startGame(); return; }
      this.status("Playing <b>" + esc(this.opp.name) + "</b> - starting in <b>" + n + "</b>", true); sfx.tick(); n--; setTimeout(count, 1000); };
    audioInit(); count();
  },
  tick(){
    if (this.state === "room" || !this.inMatch() || !this.room) return;
    this.send("hb", {});
    if (this.state !== "play") return;
    if (Date.now() - this.heard > 15000) this.left("lost the connection");
    else if (S.started && OV.watching() && Date.now() - V1.turnAt > V1.allow*1000 + 20000) this.left("stopped playing");
  },
  over(){ if (this.state !== "play") return; S.done = true; this.endAt = Date.now(); this.done(); },
  done(){
    if (this.state !== "play") return;
    this.state = "done";
    const [my, their] = OV.result();
    this.result = { my, their, res:my > their ? "win" : my < their ? "loss" : "draw" };
    if (HUB) toHub({ type:"javeda:match", level:CFG.id, match:this.match, mode:ONLINE, opponent:this.opp.id, my, their });
    if (this.result.res === "win") sfx.big(); else if (this.result.res === "loss") sfx.bad();
    setTimeout(finish, 1200);
  },
  left(why){
    if (this.state !== "play") return;
    this.state = "left"; this.why = why; S.done = true; song.pause(); setTimeout(finish, 300);
  }
};
// both of you up top: your pairs (Love Cards: whose turn it is) or your points (Snap)
let lastVs = "";
function vsHud(){
  const h = OV.rows().map(([nm, v, up]) => '<div class="row' + (up ? ' up' : '') + '"><span class="nm">' + nm + '</span><span class="lt"><b>' + v + '</b></span></div>').join("");

/* ---------------- the run ---------------- */
let ME = null, OPP = null;
const OV = ONLINE === "snap" ? W2 : V1;       // the online rules for this part
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PART === 2 ? SN : LC; camInit = false; G.root.visible = true; END.root.visible = false; END.on = false; ME.visible = true;
  if (ONLINE) G.begin(0, END_AT, .4, .4);
  else if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless || ONLINE;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!ONLINE && !CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================

   the wall, the lamp lit - and Jo's saucer coming down in front, small, its white beam on. */
const END = { out:8.5, root:null, X:300 };
function buildEnd(){
  const g = new THREE.Group(); g.visible = false; g.position.x = END.X; scene.add(g);
  rooms(g);
  const herBed = box(4.4, .8, 2.6, SC.white, .3); herBed.position.set(-3.4, -1.6, -2.6); g.add(herBed);
  g.add(at3(box(4.2, .2, 2.4, 0xc8b0f4, .3), -3.4, -1.1, -2.6));

  const hisBed = box(4, .8, 2.4, 0x4a3aa8, .3); hisBed.position.set(3.4, -.4, -3.4); g.add(hisBed);

function win(){

}
function lose(why, tip){

function over(why){

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  animSaucer(ME, t, beat);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#ffe0f4"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(dt, t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = false; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer comes down in front, small, the beam on, like on the cover
      const u = clamp((S.end - 1.2)/2.8, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.55); ME.rotation.set(.15, Math.sin(t*1.5)*.25, 0); ME.userData.beam.visible = true; ME.userData.beam.scale.set(.5, .6, .5); ME.userData.beam.position.y = -1.1;
      ME.position.set(END.X, (portrait ? -.4 : -.8) + (1 - e)*6 + Math.sin(t*2)*.05, 1.4);
      CAMP.set(END.X, portrait ? 2.6 : 2, portrait ? 17 : 10.5); CAML.set(END.X, portrait ? 2 : 1.6, -4);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("BLIND LOVE", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(dt, t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.1 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  ren.render(scene, cam);
}
function frame(){

    const dt = Math.min(.05, clockR.getDelta());

    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }

}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }

  : ONLINE === "snap" ? "<b>Tap anywhere</b> (or Space) when both piles show the same picture. A heart and a broken heart aren't the same, nor the sun and the moon."
  : PART === 2 ? "On every beat both piles turn a card. The same picture on both: <b>tap anywhere</b> (or Space) - SNAP, and the saucer beams both piles up. A heart and a broken heart aren't the same, nor the sun and the moon. A snap on no pair, or a pair let by, costs a heart (3). On the 8ths in the hooks, for <b>double points</b>."
  : "<b>Tap</b> two cards to turn them: the same picture is a pair and the saucer beams them up; not the same, they turn back. Clear the bed and a bigger one is dealt. A pair turned <b>on the beat</b> counts double; in the hooks the cards <b>peek</b> on every bar's 1, for <b>double points</b>. Out of time costs a heart (3).";
if (ONLINE){ $("go").textContent = "Find a match"; $("practice").classList.remove("hid"); $("snd").classList.add("hid"); NET.init(); }
else if (PRACTICE){ $("practice").textContent = "Back to the 1v1"; $("practice").classList.remove("hid"); }
else if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] === "2") q.set("part", "2"); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

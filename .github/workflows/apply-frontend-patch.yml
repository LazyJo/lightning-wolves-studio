name: Apply Frontend Patch
on:
  push:
    paths:
      - '.github/workflows/apply-frontend-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and self-clean
        run: |
          sed -i 's/NyArMTA0MywvIEBA/NyArMTA0Myw3IEBA/' patches/frontend-whisper.patch.b64
          base64 -d patches/frontend-whisper.patch.b64 | git apply --verbose -
          rm -rf patches .github/workflows/apply-frontend-patch.yml
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "feat: wire Whisper upload into Studio UI (Feed The Wolf zone, transcript to generate, robust errors)"
          git push

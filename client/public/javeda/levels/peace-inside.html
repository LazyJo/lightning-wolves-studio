<script>
/* ================= PEACE INSIDE =================
   Level 16 of JAVEDA (Lazy Jo feat. Zirka), in the world of the cover: the white overcast
   sky of the photo, looking up; purple and gold; the black and white checks of Zirka's
   lanyard; the hands thrown at the camera - and two saucers, Jo's (silver, the orange dome
   with the "L") and Zirka's (white, the purple dome, the checks round the rim).
   Jo picked HOOPS: a purple and gold court floating in the white sky. Hold to wind up the
   shot, let go while the marker is in the green - on the beat it's a swish (double). A new
   spot every shot; the hoop slides about later on and the green gets smaller. A miss or the
   shot clock (two bars) costs a heart (3); five in a row give one back. In the hooks it's a
   money ball (x2). At the end of the song: the cover.
   Once it's cleared, ENDLESS opens (?endless=1): the shots never stop, harder every 8 bars,
   a heart back every 24.
   And it's the first JAVEDA level you can play ONLINE, 1v1, against a real player found by
   quick match (?online=live|horse, from the JAVEDA page, logged in):
   LIVE - the same song and the same shots at the same time, the other player's score up
   top; no hearts, the whole song; the highest score wins.
   H-O-R-S-E - take turns. Make a shot and they have to make the same one (a swish has to
   be matched with a swish); miss it and it's a letter. Miss your own and the other one sets.
   Spell HORSE and you're out. Nobody is ever made up: if no one's there, nobody is. */

// the song's grid, measured from lvl16.mp3: 91.33 BPM, the first beat at 0.24 s (see SONG.md)
const GRID = { bpm:91.33, t0:.24 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(64);                      // 2:48, the last hit
const LOOP = [barT(11), barT(64)];            // endless and H-O-R-S-E: round and round, from the first hook
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (the intro, the break, the bridge), loud (the verses), hook
const SECTIONS = [[11, "calm"], [21, "hook"], [27, "loud"], [29, "calm"], [48, "loud"], [53, "calm"], [64, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ONLINE = { live:"live", horse:"horse" }[Q.get("online")] || null;
const ENDLESS = !ONLINE && Q.get("endless") === "1";
const CFG = ONLINE ? { id:"lvl16" + ONLINE, title:ONLINE === "live" ? "Live 1v1" : "H-O-R-S-E", by:"LEVEL 16 · ONLINE 1v1", online:ONLINE }
  : ENDLESS ? { id:"lvl16x", title:"Hoops", by:"LEVEL 16 · ENDLESS", endless:true, board:"Level 16 ∞" }
  : { id:"lvl16", title:"Hoops", by:"LEVEL 16" };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/SES7XPJvBH", youtube: "https://www.youtube.com/@lazyjo_?sub_confirmation=1",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl16.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [98, 87.3, 110, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  shoot:() => ac && tone("sine", 300, 700, ac.currentTime, .18, .05, 3000),                       // the ball goes up
  swish:() => ac && hiss(ac.currentTime, .35, .14, 0, 5200),                                        // nothing but net
  rim:  () => ac && (tone("square", 520, 470, ac.currentTime, .16, .05, 2200), tone("square", 780, 700, ac.currentTime + .05, .12, .03, 2200)),
  tick: () => ac && tone("triangle", 1320, 1320, ac.currentTime, .08, .05, 6000),
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: a white sky, purple and gold, the checks ---------------- */
let scene, cam, ren, clockR, ME, OPP, JO, ZI, crashed = null;
const PC = { purple:0x552583, gold:0xfdb927, lilac:0x9a7ad8, white:0xffffff, ink:0x1a1424 };
const glowM = (c, op) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const PUFF = radial([[0, "rgba(255,255,255,.95)"], [.55, "rgba(255,255,255,.55)"], [1, "rgba(255,255,255,0)"]], 128);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
// the lanyard's checks: black and white squares
const CHECK = (rep) => canvasTex(64, 64, (x, w, h) => { for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){ x.fillStyle = (i + j) % 2 ? "#1a1424" : "#f4f2f8"; x.fillRect(i*32, j*32, 32, 32); } }, rep);
const mat = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.5, metalness:.1, emissive:c, emissiveIntensity:e == null ? .15 : e });
// the overcast sky of the photo: white, a little lilac up top; soft clouds
function skyDome(){ const t = canvasTex(4, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h);
    [[0, "#cfc4ea"], [.3, "#e8e2f6"], [.5, "#ffffff"], [.56, "#f2eef8"], [1, "#d8d0e6"]].forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, w, h); });

/* =============== H-O-R-S-E: take turns =============== */
// Both players run exactly this, shot by shot, in the same order - so both always agree whose turn
// it is and who has which letters. Only the one shooting sends anything: where they let go and
// whether it went in (they decide their own shot, like everywhere else in JAVEDA).
// Seat 0 found the match first (Jo's saucer), seat 1 is the other one (Zirka's).
const WORD = "HORSE";
const HORSE = {
  reset(){ Object.assign(this, { setter:0, phase:"set", need:"make", spot:0, letters:[0, 0], k:0, over:false, queue:[], oppP:0, turnAt:0 }); },
  shooter(){ return this.phase === "set" ? this.setter : 1 - this.setter; },
  mine(){ return this.shooter() === NET.seat; },
  // one shot, by whoever's up: what it does to the game
  apply(ev){
    const who = this.shooter(), was = this.phase, need = this.need; let letter = false;
    if (this.phase === "set"){
      if (ev.made){ this.phase = "match"; this.need = ev.swish ? "swish" : "make"; }
      else { this.setter = 1 - this.setter; this.spot++; } }
    else {
      if (!(ev.made && (need !== "swish" || ev.swish))){ this.letters[who]++; letter = true; }
      this.phase = "set"; this.spot++; }
    this.k++;
    if (this.letters[who] >= WORD.length || this.k >= 60) this.over = true;
    return { who, was, need, letter };
  },
  // the spot for this set: the same for both, a little harder as the game goes
  shot(){ return HP.spot(this.spot*7 + 1, Math.min(1, .3 + this.spot*.04)); },
  turn(t){
    const st = HP.st;
    if (this.over){ st.state = "over"; NET.horseOver(); return; }
    st.shot = this.shot(); st.shot.money = false; st.p = 0; st.fly = null; this.oppP = 0; this.turnAt = Date.now();
    if (this.mine()){ st.state = "ready"; st.clock = t + BAR*2; }
    else st.state = "watch";
  },
  // their shot, as they sent it, once it's this shot's turn
  update(dt, t){
    const st = HP.st;
    if (st.state === "pause" && t > st.pauseTo) this.turn(t);
    if (st.state === "watch"){
      const i = this.queue.findIndex(e => e.k === this.k);
      if (i >= 0){ const ev = this.queue.splice(i, 1)[0]; this.queue = this.queue.filter(e => e.k > this.k);
        st.fly = { t0:t, T:ev.clock ? .2 : .9, off:ev.off, inn:!!ev.made, swish:!!ev.made && !!ev.swish, clock:!!ev.clock, hx:HP.hoopX(t + .9), mine:false }; st.state = "fly"; if (!ev.clock) sfx.shoot(); }
      else st.p += (this.oppP - st.p)*Math.min(1, dt*12);
      return true; }
    return st.state === "pause" || st.state === "over";
  },
  landed(t, F){
    const r = this.apply({ made:F.inn, swish:F.swish }), me = r.who === NET.seat, them = esc(NET.oppName());
    const lets = n => WORD.slice(0, n).split("").join("-");
    if (r.was === "set"){
      if (F.inn) say(me ? (F.swish ? "SET - A SWISH" : "SET!") : (F.swish ? "MATCH THE SWISH" : "MATCH IT"),
        me ? them + " has to make it" + (F.swish ? " - with a swish" : "") : (F.swish ? "on the beat, " : "") + "or it's a letter", 1.4, "g");
      else say(F.clock ? "SHOT CLOCK" : me ? "MISSED" : them + " MISSED", me ? them + " sets the next one" : "your turn to set one", 1.3, me ? "x" : "g"); }
    else if (r.letter){ const n = this.letters[r.who]; sfx.bad();
      say(me ? lets(n) : lets(n), me ? "you get an " + WORD[n - 1] : them + " gets an " + WORD[n - 1], 1.4, me ? "x" : "g"); }
    else say(me ? "MATCHED" : them + " MATCHED IT", me ? "no letter" : "no letter for them", 1.2, me ? "g" : "");
    HP.st.state = "pause"; HP.st.pauseTo = t + 1.3;
  },
  line(){ const st = HP.st, them = esc(NET.oppName());
    if (st.state === "watch") return them + (this.phase === "set" ? " SETS A SHOT" : " TRIES TO MATCH") + "<small>watch the bar</small>";
    if (st.state === "ready" || st.state === "wind") return (this.phase === "set" ? "YOUR SHOT - SET ONE" : this.need === "swish" ? "MATCH THE SWISH" : "MATCH IT") + "<small>" + HP.hint + "</small>";
    return "H-O-R-S-E<small>&nbsp;</small>"; },
  info(){ return "SHOT " + (this.k + 1); }
};

/* =============== ONLINE: quick match over Supabase Realtime =============== */
// Same log-in as the JAVEDA page (same site, same saved session). Everyone looking for a game of a
// mode sits in that mode's lobby (presence, keyed by account); oldest first, they pair off two by
// two. The pair meet in their own room; the one who came first (seat 0) sends "go" with the match id
// and the seed for the shots, the other says "ack", and after a count of three both play.
// LIVE: each shot sends your score; at the end of the song "fin". H-O-R-S-E: the one shooting sends
// the wind-up (a few times a second, to watch) and the shot. Both report the result to the JAVEDA

  async init(){

    this.status("Playing as <b>" + esc(this.name) + "</b>. " + (ROOM ? "<b>Private room:</b> you play the friend who opens your link." : "Quick match finds you a real player."));

  },
  send(event, payload){ if (this.room) try { this.room.send({ type:"broadcast", event, payload }); } catch(e){} },
  chan(name){ return this.sb.channel(name, { config:{ presence:{ key:this.me }, broadcast:{ self:false } } }); },
  // the lobby: everyone looking for this mode right now
  seek(){
    this.state = "seek"; if (!this.since) this.since = Date.now();

    this.status("Looking for a player&hellip;", true);
    if (this.lobby){ this.lobby.track({ id:this.me, name:this.name, since:this.since }); this.pair(); return; }
    const ch = this.lobby = this.chan("javeda16-" + ONLINE + "-v" + PROTO + RTAG);
    ch.on("presence", { event:"sync" }, () => this.pair());

  },
  waiting(){ const st = this.lobby.presenceState(), out = [];

  pair(){

      (ROOM ? "Waiting for your friend&hellip; they join as soon as they open your link." : "Looking for a player&hellip; nobody else is looking right now. Stay here - the next one in plays you."), true);
    if (i < 0) return;
    const o = L[i % 2 ? i - 1 : i + 1];

    // the one who came first is seat 0 (Jo's saucer) and names the room
    const host = i % 2 === 0, a = host ? L[i] : o;
    this.join("javeda16-" + ONLINE + "-v" + PROTO + RTAG + "-" + a.id.slice(0, 8) + "-" + a.since + "-" + (host ? o : L[i]).id.slice(0, 8), host ? 0 : 1, o);
  },
  join(name, seat, o){

    this.lobby.untrack();
    const ch = this.room = this.chan(name);
    ch.on("presence", { event:"sync" }, () => this.roomSync());
    for (const ev of ["go", "ack", "sc", "fin", "shot", "w", "hb", "bye"]) ch.on("broadcast", { event:ev }, m => this.hear(ev, (m && m.payload) || {}));

  back(){ clearInterval(this.goT); const r = this.room; this.room = null; this.opp = null; if (r) try { this.sb.removeChannel(r); } catch(e){} this.seek(); },
  roomSync(){

  hear(ev, p){

    else if (ev === "ack" && this.seat === 0 && this.state === "room" && p.match === this.match){ clearInterval(this.goT); this.play(); }

      if (n === 0){ startGame(); return; }

  },

  done(){
    if (this.state !== "play") return;

  left(why){

// the other player up top: their name and score (LIVE), or both of you and your letters (H-O-R-S-E)
let lastVs = "";
function vsHud(){
  const them = esc(NET.oppName()); let h;
  if (ONLINE === "live") h = '<span class="nm">' + them + '</span><span class="sc">' + fmt(NET.oppScore) + '</span>';
  else { const row = (seat, nm) => '<div class="row' + (HORSE.shooter() === seat ? ' up' : '') + '"><span class="nm">' + nm + '</span><span class="lt">' +
      WORD.split("").map((c, i) => i < HORSE.letters[seat] ? "<b>" + c + "</b>" : c).join("") + '</span></div>';
    h = row(NET.seat, "You") + row(1 - NET.seat, them); }
  if (h !== lastVs){ lastVs = h; $("vs").innerHTML = h; }

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = HP; camInit = false; HP.root.visible = true; END.root.visible = false; END.on = false; scene.fog.near = 60; scene.fog.far = 220;
  ME.visible = OPP.visible = true;
  if (ONLINE === "horse"){ HORSE.reset(); G.begin(0, END_AT, .3, .3); HP.st.state = "pause"; HP.st.pauseTo = BEAT*2; }
  else if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little harder every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless || ONLINE === "horse";
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (ONLINE === "live" && t >= END_AT) NET.liveEnd();
  else if (!ONLINE && !CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The court drops away and there's the cover: looking up into the white sky, Jo's saucer and
   Zirka's leaning in over the camera, a hand thrown at you from each side (Jo's, the purple
   sleeve; Zirka's, the white hoodie), the peace sign up from below, the checks of the lanyard. */
const END = { out:8, root:null, X:400 };
function buildEnd(){
  const g = new THREE.Group(); g.visible = false; g.position.x = END.X; scene.add(g);
  const jo = buildSaucer(false), zi = buildSaucer(true);
  jo.position.set(-1.5, 3.4, -6.5); jo.scale.setScalar(1.5); zi.position.set(1.7, 2.7, -6); zi.scale.setScalar(1.5); g.add(jo, zi);
  const hj = handMesh(false, false), hz = handMesh(true, false), hp = handMesh(true, true);
  g.add(hj, hz, hp);
  const lan = new THREE.Mesh(new THREE.PlaneGeometry(.5, 7), new THREE.MeshStandardMaterial({ map:CHECK([1, 14]), roughness:.6, side:THREE.DoubleSide }));
  lan.position.set(2.6, .4, -4.2); lan.rotation.set(-.3, -.2, .08); g.add(lan);
  for (let i = 0; i < 8; i++){ const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:PUFF, color:0xffffff, transparent:true, opacity:.8, depthWrite:false, fog:false }));
    s.scale.set(14 + rnd(i)*10, 6 + rnd(i*3)*4, 1); s.position.set((rnd(i*5) - .5)*40, 10 + rnd(i*7)*12, -30 - rnd(i*9)*20); g.add(s); }
  END.root = g; Object.assign(END, { jo, zi, hj, hz, hp });
}
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    // the cover: a fade to white, then looking up at the two of them
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#ffffff"; $("flash").style.opacity = Math.min(1, S.end/.8); HP.render(dt, t); }
    else {
      if (!END.on){ END.on = true; HP.root.visible = false; ME.visible = OPP.visible = false; END.root.visible = true; camInit = false; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      const k = clamp((S.end - 1.2)/1.3, 0, 1), e = 1 - Math.pow(1 - k, 3), w = portrait ? .6 : 1;
      END.hj.position.set(-2.9*w - (1 - e)*3, 2.1, -3.2); END.hj.rotation.set(.5, .3, -.5);
      END.hz.position.set(3.2*w + (1 - e)*3, 1.2, -3.4); END.hz.rotation.set(.5, -.3, .55);
      END.hp.position.set(-.3, -1.1 - (1 - e)*3, -2.6); END.hp.rotation.set(.75, 0, .1);
      for (const s of [END.jo, END.zi]){ s.userData.beam.visible = true; s.rotation.y = t*1.2; animSaucer(s, t, beat); }
      END.jo.position.y = 3.4 + Math.sin(t*1.4)*.12; END.zi.position.y = 2.7 + Math.sin(t*1.4 + 1)*.12;
      CAMP.set(END.X, -.2, 2.6); CAML.set(END.X, 3.4, -6);
      if (S.end > 2.2 && !S.saidEnd){ S.saidEnd = true; say("PEACE INSIDE", "LAZY JO FEAT. ZIRKA", 4.5, "t"); }
    }
  } else G.render(dt, t);
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.1 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  FX.frame(dt, t, beat);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }

/* ---------------- input ---------------- */
// hold anywhere (or Space) to wind up, let go to shoot
let actHeld = false;
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); actHeld = true; }, { passive:false });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { actHeld = false; });
addEventListener("keydown", e => { if ((e.key === " " || e.key === "ArrowUp") && !veilUp()){ e.preventDefault(); if (live()) actHeld = true; } });
addEventListener("keyup", e => { if (e.key === " " || e.key === "ArrowUp") actHeld = false; });
addEventListener("blur", () => { actHeld = false; });

const PRACTICE = !ONLINE && { live:"live", horse:"horse" }[Q.get("practice")] || null;
function startGame(){
  if (NET.seat === 1){ ME = ZI; OPP = JO; } else { ME = JO; OPP = ZI; }
  reset(); actHeld = false; $("ml").textContent = ONLINE === "horse" ? "" : "SCORE";
  $("veil").classList.add("hid"); $("hud").classList.remove("off"); if (ONLINE){ $("vs").classList.remove("hid"); lastVs = ""; }
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  if (ONLINE === "horse") say("H-O-R-S-E", NET.seat === 0 ? "you set first" : esc(NET.oppName()) + " sets first", 2.5, "g");
  else if (ONLINE) say("LIVE 1v1", "same song, same shots - beat " + esc(NET.oppName()), 3, "g");
  else say(CFG.endless ? "ENDLESS" : "HOOPS", CFG.endless ? "the shots never stop" : G.hint, 3, CFG.endless ? "g" : "");
}
$("go").addEventListener("click", () => {
  if (ONLINE){ if (NET.state === "ready") NET.seek(); else if (NET.state === "done" || NET.state === "left") location.reload(); return; }
  startGame();
});
// online: warm up on your own (nothing is saved), and back
$("practice").addEventListener("click", () => {
  const q = new URLSearchParams(location.search);
  if (ONLINE){ q.delete("online"); q.set("practice", ONLINE); } else { q.delete("practice"); q.set("online", PRACTICE); }
  location.search = q.toString();
});
$("by").textContent = ONLINE ? CFG.by : "LAZY JO FEAT. ZIRKA · " + (PRACTICE ? "WARM-UP" : CFG.by);
$("title").textContent = ONLINE ? "HOOPS 1v1" : "PEACE INSIDE" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = ONLINE === "live" ? "<b>LIVE:</b> you and a real player, found by quick match - the same song and the same shots at the same time, their score up top. No hearts: play the whole song. The highest score wins."
  : ONLINE === "horse" ? "<b>H-O-R-S-E:</b> you and a real player, found by quick match, taking turns. Make a shot and they have to make the same one - a swish has to be matched with a swish - or it's a letter. Miss your own and they set. Spell HORSE and you're out."
  : "A purple and gold court floating in the white sky from the cover, Zirka's saucer up by the hoop. Hold to wind up, let go in the green - on the beat it's a swish." +
    (ENDLESS ? " <b>Endless:</b> the shots never stop - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "<b>Hold</b> anywhere (or Space) to wind up - the marker runs up and down the bar. <b>Let go</b> while it's in the green: in. <b>On the beat</b> it's a swish, double." +
  (ONLINE ? " Two bars on the shot clock." : " A miss or the shot clock (two bars) costs a heart (3); five in a row give one back. In the hooks it's a money ball, x2.");
if (ONLINE){ $("go").textContent = "Find a match"; $("practice").classList.remove("hid"); $("snd").classList.add("hid"); NET.init(); }
else if (PRACTICE){ $("practice").textContent = "Back to the 1v1"; $("practice").classList.remove("hid"); }
else if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

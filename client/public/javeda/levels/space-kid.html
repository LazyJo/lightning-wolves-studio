<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= SPACE KID =================
   Level 22 of JAVEDA, in the world of the cover: deep space in purple and blue full of stars, the
   rainbow across it, the big gold moon, the dark planets with their rings - the two kids in the long
   red flying car (her with the curls, waving; him in the dark hood and the chain) - and Jo's saucer
   (the red dome with the "L", the white beam). Jo picked three, so the song has three parts:
   PART 1 · PLANET MATCH: swap two planets side by side to line up three of a colour; they burst, new
   ones fall in, chains multiply. Reach each stage's score before the time's up.
   PART 2 · RAINBOW SORT (?part=2): lift the top planet of a glass tube, drop it on the same colour or
   into an empty tube - one colour to a tube. Each mix is solved before you get it.
   PART 3 · STAR PEAKS (?part=3): the solitaire - play a free card one higher or one lower than the
   pile's top card; streaks count more and more. Clear the three peaks for a big bonus.
   Out of time costs a heart (3). On the beat it counts double, in the hooks double again. At the end
   of the song: the cover. ENDLESS for each (?endless=1) once all three are cleared. */

// the song's grid, measured from the mp3 (SONG.md): 62 BPM (a 124 beat in half time), bar 0 at 0.016 s
const GRID = { bpm:62, t0:.016 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(44);                      // the song fades out
const LOOP = [barT(2), barT(44)];             // endless: round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[2, "calm"], [4, "loud"], [10, "hook"], [28, "loud"], [30, "calm"], [32, "loud"], [38, "hook"], [44, "loud"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = { "2":2, "3":3 }[Q.get("part")] || 1;
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Planet Match", "Rainbow Sort", "Star Peaks"], IDS = ["", "lvl22", "lvl22b", "lvl22c"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 22" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 22" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 22" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const shuffle = (a, seed) => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd(seed + i*3.7)*(i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl22.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 130.8, 98];           // a bright loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),       // a planet moves
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: deep space in purple and blue, the rainbow, the big gold moon, the red flying car; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
const SC = { red:0xe8282a, gold:0xffc83a, white:0xfff6f0, ink:0x1a0a2a, violet:0x5a2ab8 };
const RAINBOW = [0xff3a3a, 0xff9a2a, 0xffe03a, 0x4ad84a, 0x3a9aff, 0x8a4aff];
const RB_CSS = ["#ff3a3a", "#ff9a2a", "#ffe03a", "#4ad84a", "#3a9aff", "#8a4aff"];
const glowM = (c, op) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const toon = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.5, metalness:.15, emissive:c, emissiveIntensity:e == null ? .12 : e });
// the sky: purple at the top to deep blue, full of little stars and a few big sparkles
const SKY = canvasTex(512, 512, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#2a0a5a"); g.addColorStop(.5, "#3a1a8a"); g.addColorStop(1, "#140838"); x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++){ x.fillStyle = "rgba(255,255,255," + (.3 + rnd(i*3)*.7) + ")"; const s = rnd(i*7) < .9 ? 1 : 2; x.fillRect(rnd(i)*w, rnd(i*5)*h, s, s); } });
function space(){ const g = new THREE.Group(); scene.add(g);
  g.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.MeshBasicMaterial({ map:SKY, side:THREE.BackSide, fog:false })));
  // the rainbow: six bands in a big arc across the back
  RAINBOW.forEach((c, i) => { const r = new THREE.Mesh(new THREE.TorusGeometry(70 - i*3, 1.5, 8, 64, Math.PI), new THREE.MeshBasicMaterial({ color:c, fog:false, transparent:true, opacity:.85 })); r.position.set(30, -20, -160); r.rotation.z = -.15; g.add(r); });

/* ---------------- PART 1 · PLANET MATCH ---------------- */
// Swap two planets side by side to line up three or more of a colour; they burst, the ones above drop,

const PM = {
  name:"PLANET MATCH", start:0, N:7,

  setup(){ const g = new THREE.Group(); scene.add(g); this.root = g;

    this.pool = []; this.burst = []; for (let i = 0; i < 24; i++){ const s = sprite(0xffffff, 1.4, 0); this.board.add(s); this.burst.push(s); } },
  begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0;
    this.st = { stage:CFG.endless ? 1 : 0, target:0, deadline:0, phase:"idle", phaseT:0, sel:null, chain:0, popped:0, stages:0, kinds:5, last:null, k:CFG.endless ? 500 : 1, base0:0, nextAt:0, got:0 };
    this.fill(t0 + BAR); },
  L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
  info(){ const s = this.st; return fmt0(S.score - s.base0) + " / " + fmt0(s.target) + " · STAGE " + (s.stage + 1); },
  pos(c, r){ return new THREE.Vector3((c - 3)*1.02, (r - 3)*1.02, 0); },
  piece(k, c, r, fromY){ const o = planetPiece(k); o.userData.c = c; o.userData.r = r; o.position.copy(this.pos(c, fromY == null ? r : fromY)); this.board.add(o); this.pool.push(o); return o; },
  fill(t){ const s = this.st, N = this.N; s.kinds = s.stage < 1 ? 5 : 6;
    for (const p of this.pool) this.board.remove(p); this.pool = [];
    this.grid = [...Array(N)].map(() => Array(N).fill(null));
    for (let c = 0; c < N; c++) for (let r = 0; r < N; r++){ let k, n = 0;

  lift(){ const d = this.drag, s = this.st; this.drag = null; if (!d || d.used || !d.o) return;

  update(dt, t){ const s = this.st;

/* ---------------- PART 3 · STAR PEAKS ---------------- */
// Three peaks of cards (the bottom row face up), the deck and the pile. Play a free card one higher or
// one lower than the pile's top card (an ace goes on a king and on a two); the cards it uncovers turn
// over. Stuck? Tap the deck. Streaks count more and more. Clear the three peaks for a big bonus.
const SUITS = [["star", "#ffd84a"], ["moon", "#ffe08a"], ["heart", "#ff5a7a"], ["planet", "#6ab8ff"]];

const FACES = {};
function faceTex(rank, suit){ const k = rank + "-" + suit; if (FACES[k]) return FACES[k];
  return FACES[k] = canvasTex(128, 176, (x, w, h) => { x.fillStyle = "#fff6f0"; x.beginPath(); x.roundRect(4, 4, w - 8, h - 8, 12); x.fill(); x.lineWidth = 5; x.strokeStyle = "#1a0a2a"; x.stroke();
    const [name, col] = SUITS[suit]; x.fillStyle = suit === 2 ? "#e8282a" : "#3a1a8a"; x.font = "bold 44px Bungee, Impact, sans-serif"; x.textAlign = "left"; x.textBaseline = "top"; x.fillText(RANKS[rank], 12, 10);
    x.save(); x.translate(w/2, h/2 + 18); x.fillStyle = col; x.strokeStyle = "#1a0a2a"; x.lineWidth = 4; x.beginPath();
    if (name === "star"){ for (let i = 0; i < 10; i++){ const r = i % 2 ? 14 : 34, a = i/10*Math.PI*2 - Math.PI/2; x.lineTo(Math.cos(a)*r, Math.sin(a)*r); } x.closePath(); }
    else if (name === "moon"){ x.arc(0, 0, 32, .6, Math.PI*2 - .6); x.arc(14, -6, 26, Math.PI*2 - .9, .9, true); x.closePath(); }
    else if (name === "heart"){ x.moveTo(0, 26); x.bezierCurveTo(-46, -4, -26, -40, 0, -16); x.bezierCurveTo(26, -40, 46, -4, 0, 26); }
    else { x.arc(0, 0, 24, 0, 7); }
    x.fill(); x.stroke(); if (name === "planet"){ x.beginPath(); x.ellipse(0, 0, 40, 10, -.3, 0, 7); x.stroke(); } x.restore(); }); }

  x.strokeStyle = "#fff6f0"; x.lineWidth = 3; x.beginPath(); x.roundRect(14, 14, w - 28, h - 28, 8); x.stroke(); x.fillStyle = "#ffc83a"; for (let i = 0; i < 3; i++){ x.beginPath(); x.arc(w/2, 50 + i*38, 9, 0, 7); x.fill(); } });
const SP = {
  name:"STAR PEAKS", start:0,
  get tag(){ return "STAR PEAKS"; }, get hint(){ return "one higher or one lower"; },
  setup(){ const g = new THREE.Group(); scene.add(g); this.root = g; this.car = redCar(); g.add(this.car);
    this.table = new THREE.Group(); g.add(this.table); this.cards = [];
    for (let i = 0; i < 52; i++){ const face = new THREE.MeshBasicMaterial({ map:CARD_BACK }); const m = new THREE.Mesh(new THREE.PlaneGeometry(.92, 1.26), face); m.visible = false; this.table.add(m); this.cards.push({ m, face }); }
    this.stockHit = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.6), new THREE.MeshBasicMaterial({ visible:false })); this.table.add(this.stockHit); },
  begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0;
    this.st = { deals:0, cleared:0, played:0, streak:0, best:0, beatPlays:0, deadline:0, nextAt:0, k:CFG.endless ? 700 : 1, got:0, last:null }; this.deal(t0 + BAR); },
  L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
  info(){ return "STREAK " + this.st.streak + " · DECK " + this.stock.length; },
  layout(){ const L = [], sy = .62;
    for (let p = 0; p < 3; p++) L[p] = { x:3*p - 3, y:3*sy + .6, row:0, cov:[3 + 2*p, 4 + 2*p] };

    this.stockPos = new THREE.Vector3(-1.2, -1.3, 0); this.wastePos = new THREE.Vector3(.4, -1.3, 0); this.stockHit.position.copy(this.stockPos).setZ(.3);

    this.stock.forEach((x, j) => { x.c.target = this.stockPos.clone().add(new THREE.Vector3(-j*.01, 0, j*.002)); x.c.m.position.copy(x.c.target); x.c.face.map = CARD_BACK; x.c.face.needsUpdate = true; });

    c.gone = true; this.toWaste(c); s.streak++; s.best = Math.max(s.best, s.streak); s.played++; s.got++; const beat = onBeat(S.t); if (beat) s.beatPlays++;

/* ---------------- the run ---------------- */
let ME = null;
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = [null, PM, RS, SP][PART]; camInit = false; G.root.visible = true; END.root.visible = false; END.on = false; ME.visible = true;
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the red flying car coming at you out of the stars, the two of them in the glass bubble (her
   waving), the jets blazing, the rainbow behind and the big gold moon - and Jo's saucer down in front
   with its white beam, small, like on the cover. */
const END = { out:8.5, root:null, X:0 };          // the game's own things are hidden by then: the cover is right here in the same space
function buildEnd(){
  const g = new THREE.Group(); g.visible = false; g.position.x = END.X; scene.add(g);
  const car = redCar(); car.scale.setScalar(1.15); g.add(car); END.car = car;
  const streak = []; for (let i = 0; i < 14; i++){ const s = sprite(i % 2 ? 0xffb05a : 0xff5a3a, 2 + rnd(i)*2, .6); g.add(s); streak.push(s); } END.streak = streak;
  END.root = g;
}
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  animSaucer(ME, t, beat);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#ffe0f4"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(dt, t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = false; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the car swoops in from the stars, nose first, a little to the left like on the cover; the saucer below
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      END.car.position.set((portrait ? .3 : -1.2) + (1 - e)*10, -.2 + (1 - e)*7 + Math.sin(t*1.6)*.12, -5 - (1 - e)*40); END.car.rotation.set(.25, 2.5, .2); animCar(END.car, t);
      END.streak.forEach((s, i) => { const k = i/END.streak.length; s.position.set(END.car.position.x + 1.6 + k*5, END.car.position.y + .3 + k*1.4, END.car.position.z - 2 - k*6); s.material.opacity = .5*(1 - k)*e; });
      ME.visible = true; ME.scale.setScalar(.5); ME.rotation.set(.15, Math.sin(t*1.5)*.25, 0); ME.userData.beam.visible = true; ME.userData.beam.scale.set(.5, .6, .5); ME.userData.beam.position.y = -1.1;
      ME.position.set(END.X, (portrait ? -2.6 : -2.2) + (1 - e)*-3 + Math.sin(t*2)*.05, 1.5);
      CAMP.set(END.X, portrait ? .6 : .4, portrait ? 15 : 9.5); CAML.set(END.X - .3, portrait ? .4 : .5, -3);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("SPACE KID", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(dt, t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.1 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by):not(#net)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const st = G.st, got = PART === 1 ? st.popped : PART === 2 ? st.solved : st.played;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = PART === 1 ? st.stages + " stages · " + st.popped + " planets burst" : PART === 2 ? st.solved + " rainbows sorted in " + st.moves + " moves" : st.played + " cards played · " + st.cleared + " peaks cleared · the longest streak " + st.best;
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> in space &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "SPACE KID";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = (PART === 3 ? "Out of this world." + "<br>Level 22 cleared: <b>Planet Match &#8734;</b>, <b>Rainbow Sort &#8734;</b> and <b>Star Peaks &#8734;</b> are open in the gold Endless list." : PART === 2 ? "Every colour in its place." + "<br>Part 3, <b>Star Peaks</b>, is open." : "Planets everywhere." + "<br>Part 2, <b>Rainbow Sort</b>, is open.");
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a0a3a); scene.fog = new THREE.Fog(0x2a1060, 60, 400);
  cam = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 1500);
  scene.add(new THREE.HemisphereLight(0xfff0ff, 0x3a2a8a, .9));
  const key = new THREE.DirectionalLight(0xfff0e0, .9); key.position.set(10, 20, 14); scene.add(key);
  ME = buildSaucer(); scene.add(ME);
  space(); G = [null, PM, RS, SP][PART]; G.setup(); buildEnd();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input ---------------- */
// Planet Match: drag a planet onto the next, or tap one then the other. Rainbow Sort and Star Peaks: tap.
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
let held = false;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); held = true; G.press(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (held && G.move && live()) G.move(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { if (!held) return; held = false; if (G.lift) G.lift(); });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? (PART === 2 ? "the cards never stop" : "the beds never stop") : G.hint, 3, CFG.endless ? "g" : "");
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "SPACE KID" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "Deep space from the cover - the rainbow across it, the big gold moon, the two kids in the red flying car - and Jo's saucer." +
  [" <b>Part 1 · Planet Match:</b> little planets in the rainbow's colours.", " <b>Part 2 · Rainbow Sort:</b> glass tubes, the planets mixed up in them.", " <b>Part 3 · Star Peaks:</b> three peaks of cards in front of the rainbow."][PART - 1] +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = [
  "<b>Drag</b> a planet onto the one next to it (or tap one, then the other) to swap them - three or more of a colour in a line burst, new ones fall in, chains multiply. Reach the stage's score before the time's up. Swapped <b>on the beat</b> it counts double; double again in the hooks. Out of time costs a heart (3).",
  "<b>Tap</b> a tube to lift its top planet, <b>tap</b> another to drop it - on the same colour or into an empty tube, four to a tube. One colour in every tube and the rainbow lights up; the next mix has another colour. Moves <b>on the beat</b> count double. Out of time costs a heart (3).",
  "<b>Tap</b> a free card one higher or one lower than the pile's top card (an ace goes on a king and a two) - the cards it uncovers turn over. Stuck? <b>Tap the deck.</b> Streaks count more and more; <b>on the beat</b> double. Clear the three peaks for a big bonus. Out of time costs a heart (3)."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>

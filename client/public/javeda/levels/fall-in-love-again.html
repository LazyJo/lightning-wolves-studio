<style>

<script>
/* ================= FALL IN LOVE AGAIN =================
   Level 23 of JAVEDA, in the world of the cover: the bright blue sky with the pink and white clouds, the
   open book floating on them with the lavender smoke heart on its page - and Jo's saucer as it is on this
   cover (the dark hull, the lavender dome with the "L", the lavender beam). Jo picked three, so the song
   has three parts:
   PART 1 · HEART POP: the bubble shooter. Hearts in five colours hang from the top of the page; the saucer
   shoots one at a time. Three or more of a colour touching burst, what hangs from nothing falls. Every 2
   bars they come down a row; reaching the line costs a heart.
   PART 2 · LOVE WORDS (?part=2): the word search. Drag from a word's first letter to its last - across,
   down or on the slant, either way round. Every word found and the page turns. Out of time costs a heart.
   PART 3 · HEART MERGE (?part=3): 2048 with hearts. Swipe, two the same become one. Stop for a bar and
   hearts drop in, one a beat; full with no move left costs a heart.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once all three are cleared. */

// the song's grid, measured from the mp3 (SONG.md): 71.5 BPM (a 143 beat in half time), bar 0 at 0.018 s
const GRID = { bpm:71.5, t0:.018 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(60);                      // the outro ends (3:21)
const LOOP = [barT(8), barT(56)];             // endless: the last hook runs back into the first
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [16, "hook"], [24, "loud"], [28, "calm"], [36, "hook"], [40, "calm"], [44, "loud"], [48, "calm"], [56, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = { "2":2, "3":3 }[Q.get("part")] || 1;
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Heart Pop", "Love Words", "Heart Merge"], IDS = ["", "lvl23", "lvl23b", "lvl23c"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 23" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 23" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 23" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl23.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [130.8, 98, 110, 87.3];           // a soft, dreamy loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: the pastel sky, the pink and white clouds, the open book floating on them with the lavender smoke heart; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
const SC = { lav:0xb88aff, pink:0xffb8d8, sky:0x7ac8f0, white:0xfffaf6, ink:0x2a2440, page:0xf6f2ee };
const HEART_COLS = [0xff4a8a, 0x8a5aff, 0x3ab8ff, 0xffc83a, 0x3ad88a, 0xff8a3a];
const HC_CSS = ["#ff6a9a", "#b88aff", "#6ac8ff", "#ffc84a", "#6ae8a8", "#ff9a5a"];
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const PUFF = radial([[0, "rgba(255,255,255,.95)"], [.45, "rgba(255,255,255,.7)"], [1, "rgba(255,255,255,0)"]], 128);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const puff = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:PUFF, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const soft = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.8, metalness:0, emissive:c, emissiveIntensity:e == null ? .2 : e });
// the sky: bright blue at the top, soft pink low down
const SKY = canvasTex(16, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#3aa8e8"); g.addColorStop(.45, "#8ad0f4"); g.addColorStop(.75, "#f4c8dc"); g.addColorStop(1, "#f8d8e4"); x.fillStyle = g; x.fillRect(0, 0, w, h); });
// a cloud: a bunch of soft puffs, white with pink in the shadows
function cloud(n, w, seed){ const g = new THREE.Group();
  for (let i = 0; i < n; i++){ const pink = rnd(seed + i*3) < .45, s = puff(pink ? 0xffc8dc : 0xfffaf6, (.5 + rnd(seed + i*5)*.6)*w*.6, .95);

  cols(r){ return (r + S.par) % 2 ? this.COLS - 1 : this.COLS; },

/* =============== 3. HEART MERGE: 2048 with hearts =============== */
// Hearts on a 4x4 page, each with a number. Swipe (or the arrows) and they all slide that way; two the
// same that meet become one, twice as big. The song keeps you going: stop for a bar and hearts drop
// in, one a beat. The page full with no move left costs a heart. Merged on the
// beat it counts double.
const MERGE_COLS = { 2:0xffd8e8, 4:0xffb8d8, 8:0xff8ab8, 16:0xff6a9a, 32:0xd88aff, 64:0xb88aff, 128:0x8a8aff, 256:0x6ac8ff, 512:0x6ae8c8, 1024:0xffc84a, 2048:0xff9a3a };

const numTex = v => NUM_TEX[v] || (NUM_TEX[v] = canvasTex(128, 128, (x, w, h) => { x.fillStyle = "#2a2440"; x.font = "bold " + (v < 100 ? 64 : v < 1000 ? 48 : 38) + "px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(v, 64, 70); }));
const MERGE = {
  N:4, CELL:1.5,
  setup(){ boot(46, 60, 420); this.w = setting(6.8, 6.8, .2); this.root = new THREE.Group(); scene.add(this.root);
    for (let i = 0; i < 16; i++){ const s = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 1.36), new THREE.MeshBasicMaterial({ color:0xe8e0f0 })); s.position.copy(this.at(i % 4, Math.floor(i/4))).setZ(-.05); this.root.add(s); }
    this.tiles = []; ME = buildSaucer(); ME.scale.setScalar(.45); scene.add(ME); },
  reset(){ Object.assign(S, { moves:0, merges:0, best:0, boards:0, k:1, lastMoveBar:-1, lastDropBar:-1, last:null }); lastT = 0; this.fresh(); say("HEART MERGE", "swipe - two the same become one", 2.4); },
  info(){ return "BEST " + S.best + " · MOVES " + S.moves; }, warn(){ return this.tiles.length >= 13; },
  at(x, y){ return new THREE.Vector3((x - 1.5)*this.CELL, (1.5 - y)*this.CELL + .2, 0); },
  fresh(){ for (const t of this.tiles) this.root.remove(t.g); this.tiles = []; this.spawn(); this.spawn(); },
  tile(v, x, y){ const g = new THREE.Group(); const h = heartMesh(0, 1.15); h.material.color.setHex(MERGE_COLS[v] || 0xff6a3a); h.material.emissive.setHex(MERGE_COLS[v] || 0xff6a3a); g.add(h);
    const n = new THREE.Mesh(new THREE.PlaneGeometry(.9, .9), new THREE.MeshBasicMaterial({ map:numTex(v), transparent:true })); n.position.z = .2; g.add(n);
    g.position.copy(this.at(x, y)); g.scale.setScalar(.2); this.root.add(g); const t = { v, x, y, g, h, n }; this.tiles.push(t); return t; },
  spawn(){ const free = []; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (!this.tiles.some(t => t.x === x && t.y === y)) free.push([x, y]);

  // slide everything one way; returns how much merged (or -1 if nothing moved)
  slide(dx, dy, dry){ const grid = [...Array(16)].fill(null); for (const t of this.tiles) grid[t.y*4 + t.x] = t;
    let moved = false, gained = 0; const kill = [], order = [0, 1, 2, 3]; if (dx > 0 || dy > 0) order.reverse();
    const done = new Set(), plan = [];
    for (const a of order) for (const b of order){ const x = dx ? a : b, y = dx ? b : a, t = grid[y*4 + x]; if (!t) continue;
      let nx = x, ny = y; while (true){ const tx = nx + dx, ty = ny + dy; if (tx < 0 || ty < 0 || tx > 3 || ty > 3) break; const o = grid[ty*4 + tx];
        if (!o){ nx = tx; ny = ty; continue; } if (o.v === t.v && !done.has(o)){ nx = tx; ny = ty; } break; }

      if (o){ done.add(o); gained += o.v*2; plan.push([t, nx, ny, o]); } else { grid[ny*4 + nx] = t; plan.push([t, nx, ny, null]); } }

    for (const t of this.tiles) if (t.pop){ t.h.material.color.setHex(MERGE_COLS[t.v] || 0xff6a3a); t.h.material.emissive.setHex(MERGE_COLS[t.v] || 0xff6a3a); t.n.material.map = numTex(t.v); t.n.material.needsUpdate = true; }

  move(dx, dy){ if (S.done) return; const g = this.slide(dx, dy); if (g < 0) return;
    S.moves++; S.lastMoveT = S.t; S.saidDrop = false; sfx.jump(); const beat = onBeat(S.t);
    if (g){ const n = g*4*(beat ? 2 : 1)*(hookAt(S.t) ? 2 : 1); S.score += n; S.merges++; S.got++; sfx.good(Math.log2(g)); }
    S.best = Math.max(S.best, ...this.tiles.map(t => t.v)); if (S.best >= 256 && !S.said256){ S.said256 = true; say("256!", "keep going", .8); }

  check(){ if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => this.slide(dx, dy, true) >= 0)) return;

  point(cx, cy){ if (!down) return; if (!this.sw) this.sw = { x:cx, y:cy }; this.sw.ex = cx; this.sw.ey = cy; },
  release(){ const s = this.sw; this.sw = null; if (!s || s.ex == null) return; const dx = s.ex - s.x, dy = s.ey - s.y; if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

  update(dt, t){

  },

    driftClouds(this.w.sky, dt); heartBeat(this.w.heart, t, beat);
    if (portrait){ cam.position.set(0, .4, 18.5); cam.lookAt(0, .4, 0); } else { cam.position.set(0, .4, 10); cam.lookAt(0, .3, 0); }

// the arrows (or W A S D) slide straight away, however quick the tap
addEventListener("keydown", e => { if (G !== MERGE || !live() || e.repeat) return; const d = { ArrowLeft:[-1, 0], a:[-1, 0], ArrowRight:[1, 0], d:[1, 0], ArrowUp:[0, -1], w:[0, -1], ArrowDown:[0, 1], s:[0, 1] }[e.key]; if (d) MERGE.move(d[0], d[1]); });

/* ---------------- the games on the song's clock ----------------
   The three games are the ones from prototypes.html, unchanged at heart; this gives each what the level
   asks of it: a name, the line under GET READY, how hard it is right now (L, 0 → 1 over the song; endless
   keeps climbing), and begin() for the song or an endless window. */
const LV = () => G && G.L ? G.L(S.t) : 0;
function asPart(E, name, tag, hint){
  return Object.assign(E, { name, tag, hint, start:0,
    begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0; this.reset(); },
    L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
    get st(){ return S; } });
}
asPart(POP, "HEART POP", "HEART POP", "aim, let go - three of a colour burst");
asPart(WORDS_SEARCH, "LOVE WORDS", "LOVE WORDS", "drag across a word, first letter to last");
asPart(MERGE, "HEART MERGE", "HEART MERGE", "swipe - two the same become one");
const PARTS = [null, POP, WORDS_SEARCH, MERGE];

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, got:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PARTS[PART]; camInit = false; G.root.visible = true; showSetting(true); END.root.visible = false; END.on = false; ME.visible = true; ME.scale.setScalar(G.meScale);
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
  $("msg").className = "";
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the open book standing on the clouds, its pages up, the lavender smoke heart on them - and
   Jo's saucer down in front with its lavender beam, small, like on the cover. */
const END = { out:8.5, root:null };
POP.meScale = .42; WORDS_SEARCH.meScale = .4; MERGE.meScale = .45;
function showSetting(on){ for (const k of ["book", "heart", "page"]) G.w[k].visible = on; }
function buildEnd(){
  const g = new THREE.Group(); g.visible = false; g.position.set(0, 0, -4); scene.add(g);
  const b = book(); b.position.set(0, -3.4, 0); b.rotation.x = .1; g.add(b); END.book = b;
  // up close the pages need their shading, like on the cover: soft grey-white paper, the dark back cover
  const paper = new THREE.MeshStandardMaterial({ map:PAGE, color:0xe4e0ea, roughness:.95, emissive:0xffffff, emissiveIntensity:.06, side:THREE.DoubleSide });
  b.traverse(m => { if (!m.isMesh) return; if (m.geometry.type === "PlaneGeometry") m.material = paper; else m.material = new THREE.MeshStandardMaterial({ color:m.material.color.getHex() > 0xe0e0e0 ? 0xdcd8e2 : 0x5a5868, roughness:.9 }); });
  const sh = smokeHeart(3.4); sh.position.set(.5, -.3, -2.2); g.add(sh); END.heart = sh;
  // the clouds the book floats on, pink and white, and a few in front
  const cl = []; for (let i = 0; i < 9; i++){ const c = cloud(8, 5 + rnd(i*5)*4, 900 + i*13); c.position.set((i - 4)*2.6 + (rnd(i*3) - .5), -3.4 - rnd(i*7)*.8, -1 + rnd(i*11)*4.5); g.add(c); cl.push(c); }
  END.clouds = cl; END.root = g;
}
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#fff0f8"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; showSetting(false); END.root.visible = true; camInit = false; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the smoke heart gathers on the page; the saucer floats up from below
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      END.heart.scale.setScalar(.4 + .6*e); END.heart.userData.pts.forEach((p, i) => { p.material.opacity = .75*e; p.position.y += Math.sin(t*1.3 + i)*.0015; });
      END.clouds.forEach((c, i) => { c.position.x += Math.sin(t*.3 + i)*.002; });
      driftClouds(G.w.sky, dt);
      ME.visible = true; ME.scale.setScalar(.55); ME.rotation.set(.12, Math.sin(t*1.5)*.25, 0); animSaucer(ME, t, beat); ME.userData.beam.visible = true; ME.userData.beam.scale.set(.5, .6, .5); ME.userData.beam.position.y = -1.1;
      ME.position.set(0, (portrait ? -4.6 : -3.9) - (1 - e)*3 + Math.sin(t*2)*.05, -.5);
      CAMP.set(0, portrait ? .4 : .8, portrait ? 16 : 10); CAML.set(0, portrait ? -1.2 : -.6, -4);
      const k = camInit ? Math.min(1, dt*1.1) : 1; camInit = true;
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("FALL IN LOVE AGAIN", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const got = PART === 1 ? S.popped : PART === 2 ? S.got : S.merges;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = PART === 1 ? S.popped + " hearts popped · " + S.boards + " pages cleared" : PART === 2 ? S.got + " words found · " + S.pages + " pages turned" : S.merges + " merges · up to " + S.best;
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> in the clouds &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "FALL IN LOVE AGAIN";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = (PART === 3 ? "Juice was right." + "<br>Level 23 cleared: <b>Heart Pop &#8734;</b>, <b>Love Words &#8734;</b> and <b>Heart Merge &#8734;</b> are open in the gold Endless list." : PART === 2 ? "Every word on the page." + "<br>Part 3, <b>Heart Merge</b>, is open." : "Hearts everywhere." + "<br>Part 2, <b>Love Words</b>, is open.");
}

/* ---------------- input ---------------- */
// Heart Pop: drag to aim, let go to shoot (or the arrows and Space). Love Words: drag across a word.
// Heart Merge: swipe (or the arrows).
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); down = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return; if (down || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { const was = down; down = false; if (was && live() && G.release) G.release(); });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down" };
addEventListener("keydown", e => { if (veilUp()) return; if (e.key === " "){ e.preventDefault(); if (!e.repeat && live() && G.press) G.press(); return; } const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? ["", "the hearts never stop", "the pages never stop", "the hearts never stop"][PART] : G.hint, 3, CFG.endless ? "g" : "");
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "FALL IN LOVE AGAIN" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The sky from the cover - pink and white clouds, the open book floating on them with the lavender smoke heart - and Jo's saucer." +
  [" <b>Part 1 · Heart Pop:</b> hearts in five colours hanging from the top of the page.", " <b>Part 2 · Love Words:</b> a page of letters in the book.", " <b>Part 3 · Heart Merge:</b> hearts with numbers on a 4x4 page."][PART - 1] +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = [
  "<b>Drag</b> to aim (or the arrows), <b>let go</b> to shoot (or Space). Three or more of a colour touching burst, and whatever's left hanging from nothing falls. Every 2 bars they all come down a row - reaching the line costs a heart (3). Clear the page for a big bonus. Shot <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Drag</b> from a word's first letter to its last - across, down or on the slant, either way round. Find every word on the list and the page turns. Out of time costs a heart (3). Found <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Swipe</b> (or the arrows): every heart slides that way, and two the same that meet become one, twice the number. Keep moving - stop for a bar and hearts drop in, one a beat. Full with no move left costs a heart (3). Merged <b>on the beat</b> it counts double; double again in the hooks."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
PARTS[PART].setup(); buildEnd();
reset();
requestAnimationFrame(frame);
</script>

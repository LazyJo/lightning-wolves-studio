<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= YOU READY? =================
   Level 13 of JAVEDA, in the room from the cover: the purple walls, the deep blue
   curtains with their big light-blue dots, the teal armchair, the zebra bed, the
   plant, the sunset poster - and Jo's saucer (silver, the orange dome with the "L").
   Jo picked LIGHT TRAILS: seen from above, the saucer never stops and draws a trail
   of light on the big rug in the middle of the room. Grab the light-blue dots to
   make it longer; cross your own trail, get hit by a pillow or go off the rug and it
   costs a heart (3). Gold rings on the beat; the hooks bring more dots and more
   pillows. At the end of the song the camera comes down to the room as it is on the
   cover, your trail still glowing on the rug.
   Once it's cleared, ENDLESS opens (?endless=1): the same room with no end, in
   8-bar windows, faster each window, a heart back every 24 bars. */

// the song's measured grid (SONG.md): 68.5 BPM (137 double-time), bars from 0.004 s
const GRID = { bpm:68.5, t0:.004 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(36);                      // the trail ends with hook 2; the outro is the ending
const LOOP = [barT(8), barT(36)];             // endless: hook 1 to the end of hook 2, round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (the intro, the break with no kick, the outro), loud (the verse), hook
const SECTIONS = [[8, "calm"], [16, "hook"], [20, "calm"], [28, "loud"], [36, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ENDLESS = Q.get("endless") === "1";
const CFG = ENDLESS ? { id:"lvl13x", title:"Light Trails", by:"LEVEL 13 · ENDLESS", endless:true, board:"Level 13 ∞" }
  : { id:"lvl13", title:"Light Trails", by:"LEVEL 13" };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl13.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 98, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  horn: () => ac && hiss(ac.currentTime, .5, .06, 0, 1400),         // a pillow flies
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the room from the cover ---------------- */
let scene, cam, ren, clockR, ME, crashed = null;
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
// from the cover: the curtains (deep blue, big light-blue dots), the zebra bed, the sunset poster, the floor
const DOTS = (rep) => canvasTex(256, 256, (x, w, h) => { x.fillStyle = "#2a3ad8"; x.fillRect(0, 0, w, h); x.fillStyle = "#5ad0ff";
  for (const [cx, cy] of [[64, 64], [192, 64], [0, 192], [128, 192], [256, 192]]){ x.beginPath(); x.ellipse(cx, cy, 34, 42, 0, 0, Math.PI*2); x.fill(); } }, rep);
const ZEBRA = (rep) => canvasTex(512, 512, (x, w, h) => { x.fillStyle = "#f0eef6"; x.fillRect(0, 0, w, h); x.fillStyle = "#24222e";
  for (let i = 0; i < 9; i++){ x.beginPath(); const y = i*58 + 10; x.moveTo(0, y); for (let k = 0; k <= 16; k++) x.lineTo(k*32, y + Math.sin(k*.8 + i)*14 + (k % 3)*3);
    for (let k = 16; k >= 0; k--) x.lineTo(k*32, y + 22 + Math.sin(k*.8 + i + .6)*12 - (k % 2)*4); x.closePath(); x.fill(); } }, rep);
const POSTER = () => canvasTex(256, 320, (x, w, h) => { x.fillStyle = "#ff8a2a"; x.fillRect(0, 0, w, h); const g = x.createLinearGradient(0, 20, 0, 220); g.addColorStop(0, "#ffb347"); g.addColorStop(1, "#ff5a8a");
  x.fillStyle = g; x.fillRect(16, 16, w - 32, 210); x.fillStyle = "#ffe03a"; x.beginPath(); x.arc(128, 110, 54, 0, Math.PI*2); x.fill();
  x.fillStyle = "#2a8ae0"; x.fillRect(16, 200, w - 32, 104); x.fillStyle = "#ffffff88"; for (let i = 0; i < 5; i++) x.fillRect(40 + i*36, 230 + (i % 2)*20, 22, 3);
  x.strokeStyle = "#1a5a3a"; x.lineWidth = 6; for (const px of [50, 206]){ x.beginPath(); x.moveTo(px, 205); x.lineTo(px + 4, 140); x.stroke(); x.fillStyle = "#1a7a3a"; for (let k = 0; k < 5; k++){ x.beginPath(); x.ellipse(px + 4 + Math.cos(k*1.3)*18, 136 + Math.sin(k*1.3)*8, 22, 6, k*1.3, 0, Math.PI*2); x.fill(); } } });
const FLOORT = (rep) => canvasTex(256, 256, (x, w, h) => { for (let i = 0; i < 8; i++){ x.fillStyle = i % 2 ? "#9a3a7a" : "#8a3070"; x.fillRect(0, i*32, w, 32); x.fillStyle = "#5a1a4a"; x.fillRect(0, i*32, w, 2); x.fillRect(rnd(i*7)*w, i*32, 2, 32); } }, rep);
// the rug the trail is drawn on: deep purple, a pink and gold border
const RUG = canvasTex(256, 176, (x, w, h) => { x.fillStyle = "#ff5ab4"; x.fillRect(0, 0, w, h); x.fillStyle = "#ffd23a"; x.fillRect(5, 5, w - 10, h - 10); x.fillStyle = "#170630"; x.fillRect(8, 8, w - 16, h - 16);
  x.strokeStyle = "#2c1050"; x.lineWidth = 2; for (let i = 0; i < 2; i++) x.strokeRect(20 + i*6, 20 + i*6, w - 40 - i*12, h - 40 - i*12); });
const rbox = (w, h, d, color) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness:.7, emissive:color, emissiveIntensity:.12 }));
const PCOL = [0xff5ab4, 0x8a3ae0, 0x2ab8a8, 0xffd23a];
// Jo's saucer from the cover: a silver hull, the orange dome with the "L", white rim lights, the beam
const BADGE = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = 128; const x = cv.getContext("2d");
  x.fillStyle = "#fff4e6"; x.beginPath(); x.arc(64, 64, 58, 0, Math.PI*2); x.fill(); x.fillStyle = "#ff7a1a"; x.beginPath(); x.arc(64, 64, 50, 0, Math.PI*2); x.fill();
  x.fillStyle = "#1a0a02"; x.font = "bold 76px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("L", 66, 70); return new THREE.CanvasTexture(cv); })();
function buildSaucer(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 14), new THREE.MeshStandardMaterial({ color:0xd8dce8, roughness:.25, metalness:.7, emissive:0x2a2a3a, emissiveIntensity:.6 }));
  hull.scale.set(1.3, .28, 1.3); g.add(hull);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.25, .07, 8, 44), new THREE.MeshStandardMaterial({ color:0x5a5a6a, metalness:.8, roughness:.3 })); rim.rotation.x = Math.PI/2; g.add(rim);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.58, 24, 10, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color:0xff8a2a, roughness:.25, metalness:.3, emissive:0x8a3a00, emissiveIntensity:.6 }));
  dome.position.y = .14; g.add(dome);
  const badge = new THREE.Mesh(new THREE.CircleGeometry(.3, 24), new THREE.MeshBasicMaterial({ map:BADGE, transparent:true })); badge.rotation.x = -Math.PI/2; badge.position.y = .73; g.add(badge);
  const lights = new THREE.Group(); g.add(lights);
  for (let i = 0; i < 14; i++){ const a = i/14*Math.PI*2, l = new THREE.Mesh(new THREE.SphereGeometry(.075, 6, 5), new THREE.MeshBasicMaterial({ color:0xfff4e0 })); l.position.set(Math.sin(a)*1.27, 0, Math.cos(a)*1.27); lights.add(l); }

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = TRAIL; camInit = false; ME.userData.beam.visible = false; ME.scale.setScalar(.85);
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little harder every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
function songT(){
  if (CFG.endless && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The camera comes down from above to the room as it is on the cover: the curtains
   on the left, the armchair, the plant, the poster, the zebra bed - your light trail
   still glowing on the rug, and the saucer up in the corner with its beam on. */
const END = { out:8 };
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
  for (const b of TRAIL.boats){ b.on = false; b.g.visible = false; b.tr.forEach(s => s.visible = false); } TRAIL.edges.forEach(e => { e.material.opacity = 0; });
  for (const o of TRAIL.orbs){ o.on = false; o.s.visible = false; } for (const r of TRAIL.rings){ r.on = false; r.r.visible = false; }
  TRAIL.heart.on = false; TRAIL.heart.g.visible = false;
  S.from = { x:TRAIL.st.x, z:TRAIL.st.z };
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  ME.userData.lights.rotation.y = t*2.5; ME.userData.beam.material.opacity = .18 + (beat ? .14 : 0); ME.userData.under.material.opacity = .55 + (beat ? .3 : 0);
  if (S.end >= 0){
    // the cover: the room from the front; the saucer rises up into the corner over your trail, beam on
    const u = clamp(S.end/3.5, 0, 1), s = u*u*(3 - 2*u), portrait = cam.aspect < .8;
    TRAIL.drawTrail(1);
    ME.visible = true; ME.scale.setScalar(.85 + s*.9); ME.userData.beam.visible = true; ME.userData.beam.scale.set(1, 1 + s*.6, 1);
    ME.position.set(S.from.x + (13 - S.from.x)*s, 1.2 + s*9, S.from.z + (-6 - S.from.z)*s); ME.rotation.set(.08*s, t*1.2, 0);
    CAMP.set(0, portrait ? 16 : 11, portrait ? 58 : 34); CAML.set(0, portrait ? 7 : 6, -8);
    if (S.end > 1.6 && !S.saidEnd){ S.saidEnd = true; say("YOU READY?", "LAZY JO", 4.5, "t"); }
    if (S.end > END.out - 1.2){ $("flash").style.background = "#1e0a3a"; $("flash").style.opacity = Math.min(1, (S.end - (END.out - 1.2))/1.2); }
  } else {
    G.render(dt, t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.1 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:Math.round(TRAIL.st.metres) });
  const st = TRAIL.st, stat = fmt(st.metres) + " m of light · " + st.got + " dots · " + st.rings + " rings";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the rug &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "YOU READY?";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = "You drew light all over the room." + "<br>Level 13 cleared: <b>Light Trails &#8734;</b> is open in the gold Endless list.";
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a0a4a); scene.fog = new THREE.Fog(0x2a0a4a, 90, 420);
  cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 2000);
  scene.add(new THREE.HemisphereLight(0xd0a8ff, 0x2a1030, .8));
  const key = new THREE.DirectionalLight(0xffe0f0, .6); key.position.set(-20, 60, 30); scene.add(key);
  ME = buildSaucer(); scene.add(ME);
  TRAIL.setup();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
let held = false;
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); held = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return; if (held || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
addEventListener("pointerup", () => { held = false; }); addEventListener("pointercancel", () => { held = false; });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k && !veilUp()){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

$("go").addEventListener("click", () => {
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : "LIGHT TRAILS", CFG.endless ? "the room with no end" : G.hint, 3, CFG.endless ? "g" : "");
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "YOU READY?" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The room from the cover, from above. Jo's saucer never stops - it draws a trail of light on the rug wherever it goes. Make it the longest light in the room." +
  (ENDLESS ? " <b>Endless:</b> it never ends - faster every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "<b>Drag</b> (or the arrow keys) to steer. Grab the light-blue dots to make your trail longer. Your own trail, the pillows and the edge of the rug cost a heart (3). A gold ring on the beat is double.";
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>

<script>
/* ================= OUBLIE-MOI =================
   Level 9 of JAVEDA - Lazy Jo x Zirka. District 9 at night: neon towers,
   rain, and the monsters of forgetting over the city. The original JAVEDA
   game was this song as a flat side-scroller; this is it rebuilt in 3D,
   on the song's own grid, in four parts:

     Part 1 NIGHT FLIGHT  Jo's blue saucer between the towers. Drag to fly; shoot
                          with space or a tap - on the song's sixteenths. Crawlers,
                          swarms, watchers that shoot, brutes that take a beating.
     Part 2 ROOFTOP RUN   Zirka's bike over the roofs. Swipe for a lane, tap to
                          jump the gaps (they open on the 1 of a bar). Zirka's gun
                          finds the monsters diving at her.
     Part 3 THE KING      The King of Forgetting over District 9. His orbs fall
                          in patterns with the song - every one marked where it
                          will land. His core opens in the hooks. Gadgets float up
                          for Jo (triple, rapid fire, a heart); the wolf token gives
                          Zirka 8 bars on the roof below. Bring him down in time.
     Part 4 JUMP RIDE     the original JAVEDA idea: Zirka's bike over the roofs, side
                          on. Jump (hold for higher), ride ahead or drop back; Zirka's
                          gun aims itself. The Wolf Rush crystal doubles its fire.

   Then the gold ENDLESS list (?endless=1 with a part, ?remix=1): each part
   with no end, and the remix - all four in turn, 8 bars each.

   The song (SONG.md) is 90 BPM, a trap beat: a quiet intro, three loud 8-bar
   hooks (bars 8, 28, 48), verses that go no-kick / loud in 4-bar blocks, a
   quiet break (44-47) and the outro. Every game reads section(t): calm, mid,
   loud or hook. Parts end at bar 56 and the ending plays over the outro.
   Endless and the remix loop bars 8-56 - whole bars, so the beat never slips. */

const GRID = { bpm:90, t0:0 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(56);                      // 2:29.3 - Parts 1-3 end here, the outro is the ending
const LOOP = [barT(8), barT(56)];             // endless: the bars of the song it plays round and round
const STINT = BAR * 8;                        // endless: one window; remix: each game's turn
const HEARTS = 5;
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
const barOf = t => Math.floor((songPos(t) - GRID.t0) / BAR);
function section(t){
  const b = barOf(t);
  if (b < 8 || b >= 56 || (b >= 44 && b < 48)) return "calm";
  if ((b >= 8 && b < 16) || (b >= 28 && b < 36) || (b >= 48 && b < 56)) return "hook";
  if ((b >= 20 && b < 24) || (b >= 40 && b < 44)) return "loud";
  return "mid";
}

const Q = new URLSearchParams(location.search);
const REMIX = Q.get("remix") === "1", ENDLESS = REMIX || Q.get("endless") === "1";
const PART = REMIX ? 0 : Math.min(4, Math.max(1, +Q.get("part") || 1));
const BASE = {
  1: { id:"lvl9",  title:"Night Flight", by:"LEVEL 9",        game:"sky" },
  2: { id:"lvl9b", title:"Rooftop Run",  by:"LEVEL 9 PART 2", game:"roof" },
  3: { id:"lvl9c", title:"The King",     by:"LEVEL 9 PART 3", game:"king" },
  4: { id:"lvl9d", title:"Jump Ride",    by:"LEVEL 9 PART 4", game:"ride" }
}[PART || 1];
// endless: the part's id + "x"; the remix of all four: lvl9r
const CFG = REMIX ? { id:"lvl9r", title:"Remix", by:"LEVEL 9 REMIX", game:"mix", endless:true, remix:true, board:"Level 9 Remix" }
  : ENDLESS ? { ...BASE, id:BASE.id + "x", by:BASE.by + " · ENDLESS", endless:true, board:"Level 9" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : BASE;
const ORDER = ["sky", "roof", "king", "ride"];

const LINKS = {
  next:    "https://lightningwolves.studio/javeda/",
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && Q.has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB){
  document.getElementById("next").addEventListener("click", e => { e.preventDefault(); toHub({ type:"javeda:next", level:CFG.id }); });
  document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
}
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const song = new Audio("lvl9.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 98, 87.3, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .005); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
// the stand-in: a trap beat on the song's grid - kick on 1 and the and of 3, claps on 2 and 4, triplet hats
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s12 = i % 12, bar = Math.floor(i / 12), sec = section(bar*BAR + .01), full = sec !== "calm";
    if (full && (s12 === 0 || s12 === 7)) tone("sine", 120, 36, at, .45, .55, 900);
    if (full && (s12 === 3 || s12 === 9)){ hiss(at, .2, .22, 0, 1500); tone("triangle", 210, 150, at, .08, .07); }
    hiss(at, .03, i % 3 ? .025 : .05, 8000);
    if (s12 === 0){ const f = PROG[bar % 4]; tone("sawtooth", f, f, at, BAR*.9, .05, 420);
      [1, 1.2, 1.5].forEach((m, k) => tone("sine", f*4*m, f*4*m, at + k*BEAT*.66, BEAT*1.2, .018, 3000)); }
    nextStep += BEAT / 3;
  }
}
const sfx = {
  zap:  () => ac && tone("square", 1500, 500, ac.currentTime, .05, .012, 5000),
  kill: big => ac && (tone("triangle", big ? 300 : 700, big ? 90 : 220, ac.currentTime, big ? .4 : .18, .07, 3000), hiss(ac.currentTime, big ? .35 : .15, .08, 0, 1800)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  good: () => ac && tone("triangle", 880, 1320, ac.currentTime, .12, .06, 6000),
  big:  () => ac && [660, 880, 1320, 1760].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.05, .25, .05, 6000)),
  jump: () => ac && tone("sine", 260, 640, ac.currentTime, .14, .05, 4000),
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  roar: () => ac && (tone("sawtooth", 90, 40, ac.currentTime, .9, .1, 500), hiss(ac.currentTime, .9, .1, 0, 300)),
  swap: () => ac && (hiss(ac.currentTime, .5, .14, 0, 2500), tone("sine", 200, 900, ac.currentTime, .4, .05, 4000))
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- District 9 at night ---------------- */
let scene, cam, ren, skyM, clockR, ME, BIKE, rain, crashed = null;
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
function buildSky(){
  const cv = document.createElement("canvas"); cv.width = 4; cv.height = 256; const x = cv.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  [[0, "#05020c"], [.32, "#140828"], [.46, "#3a1670"], [.5, "#7b2ff7"], [.54, "#2a1048"], [1, "#07030f"]].forEach(([o, c]) => g.addColorStop(o, c));
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  skyM = new THREE.Group(); scene.add(skyM);
  skyM.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv), side:THREE.BackSide, fog:false, depthWrite:false })));
  const n = 900, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++){ const a = rnd(i)*Math.PI*2, e = .15 + rnd(i*2.3)*1.3, r = 480; pos.set([Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r], i*3); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  skyM.add(new THREE.Points(sg, new THREE.PointsMaterial({ size:1.4, sizeAttenuation:false, color:0xd8c8ff, fog:false })));
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map:radial([[0, "rgba(255,240,255,1)"], [.42, "rgba(240,220,255,1)"], [.46, "rgba(200,140,255,.35)"], [1, "rgba(120,60,220,0)"]]), fog:false, depthWrite:false }));
  moon.position.set(-120, 150, -380); moon.scale.setScalar(110); skyM.add(moon);
}
// building fronts: rows of windows, some lit warm, some cyan, some pink
function windowTex(k){
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 128; const x = cv.getContext("2d");
  x.fillStyle = "#0e0820"; x.fillRect(0, 0, 64, 128);
  const cols = ["#ffd27a", "#8ae9ff", "#ff7ad8", "#c9b3ff"];

// endless and remix go in 8-bar windows. Endless: the same game, a little harder every window.
// Remix: the next game's turn, each lap (all four) harder. Every 24 bars: +2,000 and a heart back
function startStint(n, t){

  S.stint = n; const lap = Math.floor(n/per);

    if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const more = "+2,000" + (back ? " · a heart back" : "");

    if (n > 0 && n % 3 === 0) say("24 BARS", more, 1.2, "g"); return; }

  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}

  else S.t += dt;

function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*800; sfx.big();
  $("hud").classList.add("off"); $("phase").className = "off"; $("boss").classList.add("off");
  if (!FIN){ FIN = new THREE.Group(); scene.add(FIN);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(14, 30, 12), new THREE.MeshLambertMaterial({ color:0x2a1a40, emissive:0x120822 })); roof.position.y = -15; FIN.add(roof);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(16, 4), new THREE.MeshBasicMaterial({ map:neonTex("OUBLIE-MOI", "#ff3d8b"), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }));
    sign.position.set(0, 6.5, -5); FIN.add(sign); FIN.userData.sign = sign;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(16.4, .2, .2), new THREE.MeshBasicMaterial({ color:0x3a2050 })); frame.position.set(0, 4.3, -5.05); FIN.add(frame); }
  FIN.position.set(0, 0, -S.dist - 14); FIN.visible = true;
  for (const g of Object.values(GAMES)) g.root.visible = false;
  ME.visible = BIKE.visible = true; camInit = false;
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off"; $("boss").classList.add("off");
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say(CFG.remix ? "REMIX OVER" : "RUN OVER", why, 2, "g"); $("phase").className = "off"; $("boss").classList.add("off");
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0);
  if (S.end >= 0){
    const u = clamp(S.end/3, 0, 1), s = u*u*(3 - 2*u), z = -S.dist - 14;
    ME.position.set(-2.2, 1.4 + Math.sin(t*2)*.15, z + 1); ME.rotation.set(0, t*1.2, 0);
    BIKE.position.set(2.2, 0, z + 1); BIKE.rotation.set(0, -.5, 0);
    FIN.userData.sign.material.opacity = Math.min(1, S.end) * (.85 + .15*Math.sin(t*9));
    CAMP.set(Math.sin(S.end*.15)*6, 3.5 + s*3, z + 14 - s*2); CAML.set(0, 3 + s, z - 3);
    if (S.end > 1.4 && !S.saidEnd){ S.saidEnd = true; say("OUBLIE-MOI", "LAZY JO × ZIRKA", 4.5, "b"); }
    if (S.end > END.out - 1.2){ $("flash").style.background = "#0b0416"; $("flash").style.opacity = Math.min(1, (S.end - (END.out - 1.2))/1.2); }
  } else {
    G.render(dt, t);
    const blink = S.inv > 0 && Math.floor(S.inv*12) % 2;
    if (G === ROOF || G === RIDE) BIKE.visible = !blink; else if (G === KING && KING.zirkaOn()) KING.zbike.visible = !blink; else ME.visible = !blink;
    if (G === KING && !KING.zirkaOn()) KING.zbike.visible = true;
  }
  cityAt(S.dist, G === RIDE && S.end < 0);
  // rain falls past the camera
  rain.position.set(cam.position.x, cam.position.y - 4, cam.position.z - 20 + ((t*14) % 1));
  const rp = rain.geometry.attributes.position.array; for (let i = 0; i < rp.length; i += 6){ rp[i + 1] -= dt*28; rp[i + 4] -= dt*28; if (rp[i + 1] < -12){ rp[i + 1] += 30; rp[i + 4] += 30; } }
  rain.geometry.attributes.position.needsUpdate = true;
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 2 : 6)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  skyM.position.copy(cam.position);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  $("next").classList.toggle("hid", S.fail || CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off"; $("boss").classList.add("off");
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:Math.round(Math.max(0, S.t)) });
  const t = Math.max(0, S.t);
  if (CFG.endless){
    const games = S.stint + 1, laps = Math.floor(S.stint/3);
    v.querySelector(".by").textContent = (CFG.remix ? "REMIX · " : "ENDLESS · ") + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = (CFG.remix ? "Lap <b>" + (laps + 1) + "</b> &middot; " + games + (games === 1 ? " game" : " games") + " &middot; " : "") + "<b>" + clock(t) + "</b> without stopping &middot; " + S.kills + " down" + (KING.kingN ? " &middot; " + KING.kingN + (KING.kingN === 1 ? " king" : " kings") + " fallen" : "");
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  const stat = PART === 1 ? S.kills + " monsters down" : PART === 2 ? ROOF.st.coins + " bolts · " + ROOF.st.jumps + " jumps · " + S.kills + " down" : PART === 3 ? KING.st.coreHits + " core hits" : RIDE.st.coins + " bolts · " + RIDE.st.jumps + " jumps · " + S.kills + " down";
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = CFG.title.toUpperCase();
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = (PART === 1 ? "The sky over District 9 is yours." : PART === 2 ? "Over every roof in the city." : PART === 3 ? "The King of Forgetting is down. <b>Nobody forgets the Wolves.</b>" : "Jump Ride - the way JAVEDA started.") +
    (PART === 1 ? "<br>Part 2: Zirka's ride over the roofs." : PART === 2 ? "<br>Part 3: the King." : PART === 3 ? "<br>Part 4: Jump Ride, the original idea." : "<br>All four cleared: the gold <b>Endless</b> list is open - every part with no end, and the Remix.");
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0416); scene.fog = new THREE.Fog(0x1a0b2e, 30, 170);
  cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 1400);
  scene.add(new THREE.HemisphereLight(0x8a7aff, 0x1a0820, .8));
  const moon = new THREE.DirectionalLight(0xc8b8ff, .9); moon.position.set(-30, 50, 20); scene.add(moon);
  const pinkL = new THREE.DirectionalLight(0xff3d8b, .35); pinkL.position.set(20, 10, -40); scene.add(pinkL);
  buildSky(); buildCity(); buildRain(); buildSparks();
  ME = buildSaucer(); scene.add(ME); BIKE = buildBike(); scene.add(BIKE);
  SKY.setup(); ROOF.setup(); KING.setup(); RIDE.setup();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input ----------------
   Night Flight: drag to fly; hold space (or the mouse button, or a second finger) to shoot, or tap for a burst.
   Rooftop Run: swipe for a lane, tap to jump. The King: drag to fly; on Zirka's turn drag along the roof,
   tap to jump. Jump Ride: tap (or space) to jump, hold for higher, drag to ride ahead or drop back. */
const veilUp = () => !$("veil").classList.contains("hid");
let held = false, anchorX = 0, downX = 0, downY = 0, downT = 0, swiped = false, movePtr = null, lastX = 0, lastY = 0;
const touches = new Set();
const live = () => S.started && !S.done && S.end < 0;
const zirkaTurn = () => G === KING && KING.zirkaOn();
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault();
  if (e.pointerType === "touch"){ touches.add(e.pointerId);
    // a second finger in Night Flight is the trigger
    if (G === SKY && movePtr !== null && movePtr !== e.pointerId){ S.fireHeld = true; return; } }
  if (e.pointerType === "mouse" && G === SKY){ S.fireHeld = true; }
  movePtr = e.pointerId; held = true; anchorX = downX = lastX = e.clientX; downY = lastY = e.clientY; downT = performance.now(); swiped = false;
  if (G === RIDE){ RIDE.press(true); RIDE.point(e.clientX, e.clientY); return; }
  if (G.point && G !== SKY || (G === SKY && e.pointerType === "mouse")) G.point(e.clientX, e.clientY, e.pointerType !== "mouse"); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return;
  if (G === ROOF){ if (held && e.pointerId === movePtr && Math.abs(e.clientX - anchorX) > 34){ ROOF.lane(Math.sign(e.clientX - anchorX)); anchorX = e.clientX; swiped = true; } return; }
  if (G === RIDE){ if (held && e.pointerId === movePtr) RIDE.point(e.clientX, e.clientY); return; }
  if (e.pointerType === "mouse" || (held && e.pointerId === movePtr)){
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 12) swiped = true;
    // Night Flight on a phone: drag anywhere, the saucer follows the finger's moves (so a tap to shoot doesn't move it)
    if (G === SKY && e.pointerType !== "mouse"){ const k = 2*SKY.XR/Math.min(innerWidth, 700)*1.3, st = SKY.st;
      st.tx = clamp(st.tx + (e.clientX - lastX)*k, -SKY.XR, SKY.XR); st.ty = clamp(st.ty - (e.clientY - lastY)*k, SKY.YL, SKY.YH); lastX = e.clientX; lastY = e.clientY; return; }
    G.point(e.clientX, e.clientY, e.pointerType !== "mouse"); } });
addEventListener("pointerup", e => {
  touches.delete(e.pointerId);
  if (e.pointerType === "mouse" && G === SKY) S.fireHeld = false;
  if (e.pointerId !== movePtr){ if (G === SKY && e.pointerType === "touch") S.fireHeld = false; return; }
  const tap = !swiped && Math.hypot(e.clientX - downX, e.clientY - downY) < 24 && performance.now() - downT < 350;
  if (held && live()){
    if (G === ROOF && tap) ROOF.jump();
    if (G === SKY && tap && e.pointerType === "touch") S.fireQ += 4;       // a tap: a burst of four
    if (zirkaTurn() && tap) KING.jump();
    if (G === RIDE) RIDE.press(false); }
  held = false; movePtr = null; });
addEventListener("pointercancel", e => { touches.delete(e.pointerId); held = false; movePtr = null; S && (S.fireHeld = false); if (G === RIDE) RIDE.press(false); });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (veilUp() || !live()) return;
  if (G === ROOF){ if (e.repeat) return; if (k === "left" || k === "right"){ e.preventDefault(); ROOF.lane(k === "left" ? -1 : 1); } if (k === "up" || e.key === " "){ e.preventDefault(); ROOF.jump(); } return; }
  if (e.key === " "){ e.preventDefault(); if (G === SKY) S.fireHeld = true; else if (G === RIDE){ if (!e.repeat) RIDE.press(true); } else if (zirkaTurn() && !e.repeat) KING.jump(); return; }
  if (G === RIDE && k === "up"){ e.preventDefault(); if (!e.repeat) RIDE.press(true); return; }
  if (zirkaTurn() && k === "up"){ e.preventDefault(); if (!e.repeat) KING.jump(); return; }
  if (k){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false;
  if (e.key === " " && S){ S.fireHeld = false; if (G === RIDE) RIDE.press(false); }
  if (k === "up" && G === RIDE) RIDE.press(false); });

$("go").addEventListener("click", () => {
  reset();
  if (FIN) FIN.visible = false;
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.remix ? "REMIX" : CFG.endless ? "ENDLESS" : G.tag, CFG.remix ? "all four, till the hearts run out" : CFG.endless ? G.tag.toLowerCase() + " - no end" : G.hint, 3, CFG.endless ? "g" : "b");
});
$("by").textContent = "LAZY JO × ZIRKA · " + CFG.by;
$("title").textContent = CFG.title.toUpperCase() + (ENDLESS && !REMIX ? " ∞" : "");
$("intro").innerHTML = REMIX ? "Night Flight, Rooftop Run, The King, Jump Ride - 8 bars each, round and round, no end. Every lap is harder, and a finished lap gives you a heart back." : {
  1: "District 9, the night the monsters of forgetting came. Fly Jo's saucer between the neon towers and light them up.",
  2: "Zirka's bike over the rooftops of District 9 - jump the gaps on the beat, and Zirka's gun takes care of what dives in.",
  3: "The King of Forgetting hangs over the city. Bring him down before the song ends. Gadgets float up for Jo - and the wolf token hands the fight to Zirka on the roof below.",
  4: "The original JAVEDA idea: Zirka's bike over the roofs of District 9, side on. Jump the gaps and the monsters - Zirka's gun takes care of the rest."
}[PART] + (ENDLESS && !REMIX ? " <b>Endless:</b> no end - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = REMIX ? "Every part's rules in turn, one score, 5 hearts. Your best goes on the <b>Level 9 Remix</b> scoreboard." : {
  1: "<b>Drag</b> to fly. <b>Shoot:</b> hold <b>space</b> on a computer - on a phone, <b>tap</b> for a burst, or hold a second finger down. Watchers shoot on 2 and 4, brutes take a beating. Grab the gold crystal for the <b>Lightning Storm</b>. 5 hearts.",
  2: "<b>Swipe</b> left/right for a lane, <b>tap</b> to jump. The gaps open on the 1 of a bar. Pink marks are where monsters dive - Zirka shoots them, or get out of the way. 5 hearts.",
  3: "<b>Drag</b> to fly - Jo fires on his own. Every orb is marked with a ring where it lands - don't be there. His core opens in the hooks: <b>fire into it</b>. Fly into the gadgets: <b>triple</b> lightning, <b>rapid</b> fire, a <b>heart</b>, and the <b>Zirka</b> token - 8 bars on the roof below: drag to ride, tap to jump the orbs, Zirka's big shots go for the core. 5 hearts" + (ENDLESS ? "; every king that falls, a stronger one rises." : "."),
  4: "<b>Tap</b> or <b>space</b> to jump, <b>hold</b> for higher. <b>Drag</b> left/right (or the arrows) to ride ahead or drop back. Gaps open on the 1 of a bar; bolts arc over them. The purple crystal is the <b>Wolf Rush</b>. 5 hearts."
}[PART];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode || "";
    b.setAttribute("aria-pressed", String(m === "remix" ? REMIX : !REMIX && +b.dataset.part === PART && (m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); ["part", "endless", "remix"].forEach(k => q.delete(k));
      if (m === "remix") q.set("remix", "1"); else { q.set("part", b.dataset.part); if (m === "endless") q.set("endless", "1"); }
      location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

<script>
/* ================= MYSELF =================
   Level 8 of JAVEDA, in the world of the cover: a rocky canyon at sunset,
   cracked dry ground, a giant red rose, and Jo's red saucer with its green
   beam at the foot of the stem. Jo picked all three prototypes, one per part:

     Part 1 PETAL RAIN  the rose is losing its petals: catch them in the beam
                        before they hit the ground. Thorns fall too.
     Part 2 THE STEM    climb the giant stem to the bloom, round the thorns.
     Part 3 MY SHADOW   a dark saucer flies exactly where you flew a few
                        seconds ago. Gather the petals, stay ahead of yourself.
   Once all three are cleared, the gold ENDLESS list opens (?endless=1 with a
   part, ?remix=1): each part with no end, harder every 8 bars, a heart back
   every 24 - and the REMIX, all three games in turn, 8 bars each. Play till
   the hearts run out; it's for the scoreboards.

   Each game is an engine with begin(t0, t1, L0, L1, cont): it plays the
   window [t0, t1] with its difficulty L rising from L0 to L1. Parts 1-3 are
   one window, the whole song, L 0 -> 1. Endless is a run of 8-bar windows of
   the same game (cont: it carries on where it was); the remix switches game
   every window.

   The song (SONG.md) is 87 BPM and comes in two matching halves: a quiet
   intro, then loud bars 8-27 (one bar drops out at 16), a quiet break (28-35),
   loud bars 36-55 (a drop-out at 44), and the outro. The game breathes with it:
   gentler in the quiet (no thorns, no rings), nothing new in a drop-out bar.
   Parts 1-3 end at bar 56, and the cover plays over the outro. Endless and the
   remix loop LOOP, bars 8-56, whole bars - so the beat never slips. */

const GRID = { bpm:87, t0:-.043 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(56);                      // 2:34.4 - Parts 1-3 end here, the outro is the ending
const LOOP = [barT(8), barT(56)];             // endless: the bars of the song it plays round and round
// where in the song a game time is (endless runs on past the loop), and how loud it is there
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  if (b === 16 || b === 44) return "rest";
  return b < 8 || (b >= 28 && b < 36) || b >= 56 ? "calm" : "loud";
}
const STINT = BAR * 8;                        // endless: one window; remix: each game's turn
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const REMIX = Q.get("remix") === "1", ENDLESS = REMIX || Q.get("endless") === "1";
const PART = REMIX ? 0 : Math.min(3, Math.max(1, +Q.get("part") || 1));
const BASE = {
  1: { id:"lvl8",  title:"Petal Rain", by:"LEVEL 8",        game:"rain" },
  2: { id:"lvl8b", title:"The Stem",   by:"LEVEL 8 PART 2", game:"stem" },
  3: { id:"lvl8c", title:"My Shadow",  by:"LEVEL 8 PART 3", game:"shadow" }
}[PART || 1];
// endless: the part's id + "x"; the remix of all three: lvl8r
const CFG = REMIX ? { id:"lvl8r", title:"Remix", by:"LEVEL 8 REMIX", game:"mix", endless:true, remix:true, board:"Level 8 Remix" }
  : ENDLESS ? { ...BASE, id:BASE.id + "x", by:BASE.by + " · ENDLESS", endless:true, board:"Level 8" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : BASE;
const ORDER = ["rain", "stem", "shadow"];

const LINKS = {
  next:    "https://lightningwolves.studio/javeda/",
  spotify: "https://open.spotify.com/track/55fCtR1laxHOpWKY6XVDou",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/SES7XPJvBH", youtube: "https://www.youtube.com/@lazyjo_?sub_confirmation=1",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
// the hub says which song Next level opens (?next=3 \u00b7 MY HEART): the label always names it. On its own, the label in the
// card is the next song in the album's order
const NEXT_NAME = HUB && new URLSearchParams(location.search).get("next");
if (NEXT_NAME && /^\d{1,2} \u00b7 [^<>]{1,40}$/.test(NEXT_NAME)) document.querySelector("#next small").textContent = NEXT_NAME;
if (HUB){
  document.getElementById("next").addEventListener("click", e => { e.preventDefault(); toHub({ type:"javeda:next", level:CFG.id }); });
  document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
}
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { const d = a - b; return Math.atan2(Math.sin(d), Math.cos(d)); };
const $ = id => document.getElementById(id);

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl8.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 130.8, 98];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .005); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), full = bar >= 2;
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .4, .5, 900);
    if (full && s8 === 4){ hiss(at, .22, .2, 0, 1400); tone("triangle", 190, 140, at, .1, .08); }
    hiss(at, .04, s8 % 2 ? .035 : .06, 7000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("triangle", f, f, at, BAR*.9, .14, 450);
      [1, 1.19, 1.5].forEach((m, k) => tone("sine", f*4*m, f*4*m, at + k*BEAT*.5, BEAT*1.5, .02, 3000)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: () => ac && tone("triangle", 880, 1320, ac.currentTime, .12, .07, 6000),
  big:  () => ac && [660, 880, 1320, 1760].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.05, .25, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  soft: () => ac && tone("sine", 300, 180, ac.currentTime, .25, .06, 900),
  dew:  n => ac && tone("triangle", 660*Math.pow(2, (n % 6)/6), 660*Math.pow(2, (n % 6)/6), ac.currentTime, .2, .05, 6000),
  heart: () => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  swap: () => ac && (hiss(ac.currentTime, .5, .14, 0, 2500), tone("sine", 200, 900, ac.currentTime, .4, .05, 4000))
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the canyon, the rose, the saucer ---------------- */
let scene, cam, ren, sky, clockR, ME, crashed = null;
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
/* ---- the look (pictures only: the game reads nothing from any of this) ----
   CALM = the phone asks for less motion: no sparks, no drifting motes, no pulses.
   hsh = decoration's own dice, a hash of an index - never the game's rnd() counters. */
const CALM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
const hsh = n => { const x = Math.sin(n*91.3458 + 4.7)*47453.5453; return x - Math.floor(x); };
const lightMat = (map, color, opacity) => new THREE.MeshBasicMaterial({ map, color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, fog:false, side:THREE.DoubleSide });
const POOL = radial([[0, "rgba(255,255,255,.85)"], [.4, "rgba(255,255,255,.3)"], [1, "rgba(255,255,255,0)"]], 128);      // a pool of light
const MARK = radial([[0, "rgba(255,255,255,.4)"], [.74, "rgba(255,255,255,.4)"], [.82, "rgba(255,255,255,1)"], [.92, "rgba(255,255,255,1)"], [1, "rgba(255,255,255,0)"]], 128);   // a landing mark: a disc with a bright rim
const DISC = new THREE.CircleGeometry(1, 32);
const pool = (color, opacity, r) => { const m = new THREE.Mesh(DISC, lightMat(POOL, color, opacity)); m.rotation.x = -Math.PI/2; m.scale.setScalar(r); return m; };
// a long soft streak: the sunset clouds, and the cloud layers the stem climbs through
const STREAK = (() => { const cv = document.createElement("canvas"); cv.width = 256; cv.height = 64; const x = cv.getContext("2d");
  for (let i = 0; i < 9; i++){ const cx = 40 + hsh(i*2.3)*176, cy = 22 + hsh(i*4.1)*20, rx = Math.min(30 + hsh(i*6.7)*50, cx - 4, 252 - cx), ry = 4 + hsh(i*8.9)*7;
    x.save(); x.translate(cx, cy); x.scale(rx, ry); const g = x.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, "rgba(255,255,255,.5)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, 1, 0, 6.3); x.fill(); x.restore(); }
  return new THREE.CanvasTexture(cv); })();
// top to bottom, bright to dim: the beam is strongest at the saucer
const FADE = (() => { const cv = document.createElement("canvas"); cv.width = 4; cv.height = 64; const x = cv.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 64);
  g.addColorStop(0, "#fff"); g.addColorStop(1, "#999"); x.fillStyle = g; x.fillRect(0, 0, 4, 64); return new THREE.CanvasTexture(cv); })();
function buildCanyon(){
  // the sunset: dark above, a burning band on the horizon

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, lap:0, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  if (CFG.remix){ switchTo("rain"); RAIN.begin(0, STINT, .35, .6); }
  else if (CFG.endless){ switchTo(CFG.game); G.begin(0, STINT, .3, .4); }
  else { switchTo(CFG.game); G.begin(0, END_AT, 0, 1); }
}
// endless and remix go in 8-bar windows. Endless: the same game, a little harder every window.
// Remix: the next game's turn, each lap (all three) harder. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; const lap = Math.floor(n/3);
  let back = false;
  if (n > 0 && n % 3 === 0){ S.lap = lap; S.score += 2000;
    if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const more = "+2,000" + (back ? " · a heart back" : "");
  if (!CFG.remix){ const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
    if (n > 0 && n % 3 === 0) say("24 BARS", more, 1.2, "g"); return; }
  const L0 = .35 + lap*.3;
  switchTo(ORDER[n % 3]); G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .25);
  if (n > 0){ sfx.swap(); $("flash").style.background = "#ffe08a"; S.flashT = .5;
    say(G.label, n % 3 === 0 ? "LAP " + (lap + 1) + " · " + more : G.hint, 1.6, "g"); }
}
const clock = t => Math.floor(t/60) + ":" + String(Math.floor(t) % 60).padStart(2, "0");
const fmt = n => Math.round(n).toLocaleString("en");
function songT(){
  if (CFG.endless && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   Parts 1-3 end on the cover: the canyon at sunset, the rose with every
   petal back, and the red saucer settling at the foot of the stem with its
   green beam on. */
const END = { out:7 };
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big();
  $("hud").classList.add("off"); $("phase").className = "off";
  $("flash").style.background = "#fff"; S.flashT = .5;
  const x = G === RAIN ? RAIN.st.x : 0;
  switchTo("rain"); RAIN.begin(S.t, S.t + 1, 0, 0); RAIN.st.x = x; RAIN.showRose(true);
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say(CFG.remix ? "REMIX OVER" : "RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0);
  if (S.end >= 0){
    // the cover: the saucer drifts down to the foot of the stem
    const u = clamp(S.end/3, 0, 1), s = u*u*(3 - 2*u), x0 = RAIN.st.x;
    ME.visible = true; ME.position.set(x0*(1 - s), 2.2 - s*.9, -5.6*s); ME.scale.setScalar(1 - s*.25); ME.rotation.y = t*1.2; ME.userData.beam.visible = true; ME.userData.beam.material.opacity = .42;
    RAIN.rose.userData.bloom.rotation.y = Math.sin(t*.4)*.2;
    const portrait = cam.aspect < .8;
    CAMP.set(0, 5, portrait ? 22 : 13); CAML.set(0, 5.6, -7);
    if (S.end > 1.2 && !S.saidEnd){ S.saidEnd = true; say("MYSELF", "LAZY JO", 4); }
    $("flash").style.background = S.end > END.out - 1.2 ? "#0e0606" : $("flash").style.background;
    if (S.end > END.out - 1.2) $("flash").style.opacity = Math.min(1, (S.end - (END.out - 1.2))/1.2);
  } else {
    G.render(dt, t);
    ME.rotation.y = t*1.6; ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  const k = camInit && S.end < 0 ? Math.min(1, dt*6) : camInit ? Math.min(1, dt*1.5) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  sky.position.copy(cam.position);
  FX.frame(dt, t);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  $("next").classList.toggle("hid", S.fail || CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:Math.round(Math.max(0, S.t)) });
  if (CFG.endless){
    const games = S.stint + 1, laps = Math.floor(S.stint/3), t = Math.max(0, S.t);
    v.querySelector(".by").textContent = (CFG.remix ? "REMIX · " : "ENDLESS · ") + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = (CFG.remix ? "Lap <b>" + (laps + 1) + "</b> &middot; " + games + (games === 1 ? " game" : " games") + " &middot; " : "") + "<b>" + clock(t) + "</b> without stopping";
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  const stat = PART === 1 ? RAIN.st.caught + " petals caught" : PART === 2 ? STEM.st.dew + " dew drops · " + STEM.st.gaps + " gaps · " + Math.round(STEM.st.y) + " m" : SHADOW.st.got + " petals · your shadow took " + SHADOW.st.stolen;
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = CFG.title.toUpperCase();
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = (PART === 1 ? "The rose kept its petals." : PART === 2 ? "All the way up to the bloom." : "You stayed ahead of yourself.") +
    (PART === 1 ? "<br>Part 2: climb the stem." : PART === 2 ? "<br>Part 3: your shadow." : "<br>All three cleared: the gold <b>Endless</b> list is open - every part with no end, and the Remix.");
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x140607); scene.fog = new THREE.Fog(0x4a1a10, 40, 170);
  cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 1200);
  scene.add(new THREE.HemisphereLight(0xffa070, 0x201010, .75));
  const sun = new THREE.DirectionalLight(0xffa060, 1.1); sun.position.set(-10, 20, -40); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffd8c0, .45); fill.position.set(10, 15, 30); scene.add(fill);
  buildCanyon();
  ME = buildSaucer(); scene.add(ME);
  RAIN.setup(); STEM.setup(); SHADOW.setup();
  FX.build();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
let held = false, lastX = 0;
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); held = true; lastX = e.clientX; if (G.point) G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return;
  if (G === STEM){ if (held) G.drag(e.clientX - lastX); lastX = e.clientX; return; }
  if (held || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
addEventListener("pointerup", () => { held = false; }); addEventListener("pointercancel", () => { held = false; });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k && !veilUp()){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

$("go").addEventListener("click", () => {
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.remix ? "REMIX" : CFG.endless ? "ENDLESS" : G.tag, CFG.remix ? "all three games, till the hearts run out" : CFG.endless ? G.tag.toLowerCase() + " - no end" : G.hint, 3, CFG.endless ? "g" : "");
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = CFG.title.toUpperCase() + (ENDLESS && !REMIX ? " ∞" : "");
$("intro").innerHTML = REMIX ? "All three games, one after the other, with no end. Every lap is harder - and a finished lap gives you a heart back. How far can you go?" : {
  1: "The rose in the canyon is losing its petals. Catch them in the saucer's green beam before they hit the cracked ground.",
  2: "Climb the giant stem all the way to the bloom - round the thorns, through the dew.",
  3: "Your shadow flies exactly where you flew a few seconds ago. Gather the petals and stay ahead of yourself."
}[PART] + (ENDLESS ? " <b>Endless:</b> no end - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = REMIX ? "<b>Petal Rain, The Stem, My Shadow</b> - 8 bars each, round and round. 3 hearts. A bare rose costs a heart here. Your best goes on the <b>Level 8 Remix</b> scoreboard." : {
  1: "<b>Drag</b> to slide under the falling petals - the pink marks show where they'll land. A thorn costs a heart. Every petal that lands, the rose gets barer" + (ENDLESS ? "." : " - let it lose them all and it's over."),
  2: "<b>Drag left/right</b> to swing round the stem. Thorns cost a heart; rings of thorns have one gap. Dew on the beat is double.",
  3: "<b>Drag</b> to fly. Stand still and your shadow gets you. It comes closer every 8 bars, and it steals the petals it reaches."
}[PART] + (ENDLESS && PART === 1 ? " A bare rose costs a heart here, and it grows back." : "");
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode || "";
    b.setAttribute("aria-pressed", String(m === "remix" ? REMIX : !REMIX && +b.dataset.part === PART && (m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); ["part", "endless", "remix"].forEach(k => q.delete(k));
      if (m === "remix") q.set("remix", "1"); else { q.set("part", b.dataset.part); if (m === "endless") q.set("endless", "1"); }
      location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

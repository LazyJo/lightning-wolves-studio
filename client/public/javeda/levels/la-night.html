<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= LA NIGHT =================
   Level 11 of JAVEDA, in the night of the cover: a purple sky, a big moon, red
   clouds streaking across, the city with its lit windows - and Jo's saucer (silver,
   the orange dome with the "L") over it. Jo picked STREET RACE: a night race through
   the city towards the moon, in Jo's silver car with the "L" on the roof, its tail
   lights drawing a trail of light behind it like the long exposures on the cover.
   The car drives itself; hold (anywhere, or Space) to drift round the corner the
   saucer shines its beam on, let go when you face down the new street - on the beat
   for nitro. A wall costs a heart (3); bumping another car costs speed. Seven cars
   start ahead of you: finish first. The song sets the streets: long and easy in the
   calm parts, more corners in the verses, fast, sharp and gold in the hooks. At the
   end of the song the street runs out to the river: the cover - the moon over the
   skyline down the river, the boats' light trails, the saucer with its beam on.
   Once it's cleared, ENDLESS opens (?endless=1): the race with no end, faster every
   8 bars, a heart back every 24 bars, as many overtakes as you can. */

// the song's measured grid (SONG.md): 79 BPM (158 double-time), bars from 0.37 s
const GRID = { bpm:79, t0:.37 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const GO_AT = barT(2);                        // the intro: "LA NIGHT" on bar 0, 3-2-1 on bar 1, GO on bar 2
const END_AT = barT(60);                      // the race ends with hook 3; the outro is the ending
const LOOP = [barT(4), barT(60)];             // endless: hook 1 to the end of hook 3, round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, the quiet half of a verse, outro), loud (verses), hook
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  if (b < 4 || b >= 60) return "calm";                          // intro, outro
  if (b < 12 || (b >= 28 && b < 36) || b >= 52) return "hook";   // hooks 1-3 (the drums come in halfway)
  const k = (b - 12) % 24;                                       // the verses: 8 bars with the beat, 4 without, 4 quiet
  return k < 12 ? "loud" : "calm";
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ENDLESS = Q.get("endless") === "1";
const CFG = ENDLESS ? { id:"lvl11x", title:"Street Race", by:"LEVEL 11 · ENDLESS", endless:true, board:"Level 11 ∞" }
  : { id:"lvl11", title:"Street Race", by:"LEVEL 11" };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl11.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0, engine = null;
const PROG = [110, 87.3, 98, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
    // the engine: a low saw that climbs with the speed
    if (!engine){ const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = "sawtooth"; o.frequency.value = 40; f.type = "lowpass"; f.frequency.value = 420; g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(bus); o.start(); engine = { o, g }; }
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .008); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = bar >= 2 && sec !== "calm";
    if (bar >= 2 && (s8 === 0 || s8 === 5)) tone("sine", 120, 38, at, .45, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .18, .22, 0, 2000); tone("triangle", 210, 160, at, .08, .07); }
    hiss(at, .04, s8 % 2 ? .04 : .07, 7000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sawtooth", f/2, f/2, at, BAR*.85, .07, 380);
      if (bar >= 2) [2, 3, 2.52, 4].forEach((m, k) => tone("square", f*m, f*m, at + k*BEAT, BEAT*.4, sec === "hook" ? .02 : .013, 2600)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 880*Math.pow(2, ((n || 0) % 8)/24), 1320*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .1, .06, 7000),
  big:  () => ac && [660, 880, 1320, 1760].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.05, .25, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 160, 40, ac.currentTime, .45, .1, 900), hiss(ac.currentTime, .5, .2, 0, 500)),
  beep: () => ac && tone("square", 880, 880, ac.currentTime, .18, .05, 4000),
  go:   () => ac && tone("square", 1760, 1760, ac.currentTime, .45, .06, 5000),
  skid: () => ac && hiss(ac.currentTime, .35, .05, 0, 2400),
  boost:() => ac && (tone("sawtooth", 220, 880, ac.currentTime, .4, .06, 3000), hiss(ac.currentTime, .6, .1, 1500)),
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the city at night, from the cover ---------------- */
let scene, cam, ren, clockR, ME, crashed = null;
const GOLD = 0xffd23a;
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
// the street: dark asphalt, white edges, the yellow dashes down the middle (one tile = 16 m)
const ROADT = canvasTex(128, 128, (x, w, h) => { x.fillStyle = "#2a2436"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++){ x.fillStyle = "rgba(255,255,255," + (rnd(i)*.07).toFixed(3) + ")"; x.fillRect(rnd(i*3)*w, rnd(i*7)*h, 1.5, 1.5); }
  x.fillStyle = "#e8e0f0"; x.fillRect(5, 0, 3, h); x.fillRect(w - 8, 0, 3, h); x.fillStyle = "#ffd23a"; x.fillRect(w/2 - 2, 0, 4, h/2); }, [1, 1]);
// the buildings: dark, the windows lit white and warm gold like the cover's skyline, a few red (one tile = 16 x 32 m)
const BLD = [0, 1, 2, 3, 4].map(k => { const t = canvasTex(64, 128, (x, w, h) => { x.fillStyle = "#0c0a1c"; x.fillRect(0, 0, w, h);
    for (let r = 0; r < 16; r++) for (let c = 0; c < 4; c++){ const q = rnd(k*97 + r*7 + c*13); x.fillStyle = q < .42 ? "#1a1630" : q < .7 ? "#ffe2b0" : q < .9 ? "#f4f0ff" : q < .96 ? "#ffb060" : "#ff4a5a";
      x.globalAlpha = q < .42 ? 1 : .5 + rnd(q*31)*.5; x.fillRect(4 + c*15, 3 + r*7.8, 9, 4.4); x.globalAlpha = 1; } }, [1, 1]);
  return new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff, emissiveIntensity:.9, color:0x26223a, roughness:.7 }); });
function boxUV(w, h, d){ const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h/2, 0); const uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++){ const i = f*4 + v, su = f < 2 ? d/16 : f < 4 ? 0 : w/16, sv = f < 2 || f > 3 ? h/32 : 0; uv.setXY(i, uv.getX(i)*su, uv.getY(i)*sv); }
  return g; }
const NEON = [0xff6a8a, 0xffd8a0, 0x9ad8ff, 0xff3a5a].map(c => new THREE.MeshBasicMaterial({ color:c }));
const POLE_G = new THREE.CylinderGeometry(.14, .2, 7, 6), POLE_M = new THREE.MeshStandardMaterial({ color:0x2a2238, metalness:.6, roughness:.4 }), ARM_G = new THREE.BoxGeometry(2.4, .12, .12);
const LAMP_M = new THREE.SpriteMaterial({ map:DOT, color:0xffd8a0, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
const POOL_G = new THREE.PlaneGeometry(13, 13), POOL_M = new THREE.MeshBasicMaterial({ map:DOT, color:0xffb080, transparent:true, opacity:.2, blending:THREE.AdditiveBlending, depthWrite:false });
// the boards at the corners: white chevrons pointing the way it turns, a red edge
const CHEV = canvasTex(256, 64, (x, w, h) => { x.fillStyle = "#1a1030"; x.fillRect(0, 0, w, h); x.fillStyle = "#f4f0ff";
  for (let i = 0; i < 5; i++){ const x0 = 14 + i*48; x.beginPath(); x.moveTo(x0, 8); x.lineTo(x0 + 22, 8); x.lineTo(x0 + 44, 32); x.lineTo(x0 + 22, 56); x.lineTo(x0, 56); x.lineTo(x0 + 22, 32); x.closePath(); x.fill(); }
  x.strokeStyle = "#ff3a5a"; x.lineWidth = 6; x.strokeRect(3, 3, w - 6, h - 6); });
const CHEV_M = new THREE.MeshBasicMaterial({ map:CHEV, side:THREE.DoubleSide }), CHEV_G = new THREE.PlaneGeometry(11, 2.75);
const CHECK = canvasTex(256, 32, (x, w, h) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++){ x.fillStyle = (i + j) % 2 ? "#14101e" : "#f0eef6"; x.fillRect(i*16, j*16, 16, 16); } });
// the moon from the cover: big, lit from the right, craters
const MOON = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = 256; const x = cv.getContext("2d");

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = RACE; camInit = false; ME.scale.setScalar(1.8); ME.position.set(0, 7.5, -14); END.root.visible = false;
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little faster every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
function songT(){
  if (CFG.endless && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
let actHeld = false;
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; RACE.coast(dt); if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

  const big = new THREE.Mesh(boxUV(16, 110, 16), BLD[3]); big.position.set(-260, 0, RZ - 80); g.add(big); const top = sprite(0xff2a3a, 4); top.position.set(-260, 112, RZ - 80); g.add(top); END.blink.push(top);
  // the party boats going down the river, light trails behind them
  END.boats = [0, 1].map(k => { const b = new THREE.Group(), hull = new THREE.Mesh(new THREE.BoxGeometry(9, 1.2, 3), new THREE.MeshStandardMaterial({ color:0xe8e4f0, emissive:0x1a1a2a })); hull.position.y = .9; b.add(hull);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(5.6, 1.2, 2.4), BLD[1]); cab.position.y = 2; b.add(cab);
    for (let i = 0; i < 9; i++){ const l = sprite([0xff6a8a, 0xffd8a0, 0x9ad8ff][i % 3], .8); l.position.set(-4 + i, 2.9, 0); b.add(l); }
    for (let i = 0; i < 26; i++){ const s = sprite(i % 2 ? 0xff4a5a : 0xfff0e0, 1, .5); s.scale.set(2.2, .6, 1); s.position.set(5 + i*1.6, -.5, i % 2 ? .6 : -.6); s.material.opacity = .55*(1 - i/26); b.add(s); }
    b.position.set(-24 - k*50, 0, RZ - 12 - k*18); g.add(b); return b; });
  END.moon = moonAndClouds(g, new THREE.Vector3(-1, .36, -.12).normalize(), 950, 160);
  END.root = g;
}
END.blink = [];
function win(){
  if (S.end >= 0 || S.done) return;
  const r = RACE, c = r.car, st = r.st;
  S.end = 0; S.score += S.hearts*500 + ([3000, 2000, 1000][st.pos - 1] || 0); sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off"; say("FINISH", "P" + st.pos, 1.6, "g");
  // the line just ahead; the car rolls on 42 m, to a stop at the water
  const j = r.seg(c), h = r.H[j], u = r.along(c, j) + 6;
  r.kEnd = Math.max(.6, c.v/42);
  END.root.position.set(r.P[j].x + Math.sin(h)*u, 0, r.P[j].z - Math.cos(h)*u); END.root.rotation.y = -h; END.root.visible = true; END.root.updateMatrixWorld(true);
  // the city's street lamps and buildings past the water's edge go: the river is there now
  const inv = new THREE.Matrix4().copy(END.root.matrixWorld).invert();
  for (const k in r.vis) r.vis[k].traverse(o => { if (o.userData.city){ const p = o.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv); if (p.z < END.RZ + 12 || (p.x < -RACE.W/2 - 10 && p.z < END.RZ + 40)) o.visible = false; } });
  for (const m of r.moon) m.visible = false;
  for (const p of r.spk){ p.on = false; p.s.visible = false; } r.heart.on = false; r.heart.g.visible = false;
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  ME.userData.lights.rotation.y = t*2.5; ME.userData.beam.material.opacity = .14 + (beat ? .12 : 0); if (S.end < 0 && S.started) for (const m of RACE.moon) m.visible = true; ME.userData.under.material.opacity = .55 + (beat ? .3 : 0);
  G.render(dt, t);
  if (S.end >= 0){
    // the cover: at the water's edge, looking down the river to the moon; the saucer over the water, beam on
    const portrait = cam.aspect < .8, W = RACE.W, E = END.root, k = Math.min(1, dt*2), RZ = END.RZ;
    const tgt = E.localToWorld(new THREE.Vector3(-16, 8, RZ - 12)); ME.position.lerp(tgt, k); ME.scale.setScalar(ME.scale.x + (1.8 - ME.scale.x)*k);
    ME.userData.beam.visible = true; ME.userData.beam.scale.set(1, 2.2, 1); ME.userData.beam.position.y = -3.5;
    END.boats.forEach((b, i) => { b.position.x = -24 - i*50 - S.end*(4 + i*1.5); });
    for (const b of END.blink) b.visible = Math.floor(t*1.4 + b.position.y) % 2 === 0;
    CAMP.copy(E.localToWorld(new THREE.Vector3(portrait ? W/2 + 22 : W/2 + 10, portrait ? 5 : 3.6, RZ + (portrait ? 8 : 6))));
    CAML.copy(E.localToWorld(new THREE.Vector3(-260, portrait ? 52 : 40, RZ - 44)));
    if (S.end > 2.2 && !S.saidEnd){ S.saidEnd = true; say("LA NIGHT", "LAZY JO", 4.5, "t"); }
    if (S.end > END.out - 1.2){ $("flash").style.background = "#07051a"; $("flash").style.opacity = Math.min(1, (S.end - (END.out - 1.2))/1.2); }
  }
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.2 : 6)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause(); if (engine && ac) engine.g.gain.setTargetAtTime(0, ac.currentTime, .05);
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const st = RACE.st;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:Math.round(st.s) });
  const stat = fmt(st.s) + " m · " + st.drifts + " drifts · " + st.nitros + " nitros · " + st.passed + " overtakes";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> of racing &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "LA NIGHT";
  ps[0].innerHTML = "Finished <b>P" + st.pos + "</b> &middot; score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = (st.pos === 1 ? "First to the river." : "Over the line - " + (st.pos - 1) + (st.pos === 2 ? " car" : " cars") + " ahead of you. Nitro on the beat to catch them.") + "<br>Level 11 cleared: <b>Street Race &#8734;</b> is open in the gold Endless list.";
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x07051a); scene.fog = new THREE.Fog(0x1a1036, 90, 460);
  cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 3000);
  scene.add(new THREE.HemisphereLight(0x9a7aff, 0x1a0a14, .8));
  const key = new THREE.DirectionalLight(0xf0e0ff, .6); key.position.set(30, 60, -40); scene.add(key);
  ME = buildSaucer(); scene.add(ME);
  RACE.setup(); buildEnd();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input: one touch - hold anywhere (or Space) ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S && S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); actHeld = true; }, { passive:false });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { actHeld = false; });
addEventListener("keydown", e => { if ((e.key === " " || e.key === "ArrowUp" || e.key === "w") && !veilUp()){ e.preventDefault(); actHeld = true; } });
addEventListener("keyup", e => { if (e.key === " " || e.key === "ArrowUp" || e.key === "w") actHeld = false; });

$("go").addEventListener("click", () => {
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0; actHeld = false;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "LA NIGHT" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "A night race through the city, towards the moon, in Jo's silver car - its tail lights drawing a trail of light behind it. Seven cars start ahead of you: drift round the corners, hit the nitro on the beat and be first to the river." +
  (ENDLESS ? " <b>Endless:</b> the race never ends - faster every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "The car drives itself. <b>Hold</b> anywhere (or Space) to drift round the corner the saucer shines on - the arrows show which way. <b>Let go</b> when you face down the new street, on the beat for nitro. A wall costs a heart (3), bumping a car costs speed.";
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>
</body>

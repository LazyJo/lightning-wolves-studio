<style>
:root{color-scheme:dark}
html,body{height:100%}
body{margin:0; background:#120a2a; color:#fff0e8; overflow:hidden; font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
#cab{position:fixed; inset:0}
canvas{display:block; touch-action:none}
#hud{position:fixed; left:0; right:0; top:0; pointer-events:none; padding:16px 18px 30px; z-index:3; background:linear-gradient(180deg,#1a0a2aa8,#1a0a2a40 60%,transparent); display:flex; justify-content:space-between; align-items:flex-start; transition:opacity .4s}
#hud.off{opacity:0}
#m{font-family:Bungee,sans-serif; font-size:24px; color:#fff6f0; line-height:1; text-shadow:0 0 4px #1a0a2a, 0 0 12px #1a0a2a}
#ml{font-size:11px; letter-spacing:.18em; color:#ffe8c8; margin-top:3px; text-shadow:0 0 4px #1a0a2a, 0 0 8px #1a0a2a}
#hearts{font-size:18px; letter-spacing:.12em; margin-top:7px; color:#e0306a; text-shadow:0 0 8px #000; min-height:20px}
#hearts.hit{animation:hurt .5s}
@keyframes hurt{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{width:120px; height:6px; border-radius:3px; background:#ffc94a22; margin:4px 0 0 auto; overflow:hidden}
.bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#ffc94a,#ffc94a)}
.bl{font-size:11px; letter-spacing:.18em; color:#ffe8c8; text-align:right; text-shadow:0 0 4px #1a0a2a, 0 0 8px #1a0a2a}
#info{font-family:Bungee,sans-serif; font-size:14px; color:#fff3c8; margin-top:8px; text-align:right; text-shadow:0 0 3px #000, 0 0 8px #000, 0 0 16px #000}
body.gold .bar i{background:linear-gradient(90deg,#b8860b,#ffe08a)}
body.gold #m{color:#ffc83a}
/* the other player, top middle: both of you and your pairs */
#vs{position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:3; pointer-events:none; text-align:center; font-family:Bungee,sans-serif; color:#fff6f0;
  background:#1a0a2acc; border:1.5px solid #ffc83a55; border-radius:8px; padding:6px 12px; min-width:150px}
#vs .nm{display:block; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#ffe8c8; max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#vs .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
#vs .row + .row{margin-top:3px}
#vs .lt{font-size:16px; letter-spacing:.12em; color:#ffc83a44}
#vs .lt b{color:#ff6a8a; font-weight:400}
#vs .row.up .nm{color:#ffe08a}
#vs .row.up .nm::before{content:"\25B6  "}
#vs .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle}
#phase{position:fixed; left:0; right:0; bottom:0; padding:26px 0 calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(0deg,#1a0a2a99,transparent); text-align:center; pointer-events:none; z-index:3;
  font-family:Bungee,sans-serif; font-size:17px; letter-spacing:.06em; transition:opacity .3s; color:#ffc94a; text-shadow:0 0 3px #1a0a2a, 0 0 10px #1a0a2a, 0 2px 0 #1a0a2a}
#phase small{display:block; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:13px; letter-spacing:.18em; color:#fff6f0; margin-top:2px; text-shadow:0 0 3px #1a0a2a, 0 0 8px #1a0a2a}
#phase.ready{color:#ffe08a}
#phase.off{opacity:0}
#msg{position:fixed; left:0; right:0; top:24%; text-align:center; pointer-events:none; z-index:3; font-family:Bungee,sans-serif;
  font-size:26px; opacity:0; transition:opacity .25s; color:#ffc94a; text-shadow:0 0 3px #1a0a2a, 0 0 12px #1a0a2a, 0 2px 0 #1a0a2a; padding:0 16px}
#msg.on{opacity:1}
#msg.x{color:#ff6a7a}
#msg.g{color:#ffc83a}
#msg.t{font-size:clamp(30px,8vw,60px); color:#fff4ec; font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.18em; text-shadow:0 0 24px #ffc83a, 0 0 60px #ff9a5a, 0 2px 5px #120a2a}
#msg small{display:block; font-family:"Barlow Condensed",sans-serif; font-size:15px; letter-spacing:.14em; color:#fff6f0; margin-top:6px; text-shadow:0 0 3px #1a0a2a, 0 0 8px #1a0a2a}
#flash{position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0; background:#fff}
#veil{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; gap:14px; z-index:9; text-align:center; padding:24px; overflow-y:auto; color:#fff4ec;
  background:radial-gradient(50% 30% at 50% 20%, #8a4aff33 0%, transparent 70%), radial-gradient(120% 80% at 50% 25%, #5a2a9a 0%, #120a2a 70%)}
body.gold #veil{background:radial-gradient(60% 30% at 50% 62%, #ffc83a44 0%, transparent 60%), radial-gradient(120% 80% at 50% 25%, #3a2a10 0%, #120c04 70%)}
#veil .sp{flex:1 0 0; display:block}
#veil .by{letter-spacing:.42em; font-size:14px; color:#ffe8c8; margin:0 0 -8px}
#veil h1{font-family:Bungee,sans-serif; font-weight:400; margin:0; font-size:clamp(32px,10vw,60px); line-height:1; color:#fff6f0; text-shadow:0 0 22px #ffc83a, 0 0 50px #ff9a5a}
body.gold #veil h1{text-shadow:0 0 24px #ffb000}
#veil p{margin:0; color:#fff0e8; font-size:17px; max-width:42ch}
#veil b{color:#ffc94a}
#go{font-family:Bungee,sans-serif; font-size:19px; background:linear-gradient(180deg,#ffe08a,#ff9a5a); color:#2a1a00; border:0; border-radius:4px; padding:15px 36px; cursor:pointer; box-shadow:0 0 24px #ffc94a66}
#go:disabled{opacity:.45; cursor:default; box-shadow:none}
#go.alt{background:none; color:#ffc94a; border:1.5px solid #ffc94a; font-size:15px; padding:12px 30px; box-shadow:none}
.alt2{font-family:"Barlow Condensed",sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:14px; background:none; color:#fff0e8;
  border:1.5px solid #fff0e866; border-radius:4px; padding:9px 18px; cursor:pointer}
#net{font-size:16px; color:#fff0e8; max-width:42ch; min-height:20px}
#net b{color:#ffe08a}
#net .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ad07a; margin-right:6px; vertical-align:1px}
#net.wait .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#veil small{color:#ffe8c8; letter-spacing:.14em; text-transform:uppercase; font-size:12px}
#parts, #sizes{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
#parts button, #sizes button{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:14px; letter-spacing:.1em; text-transform:uppercase; padding:8px 14px; border-radius:4px; cursor:pointer;
  color:#fff0e8; background:none; border:1.5px solid #ffc94a55}
#parts button[aria-pressed="true"], #sizes button[aria-pressed="true"]{color:#fff; border-color:#ffc94a; background:#ffc94a22}
#parts button.gold{color:#ffe08a; border-color:#e0a41a99}
#parts button.gold[aria-pressed="true"]{background:#e0a41a33; border-color:#ffe08a}
/* after the song: the song, the merch, the fans. Plain links - nothing in the game
   is ever traded for a stream, same rule as the rest of JAVEDA. */
#outs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:360px}
#outs a{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:15px; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; padding:10px 14px; border-radius:4px; border:1.5px solid}
#outs .spot{color:#4ade80; border-color:#1db95499; background:#1db9541c}
#outs .merch{color:#ffd60a; border-color:#ffd60a80; background:#ffd60a14}
#outs .even{color:#ff7ac2; border-color:#ff3d8b80; background:#ff3d8b14}
#outs .disc{color:#b9c2ff; border-color:#7b8cff80; background:#5865f214}
#home{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:15px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; color:#ffc94a; padding:9px 22px;
  border-radius:4px; border:1.5px solid #ffc94a99; background:#ffc94a14}
#veil a:focus-visible, #veil button:focus-visible{outline:2px solid #ffe08a; outline-offset:3px}
@media (max-height:520px){ #veil{gap:9px; padding:14px} #veil p{font-size:15px} #veil h1{font-size:38px} #outs{max-width:none} }
@media (max-width:520px){ #vs{top:auto; bottom:calc(58px + env(safe-area-inset-bottom))} }
@media (prefers-reduced-motion:reduce){ #msg, #phase{transition:none} #net.wait .dot{animation:none} }
@media (max-width:520px){ #hud{top:0} }
/* the coach: what to do right now, in words */
#coach{position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:3; pointer-events:none; text-align:center; width:max-content; max-width:min(680px,62vw);
  background:#1a0a2ae0; border:1.5px solid #ff9a5a66; border-radius:10px; padding:7px 14px 8px; font-size:16px; line-height:1.35; color:#fff4ec; box-shadow:0 4px 18px #1a0a2a55}
#coach big{font-family:Bungee,sans-serif; font-size:22px; color:#ffc94a; vertical-align:-2px}
#coach b{color:#ffe08a}
#coach .s{font-size:13.5px; color:#ffd8c0}
#coach .r{color:#ff7a8a; font-weight:700}
#coach .bl{color:#ff9a5a; font-weight:700}
.gd,.bd{display:inline-block; width:11px; height:11px; border-radius:50%; border:1.5px solid #fff; margin:0 4px 0 2px; vertical-align:-1px}
.gd{background:#ffc020} .bd{background:#8a4aff}
@media (max-width:640px){ #coach{top:auto; bottom:calc(58px + env(safe-area-inset-bottom)); max-width:calc(100vw - 20px); font-size:14px; padding:6px 10px} #coach big{font-size:18px} #coach .s{font-size:12px} }
.hid{display:none!important}
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ================= GO! =================
   Level 28 of JAVEDA, the last song, in the world of the cover: the city at sunset seen from high over the towers -
   the sky deep purple overhead going to the fire of the sunset, the towers lit, the spires with their red lights - in
   the cinematic 3D Jo approved. No face is shown and there's no saucer in the games (Jo). Jo picked two:
   PART 1 · ROOFTOP GOLF: nine holes on the roofs, each with something new - ledges, the air-con, boost pads, portals,
     the gap, the wind, the windmill, and the spire where the cup won't keep still.
   PART 2 · SKY HOCKEY (?part=2): air hockey on a roof against the shadow, round after round, each with something new -
     two pucks, bumpers, the golden puck, the wind, portal walls, the split, and the final with everything.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once both are cleared.
   ONLINE (?online=golf|golf3|golf4|hockey, from the JAVEDA page, logged in): Golf for 2, 3 or 4 - the same nine holes
   at the same time, the others' balls ghosts on yours, the fewest strokes takes the hole; Hockey 1v1 - one table, each
   of you at your own end, the rounds the same as against the shadow. A quick match against real players - never
   made-up ones. */

// the song's grid, measured (SONG.md): 80.5 BPM, the 1 at -0.007 s; 56 bars, 2:47
const GRID = { bpm:80.5, t0:-0.007 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(52);                      // the outro: the cover
const LOOP = [barT(4), barT(52)];             // endless and online: round and round, the last hook back into the first
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: the hook (4-11, 24-31, 44-51), the verses, the breaks with no kick (20-23, 40-43),
// the breakdown with no bass (32-35)
const SECTIONS = [[4, "calm"], [12, "hook"], [20, "loud"], [24, "calm"], [32, "hook"], [36, "calm"], [40, "loud"], [44, "calm"], [52, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const hookAt = t => section(t) === "hook";
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const OMODES = { golf:"golf", golf3:"golf3", golf4:"golf4", hockey:"hockey" };
const ONLINE = OMODES[Q.get("online")] || null;
const PRACTICE = !ONLINE && OMODES[Q.get("practice")] || null;
const GOLF_N = { golf:2, golf3:3, golf4:4 }[ONLINE] || 0;      // online golf: 2, 3 or 4 players
const MODE_NAME = m => m === "hockey" ? "HOCKEY 1v1" : m === "golf" ? "GOLF 1v1" : "GOLF · " + m.slice(4) + " PLAYERS";
const PART = ONLINE === "hockey" || PRACTICE === "hockey" ? 2 : ONLINE || PRACTICE ? 1 : { "2":2 }[Q.get("part")] || 1;
const ENDLESS = !ONLINE && !PRACTICE && Q.get("endless") === "1";
const NAMES = ["", "Rooftop Golf", "Sky Hockey"], IDS = ["", "lvl28", "lvl28b"];
const CFG = ONLINE ? { id:"lvl28" + ONLINE, title:NAMES[PART] + (GOLF_N > 2 ? " · " + GOLF_N + " players" : " 1v1"), by:"LEVEL 28 · ONLINE " + (GOLF_N > 2 ? GOLF_N + " PLAYERS" : "1v1"), online:ONLINE }
  : PRACTICE ? { id:"lvl28" + PRACTICE, title:NAMES[PART], by:"LEVEL 28 · WARM UP", practice:PRACTICE }
  : ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 28" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 28" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 28" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerp = (a, b, k) => a + (b - a)*k;

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl28.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [116.5, 87.3, 98, 130.8];            // a rising loop, at sunset
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe

/* ---------------- online golf: 2, 3 or 4 players ----------------
   The same nine holes for everyone at the same time; the others' balls are ghosts on yours, each in its own colour.
   Each says how many strokes it took them (a hole run out of time, or picked up, counts 9); when everyone has, the
   fewest strokes takes the hole (a tie for the fewest is nobody's) and all go on together. Nine holes: the most holes
   wins, then the fewest strokes. Someone who leaves a 3 or 4 player game counts 9 on every hole left, and the rest
   play on. */
const SEAT_COLS = [0xff6ac8, 0x40d0ff, 0x9dff6a, 0xffa040];          // the others' ghost balls and their dots on the board
const ORD = n => n + (["", "ST", "ND", "RD"][n] || "TH");                  // 1ST ... 4TH
const GV = {
  won:[0, 0], total:[0, 0], got:{}, ghosts:{}, nextAt:0, sentAt:0,
  init(){ const N = NET.players.length; this.won = Array(N).fill(0); this.total = Array(N).fill(0); this.got = {}; this.ghosts = {}; },
  nm(i){ return i === NET.seat ? "You" : esc(NET.players[i].name); },
  // the strokes on hole n: mine, theirs (9 for someone who's gone)
  sc(n, i){ const g = this.got[n] || {}; return g[i] != null ? g[i] : NET.gone[NET.players[i].id] ? 9 : null; },
  all(n){ return NET.players.every((p, i) => this.sc(n, i) != null); },
  mine(n, s){ (this.got[n] = this.got[n] || {})[NET.seat] = s; NET.send("ev", { k:"hole", n, s });
    if (!this.all(n)) say(s >= 9 ? "WAITING" : "IN - WAITING", "for " + (NET.players.length > 2 ? "the others" : esc(NET.oppName())) + " to finish the hole", 30);
    this.check(n); },
  hear(p){ const i = NET.seatOf(p.from); if (i < 0 || i === NET.seat) return;
    if (p.k === "pos"){ this.ghosts[i] = { n:p.n | 0, x:+p.x || 0, y:+p.y || 0, holed:!!p.h }; return; }
    if (p.k === "hole"){ const n = p.n | 0, g = this.got[n] = this.got[n] || {}; if (g[i] != null) return; g[i] = Math.max(1, p.s | 0);
      if (g[NET.seat] == null) say(esc(NET.players[i].name).toUpperCase() + " IS IN", "in " + g[i] + (g[i] === 1 ? " stroke" : " strokes"), 1.2);
      this.check(n); } },
  dropped(){ this.check(GOLF.n); },
  check(n){ if (!this.all(n) || n !== GOLF.n || this.nextAt) return;
    const sc = NET.players.map((p, i) => this.sc(n, i)), best = Math.min(...sc), top = sc.flatMap((s, i) => s === best ? [i] : []), w = top.length === 1 ? top[0] : -1;
    sc.forEach((s, i) => this.total[i] += s); if (w >= 0) this.won[w]++;
    const line = NET.players.length > 2 ? "best " + best + (best === 1 ? " stroke" : " strokes") : sc.map(s => s >= 9 ? "-" : s).join(" v ") + " · " + this.won.join(" - ");
    say(w === NET.seat ? "HOLE " + (n + 1) + " IS YOURS" : w >= 0 ? "HOLE " + (n + 1) + " TO " + esc(NET.players[w].name).toUpperCase() : "HOLE " + (n + 1) + " HALVED", line, 1.6, w === NET.seat ? "g" : w >= 0 ? "x" : "");
    if (w === NET.seat) sfx.big(); this.nextAt = S.t + 1.8; },
  tick(t){ const g = GOLF.g; if (t - this.sentAt > .12){ this.sentAt = t; NET.send("ev", { k:"pos", n:GOLF.n, x:+g.bx.toFixed(3), y:+g.by.toFixed(3), h:g.holed ? 1 : 0 }); }
    if (this.nextAt && t >= this.nextAt){ this.nextAt = 0; if (GOLF.n >= 8){ NET.over(); return; } GOLF.load(GOLF.n + 1); say("HOLE " + (GOLF.n + 1) + " · " + GOLF.H.name, "par " + GOLF.H.par + " · " + GOLF.H.tip, 2, GOLF.H.gold ? "g" : ""); } },
  watching(){ return false; },
  // the table: most holes, then fewest strokes

  place(i){ return 1 + NET.players.filter((p, j) => this.better(j, i)).length; },
  order(){ return NET.players.map((p, i) => i).sort((a, b) => this.better(a, b) ? -1 : this.better(b, a) ? 1 : a - b); },
  result(){ const me = NET.seat, N = NET.players.length, pl = this.place(me), shared = NET.players.some((p, j) => j !== me && this.place(j) === pl);
    if (N === 2){ const o = 1 - me; return { my:this.won[me], their:this.won[o], res:this.better(me, o) ? "win" : this.better(o, me) ? "loss" : "draw" }; }
    return { my:this.won[me], place:pl, shared, res:pl === 1 ? (shared ? "draw" : "win") : "loss" }; },
  rows(){ return this.order().map(i => [this.nm(i) + (NET.gone[NET.players[i].id] ? " (left)" : ""), this.won[i], i === NET.seat, i === NET.seat ? 0xfff2d0 : SEAT_COLS[i]]); }

/* ---------------- online 1v1: hockey ----------------
   One table, each of you at your own end (each screen is the other turned round). The first player's game runs the
   table - the pucks, the goals, the rounds - and sends it ~20 times a second; the second sends where their striker is.
   The rounds are the same as against the shadow. First to 3 rounds wins. */
const HV = {
  opp:null, st:null, stAt:0, sentAt:0, nextAt:0, ended:false,
  host(){ return NET.seat === 0; },
  event(e){ if (this.host()) NET.send("ev", e); },
  // (the host) a round is over: the match, or the next one

    if (S.rounds[w] >= 3){ this.ended = true; NET.send("ev", { k:"over", rw:S.rounds.slice() }); setTimeout(() => NET.over(), 1200); return; }
    this.nextAt = t + 1.8; },
  hear(p){ const h = HOCKEY.h;

    if (p.k === "goal"){ const who = 1 - (p.who | 0), k = p.n | 0 || 1; h.sc = [p.sc[1] | 0, p.sc[0] | 0];
      if (who === 0){ S.goals += k; S.got++; say(k > 1 ? "GOLDEN GOAL" : "GOAL", h.sc[0] + " - " + h.sc[1], .9, "g"); sfx.big(); } else { S.against += k; say(esc(NET.oppName()).toUpperCase() + " SCORES", h.sc[0] + " - " + h.sc[1], .9, "x"); sfx.bad(); } return; }
    if (p.k === "round"){ const w = 1 - (p.w | 0); S.rounds = [p.rw[1] | 0, p.rw[0] | 0];
      say(w === 0 ? "ROUND " + (S.rd + 1) + " IS YOURS" : "ROUND " + (S.rd + 1) + " TO " + esc(NET.oppName()).toUpperCase(), S.rounds[0] + " - " + S.rounds[1], 1.6, w === 0 ? "g" : "x"); return; }
    if (p.k === "over"){ S.rounds = [p.rw[1] | 0, p.rw[0] | 0]; setTimeout(() => NET.over(), 1200); } },
  tick(dt, t){ const h = HOCKEY.h;
    if (this.host()){
      if (this.ended) return;
      if (this.opp){ const ox = h.ax, oy = h.ay, k = Math.min(1, dt*30); h.ax = lerp(h.ax, clamp(this.opp.x + this.opp.vx*.05, -HW/2 + HR, HW/2 - HR), k); h.ay = lerp(h.ay, clamp(this.opp.y + this.opp.vy*.05, HR + .05, HH/2 - HR), k); h.avx = dt ? (h.ax - ox)/dt : 0; h.avy = dt ? (h.ay - oy)/dt : 0; }
      if (this.nextAt){ if (t >= this.nextAt){ this.nextAt = 0; HOCKEY.newRound(S.rd + 1); } }
      else if (!h.sd && t - h.clockAt > H_CLOCK*BAR){ if (h.sc[0] === h.sc[1]){ h.sd = true; say("LEVEL", "the next goal takes it", 1, "g"); } else HOCKEY.roundOver(t, true); }
      HOCKEY.sim(dt, t);
      if (t - this.sentAt > .05){ this.sentAt = t; NET.send("ev", { k:"st", rd:S.rd, sc:h.sc, sd:h.sd, m:[+h.mx.toFixed(3), +h.my.toFixed(3)], p:h.pucks.map(q => [+q.x.toFixed(3), +q.y.toFixed(3), +q.vx.toFixed(2), +q.vy.toFixed(2), q.gold ? 1 : 0]) }); }

/* ---------------- online: finding players ----------------
   Supabase Realtime, the same log-in as the JAVEDA page. Everyone looking for a mode is in its lobby (javeda28-golf,
   -golf3, -golf4, -hockey); oldest first, they're put together in twos (threes, fours) and meet in their own room. The
   one who came first (seat 0) sends "go" with the match id, the seed and who's in it; the others "ack", and after a
   count of three all play. A heartbeat every second: 15 s of silence or a closed page and that player's gone - in a

   JAVEDA page. Nobody is ever invented here: no bots, no fake names. Not enough players there means waiting. */

    const { data } = await this.sb.auth.getSession();
    if (!data || !data.session){ this.status("<b>Log in</b> on the JAVEDA page to play online - the result goes on your account."); return; }
    this.me = data.session.user.id;
    const p = await this.sb.from("javeda_players").select("username").eq("user_id", this.me).maybeSingle();
    if (!p.data){ this.status("Make your player on the JAVEDA page first (a name and a picture)."); return; }

    this.status("Playing as <b>" + esc(this.name) + "</b>. Quick match finds you " + (this.size > 2 ? (this.size - 1) + " real players." : "a real player."));
    $("go").disabled = false;

  send(event, payload){ if (this.room) try { this.room.send({ type:"broadcast", event, payload:Object.assign({ from:this.me }, payload) }); } catch(e){} },
  chan(name){ return this.sb.channel(name, { config:{ presence:{ key:this.me }, broadcast:{ self:false } } }); },
  // the lobby: everyone looking for this mode right now
  seek(){

  },
  waiting(){ const st = this.lobby.presenceState(), out = [];

  pair(){

      : lone ? "Looking for players&hellip; <b>" + L.length + " of " + N + "</b> here" + (L.length < 2 ? " - nobody else is looking right now" : "") + ". Stay here - it starts when there are " + N + "."

  },
  join(name, seat, group){

  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();

      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the wings open slowly; the camera comes in behind him, as on the cover
      const u = clamp((S.end - 1.2)/4, 0, 1), e = 1 - Math.pow(1 - u, 3), portrait = cam.aspect < .8;
      animAngel(END.hero, t, .3 + .7*e, 0, 0);
      cam.fov = 38; cam.updateProjectionMatrix();
      cam.position.set(0, ROOF + (portrait ? .35 : .8) + (1 - e)*3, (portrait ? 6.4 : 4.4) + (1 - e)*6); cam.lookAt(0, ROOF + (portrait ? 2.9 : 1.6), -4.2);      // a phone: from lower, looking up - the sky, not the roof
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("GO!", "LAZY JO", 4.5, "t"); }
    }
  } else G.render(t);
  renderFrame(t);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by):not(#net)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless && !ONLINE);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off"; $("vs").classList.add("hid"); $("net").classList.add("hid");
  if (ONLINE){
    go.textContent = "Find another match"; $("practice").classList.remove("hid");
    const them = esc(NET.oppName()), mode = MODE_NAME(ONLINE), many = NET.players.length > 2;
    if (NET.state === "left"){
      v.querySelector(".by").textContent = mode + " · NO RESULT";
      v.querySelector("h1").textContent = many ? "THEY ALL LEFT" : "THEY LEFT";
      ps[0].innerHTML = many ? "Everyone else left the game." : "<b>" + them + "</b> " + esc(NET.why || "left the match") + ".";
      ps[1].innerHTML = "No result and no points either way.";
      return;
    }
    const r = NET.result, unit = GOLF_N ? " holes" : " rounds";
    if (many){
      // the table: place, name, holes (strokes)
      v.querySelector(".by").textContent = mode;
      v.querySelector("h1").textContent = r.res === "win" ? "YOU WIN" : ORD(r.place) + (r.shared ? "=" : "") + " OF " + NET.players.length;
      ps[0].innerHTML = GV.order().map(i => ORD(GV.place(i)) + " <b>" + GV.nm(i) + "</b> " + GV.won[i] + (GV.won[i] === 1 ? " hole" : " holes") + " (" + GV.total[i] + ")" + (NET.gone[NET.players[i].id] ? " - left" : "")).join("<br>");
      ps[1].innerHTML = (HUB ? "It goes on your account once the results are in." : "Play from the JAVEDA page to put it on your account.") + " Most holes wins; level on holes, the fewest strokes (in brackets).";
      return;
    }
    v.querySelector(".by").textContent = mode + " · VS " + NET.oppName().toUpperCase();
    v.querySelector("h1").textContent = { win:"YOU WIN", loss:"YOU LOSE", draw:"A DRAW" }[r.res];
    ps[0].innerHTML = "You <b>" + r.my + "</b>" + unit + " &middot; " + them + " <b>" + r.their + "</b>" + unit + (GOLF_N && r.my === r.their ? " &middot; strokes " + GV.total[NET.seat] + " v " + GV.total[1 - NET.seat] : "");
    ps[1].innerHTML = HUB ? (r.res === "win" ? "A win is <b>+25 points</b> once both of your results are in. " : r.res === "draw" ? "A draw is <b>+5 points</b> each. " : "") + "It counts on the <b>Online 1v1</b> board."
      : "Play from the JAVEDA page to put it on your account.";
    return;
  }
  if (HUB && !PRACTICE) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:S.got });
  if (PRACTICE){ $("practice").textContent = "Back online"; $("practice").classList.remove("hid"); }
  const stat = PART === 1 ? S.holes + (S.holes === 1 ? " hole" : " holes") + " in " + S.strokes + " strokes" + (S.aces ? " · " + S.aces + " in one" : "") + (S.under ? " · " + S.under + " under par" : "")
    : S.goals + (S.goals === 1 ? " goal" : " goals") + " · " + S.rounds[0] + " of " + (S.rounds[0] + S.rounds[1]) + " rounds won";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the roofs &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = (PRACTICE ? "WARM-UP" : CFG.by) + " COMPLETE";
  v.querySelector("h1").textContent = "GO!";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = PRACTICE ? "Warmed up. Now go and find someone." : (PART === 2 ? "The shadow's beaten." + "<br>Level 28 cleared: <b>Rooftop Golf &#8734;</b> and <b>Sky Hockey &#8734;</b> are open in the gold Endless list." : "Every hole on the roofs." + "<br>Part 2, <b>Sky Hockey</b>, is open.");
}

/* ---------------- input ---------------- */
// Golf: a finger down anywhere, pull back, let go. Hockey: the striker follows a finger (or the mouse); the arrows too
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
let down = false;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); down = true; G.point(e.clientX, e.clientY); if (G.down) G.down(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return; if (down || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { down = false; if (G.release) G.release(); });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k && !veilUp()){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

function startGame(){
  reset();
  if (ONLINE){ for (const p of NET.early) OV.hear(p); NET.early = []; }
  $("veil").classList.add("hid"); $("hud").classList.remove("off"); if (ONLINE){ $("vs").classList.remove("hid"); lastVs = ""; $("ml").textContent = ONLINE === "golf" ? "SCORE" : "SCORE"; }
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB && !PRACTICE && !ONLINE) toHub({ type:"javeda:start", level:CFG.id });
  if (GOLF_N) say(MODE_NAME(ONLINE), "the same holes at the same time - the fewest strokes takes the hole", 2.6, "g");
  else if (ONLINE) say("HOCKEY 1v1", "first to 3 rounds - you're at the near end", 2.6, "g");
  else if (CFG.endless) say("ENDLESS", PART === 1 ? "the holes never stop" : "the rounds never stop", 2.5, "g");
}
$("go").addEventListener("click", () => {
  if (ONLINE){ if (NET.state === "ready") NET.seek(); else if (NET.state === "done" || NET.state === "left") location.reload(); return; }
  startGame();
});
// online: warm up on your own (nothing is saved), and back
$("practice").addEventListener("click", () => {
  const q = new URLSearchParams(location.search);
  if (ONLINE){ q.delete("online"); q.set("practice", ONLINE); } else { q.delete("practice"); q.set("online", PRACTICE); }
  location.search = q.toString();
});
$("by").textContent = ONLINE ? CFG.by : "LAZY JO · " + (PRACTICE ? "WARM-UP" : CFG.by);
$("title").textContent = ONLINE ? MODE_NAME(ONLINE) : "GO!" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = ONLINE === "golf" ? "<b>GOLF 1v1:</b> you and a real player, found by quick match, on the same nine holes over the city at the same time - their ball is the pink ghost on yours. The fewer strokes takes the hole; after nine, the most holes wins (level: the fewest strokes)."
  : GOLF_N ? "<b>GOLF · " + GOLF_N + " PLAYERS:</b> you and " + (GOLF_N - 1) + " real players, found by quick match, on the same nine holes over the city at the same time - theirs are the coloured ghost balls on yours. The fewest strokes takes the hole (a tie for the fewest is nobody's); after nine, the most holes wins, then the fewest strokes. It starts when there are " + GOLF_N + " - nobody is made up."
  : ONLINE === "hockey" ? "<b>HOCKEY 1v1:</b> you and a real player, found by quick match, one air hockey table on a roof - you at the near end, them at the far end. First to 3 goals takes a round, and every round has something new; first to 3 rounds wins."
  : "The city at sunset from the cover, high over the towers - the sky going from purple to fire, the towers lit." +
    [" <b>Part 1 · Rooftop Golf:</b> nine holes on the roofs, every one with something new.", " <b>Part 2 · Sky Hockey:</b> air hockey on a roof against the shadow, round after round."][PART - 1] +
    (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = PART === 1
  ? "<b>Put a finger down anywhere, pull back and let go</b> to putt the ball of light - the further you pull, the harder; the dots show the line. Each hole has something new: ledges, the sliding air-con, gold boost pads, portals, the gap, the wind, the windmill, and the spire where the cup won't keep still. Fewer strokes, more points. A hole has 8 bars: out of time, or 8 strokes, costs a heart (3)."
  : "<b>Move your golden striker</b> (drag, the mouse, or the arrow keys) and hit the puck of light into the far goal. First to 3 takes a round - and every round has something new: two pucks, bumpers, the golden puck, the wind, portal walls, the split, the final. The shadow gets quicker every round. Losing a round costs a heart (3).";
if (!HUB && !ONLINE && !PRACTICE){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
if (PRACTICE){ $("practice").textContent = "Back online"; $("practice").classList.remove("hid"); }
// golf: alone, or online with 1, 2 or 3 others
if (PART === 1 && !ENDLESS && !PRACTICE){
  $("sizes").classList.remove("hid");
  document.querySelectorAll("#sizes button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.size === (ONLINE || "")));
    // on the JAVEDA page, the page opens it (so it knows what's being played); on its own, the address changes
    b.addEventListener("click", () => { if (b.dataset.size === (ONLINE || "")) return;
      if (HUB){ song.pause(); toHub({ type:"javeda:play", level:"lvl28" + b.dataset.size }); return; }
      const q = new URLSearchParams(location.search); for (const k of ["online", "practice", "part", "endless"]) q.delete(k);
      if (b.dataset.size) q.set("online", b.dataset.size); location.search = q.toString(); });
  });
}
G = PART === 2 ? HOCKEY : GOLF; G.setup(); ME = buildSaucer(); buildEnd();
reset();
if (ONLINE) NET.init();
requestAnimationFrame(frame);
</script>

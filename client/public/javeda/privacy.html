<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Privacy · JAVEDA</title>
<meta name="description" content="What JAVEDA, Lazy Jo's playable album, keeps about you, where, for how long, and how to delete it.">
<link rel="canonical" href="https://lightningwolves.studio/javeda/privacy.html">
<meta name="theme-color" content="#050b1e">
<link rel="icon" href="/javeda/avatars/saucer.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--navy:#050b1e; --panel:#0b1630; --line:#ffffff1f; --ink:#eaf4ff; --dim:#a9c3e3; --mute:#7f9cc0; --gold:#ffd60a; --beam:#67c8ff; --blue:#2f8fe0;
  --display:"Bungee","Arial Black",sans-serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --ui:"Barlow",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--navy)}
body{margin:0; background:radial-gradient(120% 60% at 50% 0%,#0f2350 0%,var(--navy) 60%); color:var(--ink); font:400 16.5px/1.6 var(--ui); min-height:100vh}
.wrap{max-width:760px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 18px 60px}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:26px}
.logo{font:400 26px/1 var(--display); color:#fff; text-decoration:none; letter-spacing:.02em}
.lang{position:relative; display:flex; border:1px solid var(--line); border-radius:999px; background:var(--panel)}
.lang select{appearance:none; -webkit-appearance:none; border:0; background:transparent; color:var(--dim); font:700 13px/1 var(--cond); letter-spacing:.06em; padding:8px 26px 8px 12px; cursor:pointer}
.lang select:focus-visible{outline:2px solid var(--blue); border-radius:999px}
.lang option{color:#041024; background:#fff}
.lang::after{content:""; position:absolute; right:11px; top:50%; width:6px; height:6px; margin-top:-5px; border:solid var(--dim); border-width:0 2px 2px 0; transform:rotate(45deg); pointer-events:none}
h1{font:400 clamp(30px,7vw,46px)/1.05 var(--display); margin:0 0 8px}
.date{font:700 13px/1 var(--cond); letter-spacing:.2em; text-transform:uppercase; color:var(--mute); margin:0 0 18px}
.lead{font-size:18px; color:var(--dim); margin:0 0 26px}
.short{background:var(--panel); border:1px solid #ffd60a55; border-left:3px solid var(--gold); border-radius:10px; padding:14px 18px; margin:0 0 30px}
.short h2{margin-top:0}
.short ul{margin:0; padding-left:20px}
h2{font:700 15px/1.2 var(--cond); letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:30px 0 8px}
p, li{color:var(--ink)}
ul{padding-left:20px}
li{margin:4px 0}
a{color:var(--beam)}
b{color:#fff}
.small{color:var(--mute); font-size:14px}
.back{display:inline-block; margin-top:34px; font:700 15px/1 var(--cond); letter-spacing:.16em; text-transform:uppercase; text-decoration:none; color:#041024; background:var(--blue); padding:12px 18px; border-radius:6px}
</style>
</head>

<script>
/* The same page in eight languages. What it says has to stay true: when the game starts keeping something new,
   this page changes with it (and the date at the top). */
const DATE = {"en": "Last updated 8 November 2026", "nl": "Laatst bijgewerkt op 8 november 2026", "fr": "Mis à jour le 8 novembre 2026", "es": "Actualizado el 8 de noviembre de 2026", "it": "Aggiornato l'8 novembre 2026", "ja": "2026年11月8日更新", "zh": "更新于2026年11月8日", "tw": "更新於2026年11月8日"};
const REPORT = '<a href="/javeda/#report">';
const T = {
en:{ title:"Privacy", back:"Back to JAVEDA",
lead:"JAVEDA is Lazy Jo's playable album at lightningwolves.studio/javeda. This page says, in plain words, what the game keeps about you, where it is kept, for how long, and how to get it deleted.",
short:["<b>Without an account</b>, your progress stays on your phone. Nothing about you is kept on our side, except crash reports (see below).",
 "<b>With an account</b> we keep your email, your player name and picture, and your scores and progress. Your name, picture and scores are on the public scoreboard.",
 "<b>No ads, no tracking, nothing sold.</b> We use your data only to run the game.",
 "<b>Delete it any time:</b> Profile &rarr; Delete my account."],
s:[
["Who looks after your data", "JAVEDA is made by Lazy Jo (Lightning Wolves). For any question about your data, or to ask for a copy of it, use "+REPORT+"Report a problem</a> at the bottom of the JAVEDA page and choose <b>My data (privacy)</b>. Leave your email if you want an answer."],
["Playing without an account", "You can play the whole album as a guest. Your progress, best scores, player name and picture are kept <b>on your phone only</b> (in the browser's storage). If you clear your browser's data, or switch phones or browsers, they are gone. On an iPhone, the app on your home screen keeps its own save, apart from Safari."],
["With an account", "To save your progress everywhere and get on the scoreboard, you can make a free Lightning Wolves account (the same login as the Wolf Hub). We keep:<ul><li>your <b>email</b> and your <b>password</b> (the password is stored scrambled by our login service, so nobody can read it - not us either). If you log in with Google, we get your email and name from Google;</li><li>your <b>player name</b> and <b>picture</b>;</li><li>your <b>progress and scores</b>: which levels you cleared, your best score and stars, your runs (score, distance, time), daily challenge scores, online 1v1 results, the pictures you bought with points, and the levels a daily challenge kept open for you;</li><li>if you have one, your <b>JAVEDA Pass</b> (how you got it).</li></ul>Your player name, picture, points and scores are <b>public</b>: anyone can see them on the scoreboards. Your email is never shown to other players. Lazy Jo can see the email of each account, to help you with your account and - only if you asked for it - to send you JAVEDA news."],
["News by email", "Only if you switch on <b>Email me JAVEDA news</b> in your profile. Switch it off there any time; every news email also says how."],
["Notifications", "Only if you allow them on your phone: the installed app asks once, and you can also turn them on on the daily challenge card or in your player. We then keep your phone's <b>push address</b> (made by your browser - it says nothing about you), your language, your time zone (so messages come in your morning and not at night) and what you asked for, and, when you're logged in, which player it belongs to. The messages go through your phone's own push service (Google, Apple, Mozilla or Microsoft, depending on the browser). Turn them off in your player or in your phone's settings; deleting your account forgets them too."],
["Online games", "When you play online (1v1, golf with friends, a private room), your player name, picture and what you do in the game are sent live to the other players in that game. Anyone with the link to a private room can join it."],
["The JAVEDA Pass and payments", "If you buy the JAVEDA Pass, the payment is handled by <b>Stripe</b>. We never see your card. We only learn that the payment went through, and keep that your account has the Pass."],
["The app", "If you put JAVEDA on your home screen, the game counts it: a random number for that phone (not your phone number or anything about you), whether it's an iPhone, Android or computer, and how often the app is opened - linked to your account if you are logged in. For playing offline, the app saves the game and the songs on your phone; that stays on your phone."],
["Crash reports and Report a problem", "When something breaks in the game, it sends a <b>crash report</b> by itself, so it can be fixed. It holds: the error and where in the game's code it happened, the level and page, the kind of phone and browser (for example \"iPhone, iOS 17, Safari\"), the language, whether it's the app, and your account if you are logged in. Nothing else - no location, no contacts, nothing from other apps.<br>When <b>you</b> send "+REPORT+"Report a problem</a>, we get what you write, the level you choose, the same phone and browser info, your account if you are logged in, and your email only if you fill it in."],
["What stays on your phone", "The game keeps these in your browser, on your phone or computer: your guest progress, the language you picked, your sound settings, your log-in (so you stay logged in), runs played offline that are waiting to be sent, and the offline copy of the game and its songs. There are <b>no advertising or tracking cookies</b>, and no analytics trackers."],
["Services we use", "These companies run parts of JAVEDA for us and only handle your data for that:<ul><li><b>Supabase</b> - the database and the log-in (servers in the EU), and the songs;</li><li><b>Vercel</b> - hosts the website (like every website, its servers see your IP address when you visit);</li><li><b>Stripe</b> - payments for the Pass;</li><li><b>Google Fonts</b> - the letters the game uses are loaded from Google, which sees your IP address;</li><li><b>Cloudflare (cdnjs)</b> and <b>jsDelivr</b> - deliver two code libraries the game runs on (3D graphics and the log-in), which also see your IP address;</li><li><b>Google</b> - only if you choose to log in with Google.</li></ul>Some of these may handle data outside the EU; they do so under the EU's rules for that."],
["How long", "Your account and everything in it: until you delete your account. Crash reports and problem reports: deleted after 180 days. The app count keeps its numbers, but the link to your account goes when you delete your account. A guest's progress stays on the phone until you clear it."],
["Your rights", "You can see and change your player name and picture in your profile, and <b>delete your account</b> there (Profile &rarr; Delete my account): your player, scores, progress and runs are deleted straight away, and your login too unless you also use it for the Lightning Wolves Studio or the Wolf Hub. You can also ask for a copy of your data, or ask us to correct or delete something, through "+REPORT+"Report a problem</a> (choose My data). If you think we got something wrong, you can complain to the data protection authority in your country."],
["Children", "Anyone can play as a guest, without an account. If you are under 16, ask a parent before you make an account."],
["Changes", "When the game starts keeping something new, this page changes first, and the date at the top changes with it."] ] },

nl:{ title:"Privacy", back:"Terug naar JAVEDA",
lead:"JAVEDA is het speelbare album van Lazy Jo op lightningwolves.studio/javeda. Op deze pagina staat in gewone woorden wat de game over je bewaart, waar, hoe lang, en hoe je het laat verwijderen.",
short:["<b>Zonder account</b> blijft je voortgang op je telefoon. Bij ons wordt niets over jou bewaard, behalve crashrapporten (zie hieronder).",
 "<b>Met een account</b> bewaren we je e-mail, je spelersnaam en foto, en je scores en voortgang. Je naam, foto en scores staan op het openbare scorebord.",
 "<b>Geen advertenties, geen tracking, niets verkocht.</b> We gebruiken je gegevens alleen om de game te laten werken.",
 "<b>Altijd te verwijderen:</b> Profiel &rarr; Mijn account verwijderen."],
s:[
["Wie op je gegevens past", "JAVEDA is gemaakt door Lazy Jo (Lightning Wolves). Voor elke vraag over je gegevens, of om er een kopie van te vragen, gebruik je "+REPORT+"Meld een probleem</a> onderaan de JAVEDA-pagina en kies je <b>Mijn gegevens (privacy)</b>. Laat je e-mail achter als je een antwoord wilt."],
["Spelen zonder account", "Je kunt het hele album als gast spelen. Je voortgang, beste scores, spelersnaam en foto worden <b>alleen op je telefoon</b> bewaard (in de opslag van je browser). Wis je de gegevens van je browser, of wissel je van telefoon of browser, dan zijn ze weg. Op een iPhone heeft de app op je beginscherm zijn eigen opslag, los van Safari."],
["Met een account", "Om je voortgang overal te bewaren en op het scorebord te komen, kun je een gratis Lightning Wolves-account maken (dezelfde login als de Wolf Hub). We bewaren:<ul><li>je <b>e-mail</b> en je <b>wachtwoord</b> (het wachtwoord wordt versleuteld bewaard door onze inlogdienst, zodat niemand het kan lezen - wij ook niet). Log je in met Google, dan krijgen we je e-mail en naam van Google;</li><li>je <b>spelersnaam</b> en <b>foto</b>;</li><li>je <b>voortgang en scores</b>: welke levels je uitspeelde, je beste score en sterren, je runs (score, afstand, tijd), scores van de dagelijkse uitdaging, resultaten van online 1v1, de foto's die je met punten kocht, en de levels die een dagelijkse uitdaging voor je openhield;</li><li>als je er een hebt, je <b>JAVEDA Pass</b> (hoe je hem kreeg).</li></ul>Je spelersnaam, foto, punten en scores zijn <b>openbaar</b>: iedereen kan ze zien op de scoreborden. Je e-mail wordt nooit aan andere spelers getoond. Lazy Jo kan het e-mailadres van elk account zien, om je te helpen met je account en - alleen als je erom vroeg - om je JAVEDA-nieuws te sturen."],
["Nieuws per e-mail", "Alleen als je <b>Mail me JAVEDA-nieuws</b> aanzet in je profiel. Je zet het daar altijd weer uit; in elke nieuwsmail staat ook hoe."],
["Meldingen", "Alleen als je ze toestaat op je telefoon: de geïnstalleerde app vraagt het één keer, en je kunt ze ook aanzetten op de kaart van de dagelijkse uitdaging of bij je speler. Dan bewaren we het <b>push-adres</b> van je telefoon (gemaakt door je browser - het zegt niets over jou), je taal, je tijdzone (zodat berichten in jouw ochtend komen en niet 's nachts) en wat je gevraagd hebt, en als je ingelogd bent, bij welke speler het hoort. De berichten gaan via de eigen pushdienst van je telefoon (Google, Apple, Mozilla of Microsoft, afhankelijk van de browser). Zet ze uit bij je speler of in de instellingen van je telefoon; als je je account verwijdert, verdwijnen ze ook."],
["Online spellen", "Als je online speelt (1v1, golf met vrienden, een privékamer), worden je spelersnaam, foto en wat je in het spel doet live naar de andere spelers in dat spel gestuurd. Iedereen met de link naar een privékamer kan erin."],
["De JAVEDA Pass en betalingen", "Koop je de JAVEDA Pass, dan regelt <b>Stripe</b> de betaling. Wij zien je kaart nooit. We horen alleen dat de betaling gelukt is, en bewaren dat je account de Pass heeft."],
["De app", "Zet je JAVEDA op je beginscherm, dan telt de game dat: een willekeurig nummer voor die telefoon (niet je telefoonnummer of iets over jou), of het een iPhone, Android of computer is, en hoe vaak de app wordt geopend - gekoppeld aan je account als je bent ingelogd. Om offline te spelen bewaart de app de game en de nummers op je telefoon; dat blijft op je telefoon."],
["Crashrapporten en Meld een probleem", "Als er iets kapotgaat in de game, stuurt die vanzelf een <b>crashrapport</b>, zodat het gerepareerd kan worden. Daarin staat: de fout en waar in de code van de game die gebeurde, het level en de pagina, het soort telefoon en browser (bijvoorbeeld \"iPhone, iOS 17, Safari\"), de taal, of het de app is, en je account als je bent ingelogd. Verder niets - geen locatie, geen contacten, niets uit andere apps.<br>Stuur <b>jij</b> "+REPORT+"Meld een probleem</a>, dan krijgen we wat je schrijft, het level dat je kiest, dezelfde info over telefoon en browser, je account als je bent ingelogd, en je e-mail alleen als je die invult."],
["Wat op je telefoon blijft", "De game bewaart dit in je browser, op je telefoon of computer: je gastvoortgang, de taal die je koos, je geluidsinstellingen, je login (zodat je ingelogd blijft), offline gespeelde runs die nog verstuurd moeten worden, en de offline kopie van de game en de nummers. Er zijn <b>geen advertentie- of trackingcookies</b>, en geen analytics-trackers."],
["Diensten die we gebruiken", "Deze bedrijven draaien delen van JAVEDA voor ons en gebruiken je gegevens alleen daarvoor:<ul><li><b>Supabase</b> - de database en de login (servers in de EU), en de nummers;</li><li><b>Vercel</b> - host de website (zoals bij elke website zien de servers je IP-adres als je langskomt);</li><li><b>Stripe</b> - betalingen voor de Pass;</li><li><b>Google Fonts</b> - de letters van de game worden bij Google geladen, dat je IP-adres ziet;</li><li><b>Cloudflare (cdnjs)</b> en <b>jsDelivr</b> - leveren twee codebibliotheken waar de game op draait (3D-beelden en de login), die ook je IP-adres zien;</li><li><b>Google</b> - alleen als je kiest om met Google in te loggen.</li></ul>Sommige hiervan kunnen gegevens buiten de EU verwerken; ze doen dat volgens de EU-regels daarvoor."],
["Hoe lang", "Je account en alles erin: tot je je account verwijdert. Crashrapporten en meldingen: verwijderd na 180 dagen. De app-telling houdt zijn aantallen, maar de koppeling met je account verdwijnt als je je account verwijdert. De voortgang van een gast blijft op de telefoon tot je die wist."],
["Je rechten", "Je ziet en wijzigt je spelersnaam en foto in je profiel, en je <b>verwijdert je account</b> daar (Profiel &rarr; Mijn account verwijderen): je speler, scores, voortgang en runs worden meteen verwijderd, en je login ook, tenzij je die ook gebruikt voor de Lightning Wolves Studio of de Wolf Hub. Je kunt ook een kopie van je gegevens vragen, of vragen iets te verbeteren of te verwijderen, via "+REPORT+"Meld een probleem</a> (kies Mijn gegevens). Vind je dat we iets fout doen, dan kun je klagen bij de gegevensbeschermingsautoriteit in je land."],
["Kinderen", "Iedereen kan als gast spelen, zonder account. Ben je jonger dan 16, vraag dan een ouder voor je een account maakt."],
["Wijzigingen", "Als de game iets nieuws gaat bewaren, verandert deze pagina eerst, en de datum bovenaan verandert mee."] ] },

fr:{ title:"Confidentialité", back:"Retour à JAVEDA",
lead:"JAVEDA est l'album jouable de Lazy Jo, sur lightningwolves.studio/javeda. Cette page dit simplement ce que le jeu garde sur toi, où, combien de temps, et comment le faire supprimer.",
short:["<b>Sans compte</b>, ta progression reste sur ton téléphone. Rien sur toi n'est gardé chez nous, sauf les rapports de plantage (voir plus bas).",
 "<b>Avec un compte</b>, on garde ton e-mail, ton nom de joueur et ton image, et tes scores et ta progression. Ton nom, ton image et tes scores sont sur le classement public.",
 "<b>Pas de pub, pas de pistage, rien n'est vendu.</b> On utilise tes données seulement pour faire tourner le jeu.",
 "<b>Supprimable à tout moment :</b> Profil &rarr; Supprimer mon compte."],
s:[
["Qui s'occupe de tes données", "JAVEDA est fait par Lazy Jo (Lightning Wolves). Pour toute question sur tes données, ou pour en demander une copie, utilise "+REPORT+"Signaler un problème</a> en bas de la page JAVEDA et choisis <b>Mes données (confidentialité)</b>. Laisse ton e-mail si tu veux une réponse."],
["Jouer sans compte", "Tu peux jouer tout l'album en invité. Ta progression, tes meilleurs scores, ton nom de joueur et ton image sont gardés <b>uniquement sur ton téléphone</b> (dans le stockage du navigateur). Si tu effaces les données de ton navigateur, ou changes de téléphone ou de navigateur, ils disparaissent. Sur iPhone, l'app de l'écran d'accueil a sa propre sauvegarde, séparée de Safari."],
["Avec un compte", "Pour garder ta progression partout et entrer au classement, tu peux créer un compte Lightning Wolves gratuit (le même que pour le Wolf Hub). On garde :<ul><li>ton <b>e-mail</b> et ton <b>mot de passe</b> (le mot de passe est gardé brouillé par notre service de connexion, personne ne peut le lire - nous non plus). Si tu te connectes avec Google, on reçoit ton e-mail et ton nom de Google ;</li><li>ton <b>nom de joueur</b> et ton <b>image</b> ;</li><li>ta <b>progression et tes scores</b> : les niveaux finis, ton meilleur score et tes étoiles, tes parties (score, distance, temps), tes scores du défi du jour, tes résultats en 1v1 en ligne, les images achetées avec des points, et les niveaux qu'un défi du jour a gardés ouverts pour toi ;</li><li>si tu en as un, ton <b>JAVEDA Pass</b> (comment tu l'as eu).</li></ul>Ton nom de joueur, ton image, tes points et tes scores sont <b>publics</b> : tout le monde les voit sur les classements. Ton e-mail n'est jamais montré aux autres joueurs. Lazy Jo peut voir l'e-mail de chaque compte, pour t'aider avec ton compte et - seulement si tu l'as demandé - pour t'envoyer les nouvelles de JAVEDA."],
["Les nouvelles par e-mail", "Seulement si tu actives <b>Envoie-moi les nouvelles de JAVEDA</b> dans ton profil. Tu peux le désactiver là à tout moment ; chaque e-mail de nouvelles dit aussi comment."],
["Les notifications", "Seulement si tu les autorises sur ton téléphone : l'app installée le demande une fois, et tu peux aussi les activer sur la carte du défi du jour ou dans ton joueur. On garde alors l'<b>adresse push</b> de ton téléphone (créée par ton navigateur - elle ne dit rien sur toi), ta langue, ton fuseau horaire (pour que les messages arrivent le matin chez toi et pas la nuit) et ce que tu as demandé, et si tu es connecté, à quel joueur elle appartient. Les messages passent par le service push de ton téléphone (Google, Apple, Mozilla ou Microsoft, selon le navigateur). Coupe-les dans ton joueur ou dans les réglages de ton téléphone ; supprimer ton compte les efface aussi."],
["Les jeux en ligne", "Quand tu joues en ligne (1v1, golf entre amis, une salle privée), ton nom de joueur, ton image et ce que tu fais dans le jeu sont envoyés en direct aux autres joueurs de la partie. Toute personne qui a le lien d'une salle privée peut la rejoindre."],
["Le JAVEDA Pass et les paiements", "Si tu achètes le JAVEDA Pass, le paiement passe par <b>Stripe</b>. On ne voit jamais ta carte. On apprend seulement que le paiement est passé, et on garde que ton compte a le Pass."],
["L'app", "Si tu mets JAVEDA sur ton écran d'accueil, le jeu le compte : un numéro au hasard pour ce téléphone (pas ton numéro ni rien sur toi), si c'est un iPhone, un Android ou un ordinateur, et combien de fois l'app est ouverte - lié à ton compte si tu es connecté. Pour jouer hors ligne, l'app garde le jeu et les morceaux sur ton téléphone ; ça reste sur ton téléphone."],
["Rapports de plantage et Signaler un problème", "Quand quelque chose plante dans le jeu, il envoie tout seul un <b>rapport de plantage</b>, pour qu'on puisse le réparer. On y trouve : l'erreur et où elle s'est produite dans le code du jeu, le niveau et la page, le type de téléphone et de navigateur (par exemple « iPhone, iOS 17, Safari »), la langue, si c'est l'app, et ton compte si tu es connecté. Rien d'autre - pas de position, pas de contacts, rien d'autres apps.<br>Quand <b>tu</b> envoies "+REPORT+"Signaler un problème</a>, on reçoit ce que tu écris, le niveau choisi, les mêmes infos sur le téléphone et le navigateur, ton compte si tu es connecté, et ton e-mail seulement si tu le remplis."],
["Ce qui reste sur ton téléphone", "Le jeu garde ceci dans ton navigateur, sur ton téléphone ou ton ordinateur : ta progression d'invité, la langue choisie, tes réglages de son, ta connexion (pour rester connecté), les parties jouées hors ligne qui attendent d'être envoyées, et la copie hors ligne du jeu et des morceaux. Il n'y a <b>aucun cookie de publicité ou de pistage</b>, et aucun outil de statistiques."],
["Les services qu'on utilise", "Ces entreprises font tourner des parties de JAVEDA pour nous et ne traitent tes données que pour ça :<ul><li><b>Supabase</b> - la base de données et la connexion (serveurs dans l'UE), et les morceaux ;</li><li><b>Vercel</b> - héberge le site (comme pour tout site, ses serveurs voient ton adresse IP quand tu viens) ;</li><li><b>Stripe</b> - les paiements du Pass ;</li><li><b>Google Fonts</b> - les lettres du jeu sont chargées chez Google, qui voit ton adresse IP ;</li><li><b>Cloudflare (cdnjs)</b> et <b>jsDelivr</b> - fournissent deux bibliothèques de code du jeu (la 3D et la connexion), et voient aussi ton adresse IP ;</li><li><b>Google</b> - seulement si tu choisis de te connecter avec Google.</li></ul>Certains peuvent traiter des données hors de l'UE ; ils le font selon les règles de l'UE prévues pour ça."],
["Combien de temps", "Ton compte et tout ce qu'il contient : jusqu'à ce que tu supprimes ton compte. Rapports de plantage et signalements : supprimés après 180 jours. Le comptage de l'app garde ses chiffres, mais le lien avec ton compte disparaît quand tu supprimes ton compte. La progression d'un invité reste sur le téléphone jusqu'à ce que tu l'effaces."],
["Tes droits", "Tu vois et changes ton nom de joueur et ton image dans ton profil, et tu <b>supprimes ton compte</b> là (Profil &rarr; Supprimer mon compte) : ton joueur, tes scores, ta progression et tes parties sont supprimés tout de suite, et ta connexion aussi sauf si tu l'utilises aussi pour le Lightning Wolves Studio ou le Wolf Hub. Tu peux aussi demander une copie de tes données, ou demander de corriger ou supprimer quelque chose, via "+REPORT+"Signaler un problème</a> (choisis Mes données). Si tu penses qu'on a fait une erreur, tu peux te plaindre auprès de l'autorité de protection des données de ton pays."],
["Les enfants", "Tout le monde peut jouer en invité, sans compte. Si tu as moins de 16 ans, demande à un parent avant de créer un compte."],
["Les changements", "Quand le jeu commence à garder quelque chose de nouveau, cette page change d'abord, et la date en haut change avec elle."] ] },

es:{ title:"Privacidad", back:"Volver a JAVEDA",
lead:"JAVEDA es el álbum jugable de Lazy Jo, en lightningwolves.studio/javeda. Esta página explica con palabras sencillas qué guarda el juego sobre ti, dónde, cuánto tiempo y cómo hacer que se borre.",
short:["<b>Sin cuenta</b>, tu progreso se queda en tu móvil. No guardamos nada sobre ti, salvo los informes de fallos (ver abajo).",
 "<b>Con cuenta</b> guardamos tu email, tu nombre de jugador y tu imagen, y tus puntuaciones y progreso. Tu nombre, imagen y puntuaciones están en la clasificación pública.",
 "<b>Sin anuncios, sin rastreo, nada se vende.</b> Usamos tus datos solo para que el juego funcione.",
 "<b>Bórralo cuando quieras:</b> Perfil &rarr; Eliminar mi cuenta."],
s:[
["Quién cuida tus datos", "JAVEDA lo hace Lazy Jo (Lightning Wolves). Para cualquier pregunta sobre tus datos, o para pedir una copia, usa "+REPORT+"Informar de un problema</a> al final de la página de JAVEDA y elige <b>Mis datos (privacidad)</b>. Deja tu email si quieres respuesta."],
["Jugar sin cuenta", "Puedes jugar todo el álbum como invitado. Tu progreso, mejores puntuaciones, nombre de jugador e imagen se guardan <b>solo en tu móvil</b> (en el almacenamiento del navegador). Si borras los datos del navegador, o cambias de móvil o de navegador, desaparecen. En iPhone, la app de la pantalla de inicio tiene su propio guardado, aparte de Safari."],
["Con cuenta", "Para guardar tu progreso en todas partes y entrar en la clasificación, puedes crear una cuenta gratis de Lightning Wolves (el mismo acceso que el Wolf Hub). Guardamos:<ul><li>tu <b>email</b> y tu <b>contraseña</b> (nuestro servicio de acceso guarda la contraseña cifrada, nadie puede leerla, ni nosotros). Si entras con Google, recibimos tu email y tu nombre de Google;</li><li>tu <b>nombre de jugador</b> y tu <b>imagen</b>;</li><li>tu <b>progreso y puntuaciones</b>: los niveles superados, tu mejor puntuación y estrellas, tus partidas (puntuación, distancia, tiempo), las puntuaciones del reto diario, los resultados de 1v1 online, las imágenes compradas con puntos y los niveles que un reto diario te dejó abiertos;</li><li>si lo tienes, tu <b>JAVEDA Pass</b> (cómo lo conseguiste).</li></ul>Tu nombre de jugador, imagen, puntos y puntuaciones son <b>públicos</b>: cualquiera los ve en las clasificaciones. Tu email nunca se muestra a otros jugadores. Lazy Jo puede ver el email de cada cuenta, para ayudarte con tu cuenta y, solo si lo pediste, para enviarte noticias de JAVEDA."],
["Noticias por email", "Solo si activas <b>Envíame noticias de JAVEDA</b> en tu perfil. Puedes desactivarlo ahí cuando quieras; cada email de noticias también explica cómo."],
["Notificaciones", "Solo si las permites en tu móvil: la app instalada lo pregunta una vez, y también puedes activarlas en la tarjeta del reto diario o en tu jugador. Entonces guardamos la <b>dirección push</b> de tu móvil (la crea tu navegador - no dice nada de ti), tu idioma, tu zona horaria (para que los mensajes lleguen por la mañana donde estés y no de noche) y lo que pediste, y si has iniciado sesión, a qué jugador pertenece. Los mensajes pasan por el servicio push de tu móvil (Google, Apple, Mozilla o Microsoft, según el navegador). Desactívalas en tu jugador o en los ajustes de tu móvil; al borrar tu cuenta también desaparecen."],
["Juegos online", "Cuando juegas online (1v1, golf con amigos, una sala privada), tu nombre de jugador, tu imagen y lo que haces en el juego se envían en directo a los demás jugadores de esa partida. Cualquiera con el enlace de una sala privada puede entrar."],
["El JAVEDA Pass y los pagos", "Si compras el JAVEDA Pass, el pago lo gestiona <b>Stripe</b>. Nunca vemos tu tarjeta. Solo sabemos que el pago se hizo, y guardamos que tu cuenta tiene el Pass."],
["La app", "Si pones JAVEDA en tu pantalla de inicio, el juego lo cuenta: un número al azar para ese móvil (no tu número de teléfono ni nada sobre ti), si es un iPhone, un Android o un ordenador, y cuántas veces se abre la app, unido a tu cuenta si has iniciado sesión. Para jugar sin conexión, la app guarda el juego y las canciones en tu móvil; eso se queda en tu móvil."],
["Informes de fallos e Informar de un problema", "Cuando algo falla en el juego, este envía solo un <b>informe de fallo</b>, para poder arreglarlo. Incluye: el error y dónde ocurrió en el código del juego, el nivel y la página, el tipo de móvil y navegador (por ejemplo \"iPhone, iOS 17, Safari\"), el idioma, si es la app, y tu cuenta si has iniciado sesión. Nada más: ni ubicación, ni contactos, nada de otras apps.<br>Cuando <b>tú</b> envías "+REPORT+"Informar de un problema</a>, recibimos lo que escribes, el nivel que eliges, la misma información del móvil y el navegador, tu cuenta si has iniciado sesión, y tu email solo si lo rellenas."],
["Lo que se queda en tu móvil", "El juego guarda esto en tu navegador, en tu móvil u ordenador: tu progreso de invitado, el idioma elegido, tus ajustes de sonido, tu sesión (para seguir conectado), las partidas jugadas sin conexión que esperan para enviarse, y la copia sin conexión del juego y las canciones. <b>No hay cookies de publicidad ni de rastreo</b>, ni herramientas de analítica."],
["Servicios que usamos", "Estas empresas hacen funcionar partes de JAVEDA para nosotros y solo tratan tus datos para eso:<ul><li><b>Supabase</b>: la base de datos y el acceso (servidores en la UE), y las canciones;</li><li><b>Vercel</b>: aloja la web (como en cualquier web, sus servidores ven tu dirección IP al visitarla);</li><li><b>Stripe</b>: los pagos del Pass;</li><li><b>Google Fonts</b>: las letras del juego se cargan desde Google, que ve tu dirección IP;</li><li><b>Cloudflare (cdnjs)</b> y <b>jsDelivr</b>: sirven dos bibliotecas de código del juego (el 3D y el acceso), y también ven tu dirección IP;</li><li><b>Google</b>: solo si eliges entrar con Google.</li></ul>Algunos pueden tratar datos fuera de la UE; lo hacen según las normas de la UE para ello."],
["Cuánto tiempo", "Tu cuenta y todo lo que contiene: hasta que borres tu cuenta. Informes de fallos y de problemas: se borran a los 180 días. El recuento de la app conserva sus cifras, pero el vínculo con tu cuenta desaparece cuando la borras. El progreso de un invitado se queda en el móvil hasta que lo borres."],
["Tus derechos", "Puedes ver y cambiar tu nombre de jugador e imagen en tu perfil, y <b>borrar tu cuenta</b> ahí (Perfil &rarr; Eliminar mi cuenta): tu jugador, puntuaciones, progreso y partidas se borran al momento, y también tu acceso salvo que lo uses además para el Lightning Wolves Studio o el Wolf Hub. También puedes pedir una copia de tus datos, o pedir que corrijamos o borremos algo, con "+REPORT+"Informar de un problema</a> (elige Mis datos). Si crees que hemos hecho algo mal, puedes reclamar ante la autoridad de protección de datos de tu país."],
["Menores", "Cualquiera puede jugar como invitado, sin cuenta. Si tienes menos de 16 años, pide permiso a un padre o madre antes de crear una cuenta."],
["Cambios", "Cuando el juego empiece a guardar algo nuevo, esta página cambia primero, y la fecha de arriba cambia con ella."] ] },
ja:{"title":"プライバシー","back":"JAVEDAに戻る","lead":"JAVEDAは、Lazy Joのプレイできるアルバムです（lightningwolves.studio/javeda）。このページでは、ゲームがあなたについて何を保存するのか、どこに保存されるのか、どのくらいの期間か、そして削除してもらう方法を、わかりやすい言葉で説明します。","short":["<b>アカウントなし</b>の場合、進行状況はあなたのスマホに残ります。クラッシュレポート（下記参照）を除き、あなたに関する情報は私たちの側には何も保存されません。","<b>アカウントあり</b>の場合、メールアドレス、プレイヤー名とアイコン、スコアと進行状況を保存します。名前・アイコン・スコアは公開ランキングに表示されます。","<b>広告なし、トラッキングなし、データの販売なし。</b>データはゲームを動かすためだけに使います。","<b>いつでも削除できます：</b>プロフィール &rarr; アカウントを削除。"],"s":[["データを管理しているのは","JAVEDAはLazy Jo（Lightning Wolves）が作っています。データについての質問や、データのコピーがほしい場合は、JAVEDAページ下部の<a href=\"/javeda/#report\">問題を報告</a>から<b>自分のデータ（プライバシー）</b>を選んでください。返事がほしい場合はメールアドレスを書いてください。"],["アカウントなしでプレイ","アルバム全体をゲストとして遊べます。進行状況、ベストスコア、プレイヤー名、アイコンは<b>あなたのスマホだけ</b>に（ブラウザのストレージに）保存されます。ブラウザのデータを消去したり、スマホやブラウザを変えたりすると、それらは消えます。iPhoneでは、ホーム画面のアプリはSafariとは別に独自のセーブを持っています。"],["アカウントあり","どこでも進行状況を保存してランキングに載るために、無料のLightning Wolvesアカウント（Wolf Hubと同じログイン）を作れます。保存するのは：<ul><li><b>メールアドレス</b>と<b>パスワード</b>（パスワードはログインサービスが読めない形に変換して保存するので、誰にも読めません。私たちにもです）。Googleでログインした場合は、Googleからメールアドレスと名前を受け取ります。</li><li><b>プレイヤー名</b>と<b>アイコン</b></li><li><b>進行状況とスコア</b>：クリアしたレベル、ベストスコアと星、プレイ記録（スコア、距離、タイム）、デイリーチャレンジのスコア、オンライン1v1の結果、ポイントで買ったアイコン、デイリーチャレンジで開いたままになっているレベル</li><li>持っている場合は<b>JAVEDAパス</b>（入手方法）</li></ul>プレイヤー名、アイコン、ポイント、スコアは<b>公開</b>されます：誰でもランキングで見られます。メールアドレスが他のプレイヤーに表示されることはありません。Lazy Joは各アカウントのメールアドレスを見ることができます。これはアカウントについてサポートするため、そして希望した場合に限りJAVEDAのニュースを送るためです。"],["メールでのニュース","プロフィールで<b>JAVEDAのニュースをメールで受け取る</b>をオンにした場合だけです。そこでいつでもオフにできます。ニュースメールにも毎回その方法が書いてあります。"],["通知","スマホで許可した場合だけです：インストールしたアプリが一度だけ確認します。デイリーチャレンジのカードやプレイヤー画面でオンにすることもできます。その場合、スマホの<b>プッシュアドレス</b>（ブラウザが作るもので、あなたについての情報は含みません）、言語、タイムゾーン（夜ではなく朝にメッセージが届くように）、希望した通知の内容、そしてログイン中ならどのプレイヤーのものかを保存します。メッセージはスマホのプッシュサービス（ブラウザによってGoogle、Apple、Mozilla、Microsoftのいずれか）を通して届きます。プレイヤー画面かスマホの設定でオフにできます。アカウントを削除すると、これも消去されます。"],["オンラインゲーム","オンラインで遊ぶとき（1v1、友だちとのゴルフ、プライベートルーム）、プレイヤー名、アイコン、ゲーム内での操作が、そのゲームの他のプレイヤーにリアルタイムで送られます。プライベートルームのリンクを持っている人は誰でも参加できます。"],["JAVEDAパスと支払い","JAVEDAパスを購入すると、支払いは<b>Stripe</b>が処理します。私たちがカード情報を見ることはありません。支払いが完了したことだけを知り、あなたのアカウントがPassを持っていることを記録します。"],["アプリ","JAVEDAをホーム画面に追加すると、ゲームはそれをカウントします：そのスマホ用のランダムな番号（電話番号やあなたについての情報ではありません）、iPhone・Android・パソコンのどれか、アプリを開いた回数です。ログイン中ならアカウントと結びつけられます。オフラインで遊べるように、アプリはゲームと曲をスマホに保存します。これはスマホの中だけに残ります。"],["クラッシュレポートと問題を報告","ゲームで何かが壊れると、修正できるように自動で<b>クラッシュレポート</b>が送られます。内容は：エラーとゲームのコードのどこで起きたか、レベルとページ、スマホとブラウザの種類（例：「iPhone, iOS 17, Safari」）、言語、アプリかどうか、ログイン中ならアカウントです。それ以外は何もありません。位置情報も連絡先も、他のアプリの情報もありません。<br><b>あなた</b>が<a href=\"/javeda/#report\">問題を報告</a>を送ると、書いた内容、選んだレベル、同じスマホとブラウザの情報、ログイン中ならアカウント、そして入力した場合のみメールアドレスを受け取ります。"],["スマホに残るもの","ゲームは次のものをブラウザ（スマホやパソコン）に保存します：ゲストの進行状況、選んだ言語、サウンド設定、ログイン情報（ログインしたままになるように）、オフラインでプレイして送信待ちの記録、ゲームと曲のオフライン用コピー。<b>広告やトラッキング用のCookieはありません</b>。アクセス解析のトラッカーもありません。"],["利用しているサービス","これらの会社がJAVEDAの一部を運営しており、そのためだけにあなたのデータを扱います：<ul><li><b>Supabase</b> - データベースとログイン（EU内のサーバー）、そして曲</li><li><b>Vercel</b> - ウェブサイトのホスティング（どのウェブサイトとも同じく、訪問時にサーバーがIPアドレスを見ます）</li><li><b>Stripe</b> - Passの支払い</li><li><b>Google Fonts</b> - ゲームで使う文字（フォント）はGoogleから読み込まれ、GoogleはIPアドレスを見ます</li><li><b>Cloudflare (cdnjs)</b>と<b>jsDelivr</b> - ゲームが使う2つのコードライブラリ（3Dグラフィックとログイン）を配信し、これらもIPアドレスを見ます</li><li><b>Google</b> - Googleでログインすることを選んだ場合のみ</li></ul>これらの一部はEU外でデータを扱うことがありますが、その場合はEUのルールに従って行います。"],["保存期間","アカウントとその中のすべて：アカウントを削除するまで。クラッシュレポートと問題の報告：180日後に削除。アプリのカウントは数字を残しますが、アカウントとの結びつきはアカウントを削除すると消えます。ゲストの進行状況は、消去するまでスマホに残ります。"],["あなたの権利","プロフィールでプレイヤー名とアイコンを確認・変更でき、そこで<b>アカウントを削除</b>することもできます（プロフィール &rarr; アカウントを削除）：プレイヤー、スコア、進行状況、プレイ記録はすぐに削除されます。ログイン情報も削除されますが、Lightning Wolves StudioやWolf Hubでも使っている場合は残ります。データのコピーの請求や、訂正・削除の依頼も<a href=\"/javeda/#report\">問題を報告</a>からできます（自分のデータを選んでください）。私たちの対応が間違っていると思う場合は、お住まいの国のデータ保護機関に苦情を申し立てることができます。"],["子ども","誰でもアカウントなしでゲストとして遊べます。16歳未満の場合は、アカウントを作る前に保護者に聞いてください。"],["変更","ゲームが新しい情報を保存し始めるときは、まずこのページが更新され、上の日付も一緒に変わります。"]]},
zh:{"title":"隐私","back":"返回 JAVEDA","lead":"JAVEDA 是 Lazy Jo 的可玩专辑，网址是 lightningwolves.studio/javeda。本页用简单的话说明：游戏会保存你的哪些信息、存在哪里、保存多久，以及如何删除。","short":["<b>没有账号时</b>，你的进度保存在你的手机上。除了崩溃报告（见下文），我们这边不会保存任何关于你的信息。","<b>有账号时</b>，我们会保存你的邮箱、玩家名和头像，以及你的分数和进度。你的名字、头像和分数会显示在公开排行榜上。","<b>没有广告，没有追踪，不出售任何数据。</b>我们只用你的数据来运行游戏。","<b>随时可以删除：</b>个人资料 &rarr; 删除我的账号。"],"s":[["谁负责你的数据","JAVEDA 由 Lazy Jo（Lightning Wolves）制作。如果你对自己的数据有任何问题，或想索取一份数据副本，请使用 JAVEDA 页面底部的<a href=\"/javeda/#report\">报告问题</a>，并选择<b>我的数据（隐私）</b>。如果你想收到回复，请留下你的邮箱。"],["不用账号玩","你可以以游客身份玩整张专辑。你的进度、最佳分数、玩家名和头像<b>只保存在你的手机上</b>（在浏览器的存储里）。如果你清除浏览器数据，或者换手机、换浏览器，这些就没了。在 iPhone 上，主屏幕上的应用有自己独立的存档，和 Safari 分开。"],["有账号时","为了在任何地方都能保存进度并登上排行榜，你可以注册一个免费的 Lightning Wolves 账号（和 Wolf Hub 用同一个登录）。我们会保存：<ul><li>你的<b>邮箱</b>和<b>密码</b>（密码由我们的登录服务以无法读取的形式保存，所以没有人能看到——我们也不能）。如果你用 Google 登录，我们会从 Google 获取你的邮箱和名字；</li><li>你的<b>玩家名</b>和<b>头像</b>；</li><li>你的<b>进度和分数</b>：你通关了哪些关卡、你的最佳分数和星星、你的游戏记录（分数、距离、时间）、每日挑战分数、在线 1v1 结果、你用积分买的头像，以及每日挑战为你保留开放的关卡；</li><li>如果你有的话，你的 <b>JAVEDA 通行证</b>（你是怎么获得的）。</li></ul>你的玩家名、头像、积分和分数是<b>公开的</b>：任何人都能在排行榜上看到。你的邮箱永远不会显示给其他玩家。Lazy Jo 可以看到每个账号的邮箱，用于帮你处理账号问题，以及——仅在你要求时——给你发送 JAVEDA 新闻。"],["邮件新闻","只有在你在个人资料里打开<b>用邮件给我发 JAVEDA 新闻</b>时才会发送。你随时可以在那里关闭；每封新闻邮件里也会写明关闭方法。"],["通知","只有在你在手机上允许时才会发送：已安装的应用会询问一次，你也可以在每日挑战卡片上或在你的玩家页面里打开。之后我们会保存你手机的<b>推送地址</b>（由浏览器生成——不包含任何关于你的信息）、你的语言、你的时区（这样消息会在你的早上而不是夜里送达）、你想接收的内容，以及在你登录时，它属于哪个玩家。消息通过你手机自带的推送服务发送（根据浏览器不同，是 Google、Apple、Mozilla 或 Microsoft）。你可以在玩家页面或手机设置里关闭通知；删除账号也会一并清除这些信息。"],["在线游戏","当你在线游玩时（1v1、和好友打高尔夫、私人房间），你的玩家名、头像以及你在游戏中的操作会实时发送给同一局里的其他玩家。任何拿到私人房间链接的人都可以加入。"],["JAVEDA 通行证 与付款","如果你购买 JAVEDA 通行证，付款由 <b>Stripe</b> 处理。我们永远看不到你的银行卡信息。我们只知道付款成功了，并记录你的账号拥有 Pass。"],["应用","如果你把 JAVEDA 添加到主屏幕，游戏会进行统计：这部手机的一个随机编号（不是你的手机号，也不包含任何关于你的信息）、它是 iPhone、Android 还是电脑，以及应用被打开的频率——如果你已登录，会关联到你的账号。为了离线游玩，应用会把游戏和歌曲保存在你的手机上；这些只留在你的手机上。"],["崩溃报告与报告问题","当游戏出现故障时，它会自动发送一份<b>崩溃报告</b>，以便修复。内容包括：错误信息及其发生在游戏代码中的位置、关卡和页面、手机和浏览器的类型（例如“iPhone, iOS 17, Safari”）、语言、是否为应用，以及你登录时的账号。除此之外没有别的——没有位置、没有联系人、没有来自其他应用的任何信息。<br>当<b>你</b>发送<a href=\"/javeda/#report\">报告问题</a>时，我们会收到你写的内容、你选择的关卡、同样的手机和浏览器信息、你登录时的账号，以及只有在你填写时才会有的邮箱。"],["留在你手机上的内容","游戏会在你手机或电脑的浏览器里保存这些：你的游客进度、你选择的语言、你的声音设置、你的登录状态（让你保持登录）、离线时玩的、等待上传的游戏记录，以及游戏和歌曲的离线副本。<b>没有广告或追踪 Cookie</b>，也没有统计分析追踪器。"],["我们使用的服务","这些公司为我们运行 JAVEDA 的部分功能，并且只为此处理你的数据：<ul><li><b>Supabase</b> - 数据库和登录（服务器位于欧盟），以及歌曲；</li><li><b>Vercel</b> - 托管网站（和所有网站一样，你访问时它的服务器会看到你的 IP 地址）；</li><li><b>Stripe</b> - Pass 的付款；</li><li><b>Google Fonts</b> - 游戏使用的字体从 Google 加载，Google 会看到你的 IP 地址；</li><li><b>Cloudflare (cdnjs)</b> 和 <b>jsDelivr</b> - 提供游戏运行所需的两个代码库（3D 图形和登录），它们也会看到你的 IP 地址；</li><li><b>Google</b> - 仅在你选择用 Google 登录时。</li></ul>其中一些服务可能在欧盟以外处理数据；这种情况下，它们遵守欧盟的相关规定。"],["保存多久","你的账号及其中的一切：保存到你删除账号为止。崩溃报告和问题报告：180 天后删除。应用统计会保留数字，但你删除账号时，与你账号的关联会被删除。游客的进度会一直留在手机上，直到你清除它。"],["你的权利","你可以在个人资料中查看和修改你的玩家名和头像，也可以在那里<b>删除你的账号</b>（个人资料 &rarr; 删除我的账号）：你的玩家、分数、进度和游戏记录会立即删除，你的登录信息也会删除，除非你同时在 Lightning Wolves Studio 或 Wolf Hub 使用它。你也可以通过<a href=\"/javeda/#report\">报告问题</a>（选择“我的数据”）索取你的数据副本，或要求我们更正或删除某些内容。如果你认为我们处理有误，可以向你所在国家的数据保护机构投诉。"],["儿童","任何人都可以不用账号，以游客身份游玩。如果你未满 16 岁，请在注册账号前先问问家长。"],["变更","当游戏开始保存新的内容时，会先更新本页，顶部的日期也会随之更改。"]]},
tw:{"title":"隱私權","back":"返回 JAVEDA","lead":"JAVEDA 是 Lazy Jo 的可玩專輯，網址是 lightningwolves.studio/javeda。這一頁用簡單的話說明：遊戲會保存你的哪些資料、存在哪裡、保存多久，以及如何刪除。","short":["<b>沒有帳號時</b>，你的進度會留在你的手機上。除了當機報告（見下方），我們這邊不會保存任何關於你的資料。","<b>有帳號時</b>，我們會保存你的電子郵件、玩家名稱和頭像，以及你的分數和進度。你的名稱、頭像和分數會顯示在公開排行榜上。","<b>沒有廣告、沒有追蹤、不出售任何資料。</b>我們只用你的資料來運作遊戲。","<b>隨時都能刪除：</b>個人檔案 &rarr; 刪除我的帳號。"],"s":[["誰負責你的資料","JAVEDA 由 Lazy Jo（Lightning Wolves）製作。如果你對自己的資料有任何問題，或想索取一份資料副本，請使用 JAVEDA 頁面底部的<a href=\"/javeda/#report\">回報問題</a>，並選擇<b>我的資料（隱私）</b>。如果想收到回覆，請留下你的電子郵件。"],["不用帳號玩","你可以用訪客身分玩完整張專輯。你的進度、最佳分數、玩家名稱和頭像<b>只會保存在你的手機上</b>（在瀏覽器的儲存空間裡）。如果你清除瀏覽器資料，或換手機、換瀏覽器，這些就會消失。在 iPhone 上，主畫面上的 App 有自己獨立的存檔，和 Safari 分開。"],["有帳號時","為了在任何地方都能保存進度並登上排行榜，你可以註冊免費的 Lightning Wolves 帳號（和 Wolf Hub 使用同一組登入）。我們會保存：<ul><li>你的<b>電子郵件</b>和<b>密碼</b>（密碼由我們的登入服務以無法讀取的形式保存，所以沒有人看得到——我們也看不到）。如果你用 Google 登入，我們會從 Google 取得你的電子郵件和名字；</li><li>你的<b>玩家名稱</b>和<b>頭像</b>；</li><li>你的<b>進度和分數</b>：你過關了哪些關卡、你的最佳分數和星星、你的遊玩紀錄（分數、距離、時間）、每日挑戰分數、線上 1v1 結果、你用積分買的頭像，以及每日挑戰為你保留開放的關卡；</li><li>如果你有的話，你的 <b>JAVEDA 通行證</b>（你是怎麼取得的）。</li></ul>你的玩家名稱、頭像、積分和分數是<b>公開的</b>：任何人都能在排行榜上看到。你的電子郵件絕不會顯示給其他玩家。Lazy Jo 可以看到每個帳號的電子郵件，用來協助你處理帳號問題，以及——僅在你要求時——寄給你 JAVEDA 消息。"],["電子郵件消息","只有在你於個人檔案中開啟<b>用電子郵件寄 JAVEDA 消息給我</b>時才會寄送。你隨時可以在那裡關閉；每封消息郵件也會說明關閉方法。"],["通知","只有在你在手機上允許時才會發送：已安裝的 App 會詢問一次，你也可以在每日挑戰卡片上或在你的玩家頁面中開啟。之後我們會保存你手機的<b>推播位址</b>（由瀏覽器產生——不包含任何關於你的資料）、你的語言、你的時區（讓訊息在你的早上而不是半夜送達）、你想收到的內容，以及在你登入時，它屬於哪位玩家。訊息會透過你手機本身的推播服務傳送（依瀏覽器而定，是 Google、Apple、Mozilla 或 Microsoft）。你可以在玩家頁面或手機設定中關閉；刪除帳號也會一併清除這些資料。"],["線上遊戲","當你線上遊玩時（1v1、和好友打高爾夫、私人房間），你的玩家名稱、頭像以及你在遊戲中的操作會即時傳送給同一場遊戲的其他玩家。任何拿到私人房間連結的人都能加入。"],["JAVEDA 通行證 與付款","如果你購買 JAVEDA 通行證，付款由 <b>Stripe</b> 處理。我們絕不會看到你的卡片資料。我們只會知道付款成功，並記錄你的帳號擁有 Pass。"],["App","如果你把 JAVEDA 加到主畫面，遊戲會進行統計：這支手機的一個隨機編號（不是你的手機號碼，也不包含任何關於你的資料）、它是 iPhone、Android 還是電腦，以及 App 被開啟的頻率——如果你已登入，會連結到你的帳號。為了離線遊玩，App 會把遊戲和歌曲存在你的手機上；這些只會留在你的手機上。"],["當機報告與回報問題","當遊戲出錯時，它會自動傳送一份<b>當機報告</b>，以便修正。內容包括：錯誤及其發生在遊戲程式碼中的位置、關卡和頁面、手機和瀏覽器的類型（例如「iPhone, iOS 17, Safari」）、語言、是否為 App，以及你登入時的帳號。除此之外什麼都沒有——沒有位置、沒有聯絡人、沒有來自其他 App 的任何資料。<br>當<b>你</b>送出<a href=\"/javeda/#report\">回報問題</a>時，我們會收到你寫的內容、你選擇的關卡、同樣的手機和瀏覽器資訊、你登入時的帳號，以及只有在你填寫時才會有的電子郵件。"],["留在你手機上的東西","遊戲會在你手機或電腦的瀏覽器中保存這些：你的訪客進度、你選擇的語言、你的音效設定、你的登入狀態（讓你保持登入）、離線時玩、等待上傳的遊玩紀錄，以及遊戲和歌曲的離線副本。<b>沒有廣告或追蹤 Cookie</b>，也沒有分析追蹤器。"],["我們使用的服務","這些公司為我們運作 JAVEDA 的部分功能，且只為此處理你的資料：<ul><li><b>Supabase</b> - 資料庫和登入（伺服器位於歐盟），以及歌曲；</li><li><b>Vercel</b> - 代管網站（和所有網站一樣，你造訪時它的伺服器會看到你的 IP 位址）；</li><li><b>Stripe</b> - Pass 的付款；</li><li><b>Google Fonts</b> - 遊戲使用的字型從 Google 載入，Google 會看到你的 IP 位址；</li><li><b>Cloudflare (cdnjs)</b> 和 <b>jsDelivr</b> - 提供遊戲運作所需的兩個程式庫（3D 圖形和登入），它們也會看到你的 IP 位址；</li><li><b>Google</b> - 僅在你選擇用 Google 登入時。</li></ul>其中部分服務可能在歐盟以外處理資料；此時它們會遵守歐盟的相關規定。"],["保存多久","你的帳號及其中的一切：保存到你刪除帳號為止。當機報告和問題回報：180 天後刪除。App 統計會保留數字，但你刪除帳號時，與你帳號的連結就會移除。訪客的進度會一直留在手機上，直到你清除為止。"],["你的權利","你可以在個人檔案中查看和修改你的玩家名稱和頭像，也可以在那裡<b>刪除你的帳號</b>（個人檔案 &rarr; 刪除我的帳號）：你的玩家、分數、進度和遊玩紀錄會立即刪除，你的登入資料也會刪除，除非你同時在 Lightning Wolves Studio 或 Wolf Hub 使用它。你也可以透過<a href=\"/javeda/#report\">回報問題</a>（選擇「我的資料」）索取你的資料副本，或要求我們更正或刪除某些內容。如果你認為我們處理有誤，可以向你所在國家的資料保護主管機關提出申訴。"],["兒童","任何人都可以不用帳號，以訪客身分遊玩。如果你未滿 16 歲，請在註冊帳號前先問過家長。"],["變更","當遊戲開始保存新的內容時，會先更新這一頁，頂端的日期也會跟著改變。"]]},
it:{"title":"Privacy","back":"Torna a JAVEDA","lead":"JAVEDA è l'album giocabile di Lazy Jo su lightningwolves.studio/javeda. Questa pagina spiega, in parole semplici, cosa conserva il gioco su di te, dove lo conserva, per quanto tempo e come farlo cancellare.","short":["<b>Senza account</b>, i tuoi progressi restano sul tuo telefono. Da parte nostra non conserviamo nulla su di te, tranne i report dei crash (vedi sotto).","<b>Con un account</b> conserviamo la tua email, il tuo nome giocatore e la tua immagine, e i tuoi punteggi e progressi. Il tuo nome, la tua immagine e i tuoi punteggi compaiono nella classifica pubblica.","<b>Niente pubblicità, nessun tracciamento, non vendiamo nulla.</b> Usiamo i tuoi dati solo per far funzionare il gioco.","<b>Puoi cancellarli quando vuoi:</b> Profilo &rarr; Elimina il mio account."],"s":[["Chi si occupa dei tuoi dati","JAVEDA è creato da Lazy Jo (Lightning Wolves). Per qualsiasi domanda sui tuoi dati, o per chiederne una copia, usa <a href=\"/javeda/#report\">Segnala un problema</a> in fondo alla pagina di JAVEDA e scegli <b>I miei dati (privacy)</b>. Lascia la tua email se vuoi una risposta."],["Giocare senza account","Puoi giocare tutto l'album come ospite. I tuoi progressi, i tuoi record, il tuo nome giocatore e la tua immagine sono conservati <b>solo sul tuo telefono</b> (nella memoria del browser). Se cancelli i dati del browser, o cambi telefono o browser, vanno persi. Su iPhone, l'app nella schermata Home ha un suo salvataggio, separato da Safari."],["Con un account","Per salvare i tuoi progressi ovunque ed entrare in classifica, puoi creare un account Lightning Wolves gratuito (lo stesso accesso del Wolf Hub). Conserviamo:<ul><li>la tua <b>email</b> e la tua <b>password</b> (la password viene salvata in forma criptata dal nostro servizio di accesso, quindi nessuno può leggerla - nemmeno noi). Se accedi con Google, riceviamo da Google la tua email e il tuo nome;</li><li>il tuo <b>nome giocatore</b> e la tua <b>immagine</b>;</li><li>i tuoi <b>progressi e punteggi</b>: quali livelli hai completato, il tuo record e le stelle, le tue partite (punteggio, distanza, tempo), i punteggi delle sfide del giorno, i risultati delle sfide 1v1 online, le immagini che hai comprato con i punti e i livelli che una sfida del giorno ti ha tenuto aperti;</li><li>se ce l'hai, il tuo <b>JAVEDA Pass</b> (come l'hai ottenuto).</li></ul>Il tuo nome giocatore, la tua immagine, i tuoi punti e i tuoi punteggi sono <b>pubblici</b>: chiunque può vederli nelle classifiche. La tua email non viene mai mostrata agli altri giocatori. Lazy Jo può vedere l'email di ogni account, per aiutarti con il tuo account e - solo se l'hai chiesto - per mandarti le novità di JAVEDA."],["Novità via email","Solo se attivi <b>Mandami via email le novità di JAVEDA</b> nel tuo profilo. Puoi disattivarlo lì quando vuoi; ogni email di novità spiega anche come fare."],["Notifiche","Solo se le autorizzi sul tuo telefono: l'app installata lo chiede una volta, e puoi attivarle anche dalla scheda della sfida del giorno o nella tua scheda giocatore. In quel caso conserviamo l'<b>indirizzo push</b> del tuo telefono (creato dal tuo browser - non dice nulla di te), la tua lingua, il tuo fuso orario (così i messaggi arrivano la mattina e non di notte) e cosa hai chiesto, e, se hai effettuato l'accesso, a quale giocatore appartiene. I messaggi passano dal servizio push del tuo telefono (Google, Apple, Mozilla o Microsoft, a seconda del browser). Disattivale nella tua scheda giocatore o nelle impostazioni del telefono; se elimini il tuo account, vengono dimenticate anche loro."],["Giochi online","Quando giochi online (1v1, golf con gli amici, una stanza privata), il tuo nome giocatore, la tua immagine e quello che fai nel gioco vengono inviati in tempo reale agli altri giocatori di quella partita. Chiunque abbia il link di una stanza privata può entrarci."],["Il JAVEDA Pass e i pagamenti","Se compri il JAVEDA Pass, il pagamento è gestito da <b>Stripe</b>. Non vediamo mai la tua carta. Sappiamo solo che il pagamento è andato a buon fine e registriamo che il tuo account ha il Pass."],["L'app","Se metti JAVEDA nella schermata Home, il gioco la conta: un numero casuale per quel telefono (non il tuo numero di telefono né altro su di te), se è un iPhone, un Android o un computer, e quanto spesso viene aperta l'app - collegato al tuo account se hai effettuato l'accesso. Per giocare offline, l'app salva il gioco e le canzoni sul tuo telefono; e lì restano."],["Report dei crash e Segnala un problema","Quando qualcosa si rompe nel gioco, il gioco invia da solo un <b>report del crash</b>, così il problema si può risolvere. Contiene: l'errore e il punto del codice del gioco in cui si è verificato, il livello e la pagina, il tipo di telefono e di browser (per esempio \"iPhone, iOS 17, Safari\"), la lingua, se si tratta dell'app, e il tuo account se hai effettuato l'accesso. Nient'altro - nessuna posizione, nessun contatto, niente da altre app.<br>Quando <b>tu</b> invii <a href=\"/javeda/#report\">Segnala un problema</a>, riceviamo quello che scrivi, il livello che scegli, le stesse informazioni su telefono e browser, il tuo account se hai effettuato l'accesso, e la tua email solo se la inserisci."],["Cosa resta sul tuo telefono","Il gioco conserva queste cose nel tuo browser, sul telefono o sul computer: i tuoi progressi da ospite, la lingua che hai scelto, le impostazioni audio, il tuo accesso (così resti collegato), le partite giocate offline in attesa di essere inviate, e la copia offline del gioco e delle sue canzoni. <b>Non ci sono cookie pubblicitari o di tracciamento</b>, né tracker di statistiche."],["Servizi che usiamo","Queste aziende gestiscono parti di JAVEDA per noi e trattano i tuoi dati solo per questo:<ul><li><b>Supabase</b> - il database e l'accesso (server nell'UE), e le canzoni;</li><li><b>Vercel</b> - ospita il sito (come per ogni sito, i suoi server vedono il tuo indirizzo IP quando lo visiti);</li><li><b>Stripe</b> - i pagamenti del Pass;</li><li><b>Google Fonts</b> - i caratteri usati dal gioco vengono caricati da Google, che vede il tuo indirizzo IP;</li><li><b>Cloudflare (cdnjs)</b> e <b>jsDelivr</b> - forniscono due librerie di codice su cui gira il gioco (la grafica 3D e l'accesso), e anche loro vedono il tuo indirizzo IP;</li><li><b>Google</b> - solo se scegli di accedere con Google.</li></ul>Alcuni di questi servizi potrebbero trattare dati fuori dall'UE; in quel caso lo fanno rispettando le regole dell'UE previste per questo."],["Per quanto tempo","Il tuo account e tutto ciò che contiene: finché non elimini il tuo account. Report dei crash e segnalazioni di problemi: cancellati dopo 180 giorni. Il conteggio dell'app mantiene i suoi numeri, ma il collegamento al tuo account sparisce quando elimini l'account. I progressi di un ospite restano sul telefono finché non li cancelli."],["I tuoi diritti","Puoi vedere e modificare il tuo nome giocatore e la tua immagine nel tuo profilo, e lì puoi anche <b>eliminare il tuo account</b> (Profilo &rarr; Elimina il mio account): il tuo giocatore, i punteggi, i progressi e le partite vengono cancellati subito, e anche il tuo accesso, a meno che tu non lo usi anche per Lightning Wolves Studio o per il Wolf Hub. Puoi anche chiedere una copia dei tuoi dati, o chiederci di correggere o cancellare qualcosa, tramite <a href=\"/javeda/#report\">Segnala un problema</a> (scegli I miei dati). Se pensi che abbiamo sbagliato qualcosa, puoi presentare un reclamo all'autorità per la protezione dei dati del tuo paese."],["Minori","Chiunque può giocare come ospite, senza account. Se hai meno di 16 anni, chiedi a un genitore prima di creare un account."],["Modifiche","Quando il gioco inizia a conservare qualcosa di nuovo, prima viene aggiornata questa pagina, e insieme cambia la data in alto."]]}
};
// the chat (added 7 November 2026): after Online games, in every language
const CHAT_S = {"en": ["The chat", "The chat on the JAVEDA page is for players with an account. What you write there is shown, with your player name and picture, to everyone who opens the page. Messages are deleted after 30 days, and you can delete your own any time. Links aren't allowed and the worst words are starred out. A reported message goes to Lazy Jo, who can delete messages and mute a player for a while. Don't share personal details (where you live, your phone number, your socials) in the chat."], "nl": ["De chat", "De chat op de JAVEDA-pagina is voor spelers met een account. Wat je er schrijft, is met je spelersnaam en foto te zien voor iedereen die de pagina opent. Berichten worden na 30 dagen verwijderd, en je eigen berichten kun je altijd zelf verwijderen. Links mogen niet en de ergste woorden worden met sterretjes vervangen. Een gemeld bericht gaat naar Lazy Jo, die berichten kan verwijderen en een speler een tijdje kan dempen. Deel geen persoonlijke gegevens (waar je woont, je telefoonnummer, je socials) in de chat."], "fr": ["Le chat", "Le chat de la page JAVEDA est réservé aux joueurs avec un compte. Ce que tu y écris est visible, avec ton nom de joueur et ton image, par tous ceux qui ouvrent la page. Les messages sont supprimés au bout de 30 jours, et tu peux supprimer les tiens quand tu veux. Les liens sont interdits et les pires mots sont remplacés par des étoiles. Un message signalé est envoyé à Lazy Jo, qui peut supprimer des messages et rendre un joueur muet pendant un moment. Ne partage pas d'informations personnelles (où tu habites, ton numéro de téléphone, tes réseaux) dans le chat."], "es": ["El chat", "El chat de la página de JAVEDA es para jugadores con cuenta. Lo que escribes ahí lo ve, con tu nombre de jugador y tu imagen, cualquiera que abra la página. Los mensajes se borran a los 30 días, y puedes borrar los tuyos cuando quieras. No se permiten enlaces y las peores palabras se sustituyen por asteriscos. Un mensaje denunciado le llega a Lazy Jo, que puede borrar mensajes y silenciar a un jugador durante un tiempo. No compartas datos personales (dónde vives, tu número de teléfono, tus redes) en el chat."], "it": ["La chat", "La chat sulla pagina di JAVEDA è per i giocatori con un account. Quello che scrivi lì è visibile, con il tuo nome da giocatore e la tua immagine, a chiunque apra la pagina. I messaggi vengono cancellati dopo 30 giorni, e puoi eliminare i tuoi quando vuoi. I link non sono ammessi e le parole peggiori vengono coperte da asterischi. Un messaggio segnalato arriva a Lazy Jo, che può eliminare messaggi e silenziare un giocatore per un po'. Non condividere dati personali (dove abiti, il tuo numero di telefono, i tuoi social) nella chat."], "ja": ["チャット", "JAVEDAのページのチャットは、アカウントを持っているプレイヤー向けです。書いた内容は、プレイヤー名とアイコンと一緒に、ページを開いた全員に表示されます。メッセージは30日後に削除され、自分のメッセージはいつでも削除できます。リンクは禁止で、ひどい言葉は伏せ字になります。報告されたメッセージはLazy Joに届き、Lazy Joはメッセージを削除したり、プレイヤーをしばらくミュートしたりできます。チャットに個人情報（住んでいる場所、電話番号、SNS）を書かないでね。"], "zh": ["聊天", "JAVEDA 页面上的聊天仅限有账号的玩家使用。你在里面写的内容会连同你的玩家名和头像，显示给所有打开这个页面的人。消息会在30天后删除，你也可以随时删除自己的消息。不能发链接，最难听的词会被替换成星号。被举报的消息会发给 Lazy Jo，他可以删除消息，或让某位玩家暂时禁言。请不要在聊天里透露个人信息（住址、电话号码、社交账号）。"], "tw": ["聊天", "JAVEDA 頁面上的聊天僅限有帳號的玩家使用。你在裡面寫的內容會連同你的玩家名稱和頭像，顯示給所有打開這個頁面的人。訊息會在30天後刪除，你也可以隨時刪除自己的訊息。不能貼連結，最難聽的字眼會被換成星號。被檢舉的訊息會送到 Lazy Jo 那裡，他可以刪除訊息，或讓某位玩家暫時禁言。請不要在聊天裡透露個人資料（住址、電話號碼、社群帳號）。"]};
for (const L in CHAT_S) if (T[L]) T[L].s.splice(6, 0, CHAT_S[L]);
// invite friends (added 8 November 2026): after the chat
const INVITE_S = {"en": ["Invite friends", "Each player has an invite link. If you make an account through a friend's link, we keep who invited you, so you both get a key when you clear your first level. Your friend only sees how many people joined with their link, not who. It goes when either account is deleted."], "nl": ["Vrienden uitnodigen", "Elke speler heeft een uitnodigingslink. Maak je een account via de link van een vriend, dan bewaren we wie je uitnodigde, zodat jullie allebei een sleutel krijgen als je je eerste level uitspeelt. Je vriend ziet alleen hoeveel mensen via de link meededen, niet wie. Het verdwijnt als een van beide accounts wordt verwijderd."], "fr": ["Inviter des amis", "Chaque joueur a un lien d'invitation. Si tu crées un compte avec le lien d'un ami, on garde qui t'a invité, pour que vous receviez tous les deux une clé quand tu termines ton premier niveau. Ton ami voit seulement combien de personnes ont rejoint avec son lien, pas qui. C'est effacé quand l'un des deux comptes est supprimé."], "es": ["Invitar a amigos", "Cada jugador tiene un enlace de invitación. Si creas una cuenta con el enlace de un amigo, guardamos quién te invitó, para que los dos recibáis una llave cuando superes tu primer nivel. Tu amigo solo ve cuántas personas se unieron con su enlace, no quiénes. Se borra cuando se elimina cualquiera de las dos cuentas."], "it": ["Invitare amici", "Ogni giocatore ha un link d'invito. Se crei un account con il link di un amico, teniamo traccia di chi ti ha invitato, così ricevete entrambi una chiave quando completi il tuo primo livello. Il tuo amico vede solo quante persone si sono unite con il suo link, non chi. Viene cancellato quando uno dei due account viene eliminato."], "ja": ["友だちを招待", "プレイヤーにはそれぞれ招待リンクがあります。友だちのリンクからアカウントを作ると、誰に招待されたかを保存し、最初のレベルをクリアしたときに2人ともカギがもらえるようにします。友だちに見えるのはリンクから参加した人数だけで、誰かはわかりません。どちらかのアカウントが削除されると消えます。"], "zh": ["邀请好友", "每位玩家都有一个邀请链接。如果你通过好友的链接创建账号，我们会记录是谁邀请了你，这样你通关第一个关卡时你们都能得到一把钥匙。你的好友只能看到有多少人通过他的链接加入，看不到是谁。任意一个账号被删除时，这条记录也会删除。"], "tw": ["邀請好友", "每位玩家都有一個邀請連結。如果你透過好友的連結建立帳號，我們會記錄是誰邀請了你，這樣你過關第一個關卡時你們都能得到一把鑰匙。你的好友只能看到有多少人透過他的連結加入，看不到是誰。任一帳號被刪除時，這筆記錄也會刪除。"]};
for (const L in INVITE_S) if (T[L]) T[L].s.splice(7, 0, INVITE_S[L]);
const SHORT_H = { en:"In short", nl:"In het kort", fr:"En bref", es:"En resumen", ja:"要点", zh:"简而言之", tw:"簡單來說", it:"In breve" };
const LANGS = ["en", "nl", "fr", "es", "it", "ja", "zh", "tw"];
const NAMES = { en:"English", nl:"Nederlands", fr:"Français", es:"Español", it:"Italiano", ja:"日本語", zh:"简体中文", tw:"繁體中文" }, HL = { zh:"zh-Hans", tw:"zh-Hant" };
function pick(){
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("javeda.lang"); if (LANGS.includes(s)) return s; } catch(e){}
  for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])){
    const x = String(l).toLowerCase(); if (x.startsWith("zh")) return /hant|tw|hk|mo/.test(x) ? "tw" : "zh";
    if (LANGS.includes(x.slice(0, 2))) return x.slice(0, 2); }
  return "en";
}
function render(L){
  const t = T[L]; document.documentElement.lang = HL[L] || L; document.title = t.title + " · JAVEDA";
  document.getElementById("doc").innerHTML = "<h1>" + t.title + "</h1><p class='date'>" + DATE[L] + "</p><p class='lead'>" + t.lead + "</p>" +
    "<div class='short'><h2>" + SHORT_H[L] + "</h2><ul>" + t.short.map(x => "<li>" + x + "</li>").join("") + "</ul></div>" +
    t.s.map(([h, b]) => "<h2>" + h + "</h2><p>" + b + "</p>").join("").replace(/<p>([^]*?)<ul>/g, "<p>$1</p><ul>").replace(/<\/ul>([^<]+)<\/p>/g, "</ul><p>$1</p>");
  document.getElementById("back").innerHTML = "&larr; " + t.back;
  document.getElementById("lang").innerHTML = "<select aria-label='Language'>" + LANGS.map(k => "<option value='" + k + "' lang='" + (HL[k] || k) + "'" + (k === L ? " selected" : "") + ">" + NAMES[k] + "</option>").join("") + "</select>";
}
document.getElementById("lang").addEventListener("change", e => { const v = e.target.value; try { localStorage.setItem("javeda.lang", v); } catch(err){} render(v); });
render(pick());
</script>
</body>
</html>

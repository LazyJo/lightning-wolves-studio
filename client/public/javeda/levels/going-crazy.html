<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= GOING CRAZY =================
   Level 10 of JAVEDA, in the world of the cover: a skyline at night seen from
   high above - towers full of gold windows, the gold highways, the dark marina -
   and Jo's orange saucer (the "L" badge on top) coming down with its beam.
   Jo picked the FREEFALL prototype: the saucer drops down a shaft between four
   towers, seen from above. Each skybridge of glass has one hole to get through;
   crane arms swing, helicopters cross, window-washer cradles slide along; lights
   to grab and gold rings on the beat. 3 hearts. At the end of the song you burst
   out over the city - the cover.
   Once it's cleared, ENDLESS opens (?endless=1): the same fall with no end, in
   8-bar windows, harder each window, a heart back every 24 bars.

   Everything comes up at you on the song's grid: it's laid out by beat, so it
   reaches you (y = 0) exactly on the beat it belongs to. */

// the song's measured grid (SONG.md): 83.5 BPM (167 double-time), bars from -0.723 s
const GRID = { bpm:83.5, t0:-.723 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(36);                      // the fall ends with hook 2; the outro is the ending
const LOOP = [barT(8), barT(36)];             // endless: hook 1 to the end of hook 2, round and round
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook, rest (a bar that drops out)
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  if (b < 4 || b >= 36) return "calm";        // intro, outro
  if (b < 8) return "loud";                     // the hook without drums
  if (b < 16 || b >= 28) return "hook";         // hook 1, hook 2
  if (b < 18) return "rest";                    // the drop-out after hook 1
  return b < 24 ? "loud" : "calm";              // the verse, then its kick-less half
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ENDLESS = Q.get("endless") === "1";
const CFG = ENDLESS ? { id:"lvl10x", title:"Freefall", by:"LEVEL 10 · ENDLESS", endless:true, board:"Level 10 ∞" }
  : { id:"lvl10", title:"Freefall", by:"LEVEL 10" };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl10.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [98, 87.3, 73.4, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .005); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 3 || s8 === 6)) tone("sine", 120, 36, at, .42, .5, 900);
    if (full && s8 === 4){ hiss(at, .2, .22, 0, 1600); tone("triangle", 210, 150, at, .1, .08); }
    hiss(at, .035, s8 % 2 ? .03 : .055, 7500);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sawtooth", f, f, at, BAR*.85, .06, 520);
      if (sec === "hook") [1, 1.2, 1.5, 2].forEach((m, k) => tone("square", f*4*m, f*4*m, at + k*BEAT*.5, BEAT*.4, .012, 2600)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 880*Math.pow(2, ((n || 0) % 8)/24), 1320*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .1, .06, 7000),
  big:  () => ac && [660, 880, 1320, 1760].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.05, .25, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  glass:() => ac && (tone("triangle", 2400, 1800, ac.currentTime, .15, .04, 9000), hiss(ac.currentTime, .12, .05, 5000)),
  close:() => ac && hiss(ac.currentTime, .25, .1, 0, 2200),
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the city from the cover ---------------- */
let scene, cam, ren, sky, clockR, ME, crashed = null;
const glowMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
// windows: mostly warm gold, some cool white-blue, a few dark
function windowTex(k){
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 128; const x = cv.getContext("2d");
  x.fillStyle = "#0b0f1c"; x.fillRect(0, 0, 64, 128);
  for (let r = 0; r < 16; r++) for (let c = 0; c < 8; c++){ const q = rnd(k*97 + r*13 + c*7);
    if (q < .28) continue;
    x.fillStyle = q < .78 ? (q < .5 ? "#ffb347" : "#ffd88a") : q < .9 ? "#cfe8ff" : "#ff8a3a";
    x.globalAlpha = .55 + rnd(q*31)*.45; x.fillRect(c*8 + 2, r*8 + 2, 4, 5); x.globalAlpha = 1; }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const WIN = [];
const TOWER_ROOF = new THREE.MeshStandardMaterial({ color:0x10131e, roughness:.8 });
function tower(w, h, d, k){
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  for (let f = 0; f < 6; f++){ const sx = f < 2 ? d : w, top = f === 2 || f === 3;
    for (let v = 0; v < 4; v++){ const i = f*4 + v; uv.setXY(i, uv.getX(i)*(top ? 1 : sx/5), uv.getY(i)*(top ? 1 : h/10)); } }
  return new THREE.Mesh(g, [WIN[k % 4], WIN[k % 4], TOWER_ROOF, TOWER_ROOF, WIN[k % 4], WIN[k % 4]]);
}
function neonTex(text, color){
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 128; const x = cv.getContext("2d");
  x.font = "64px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.shadowColor = color; x.shadowBlur = 24; x.fillStyle = color; x.fillText(text, 256, 68); x.shadowBlur = 0; x.fillStyle = "#fff"; x.fillText(text, 256, 68);
  return new THREE.CanvasTexture(cv);
}
function buildSky(){
  const cv = document.createElement("canvas"); cv.width = 4; cv.height = 256; const x = cv.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  [[0, "#02040c"], [.35, "#0a1230"], [.47, "#1a2a5a"], [.5, "#3a3a6a"], [.53, "#120c18"], [1, "#05060c"]].forEach(([o, c]) => g.addColorStop(o, c));
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv), side:THREE.BackSide, fog:false, depthWrite:false }));
  scene.add(sky);
}
// Jo's orange saucer from the cover: an orange hull, the "L" badge on top, white rim lights, the beam
const BADGE = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = 128; const x = cv.getContext("2d");
  x.fillStyle = "#fff4e6"; x.beginPath(); x.arc(64, 64, 58, 0, Math.PI*2); x.fill(); x.fillStyle = "#ff7a1a"; x.beginPath(); x.arc(64, 64, 50, 0, Math.PI*2); x.fill();
  x.fillStyle = "#1a0a02"; x.font = "bold 76px Bungee, Impact, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("L", 66, 70); return new THREE.CanvasTexture(cv); })();
function buildSaucer(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 14), new THREE.MeshStandardMaterial({ color:0xff8a2a, roughness:.3, metalness:.45, emissive:0x6a2400, emissiveIntensity:.6 }));
  hull.scale.set(1.25, .3, 1.25); g.add(hull);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.2, .07, 8, 44), new THREE.MeshStandardMaterial({ color:0x3a1a08, metalness:.7, roughness:.3 })); rim.rotation.x = Math.PI/2; g.add(rim);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.55, 24, 10, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color:0xffb05a, roughness:.2, metalness:.3, emissive:0x7a3a00, emissiveIntensity:.5 }));
  dome.position.y = .14; g.add(dome);
  const badge = new THREE.Mesh(new THREE.CircleGeometry(.32, 24), new THREE.MeshBasicMaterial({ map:BADGE, transparent:true })); badge.rotation.x = -Math.PI/2; badge.position.y = .7; g.add(badge);
  const lights = new THREE.Group(); g.add(lights);
  for (let i = 0; i < 14; i++){ const a = i/14*Math.PI*2, l = new THREE.Mesh(new THREE.SphereGeometry(.075, 6, 5), new THREE.MeshBasicMaterial({ color:0xfff4e0 })); l.position.set(Math.sin(a)*1.22, 0, Math.cos(a)*1.22); lights.add(l); }
  const under = sprite(0xff8a2a, 3.4, .7); under.position.y = -.2; g.add(under);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.35, 1.6, 3.4, 24, 1, true), glowMat(0xffa040, .22)); beam.position.y = -1.9; g.add(beam);
  g.userData = { lights, beam, under };
  return g;
}

/* ---------------- the city below: where you come out at the end ---------------- */
const CITY_X = 900;                           // it's off to the side, out of the shaft's way
const BLINK = [];
const ROADS = [];
function buildCity(){
  const root = new THREE.Group(); root.position.x = CITY_X; scene.add(root);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color:0x0a0b10, roughness:1 })); ground.rotation.x = -Math.PI/2; root.add(ground);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(160, 500), new THREE.MeshStandardMaterial({ color:0x061428, roughness:.15, metalness:.7, emissive:0x020a18 })); sea.rotation.x = -Math.PI/2; sea.position.set(120, .05, 0); root.add(sea);

    for (const c of this.cranes) if (c.on){ c.g.position.set(c.cx, c.y, c.cz); c.g.rotation.y = -c.a; }
    for (const h of this.helis) if (h.on){ h.g.position.set(h.x, h.y, h.hz); h.g.rotation.y = h.dir > 0 ? 0 : Math.PI; h.g.userData.rotor.rotation.y = t*30; }
    for (const c of this.cradles) if (c.on) c.g.position.set(c.x, c.y, c.cz);
    for (const o of this.orbs) if (o.on){ o.s.position.set(o.x, o.y, o.z); o.s.scale.setScalar(1.2 + (beat ? .4 : 0)); }
    for (const r of this.rings) if (r.on){ r.r.position.set(r.rx, r.y, r.rz); r.r.scale.setScalar(1 + (beat ? .12 : 0)); }
    for (const h of this.hearts) if (h.on){ h.g.position.set(h.hx, h.y, h.hz); h.g.rotation.y = t*2; }
    const portrait = cam.aspect < .8;
    CAMP.set(st.x*.25, portrait ? 15 : 11, (portrait ? 3 : 4.5) + st.z*.25); CAML.set(st.x*.4, -30, st.z*.4 - 2);
  }
};

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = FALL; FALL.root.visible = true; CITY.visible = false; camInit = false;
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
}
// endless goes in 8-bar windows, a little harder every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
function songT(){
  if (CFG.endless && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  roadsStep(dt);
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   You burst out of the bottom of the shaft over the city: the cover. The towers
   lit gold, the highways, the marina - and the orange saucer coming down with
   its beam on. */
const END = { out:7.5 };
let CITY = null;
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
  $("flash").style.background = "#fff"; S.flashT = .6;
  FALL.root.visible = false; CITY.visible = true; camInit = false; fogFor(true);
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  ME.userData.lights.rotation.y = t*2.5; ME.userData.beam.material.opacity = .18 + (beat ? .14 : 0); ME.userData.under.material.opacity = .55 + (beat ? .3 : 0);
  if (S.end >= 0){
    // the cover: high over the city, the saucer comes down toward you with its beam on
    const u = clamp(S.end/4, 0, 1), s = u*u*(3 - 2*u), portrait = cam.aspect < .8;
    ME.visible = true; ME.scale.setScalar(2.2); ME.position.set(CITY_X + 2 - s*2, 70 - s*28, 34 - s*6); ME.rotation.set(.12, t*1.2, 0);
    CAMP.set(CITY_X, portrait ? 92 : 78, portrait ? 86 : 70); CAML.set(CITY_X, 18, -26);
    if (S.end > 1.4 && !S.saidEnd){ S.saidEnd = true; say("GOING CRAZY", "LAZY JO", 4.5, "t"); }
    if (S.end > END.out - 1.2){ $("flash").style.background = "#060914"; $("flash").style.opacity = Math.min(1, (S.end - (END.out - 1.2))/1.2); }
  } else {
    ME.scale.setScalar(1);
    G.render(dt, t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  for (const s of BLINK) s.visible = Math.floor(t*1.4 + s.position.y) % 2 === 0;
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.4 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  sky.position.copy(cam.position);
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:Math.round(FALL.st.depth) });
  const st = FALL.st, stat = fmt(st.depth) + " m down · " + st.got + " lights · " + st.rings + " rings · " + st.bridges + " skybridges";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> of freefall &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "GOING CRAZY";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = "All the way down through the city." + "<br>Level 10 cleared: <b>Freefall &#8734;</b> is open in the gold Endless list.";
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060c); scene.fog = new THREE.Fog(0x0a0e1e, 30, 160);
  cam = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, .1, 2000);
  scene.add(new THREE.HemisphereLight(0x7a8aff, 0x1a1008, .7));
  const key = new THREE.DirectionalLight(0xffd0a0, .8); key.position.set(30, 60, 20); scene.add(key);
  for (let k = 0; k < 4; k++){ const t = windowTex(k + 1); WIN.push(new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff, emissiveIntensity:.95, color:0x2a2a38, roughness:.6 })); }
  buildSky();
  CITY = buildCity(); CITY.visible = false;
  ME = buildSaucer(); scene.add(ME);
  FALL.setup();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}
// the fog: thick in the shaft, thinner over the city at the end
function fogFor(end){ scene.fog.near = end ? 90 : 30; scene.fog.far = end ? 420 : 160; }

/* ---------------- input ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
let held = false;
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); held = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live()) return; if (held || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
addEventListener("pointerup", () => { held = false; }); addEventListener("pointercancel", () => { held = false; });
const KEYMAP = { ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k && !veilUp()){ e.preventDefault(); keys[k] = true; } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

$("go").addEventListener("click", () => {
  reset(); fogFor(false);
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : "FREEFALL", CFG.endless ? "the fall with no end" : G.hint, 3, CFG.endless ? "g" : "");
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "GOING CRAZY" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "Jo's orange saucer drops into the city from the sky. Freefall down between the towers - through the skybridges, past the cranes and the helicopters - all the way to the streets." +
  (ENDLESS ? " <b>Endless:</b> the fall never ends - faster every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "<b>Drag</b> (or the arrow keys) to steer. Each glass skybridge has one hole - be over it when it reaches you. Cranes, helicopters and cradles cost a heart (3). Grab the lights; a gold ring on the beat is double.";
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>

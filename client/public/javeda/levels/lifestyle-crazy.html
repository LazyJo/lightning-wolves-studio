<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= LIFESTYLE CRAZY =================
   Level 26 of JAVEDA, in the world of the cover: the night full of stars, the lasers crossing high over the black
   car with the glowing pink hood and the rainbow rings round its headlights, the hooded rider on its roof with his
   visor lit - and Jo's saucer as it is on this cover (the red dome with the "L", the pink lights, the purple beam).
   Jo picked two, so the song has two parts:
   PART 1 · NEON PINBALL: a real pinball table on the floor in front of the car. Score enough and the next table
   comes in, harder - and so on.
   PART 2 · SPEAKER PUSH (?part=2): push the speakers onto the glowing pads; the saucer can push but never pull.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once both are cleared. */

// the song's grid, measured from the mp3 (SONG.md): 70 BPM (a 140 beat in half time), bar 0 at 0.422 s
const GRID = { bpm:70, t0:0.422 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(56);                      // the outro: just the bass again (3:12)
const LOOP = [barT(4), barT(44)];             // endless: the third hook is the first one again
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (the bass on its own), hook, loud (the verses)
const SECTIONS = [[4, "calm"], [12, "hook"], [20, "loud"], [24, "calm"], [32, "hook"], [40, "loud"], [44, "calm"], [52, "hook"], [56, "loud"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = { "2":2 }[Q.get("part")] || 1;
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Neon Pinball", "Speaker Push"], IDS = ["", "lvl26", "lvl26b"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 26" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 26" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 26" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl26.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 130.8, 98];            // a dark club loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  flip: () => ac && (tone("square", 180, 90, ac.currentTime, .05, .05, 1500), hiss(ac.currentTime, .04, .08, 0, 2500)),        // a flipper's clack
  bumper:() => ac && (tone("square", 520, 260, ac.currentTime, .09, .06, 3000), tone("sine", 130, 60, ac.currentTime, .12, .12, 600)),
  sling:() => ac && tone("triangle", 900, 400, ac.currentTime, .08, .05, 5000),
  drop: () => ac && (tone("square", 300, 120, ac.currentTime, .12, .06, 1800), hiss(ac.currentTime, .1, .1, 0, 900)),
  launch:() => ac && (hiss(ac.currentTime, .35, .14, 0, 700), tone("sawtooth", 80, 400, ac.currentTime, .3, .06, 1200)),
  lock: () => ac && [392, 523, 784, 1047, 1568].forEach((f, i) => tone("sine", f, f, ac.currentTime + i*.07, .35, .06, 7000)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in

  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#f0d8ff"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = true; LOOK.copy(portrait ? new THREE.Vector3(0, .2, -1.3) : new THREE.Vector3(0, -.4, -1)); for (const id of ["dmd", "pad", "pad2"]) $(id).classList.add("hid"); }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer settles in front of the car's grille, its purple beam on the floor
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.5); ME.rotation.set(-.1, Math.sin(t*1.5)*.2, 0); animSaucer(ME, t, beat);
      const b = ME.userData.beam; b.visible = true; b.scale.set(.5, .5, .5); b.position.y = -.95;
      ME.position.set(0, 1.0 + (1 - e)*3 + Math.sin(t*2)*.04, -2.4);
      END.glow.material.opacity = .45*e*(beat ? 1.2 : 1); animClub(G.w, t, dt, beat);
      CAMP.set(0, portrait ? 2.4 : 1.6, portrait ? 7.5 : 4.6); CAML.set(0, portrait ? 2.2 : 1.9, -8);
      const k = Math.min(1, dt*1.1);
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("LIFESTYLE CRAZY", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off"; for (const id of ["dmd", "pad", "pad2"]) $(id).classList.add("hid");
  const got = S.got;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = PART === 1 ? "table " + (S.table + 1) + " · " + S.hits + " hits · " + S.locks + " beam locks" : S.floors + " floors partying · " + S.moves + " moves";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> under the lasers &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "LIFESTYLE CRAZY";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = ["", "Tables down.<br>Part 2, <b>Speaker Push</b>, is open.", "Every speaker on its pad.<br>Level 26 cleared: <b>Neon Pinball &#8734;</b> and <b>Speaker Push &#8734;</b> are open in the gold Endless list."][PART];
}

/* ---------------- input ---------------- */
// Neon Pinball: a finger on the left or right half holds that flipper (a finger each side works); the first tap
// launches. Speaker Push: tap next to the saucer, swipe, or the arrow pad; UNDO and RESTART.
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
const onPads = e => e.target.closest && e.target.closest("#pad, #pad2");
const fingers = new Map();
addEventListener("pointerdown", e => { if (veilUp() || !live() || onPads(e)) return; e.preventDefault();
  if (G === PB){ const s = e.clientX < innerWidth/2 ? -1 : 1; fingers.set(e.pointerId, s); PB.hold(s, true); }
  else PUSH.touchStart(e.clientX, e.clientY); }, { passive:false });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, e => {
  if (G === PB){ const s = fingers.get(e.pointerId); fingers.delete(e.pointerId); if (s && ![...fingers.values()].includes(s)) PB.hold(s, false); }
  else if (live() && !onPads(e)) PUSH.touchEnd(e.clientX, e.clientY); });
document.querySelectorAll("#pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); if (!live()) return; const W = PUSH.W; PUSH.move({ u:-W, d:W, l:-1, r:1 }[b.dataset.d]); }));
$("undo").addEventListener("pointerdown", e => { e.preventDefault(); if (live()) PUSH.undo(); });
$("restart").addEventListener("pointerdown", e => { e.preventDefault(); if (live()) PUSH.restart(); });
const KEYMAP = { ArrowLeft:"left", a:"left", z:"left", ArrowRight:"right", d:"right", m:"right" };
addEventListener("keydown", e => { if (veilUp() || !live()) return; if (e.key === " "){ e.preventDefault(); if (!e.repeat && G.press) G.press(); return; }
  if (G === PB){ const k = KEYMAP[e.key]; if (k){ e.preventDefault(); if (!keys[k]) PB.flip(k === "left" ? -1 : 1, true); keys[k] = true; } } });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k && G === PB){ keys[k] = false; PB.flip(k === "left" ? -1 : 1, false); } });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? (PART === 1 ? "the tables never stop" : "the floors never stop") : G.hint, 3, CFG.endless ? "g" : ""); $("dmd").classList.toggle("hid", PART !== 1); $("pad").classList.toggle("hid", PART !== 2); $("pad2").classList.toggle("hid", PART !== 2); document.body.classList.toggle("push", PART === 2); document.body.classList.toggle("push", PART === 2);
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "LIFESTYLE CRAZY" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The night from the cover - the stars, the lasers crossing over the black car with the glowing pink hood and the rider on its roof - and Jo's saucer." +
  [" <b>Part 1 · Neon Pinball:</b> a real pinball table on the floor in front of the car.", " <b>Part 2 · Speaker Push:</b> the dance floor, the speakers off, the pads where they belong."][PART - 1] +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = [
  "<b>Tap</b> to launch (on the beat: a skill shot), then <b>hold the left or the right</b> of the screen for each flipper (or the arrows). Bumpers, slingshots, the drop targets, the L-I-F-E lanes (the flippers turn the lit ones), and the lock under Jo's saucer - three locks for multiball. Score enough and the <b>next table</b> comes in, harder every time. A lost ball costs a heart (3); a new table gives one back.",
  "Push every speaker onto a glowing pad - the saucer can <b>push</b> but never pull, one speaker at a time. <b>Tap</b> next to it, swipe, or use the <b>arrows</b>; white arrows show where it can go, orange ones where it'll push. A speaker stuck in a corner can't come out: <b>UNDO</b> or <b>RESTART</b>. Out of time costs a heart (3)."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
PARTS[PART].setup(); buildEnd();
reset();
requestAnimationFrame(frame);
</script>

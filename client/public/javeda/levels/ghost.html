<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= GHOST =================
   Level 15 of JAVEDA, in the street from the cover: old dark brick houses at dusk, a few
   windows lit warm orange, the pink sky low down, an orange street lamp, bare trees, fog
   rolling over the street - and Jo's saucer (silver, the orange dome with the "L") with
   its warm orange beam. Jo picked HAUNTED WINDOWS: the two old houses from the street. On
   the beat a ghost comes up in a window - tap it and the beam takes it (on the beat x2).
   The neighbours at the lit windows cost a heart (3); a ghost that ducks away haunts the
   houses more - eight cost a heart, ten caught in a row (or a few quiet bars) calm them down. The song sets how
   many: a few in the calm, one a beat in the verses, two at once and gold ones in the hooks.
   At the end of the song: the street as it is on the cover.
   Once it's cleared, ENDLESS opens (?endless=1): the ghosts never stop, quicker every 8
   bars, a heart back every 24. */

// the song's grid, measured from lvl15.mp3: 76.5 BPM, the first beat at 0.776 s (see SONG.md)
const GRID = { bpm:76.5, t0:.776 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(64);                      // 3:22, the last hit
const LOOP = [barT(8), barT(64)];             // endless: round and round, from the first hook
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [16, "hook"], [24, "loud"], [28, "calm"], [36, "hook"], [44, "loud"], [48, "calm"], [56, "hook"], [64, "loud"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);
const ENDLESS = Q.get("endless") === "1";
const CFG = ENDLESS ? { id:"lvl15x", title:"Haunted Windows", by:"LEVEL 15 · ENDLESS", endless:true, board:"Level 15 ∞" }
  : { id:"lvl15", title:"Haunted Windows", by:"LEVEL 15" };

const LINKS = {
  spotify: "https://open.spotify.com/track/3Z8nes2rHTZCmQwX0vO33c",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/SES7XPJvBH", youtube: "https://www.youtube.com/@lazyjo_?sub_confirmation=1",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl15.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 87.3, 98, 82.4];
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  zap:  () => ac && (tone("sine", 900, 300, ac.currentTime, .25, .05, 4000), hiss(ac.currentTime, .25, .05, 0, 2500)),   // the beam takes a ghost
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the street from the cover ---------------- */
let scene, cam, ren, clockR, ME, crashed = null;
const GC = { lamp:0xffa040, warm:0xffc070, pink:0xff8a9a, ghost:0xdce6ff, red:0xff4a5a, soul:0x9ad8ff };
const glowM = (c, op) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const PUFF = radial([[0, "rgba(255,255,255,.55)"], [.5, "rgba(255,255,255,.22)"], [1, "rgba(255,255,255,0)"]], 128);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
// the dusk sky: dark blue up top, purple, the pink glow low down behind the houses
function skyDome(){ const t = canvasTex(4, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h);
    [[0, "#10101e"], [.3, "#2a2348"], [.42, "#5a4070"], [.48, "#b07890"], [.5, "#ffa890"], [.52, "#3a3040"], [1, "#16131c"]].forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, w, h); });
  const m = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.MeshBasicMaterial({ map:t, side:THREE.BackSide, fog:false, depthWrite:false })); scene.add(m); return m; }
// the houses: old dark brick, three windows across, a few lit warm orange (one tile = 9 x 12 m)
const HOUSE = [0, 1, 2, 3].map(k => { const t = canvasTex(96, 128, (x, w, h) => {
    x.fillStyle = ["#3a2622", "#33241f", "#2e2226", "#3c2a24"][k]; x.fillRect(0, 0, w, h);
    for (let r = 0; r < 32; r++){ x.fillStyle = "rgba(0,0,0,.35)"; x.fillRect(0, r*4, w, 1); for (let c = 0; c < 12; c++) x.fillRect(((c*8 + (r % 2)*4) % w), r*4, 1, 4); }
    for (let i = 0; i < 300; i++){ x.fillStyle = "rgba(" + (rnd(i + k)*80 | 0) + ",40,30," + (rnd(i*3)*.25).toFixed(2) + ")"; x.fillRect(rnd(i*5 + k)*w, rnd(i*7)*h, 3, 2); }
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++){ const q = rnd(k*31 + r*7 + c*3), lit = q < .14, X = 10 + c*30, Y = 12 + r*40;
      x.fillStyle = "#18141a"; x.fillRect(X - 2, Y - 2, 20, 30); x.fillStyle = lit ? "#ffa850" : q < .3 ? "#2a2028" : "#0e0c12"; x.fillRect(X, Y, 16, 26);
      if (lit){ x.fillStyle = "#ffd090"; x.fillRect(X + 3, Y + 3, 10, 20); } x.fillStyle = "#18141a"; x.fillRect(X + 7, Y, 2, 26); x.fillRect(X, Y + 12, 16, 2); } }, [1, 1]);
  return new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff, emissiveIntensity:.32, roughness:.95, color:0x9a8a88 }); });
const ROOF = new THREE.MeshStandardMaterial({ color:0x16121a, roughness:1 });
function boxUV(w, h, d){ const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h/2, 0); const uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++){ const i = f*4 + v, su = f < 2 ? d/9 : f < 4 ? 0 : w/9, sv = f < 2 || f > 3 ? h/12 : 0; uv.setXY(i, uv.getX(i)*su, uv.getY(i)*sv); }
  return g; }
function house(w, h, d, k){ const g = new THREE.Group(); g.add(new THREE.Mesh(boxUV(w, h, d), HOUSE[k % 4]));
  const r = new THREE.Mesh(new THREE.BoxGeometry(w + .4, d*.6, d*.6), ROOF); r.rotation.x = Math.PI/4; r.position.y = h; g.add(r);   // the ridge runs along the street
  if (k % 3 === 0){ const ch = new THREE.Mesh(new THREE.BoxGeometry(.9, 2.4, .9), ROOF); ch.position.set(w*.25, h + d*.2, -d*.15); g.add(ch); }
  return g; }
// a street lamp from the cover: a dark pole, a warm orange light, a pool of it on the ground
const POLE_M = new THREE.MeshStandardMaterial({ color:0x1a161c, roughness:.6, metalness:.5 });
function lamp(lit){ const g = new THREE.Group();
  g.add(at3(new THREE.Mesh(new THREE.CylinderGeometry(.1, .16, 6, 6), POLE_M), 0, 3, 0)); g.add(at3(new THREE.Mesh(new THREE.BoxGeometry(1.2, .1, .1), POLE_M), -.5, 6, 0));
  const head = new THREE.Mesh(new THREE.SphereGeometry(.28, 10, 8), new THREE.MeshBasicMaterial({ color:0xffd8a0 })); head.position.set(-1, 5.8, 0); g.add(head);
  const glow = sprite(GC.lamp, 5, .9); glow.position.copy(head.position); g.add(glow);

  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The houses fade, and there's the street as it is on the cover: down between the dark
   brick houses to the bare trees and the pink sky, the street lamp glowing orange, the fog,
   and the saucer low over the road with its warm beam on. */
const END = { out:8, root:null, X:300 };
function buildEnd(){
  const g = streetSet(-90, 16, { W:6, lampEvery:200 }); g.visible = false; g.position.x = END.X;
  const l = lamp(); l.position.set(6.6, 0, -24); l.rotation.y = 0; g.add(l); l.scale.setScalar(1.15);
  for (let i = 0; i < 5; i++){ const tr = tree(1.5 + rnd(i)*.6, i*9); tr.position.set(-8 + i*4, 0, -86 - (i % 2)*4); g.add(tr); }
  const fog = fogPuffs(24, [16, 80], .4); for (const p of fog){ p.s.position.z -= 30; g.add(p.s); }
  END.root = g; END.fog = fog;
}
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  ME.userData.lights.rotation.y = t*2.5; ME.userData.beam.material.opacity = .18 + (beat ? .14 : 0); ME.userData.under.material.opacity = .55 + (beat ? .3 : 0);
  if (S.end >= 0){
    // the cover: a fade to dark, then the street - the saucer low over the road in the fog, beam on
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#0e0b14"; $("flash").style.opacity = Math.min(1, S.end/.8); HW.render(dt, t); }
    else {
      if (!END.on){ END.on = true; HW.root.visible = false; END.root.visible = true; camInit = false; scene.fog.near = 6; scene.fog.far = 95; }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      ME.visible = true; ME.scale.setScalar(1.5); ME.position.set(END.X, 2.4 + Math.sin(t*1.5)*.15, -14); ME.rotation.set(.05, t*1.2, 0);
      ME.userData.beam.visible = true; ME.userData.beam.scale.set(1.2, .75, 1.2); ME.userData.beam.position.y = -1.2;
      driftFog(END.fog, t, 3);
      CAMP.set(END.X, portrait ? 2.6 : 2.4, portrait ? 12 : 8); CAML.set(END.X, portrait ? 6 : 5, -60);
      if (S.end > 2.2 && !S.saidEnd){ S.saidEnd = true; say("GHOST", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(dt, t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  const k = camInit ? Math.min(1, dt*(S.end >= 0 ? 1.1 : 7)) : 1; camInit = true;
  cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
  SKY.position.x = cam.position.x; if (!CALM) for (const c of SKY.userData.clouds) c.c.position.x = c.x0 + Math.sin(t*.02*c.v + c.x0)*26;
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:HW.st.caught });
  const st = HW.st, stat = fmt(st.caught) + " ghosts caught" + (st.golds ? " · " + st.golds + " gold" : "") + " · " + st.haunt + " haunting";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the street &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "GHOST";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = "The houses are quiet again." + "<br>Level 15 cleared: <b>Haunted Windows &#8734;</b> is open in the gold Endless list.";
}
function boot(){
  ren = new THREE.WebGLRenderer({ antialias:true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); ren.setSize(innerWidth, innerHeight); $("cab").appendChild(ren.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x16131c); scene.fog = new THREE.Fog(0x4a4256, 40, 160);
  cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 2000);
  scene.add(new THREE.HemisphereLight(0x9a8ab8, 0x1a1418, .75));
  const key = new THREE.DirectionalLight(0xffb0a0, .45); key.position.set(-10, 20, -60); scene.add(key);
  skyDome(); buildSky();
  ME = buildSaucer(); scene.add(ME);
  HW.setup(); buildEnd();
  clockR = new THREE.Clock();
  addEventListener("resize", () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
}

/* ---------------- input ---------------- */
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
// tap (or click) a window
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); G.tap(e.clientX, e.clientY); }, { passive:false });

$("go").addEventListener("click", () => {
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : "HAUNTED WINDOWS", CFG.endless ? "the ghosts never stop" : G.hint, 3, CFG.endless ? "g" : "");
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "GHOST" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The old houses on the street from the cover, at dusk, in the fog. Ghosts come up in the windows on the beat - catch them with the saucer's beam before they duck away." +
  (ENDLESS ? " <b>Endless:</b> the ghosts never stop - quicker every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "<b>Tap</b> a ghost while it's up in its window - <b>on the beat</b> it's double. Gold ghosts are a bonus, a pink one with a heart gives one back. Tapping a neighbour at a lit window costs a heart (3); eight ghosts that duck away and the houses are haunted - ten caught in a row calm them down.";
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String((m === "endless") === ENDLESS));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); if (m === "endless") q.set("endless", "1"); location.search = q.toString(); });
  });
}
boot();
reset();
requestAnimationFrame(frame);
</script>

<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= DOWN FOR ME =================
   Level 24 of JAVEDA, in the world of the cover: the terrace over the sea at sunset - the sun going down on
   the horizon, its golden path on the water, the palms at both sides, the turquoise water round the floor -
   and the round wooden table with the bouquet in the teal vase, the two cups, the little glasses, the two dark
   chairs. Jo's saucer as it is on this cover (the purple dome with the "L", the white beam).
   SUNSET SWAP: a picture from the cover cut into squares and mixed up on the table - the sunset, the
   bouquet, the saucer, the cups, the cover itself and the palms. Tap two squares to swap them; a
   square in its place locks. 3x3, then 4x4, then 5x5. Out of time costs a heart (3). On the beat it counts
   double, in the hooks double again. At the end of the song: the cover. ENDLESS (?endless=1) once it's cleared. */

// the song's grid, measured from the mp3 (SONG.md): 71 BPM (a 142 beat in half time), bar 0 at 0.018 s
const GRID = { bpm:71, t0:.018 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(44);                      // the song ends (2:29)
const LOOP = [barT(8), barT(40)];             // endless: the last section runs back into the first hook
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [16, "hook"], [24, "loud"], [28, "calm"], [36, "hook"], [41, "loud"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = 1;                                // one part: Sunset Swap
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Sunset Swap"], IDS = ["", "lvl24"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 24" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 24" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 24" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl24.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [110, 146.8, 123.5, 98];           // a warm, easy loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: the terrace over the sea at sunset - the round wooden table with the bouquet in the teal vase, the cups and the little glasses, the two dark chairs, the palms; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
const FLOWER_COLS = [0xff5a8a, 0xe8203a, 0xff7a2a, 0xd040b0, 0x2ac8c8, 0xffc83a];
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const soft = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.8, metalness:0, emissive:c, emissiveIntensity:e == null ? .15 : e });

// the sunset, far away: the sky from deep blue to gold, the sun on the horizon, the sea with its golden path
function paintSunset(x, w, h, hz){
  let g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, "#1e5ab8"); g.addColorStop(.35, "#3a98e0"); g.addColorStop(.62, "#8ac8e8"); g.addColorStop(.82, "#ffcca0"); g.addColorStop(.94, "#ffaa5a"); g.addColorStop(1, "#ffe0a0");
  x.fillStyle = g; x.fillRect(0, 0, w, hz);
  for (let i = 0; i < 16; i++){ x.fillStyle = "rgba(255," + (190 + Math.floor(rnd(i*3)*50)) + "," + (200 + Math.floor(rnd(i*7)*40)) + "," + (.25 + rnd(i*5)*.3) + ")";
    x.beginPath(); x.ellipse(rnd(i*11)*w, hz*(.15 + rnd(i*13)*.6), w*(.06 + rnd(i*17)*.12), hz*(.02 + rnd(i*19)*.04), 0, 0, Math.PI*2); x.fill(); }
  g = x.createLinearGradient(0, hz, 0, h); g.addColorStop(0, "#6ac0d8"); g.addColorStop(.25, "#2a92c8"); g.addColorStop(1, "#0a5294");
  x.fillStyle = g; x.fillRect(0, hz, w, h - hz);
  for (let i = 0; i < 700; i++){ const k = rnd(i*1.3), yy = hz + 2 + k*k*(h - hz), spread = 14 + (yy - hz)*.9, xx = w/2 + (rnd(i*2.1) - .5)*2*spread*rnd(i*3.7);

  SIZE:4.5,
  setup(){ boot(48); this.w = terrace(); this.root = new THREE.Group(); scene.add(this.root); this.cells = [];

    ME = buildSaucer(); ME.scale.setScalar(.42); scene.add(ME); },
  reset(){ for (const x of this.cells) this.root.remove(x.m); this.cells = [];
    Object.assign(S, { pic:0, pics:0, fixed:0, k:1, nextAt:0, sel:null, last:null, deadline:0 }); lastT = 0; this.make(0); say("SUNSET SWAP", "tap two squares to swap them", 2.4); },
  info(){ return this.cells.filter(x => x.at === x.home).length + "/" + this.cells.length + " · PICTURE " + (S.pic + 1); }, warn(){ return !S.nextAt && S.deadline - S.t < BAR; },
  slot(i){ const n = this.n, s = this.SIZE/n; return new THREE.Vector3((i % n - (n - 1)/2)*s - .3, .06, (Math.floor(i/n) - (n - 1)/2)*s - .1); },
  make(t){ for (const x of this.cells) this.root.remove(x.m); this.cells = [];
    const n = this.n = S.pic < 2 ? 3 : S.pic < 5 ? 4 : 5, s = this.SIZE/n, tex = PIC_TEX[S.pic % PIC_TEX.length]; this.prev.material.map = tex; coverClones = [];
    const order = shuffle([...Array(n*n).keys()], S.k++*17 + 3);
    // no more than one square starts in its place
    for (let i = 0, fix = 0; i < order.length; i++) if (order[i] === i && ++fix > 1){ const j = (i + 1) % order.length; [order[i], order[j]] = [order[j], order[i]]; }
    for (let i = 0; i < n*n; i++){ const tx = tex.clone(); tx.needsUpdate = true; if (tex === PIC_TEX[4]) coverClones.push(tx); tx.repeat.set(1/n, 1/n); tx.offset.set((i % n)/n, 1 - (Math.floor(i/n) + 1)/n);
      const m = new THREE.Mesh(new THREE.BoxGeometry(s*.96, .1, s*.96), [DOM_SIDE, DOM_SIDE, new THREE.MeshStandardMaterial({ map:tx, roughness:.6, emissive:0xffffff, emissiveIntensity:0 }), DOM_SIDE, DOM_SIDE, DOM_SIDE]);
      const at = order[i]; m.position.copy(this.slot(at)).setY(1.5 + rnd(i)*1.5); m.userData.to = this.slot(at); this.root.add(m); this.cells.push({ home:i, at, m }); }
    S.sel = null; S.nextAt = 0; S.allow = BAR*(2 + n*n*.5)*(1.15 - .3*clamp(LV(), 0, 1.4)); S.deadline = t + S.allow; },
  pick(x){ if (!x || S.nextAt) return; if (x.at === x.home){ sfx.tick(); return; }
    if (!S.sel){ S.sel = x; sfx.tick(); return; } if (S.sel === x){ S.sel = null; return; }
    const a = S.sel; S.sel = null; [a.at, x.at] = [x.at, a.at]; a.m.userData.to = this.slot(a.at); x.m.userData.to = this.slot(x.at); sfx.slide();
    let got = 0; for (const y of [a, x]) if (y.at === y.home){ got++; const g = this.glint[(S.fixed++) % this.glint.length]; g.position.copy(this.slot(y.at)).setY(.3); g.material.opacity = 1; g.scale.setScalar(1.4); }
    if (got){ S.got += got; S.combo++; const n = 50*got*mult(S.t); S.score += n; sfx.good(S.combo); S.last = this.slot(x.at); } else S.combo = 0;
    if (this.cells.every(y => y.at === y.home)){ const bonus = 400*this.n + Math.round(Math.max(0, S.deadline - S.t)*30); S.score += bonus; S.pics++; S.pic++; sfx.big(); say("THE PICTURE", "+" + bonus, 1.2); S.nextAt = S.t + BEAT*4; } },
  tap(cx, cy){ const ms = this.cells.map(x => x.m), hit = rayAt(cx, cy, ms); if (hit) this.pick(this.cells.find(x => x.m === hit.object)); },
  update(dt, t){
    if (S.nextAt && t > S.nextAt) this.make(t);
    if (!S.nextAt && t > S.deadline){ if (hurt("OUT OF TIME", "Tap two squares to swap them - look at the picture beside the board for where each one goes.")) return; this.make(t); }
  },
  render(t){ const dt = dtOf(t), beat = onBeat(t);
    for (const x of this.cells){ lerpTo(x.m, dt, 10); const ok = x.at === x.home; x.m.material[2].emissiveIntensity = S.sel === x ? .3 + (beat ? .1 : 0) : ok && S.nextAt ? .25 : 0; if (S.sel === x) x.m.position.y = .3; }
    for (const g of this.glint) if (g.material.opacity > 0){ g.material.opacity = Math.max(0, g.material.opacity - dt*2); g.scale.multiplyScalar(1 + dt*1.5); }
    // the picture it should be, propped up beside the board (in front of it on a phone)
    if (cam.aspect < .8){ this.prev.position.set(0, .75, 3.55); this.prev.rotation.set(-.75, 0, 0); this.prev.scale.setScalar(.85); } else { this.prev.position.set(3.35, .9, -.7); this.prev.rotation.set(-.55, -.5, 0, "YXZ"); this.prev.scale.setScalar(1); }
    hover(S.sel ? S.sel.m.position : S.last || new THREE.Vector3(-.3, 0, -.1), t, dt);
    tableCam();
  }
};

/* ---------------- the game on the song's clock ----------------
   Sunset Swap is the one from prototypes.html, unchanged at heart; this gives it what the level asks of it:
   a name, the line under GET READY, how hard it is right now (L, 0 -> 1 over the song; endless keeps
   climbing), and begin() for the song or an endless window. */
const LV = () => G && G.L ? G.L(S.t) : 0;
function asPart(E, name, tag, hint){
  return Object.assign(E, { name, tag, hint, start:0,
    begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0; this.reset(); },
    L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
    get st(){ return S; } });
}
asPart(SWAP, "SUNSET SWAP", "SUNSET SWAP", "tap two squares to swap them");
const PARTS = [null, SWAP];

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, got:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PARTS[PART]; camInit = false; G.root.visible = true; showSetting(true); END.root.visible = false; END.on = false; ME.visible = true; ME.scale.setScalar(G.meScale);
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
  $("msg").className = "";
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the camera draws back from the board to the whole terrace - the bouquet in the teal vase, the
   cups, the chairs, the palms, the sun going down on the sea - and Jo's saucer comes down on the front edge of
   the table with its white beam, like on the cover. */
const END = { out:8.5, root:null };
SWAP.meScale = .42;
function showSetting(on){}
function buildEnd(){ END.root = new THREE.Group(); scene.add(END.root); END.glow = sprite(0xffd890, 3, 0); END.glow.position.set(0, .2, 3.9); END.root.add(END.glow); }
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#fff0d8"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = true; LOOK.copy(portrait ? new THREE.Vector3(0, .6, -1.6) : new THREE.Vector3(0, -1.3, -.6)); }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer comes down to the front edge of the table, its beam pouring over the edge
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.5); ME.rotation.set(-.12, Math.sin(t*1.5)*.2, 0); animSaucer(ME, t, beat);
      const b = ME.userData.beam; b.visible = true; b.scale.set(.45, 1, .45); b.position.y = -1.8;
      ME.position.set(0, .5 + (1 - e)*3 + Math.sin(t*2)*.04, 4.05);
      END.glow.material.opacity = .25*e*(beat ? 1.2 : 1);
      CAMP.set(0, portrait ? 3.6 : 2.9, portrait ? 13.5 : 11.5); CAML.set(0, portrait ? .9 : 1.1, -4);
      const k = Math.min(1, dt*1.1);
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("DOWN FOR ME", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const got = S.got;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = S.pics + (S.pics === 1 ? " picture" : " pictures") + " put back together · " + S.got + " squares in their place";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the terrace &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "DOWN FOR ME";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = "The sun's down, every picture in its place.<br>Level 24 cleared: <b>Sunset Swap &#8734;</b> is open in the gold Endless list.";
}

/* ---------------- input ---------------- */
// Sunset Swap: tap a square, tap another - they swap.
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live()) return; e.preventDefault(); G.tap(e.clientX, e.clientY); }, { passive:false });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? "the pictures never stop" : G.hint, 3, CFG.endless ? "g" : "");
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "DOWN FOR ME" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The terrace from the cover - the sun going down over the sea, the palms, the round wooden table with the bouquet in the teal vase and the cups - and Jo's saucer." +
  " <b>Sunset Swap:</b> pictures from the cover cut into squares and mixed up on the table." +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = "<b>Tap</b> a square, then <b>tap</b> another - they swap. A square in its place locks; the picture it should be stands beside the board. 3x3, then 4x4, then 5x5 - and the fifth picture is the cover. Out of time costs a heart (3). Squares put in place <b>on the beat</b> count double; double again in the hooks.";
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
PARTS[PART].setup(); buildEnd();
reset();
requestAnimationFrame(frame);
</script>

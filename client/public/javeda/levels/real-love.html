<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= REAL LOVE =================
   Level 25 of JAVEDA, in the world of the cover: the beach at night - the big glowing heart over the sea (the
   small dark red one beside it), the crescent moon, the heart's light on the water, the waves rolling in, the
   palms dark on the right, the red pickup on the sand with its headlights on - and Jo's saucer as it is on this
   cover (the gold dome with the "L", the white beam). Jo picked all four, so the song has four parts:
   PART 1 · HEART FLOW: link the pairs of hearts with lines of light; lines can't cross.
   PART 2 · CRAB SWEEPER (?part=2): dig the mounds; the numbers count the crabs around. Keep digging - the tide.
   PART 3 · STARLIGHT (?part=3): a star and the four next to it change when you tap it; light them all.
   PART 4 · SHELL SUDOKU (?part=4): each picture once in every row, column and box.
   Hearts: 3. On the beat it counts double, in the hooks double again. At the end of the song: the cover.
   ENDLESS for each (?endless=1) once all four are cleared. */

// the song's grid, measured from the mp3 (SONG.md): 67 BPM (a 134 beat in half time), bar 0 at -0.01 s
const GRID = { bpm:67, t0:-.0095 };
const BEAT = 60 / GRID.bpm, BAR = BEAT * 4;
const barT = (b, beat) => GRID.t0 + b * BAR + (beat || 0) * BEAT;
const END_AT = barT(48);                      // the song fades out (2:52)
const LOOP = [barT(8), barT(48)];             // endless: the last hook runs back into the first verse
const songPos = t => t < LOOP[1] ? t : LOOP[0] + (t - LOOP[0]) % (LOOP[1] - LOOP[0]);
// how the song feels at time t: calm (intro, breaks), loud (verses), hook
const SECTIONS = [[8, "calm"], [20, "loud"], [28, "hook"], [40, "loud"], [48, "hook"]];
function section(t){
  const b = Math.floor((songPos(t) - GRID.t0) / BAR);
  for (const [end, sec] of SECTIONS) if (b < end) return sec;
  return "calm";                                // the outro
}
const STINT = BAR * 8;                        // endless: one window
const HEARTS = 3;

const Q = new URLSearchParams(location.search);

const PART = { "2":2, "3":3, "4":4 }[Q.get("part")] || 1;
const ENDLESS = Q.get("endless") === "1";
const NAMES = ["", "Heart Flow", "Crab Sweeper", "Starlight", "Shell Sudoku"], IDS = ["", "lvl25", "lvl25b", "lvl25c", "lvl25d"];
const CFG = ENDLESS ? { id:IDS[PART] + "x", title:NAMES[PART], by:"LEVEL 25" + (PART > 1 ? " PART " + PART : "") + " · ENDLESS", endless:true, board:"Level 25" + (PART > 1 ? " Part " + PART : "") + " ∞" }
  : { id:IDS[PART], title:NAMES[PART], by:"LEVEL 25" + (PART > 1 ? " PART " + PART : "") };

const LINKS = {
  spotify: "https://open.spotify.com/playlist/57mcBqSkldvZZwS7MccYj7",
  merch:   "https://www.even.biz/l/lightningwolves",
  even:    "https://www.even.biz/l/lazyjomusic",
  discord: "https://discord.gg/ngZ4MRjV6",
  home:    "https://lightningwolves.studio/javeda/"
};
document.querySelectorAll("[data-link]").forEach(a => { a.href = LINKS[a.dataset.link]; });
const HUB = window.parent !== window && new URLSearchParams(location.search).has("hub");
const toHub = msg => { try { window.parent.postMessage(msg, location.origin); } catch(e){} };
if (HUB) document.getElementById("home").addEventListener("click", e => { e.preventDefault(); song.pause(); toHub({ type:"javeda:menu" }); });
if (CFG.endless) document.body.classList.add("gold");

const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
/* ---------------- sound: the song, or the stand-in beat ---------------- */
const SONGS = "https://wjvvkffroujkhbisxnab.supabase.co/storage/v1/object/public/media/javeda/";   // the level songs live in Supabase Storage (bucket media), not in the deploy
const song = new Audio(SONGS + "lvl25.mp3"); song.preload = "auto";
let haveSong = true; song.addEventListener("error", () => { haveSong = false; });
let ac = null, bus = null, noise = null, beatT0 = 0, nextStep = 0, stepI = 0;
const PROG = [87.3, 116.5, 98, 130.8];          // a slow, warm night loop
function audioInit(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .45; bus.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    if (ac.state === "suspended") ac.resume();
  } catch(e){ ac = null; }
}
function tone(type, f0, f1, at, dur, gain, lp){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp || 8000; o.type = type;
  o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(at); o.stop(at + dur + .05);
}
function hiss(at, dur, gain, hp, bp){
  if (!ac) return;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noise; f.type = bp ? "bandpass" : "highpass"; f.frequency.value = bp || hp;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(at); s.stop(at + dur + .02);
}
function synthBeat(){
  if (!ac || haveSong || !S.started || S.done || S.end >= 0) return;
  while (nextStep < ac.currentTime + .15){
    const i = stepI++, at = nextStep, s8 = i % 8, bar = Math.floor(i / 8), sec = section(bar*BAR + .01), full = sec !== "calm" && sec !== "rest";
    if (full && (s8 === 0 || s8 === 5)) tone("sine", 110, 38, at, .5, .5, 800);
    if (full && (s8 === 2 || s8 === 6)){ hiss(at, .22, .2, 0, 1800); tone("triangle", 190, 140, at, .1, .07); }
    hiss(at, .03, s8 % 2 ? .025 : .045, 8000);
    if (s8 === 0){ const f = PROG[bar % 4]; tone("sine", f/2, f/2, at, BAR*.9, .14, 300);
      [2, 2.38, 3, 3.56].forEach(m => tone("triangle", f*m, f*m, at, BAR*.8, sec === "hook" ? .03 : .02, 1800)); }
    nextStep += BEAT / 2;
  }
}
const sfx = {
  good: n => ac && tone("triangle", 784*Math.pow(2, ((n || 0) % 8)/24), 1175*Math.pow(2, ((n || 0) % 8)/24), ac.currentTime, .12, .06, 6000),
  big:  () => ac && [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.06, .3, .05, 6000)),
  bad:  () => ac && (tone("sawtooth", 220, 60, ac.currentTime, .35, .08, 1200), hiss(ac.currentTime, .3, .12, 0, 600)),
  slide:() => ac && (hiss(ac.currentTime, .1, .05, 0, 900), tone("sine", 300, 200, ac.currentTime, .1, .05, 1200)),
  jump: () => ac && tone("sine", 520, 880, ac.currentTime, .1, .06, 4000),                          // a heart shot, a swipe
  clink:() => ac && tone("triangle", 2400, 1800, ac.currentTime, .12, .05, 9000),                       // a card turns
  clap: () => ac && (hiss(ac.currentTime, .12, .25, 0, 1500), hiss(ac.currentTime + .012, .1, .18, 0, 2200)),
  tick: () => ac && tone("triangle", 1200, 1200, ac.currentTime, .06, .05, 9000),                      // the count-in
  heart:() => ac && [880, 1320].forEach((f, i) => tone("triangle", f, f, ac.currentTime + i*.09, .3, .07, 6000)),
  whoosh:() => ac && hiss(ac.currentTime, .9, .16, 0, 900)
};
const onBeat = t => { const ph = (((t - GRID.t0) % BEAT) + BEAT) % BEAT / BEAT; return ph < .14 || ph > .86; };

/* ---------------- the cover: the beach at night - the glowing heart over the sea, the crescent moon, the waves rolling in, the palms, the red pickup with its headlights on; Jo's saucer ---------------- */
let scene, cam, ren, clockR, crashed = null;
function radial(stops, size){ const cv = document.createElement("canvas"); cv.width = cv.height = size || 128; const r = cv.width/2, x = cv.getContext("2d"), g = x.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.width); return new THREE.CanvasTexture(cv); }
const DOT = radial([[0, "rgba(255,255,255,1)"], [.25, "rgba(255,255,255,.6)"], [1, "rgba(255,255,255,0)"]], 64);
const sprite = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity:op == null ? 1 : op, depthWrite:false, blending:THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };
const at3 = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function canvasTex(w, h, draw, rep){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h); const t = new THREE.CanvasTexture(cv);
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const soft = (c, e) => new THREE.MeshStandardMaterial({ color:c, roughness:.8, metalness:0, emissive:c, emissiveIntensity:e == null ? .15 : e });

function palm(h, lean, seed){ const g = new THREE.Group(), trunkM = soft(0x6a4a2a, .1);
  let p = new THREE.Vector3(0, 0, 0); const segs = 14;
  for (let i = 0; i < segs; i++){ const u = i/segs, r = .55 - u*.3, seg = new THREE.Mesh(new THREE.CylinderGeometry(r*.9, r, h/segs*1.05, 8), trunkM);
    const q = new THREE.Vector3(lean*u*u*h*.35, (i + .5)*h/segs, 0); seg.position.copy(q); seg.rotation.z = -lean*u*.7; g.add(seg); p = q; }
  const top = new THREE.Vector3(lean*h*.35, h, 0), leafM = new THREE.MeshStandardMaterial({ color:0x2a6a2a, roughness:.8, emissive:0x0a2a0a, emissiveIntensity:.3, side:THREE.DoubleSide });

  (x, w, h) => { x.fillStyle = "#ff3a5a"; HEART_PATH(x, w/2, h*.5, w*.3); x.fill(); },                                                                                                    // a heart
  (x, w, h) => { x.fillStyle = "#fff4c0"; x.beginPath(); x.arc(w/2, h/2, w*.36, 0, Math.PI*2); x.fill(); x.globalCompositeOperation = "destination-out"; x.beginPath(); x.arc(w/2 + w*.16, h/2 - h*.08, w*.32, 0, Math.PI*2); x.fill(); x.globalCompositeOperation = "source-over"; },  // the moon
  (x, w, h) => { x.fillStyle = "#e8402a"; x.beginPath(); x.ellipse(w/2, h*.58, w*.26, h*.17, 0, 0, Math.PI*2); x.fill(); for (const s of [-1, 1]){ x.beginPath(); x.arc(w/2 + s*w*.32, h*.32, w*.1, 0, Math.PI*2); x.fill();
    x.strokeStyle = "#e8402a"; x.lineWidth = 5; for (let k = 0; k < 3; k++){ x.beginPath(); x.moveTo(w/2 + s*w*.2, h*.6 + k*h*.07); x.lineTo(w/2 + s*w*.42, h*.68 + k*h*.09); x.stroke(); } } },                      // a crab
  (x, w, h) => { x.strokeStyle = "#8a5a2a"; x.lineWidth = 9; x.beginPath(); x.moveTo(w*.45, h*.92); x.quadraticCurveTo(w*.48, h*.5, w*.56, h*.32); x.stroke(); x.fillStyle = "#3ad86a";
    for (let i = 0; i < 6; i++){ const a = -Math.PI*.95 + i*Math.PI*.38; x.beginPath(); x.ellipse(w*.56 + Math.cos(a)*w*.17, h*.32 + Math.sin(a)*h*.1, w*.2, h*.06, a, 0, Math.PI*2); x.fill(); } }                         // a palm
];
const SYM_TEX = SYM.map(f => iconTex(128, 128, f));
const SDK = {
  setup(){ boot(48); this.w = beach(); this.root = new THREE.Group(); scene.add(this.root); this.cells = []; this.tray = []; this.lines = [];
    ME = buildSaucer(); ME.scale.setScalar(.42); scene.add(ME); },
  reset(){ Object.assign(S, { board:0, boards:0, placed:0, wrong:0, k:1, nextAt:0, last:null, deadline:0, pick:0 }); lastT = 0; this.make(0); say("SHELL SUDOKU", "each picture once in every row, column and box", 2.4); },
  info(){ return this.cells.filter(x => x.v < 0).length + " TO FILL · " + this.n + "x" + this.n; }, warn(){ return !S.nextAt && S.deadline - S.t < BAR; },
  // a solved grid from the pattern, mixed up (pictures, rows in a band, bands, columns in a stack, stacks)
  solved(n, br, bc){ const base = (r, c) => (bc*(r % br) + Math.floor(r/br) + c) % n, k = S.k++*13;
    const sym = shuffle([...Array(n).keys()], k), bands = shuffle([...Array(n/br).keys()], k + 1), stacks = shuffle([...Array(n/bc).keys()], k + 2);
    const rows = [], cols = []; for (const b of bands) for (const i of shuffle([...Array(br).keys()], k + 3 + b)) rows.push(b*br + i); for (const s of stacks) for (const i of shuffle([...Array(bc).keys()], k + 9 + s)) cols.push(s*bc + i);
    return rows.map(r => cols.map(c => sym[base(r, c)])); },
  count(g, n, br, bc, lim){ for (let i = 0; i < n*n; i++){ const r = Math.floor(i/n), c = i % n; if (g[r][c] >= 0) continue; let tot = 0;
      for (let v = 0; v < n; v++){ if (g[r].includes(v) || g.some(row => row[c] === v)) continue; const r0 = r - r % br, c0 = c - c % bc; let box = false; for (let y = r0; y < r0 + br; y++) for (let x = c0; x < c0 + bc; x++) if (g[y][x] === v) box = true; if (box) continue;
        g[r][c] = v; tot += this.count(g, n, br, bc, lim - tot); g[r][c] = -1; if (tot >= lim) return tot; }
      return tot; }
    return 1; },
  make(t){ for (const m of this.cells.map(x => x.m).concat(this.cells.map(x => x.s), this.tray, this.lines)) if (m) this.root.remove(m);
    const n = this.n = S.board < 2 ? 4 : 6, br = 2, bc = n === 4 ? 2 : 3, sol = this.solved(n, br, bc), g = sol.map(row => row.slice()), maxBlank = n === 4 ? 8 + Math.min(2, S.board) : 16 + Math.min(6, (S.board - 2)*2);
    let blanks = 0; for (const i of shuffle([...Array(n*n).keys()], S.k++*7)){ if (blanks >= maxBlank) break; const r = Math.floor(i/n), c = i % n, v = g[r][c]; g[r][c] = -1; if (this.count(g, n, br, bc, 2) !== 1) g[r][c] = v; else blanks++; }
    this.sol = sol; this.cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){ const m = new THREE.Mesh(new THREE.BoxGeometry(cellW(n)*.92, .1, cellW(n)*.92), STONE); m.position.copy(cellPos(n, c, r, .05)); this.root.add(m);
      const x = { c, r, m, v:g[r][c], given:g[r][c] >= 0, s:null }; if (x.given) this.show(x, x.v); this.cells.push(x); }
    // the box lines, drawn darker in the sand
    this.lines = []; const W = BOARD.SIZE, lm = new THREE.MeshBasicMaterial({ color:0x2a1a10 });
    for (let i = 1; i < n/bc; i++){ const l = new THREE.Mesh(new THREE.BoxGeometry(.06, .12, W), lm); l.position.set(-W/2 + i*bc*cellW(n), .06, BOARD.Z); this.root.add(l); this.lines.push(l); }
    for (let i = 1; i < n/br; i++){ const l = new THREE.Mesh(new THREE.BoxGeometry(W, .12, .06), lm); l.position.set(0, .06, BOARD.Z - W/2 + i*br*cellW(n)); this.root.add(l); this.lines.push(l); }
    // the tray: one of each picture in front of the board
    this.tray = [...Array(n).keys()].map(k => { const b = new THREE.Group(), pad = new THREE.Mesh(new THREE.CylinderGeometry(.42, .46, .1, 20), STONE); b.add(pad);
      const ic = new THREE.Mesh(new THREE.PlaneGeometry(.66, .66), new THREE.MeshBasicMaterial({ map:SYM_TEX[k], transparent:true })); ic.rotation.x = -Math.PI/2; ic.position.y = .07; b.add(ic);
      b.position.set((k - (n - 1)/2)*1.0, .05, BOARD.Z + BOARD.SIZE/2 + .85); b.userData.k = k; this.root.add(b); return b; });
    S.pick = 0; S.nextAt = 0; S.allow = BAR*(1.5 + blanks*.55)*(1.15 - .3*clamp(LV(), 0, 1.4)); S.deadline = t + S.allow; },
  show(x, v){ if (x.s) this.root.remove(x.s); x.s = null; if (v < 0) return; const w = cellW(this.n), s = new THREE.Mesh(new THREE.PlaneGeometry(w*.78, w*.78), new THREE.MeshBasicMaterial({ map:SYM_TEX[v], transparent:true, color:x.given ? 0xc8c0b0 : 0xffffff }));
    s.rotation.x = -Math.PI/2; s.position.copy(x.m.position).setY(.115); this.root.add(s); x.s = s; },
  put(x, v){ if (!x || x.given || S.nextAt) return; if (x.v === v){ x.v = -1; this.show(x, -1); return; }
    S.last = x.m.position.clone();
    if (this.sol[x.r][x.c] !== v){ S.wrong++; S.combo = 0; x.bad = .45; sfx.bad(); say("NOT THERE", "that one's already in the row, the column or the box", .8, "warn"); return; }
    x.v = v; this.show(x, v); x.pop = .3; S.placed++; S.got++; S.combo++; const n = 30*mult(S.t); S.score += n; sfx.good(S.combo);
    if (this.cells.every(y => y.v >= 0)){ const bonus = 150*this.n + Math.round(Math.max(0, S.deadline - S.t)*30); S.score += bonus; S.boards++; S.board++; sfx.big(); say("SOLVED", "+" + bonus, 1.2); S.nextAt = S.t + BEAT*3; } },
  tap(cx, cy){ const hit = rayAt(cx, cy, this.tray); if (hit){ S.pick = owner(hit.object, this.tray).userData.k; sfx.tick(); return; }
    const p = cellAt(this.n, cx, cy); if (p) this.put(this.cells[p[1]*this.n + p[0]], S.pick); },
  update(dt, t){
    if (S.nextAt && t > S.nextAt) this.make(t);
    if (!S.nextAt && t > S.deadline){ if (hurt("OUT OF TIME", "Each picture once in every row, every column and every box - tap a picture on the tray, then a stone.")) return; this.make(t); }
  },
  render(t){ const dt = dtOf(t), beat = onBeat(t);
    this.tray.forEach(b => { const on = b.userData.k === S.pick; b.position.y = .05 + (on ? .2 + (beat ? .05 : 0) : 0); b.scale.setScalar(on ? 1.15 : 1); });
    for (const x of this.cells){ if (x.bad > 0){ x.bad -= dt; x.m.position.x = cellPos(this.n, x.c, x.r).x + Math.sin(t*60)*.03; } if (x.pop > 0 && x.s){ x.pop -= dt; x.s.scale.setScalar(1 + x.pop); } }
    animBeach(this.w, t, dt, beat);
    hover(S.last || new THREE.Vector3(0, 0, BOARD.Z), t, dt);
    sandCam();
  }
};

/* ---------------- the games on the song's clock ----------------
   The four games are the ones from prototypes.html, unchanged at heart; this gives each what the level
   asks of it: a name, the line under GET READY, how hard it is right now (L, 0 → 1 over the song; endless
   keeps climbing), and begin() for the song or an endless window. */
const LV = () => G && G.L ? G.L(S.t) : 0;
function asPart(E, name, tag, hint){
  return Object.assign(E, { name, tag, hint, start:0,
    begin(t0, t1, L0, L1, cont){ this.t0 = t0; this.t1 = t1; this.L0 = L0; this.L1 = L1; if (cont) return; this.start = t0; this.reset(); },
    L(t){ return this.L0 + (this.L1 - this.L0)*clamp((t - this.t0)/(this.t1 - this.t0), 0, 1); },
    get st(){ return S; } });
}
asPart(FLOW, "HEART FLOW", "HEART FLOW", "drag from a heart to its partner");
asPart(CRABS, "CRAB SWEEPER", "CRAB SWEEPER", "tap to dig, hold to flag a crab");
asPart(STARS, "STARLIGHT", "STARLIGHT", "light every star");
asPart(SDK, "SHELL SUDOKU", "SHELL SUDOKU", "each picture once in every row, column and box");
const PARTS = [null, FLOW, CRABS, STARS, SDK];

/* ---------------- the run ---------------- */
function reset(){
  S = { t:-1, started:false, done:false, fail:false, score:0, end:-1, msgT:0, flashT:0, hearts:HEARTS, inv:0, combo:0, best:0, got:0, onBeat:0, stint:-1, loops:0 };
  lastH = ""; $("msg").className = ""; $("flash").style.opacity = 0;
  G = PARTS[PART]; camInit = false; G.root.visible = true; showSetting(true); END.root.visible = false; END.on = false; ME.visible = true; ME.scale.setScalar(G.meScale);
  if (CFG.endless) G.begin(0, STINT, .3, .4); else G.begin(0, END_AT, 0, 1);
  $("msg").className = "";
}
// endless goes in 8-bar windows, a little quicker every window. Every 24 bars: +2,000 and a heart back
function startStint(n, t){
  S.stint = n; let back = false;
  if (n > 0 && n % 3 === 0){ S.score += 2000; if (S.hearts < HEARTS){ S.hearts++; back = true; sfx.heart(); } }
  const L0 = .3 + n*.1; G.begin(n*STINT, (n + 1)*STINT, L0, L0 + .1, n > 0);
  if (n > 0 && n % 3 === 0) say("24 BARS", "+2,000" + (back ? " · a heart back" : ""), 1.2, "g");
}
const LOOPS = CFG.endless;
function songT(){
  if (LOOPS && song.currentTime >= LOOP[1]){ try { song.currentTime -= LOOP[1] - LOOP[0]; S.loops++; } catch(e){} }
  return song.currentTime + S.loops*(LOOP[1] - LOOP[0]);
}
function update(dt){
  if (haveSong && !song.paused && song.currentTime > 0 && S.end < 0 && !S.done) S.t = songT();
  else if (!haveSong && ac && S.end < 0 && !S.done) S.t = ac.currentTime - beatT0;
  else S.t += dt;
  if (S.msgT > 0){ S.msgT -= dt; if (S.msgT <= 0) $("msg").className = ""; }
  if (S.flashT > 0){ S.flashT -= dt; $("flash").style.opacity = Math.max(0, S.flashT/.5*.6); }
  if (S.end >= 0){ S.end += dt; if (S.end > END.out && !S.finished){ S.finished = true; finish(); } return; }
  if (S.done) return;
  const t = Math.max(0, S.t);
  if (S.inv > 0) S.inv -= dt;
  if (CFG.endless){ const n = Math.floor(t / STINT); if (n !== S.stint) startStint(n, t); }
  G.update(dt, t);
  if (!CFG.endless && t >= END_AT && !S.done && S.end < 0) win();
}

/* ================= THE ENDING =================
   The cover: the camera draws back from the board to the whole beach - the glowing heart over the sea, the
   waves rolling in, the palms, the red pickup with its headlights on - and Jo's saucer comes down on the sand
   in front with its white beam, like on the cover. */
const END = { out:8.5, root:null };
for (const P of PARTS) if (P) P.meScale = .42;
function showSetting(on){}
function buildEnd(){ END.root = new THREE.Group(); scene.add(END.root); END.glow = sprite(0xfff4d0, 2.6, 0); END.glow.position.set(-.6, .1, 2.6); END.root.add(END.glow); }
function win(){
  if (S.end >= 0 || S.done) return;
  S.end = 0; S.score += S.hearts*500; sfx.big(); sfx.whoosh();
  $("hud").classList.add("off"); $("phase").className = "off";
}
function lose(why, tip){
  if (S.done) return;
  S.fail = true; S.done = true; S.why = why; S.tip = tip;
  say(why, "", 2, "x"); $("phase").className = "off";
  setTimeout(finish, 1500);
}
function over(why){
  if (S.done) return;
  S.done = true; S.why = why;
  say("RUN OVER", why, 2, "g"); $("phase").className = "off";
  setTimeout(finish, 1500);
}

/* ---------------- drawing ---------------- */
// while playing, each game puts the camera where it wants it; the ending glides it to the cover
function render(dt){
  const t = Math.max(0, S ? S.t : 0), beat = onBeat(t);
  if (S.end >= 0){
    const portrait = cam.aspect < .8;
    if (S.end < 1){ $("flash").style.background = "#ffe0d8"; $("flash").style.opacity = Math.min(1, S.end/.8); G.render(t); }
    else {
      if (!END.on){ END.on = true; G.root.visible = false; END.root.visible = true; camInit = true; LOOK.copy(portrait ? new THREE.Vector3(0, .9, -2.6) : new THREE.Vector3(0, -1, -1.6)); $("act").classList.add("hid"); }
      $("flash").style.opacity = S.end < 1.8 ? Math.max(0, 1 - (S.end - 1)/.8) : S.end > END.out - 1.2 ? Math.min(1, (S.end - (END.out - 1.2))/1.2) : 0;
      // the saucer comes down on the sand in front of the pickup, its beam on the sand
      const u = clamp((S.end - 1.2)/3, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ME.visible = true; ME.scale.setScalar(.46); ME.rotation.set(-.08, Math.sin(t*1.5)*.2, 0); animSaucer(ME, t, beat);
      const b = ME.userData.beam; b.visible = true; b.scale.set(.5, .55, .5); b.position.y = -1.0;
      ME.position.set(portrait ? 2.4 : .5, .85 + (1 - e)*3 + Math.sin(t*2)*.04, 2.6); END.glow.position.x = ME.position.x;
      END.glow.material.opacity = .35*e*(beat ? 1.2 : 1); animBeach(G.w, t, dt, beat);
      CAMP.set(portrait ? 3.4 : 1.6, portrait ? 3.0 : 2.3, portrait ? 13 : 8.6); CAML.set(portrait ? 3.8 : 2.6, portrait ? 1.7 : 1.5, -4);
      const k = Math.min(1, dt*1.1);
      cam.position.lerp(CAMP, k); LOOK.lerp(CAML, k); cam.lookAt(LOOK);
      if (S.end > 2.4 && !S.saidEnd){ S.saidEnd = true; say("REAL LOVE", "LAZY JO", 4.5, "t"); }
    }
  } else {
    G.render(t);
    ME.visible = !(S.inv > 0 && Math.floor(S.inv*12) % 2);
  }
  ren.render(scene, cam);
}
function frame(){
  try {
    const dt = Math.min(.05, clockR.getDelta());
    if (S.started){ synthBeat(); if (!S.finished) update(dt); if (!S.done && S.end < 0) hud(); }
    render(dt);
  } catch(e){ if (!crashed){ crashed = e; console.error(e); } }
  requestAnimationFrame(frame);
}
function score(){ return S.fail ? Math.floor(S.score / 4) : Math.round(S.score); }
function finish(){
  song.pause();
  const v = $("veil"); v.classList.remove("hid");
  const ps = v.querySelectorAll("p:not(.by)"), go = $("go");
  go.textContent = "Play again"; go.disabled = false; go.classList.toggle("alt", !S.fail && !CFG.endless);
  for (const id of ["outs", "home"]) $(id).classList.remove("hid");
  $("snd").classList.add("hid"); $("hud").classList.add("off"); $("parts").classList.add("hid"); $("phase").className = "off";
  const got = S.got;
  if (HUB) toHub({ type:"javeda:result", level:CFG.id, cleared:CFG.endless ? true : !S.fail, score:score(), metres:got });
  const stat = PART === 1 ? S.links + " pairs linked · " + S.boards + " beaches" : PART === 2 ? S.dug + " mounds dug · " + S.boards + " beaches cleared" : PART === 3 ? S.boards + " skies lit in " + S.moves + " taps" : S.placed + " pictures placed · " + S.boards + " grids solved";
  if (CFG.endless){
    v.querySelector(".by").textContent = "ENDLESS · " + S.why;
    v.querySelector("h1").textContent = fmt(score());
    ps[0].innerHTML = "<b>" + clock(Math.max(0, S.t)) + "</b> on the beach &middot; " + stat;
    ps[1].innerHTML = "Your best counts on the <b>" + CFG.board + "</b> scoreboard. <b>Go again.</b>";
    return;
  }
  if (S.fail){
    v.querySelector(".by").textContent = S.why;
    v.querySelector("h1").textContent = "NOT YET";
    ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
    ps[1].innerHTML = S.tip + " <b>Go again.</b>";
    return;
  }
  v.querySelector(".by").textContent = CFG.by + " COMPLETE";
  v.querySelector("h1").textContent = "REAL LOVE";
  ps[0].innerHTML = "Score <b>" + fmt(score()) + "</b> &middot; " + stat;
  ps[1].innerHTML = ["", "Every heart found its pair.<br>Part 2, <b>Crab Sweeper</b>, is open.", "Not one crab too many.<br>Part 3, <b>Starlight</b>, is open.", "Every star lit.<br>Part 4, <b>Shell Sudoku</b>, is open.",
    "That's real love.<br>Level 25 cleared: <b>Heart Flow &#8734;</b>, <b>Crab Sweeper &#8734;</b>, <b>Starlight &#8734;</b> and <b>Shell Sudoku &#8734;</b> are open in the gold Endless list."][PART];
}

/* ---------------- input ---------------- */
// Heart Flow: drag. Crab Sweeper: tap to dig, hold (or the FLAG button) to flag. Starlight, Shell Sudoku: tap.
const veilUp = () => !$("veil").classList.contains("hid");
const live = () => S.started && !S.done && S.end < 0;
addEventListener("pointerdown", e => { if (veilUp() || !live() || e.target === $("act")) return; e.preventDefault(); if (G.tap){ G.tap(e.clientX, e.clientY); return; } down = true; G.point(e.clientX, e.clientY); }, { passive:false });
addEventListener("pointermove", e => { if (!live() || G.tap || e.target === $("act")) return; if (down || e.pointerType === "mouse") G.point(e.clientX, e.clientY); });
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, () => { const was = down; down = false; if (was && live() && G.release) G.release(); });
$("act").addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); if (live() && G.press) G.press(); });
addEventListener("keydown", e => { if (e.key === " " && !veilUp() && live() && G.press){ e.preventDefault(); if (!e.repeat) G.press(); } });

function startGame(){
  reset();
  $("veil").classList.add("hid"); $("hud").classList.remove("off");
  audioInit();
  if (haveSong){ try { song.currentTime = 0; } catch(e){} const p = song.play(); if (p && p.catch) p.catch(() => {}); }
  if (ac){ beatT0 = ac.currentTime + .05; nextStep = beatT0; stepI = 0; }
  S.started = true; S.t = 0;
  if (HUB) toHub({ type:"javeda:start", level:CFG.id });
  say(CFG.endless ? "ENDLESS" : G.name, CFG.endless ? "the beaches never stop" : G.hint, 3, CFG.endless ? "g" : ""); $("act").classList.toggle("hid", PART !== 2);
}
$("go").addEventListener("click", () => {
  startGame();
});
$("by").textContent = "LAZY JO · " + CFG.by;
$("title").textContent = "REAL LOVE" + (ENDLESS ? " ∞" : "");
$("intro").innerHTML = "The beach from the cover at night - the glowing heart over the sea, the crescent moon, the waves, the red pickup with its headlights on - and Jo's saucer." +
  [" <b>Part 1 · Heart Flow:</b> pairs of hearts on stones in the sand.", " <b>Part 2 · Crab Sweeper:</b> mounds of sand, crabs hiding under some.", " <b>Part 3 · Starlight:</b> stars lying in the sand, some lit, some dark.", " <b>Part 4 · Shell Sudoku:</b> a sudoku with pictures from the beach."][PART - 1] +
  (ENDLESS ? " <b>Endless:</b> it never stops - harder every 8 bars, a heart back every 24." : "");
$("how").innerHTML = [
  "<b>Drag</b> from a heart to the heart of the same colour to draw a line of light - lines can't cross, and drawing over one cuts it. Link every pair for the next beach; fill every stone too for a bonus. Out of time costs a heart (3). Linked <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Tap</b> a mound to dig it: the number says how many crabs are in the 8 around it (an empty one digs its neighbours too; the first dig is never a crab). <b>Hold</b> a mound, or turn on <b>FLAG</b>, to mark a crab. Dig up a crab and it bites - a heart (3) - and keep digging: 2 bars without a dig and the tide takes a heart. Dug <b>on the beat</b> it counts double; double again in the hooks.",
  "<b>Tap</b> a star: it changes, and so do the four next to it - lit goes dark, dark lights up. Light every star for the next sky (each one says how many taps it was made with). Out of time costs a heart (3). Lit <b>on the beat</b> it counts double; double again in the hooks.",
  "Each picture once in every row, every column and every box: <b>tap</b> a picture on the tray, then <b>tap</b> a stone. A wrong one doesn't stay. 4x4, then 6x6. Out of time costs a heart (3). Placed <b>on the beat</b> it counts double; double again in the hooks."][PART - 1];
if (!HUB){
  $("parts").classList.remove("hid");
  document.querySelectorAll("#parts button").forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute("aria-pressed", String(m === String(PART) + (ENDLESS ? "x" : "")));
    b.addEventListener("click", () => { const q = new URLSearchParams(location.search); q.delete("endless"); q.delete("part");
      if (m[0] !== "1") q.set("part", m[0]); if (m.endsWith("x")) q.set("endless", "1"); location.search = q.toString(); });
  });
}
PARTS[PART].setup(); buildEnd();
reset();
requestAnimationFrame(frame);
</script>
